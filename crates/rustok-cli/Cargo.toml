[package]
name = "rustok-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "User-facing RusToK platform CLI runner"

[dependencies]
async-trait.workspace = true
rustok-cli-core.workspace = true
rustok-cli-registry.workspace = true
rustok-runtime.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
chrono.workspace = true
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
rustok-api.workspace = true
rustok-core.workspace = true
rustok-migrations.workspace = true
rustok-rbac.workspace = true
rustok-server = { path = "../../apps/server", default-features = false }
rustok-telemetry.workspace = true
rustok-test-utils.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
tempfile = "3.27"
uuid.workspace = true

[lib]
name = "rustok_cli"
path = "src/lib.rs"

[[bin]]
name = "rustok-cli"
path = "src/main.rs"
