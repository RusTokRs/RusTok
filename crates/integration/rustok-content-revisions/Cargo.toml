[package]
name = "rustok-content-revisions"
version = "0.1.0"
edition = "2021"
description = "Content revision history integration for RusTok platform"
license = "MIT OR Apache-2.0"

[dependencies]
# Internal dependencies
rustok-revisions = { path = "../../../rustok-revisions", features = ["derive", "seaorm"] }

# RusTok platform
rustok-core = { path = "../../libs/rustok-core" }

# External dependencies
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sea-orm = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres", "macros"] }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
