[module]
slug = "marketplace_balance"
name = "Marketplace Balance"
version = "0.1.0"
description = "Marketplace Family seller balance, escrow hold, and financial tracking owner"
ownership = "first_party"
trust_level = "verified"
ui_classification = "no_ui"

[marketplace]
category = "commerce"
tags = [
    "marketplace",
    "balance",
    "seller-balance",
    "escrow",
    "hold",
    "payout-reserve",
]

[crate]
entry_type = "MarketplaceBalanceModule"

[fba.provider]
status = "in_progress"
role = "provider"
contract_version = "marketplace.ledger.v3"
registry = "contracts/marketplace-ledger-fba-registry.json"
context = "rustok_api::ports::PortContext"
error = "rustok_api::ports::PortError"

[fba.provider.rollout]
fallback_profiles = ["embedded_native", "remote_adapter_placeholder"]
degraded_modes = [
    "ledger_storage_unavailable",
    "commission_provider_unavailable",
    "ledger_receipt_requires_review",
    "reversal_not_supported",
    "seller_balance_projection_missing",
    "seller_balance_rebuild_required",
]

[dependencies]
marketplace_commission = { version_req = ">=0.1.0" }
accounting = { version_req = ">=0.1.0" }
