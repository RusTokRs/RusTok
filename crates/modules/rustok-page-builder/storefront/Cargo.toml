[package]
name = "rustok-page-builder-storefront"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Leptos storefront renderer and feature-gated authenticated Fly inline editor"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
hydrate = [
  "leptos/hydrate",
  "fly-leptos?/wasm-client",
]
ssr = [
  "leptos/ssr",
  "fly-leptos?/ssr",
]
inline-edit = ["dep:fly-leptos"]

[dependencies]
fly = { path = "../../../ui/fly" }
fly-browser = { path = "../../../ui/fly/browser" }
fly-leptos = { path = "../../../ui/fly/leptos", optional = true, default-features = false }
rustok-page-builder = { path = "..", default-features = false }
leptos.workspace = true
rustok-ui-core.workspace = true
rustok-ui-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true

