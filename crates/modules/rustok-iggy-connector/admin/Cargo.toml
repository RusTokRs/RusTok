[package]
name = "rustok-iggy-connector-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Module-owned Leptos admin surface for the Iggy Connector"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[features]
default = []
hydrate = ["leptos/hydrate", "rustok-auth-ui/hydrate"]
ssr = ["leptos/ssr", "rustok-auth-ui/ssr", "rustok-api/server", "dep:leptos_axum", "dep:rustok-iggy-connector"]

[dependencies]
leptos.workspace = true
rustok-auth-ui.workspace = true
leptos_axum = { workspace = true, optional = true }
rustok-api = { workspace = true, default-features = false }
rustok-graphql.workspace = true
rustok-iggy-connector = { workspace = true, optional = true }
rustok-ui-core.workspace = true
rustok-ui-i18n.workspace = true
rustok-ui-transport.workspace = true
serde = { workspace = true, features = ["derive"] }
