[package]
name = "rustok-iggy-connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Iggy event sink and source connector translating domain events to Iggy streams for RusToK"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait.workspace = true
rustok-core.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures-util.workspace = true
uuid.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
sea-orm = { workspace = true, optional = true }
sea-orm-migration.workspace = true

[features]
default = []
# Enable Iggy SDK support (for full functionality)
iggy = ["dep:iggy"]
migrations = ["dep:sea-orm"]

[dependencies.iggy]
version = "0.12.0"
optional = true

[dev-dependencies]
sea-orm = { workspace = true, features = ["sqlx-sqlite"] }

[package.metadata.cargo-udeps.ignore]
normal = ["thiserror"]
