[module]
slug = "security"
name = "Security"
version = "0.1.0"
description = "Security Suite and Threat Protection module for RusToK"
ownership = "first_party"
trust_level = "verified"
ui_classification = "dual_surface"
recommended_admin_surfaces = ["leptos-admin"]

[marketplace]
category = "collaboration"
tags = ["security"]

[dependencies]
outbox = { version_req = ">=0.1.0" }

[crate]
entry_type = "SecurityModule"

[provides.admin_ui]
leptos_crate = "rustok-security-admin"
route_segment = "security"
nav_label = "Security"

[provides.admin_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "admin/locales"

[provides.storefront_ui]
leptos_crate = "rustok-security-storefront"
slot = "home_after_catalog"
route_segment = "security"
page_title = "Security"

[provides.storefront_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "storefront/locales"
