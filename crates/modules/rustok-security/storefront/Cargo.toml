[package]
name = "rustok-security-storefront"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Storefront FFA package for Security"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[features]
default = []
csr = ["leptos/csr", "rustok-auth-ui/csr"]
hydrate = ["leptos/hydrate", "rustok-auth-ui/hydrate"]
ssr = [
  "leptos/ssr",
  "rustok-auth-ui/ssr",
  "dep:leptos_axum",
  "dep:rustok-core",
  "dep:rustok-security",
  "rustok-api/server",
]

[dependencies]
rustok-ui-core.workspace = true
rustok-ui-transport.workspace = true
rustok-ui-i18n.workspace = true
leptos-ui.workspace = true
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
rustok-auth-ui.workspace = true
rustok-graphql.workspace = true
leptos-ui-routing.workspace = true
leptos_router.workspace = true
rustok-api = { workspace = true, default-features = false }

rustok-core = { workspace = true, optional = true }
rustok-security = { path = "..", default-features = false, optional = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["serde"] }
tracing.workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["leptos-ui", "rustok-auth-ui", "rustok-graphql", "leptos-ui-routing", "leptos_axum", "rustok-security", "rustok-core"]
