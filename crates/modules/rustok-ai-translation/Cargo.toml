[package]
name = "rustok-ai-translation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Stateless machine-translation bridge between RusToK Translation and AI contracts"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
server = ["rustok-ai/server", "rustok-api/runtime", "rustok-translation/runtime"]

[dependencies]
async-trait.workspace = true
rustok-ai.workspace = true
rustok-api.workspace = true
rustok-translation.workspace = true
rustok-translation-targets.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
