[package]
name = "rustok-seo-panel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Reusable SEO authoring panel and widget helpers for entity editors"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[dependencies]
leptos.workspace = true
leptos-auth.workspace = true
rustok-graphql.workspace = true
rustok-api = { workspace = true, default-features = false }
rustok-seo-targets.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true