[package]
name = "rustok-seo-storefront"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Storefront and client UI support for RusToK SEO module"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = [
  "leptos/ssr",
  "rustok-seo/server",
]

[dependencies]
leptos.workspace = true
rustok-ui-core.workspace = true
rustok-ui-transport.workspace = true
rustok-graphql.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rustok-core.workspace = true
rustok-seo = { path = "..", default-features = false }

[dev-dependencies]
tokio.workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["rustok-graphql", "rustok-ui-core", "rustok-ui-transport"]
