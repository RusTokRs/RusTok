[package]
name = "rustok-forms-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Leptos admin UI package for the rustok-forms module"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[features]
default = []
hydrate = ["leptos/hydrate", "rustok-auth-ui/hydrate"]
ssr = ["leptos/ssr", "rustok-auth-ui/ssr"]
csr = ["leptos/csr", "rustok-auth-ui/csr"]

[dependencies]
leptos.workspace = true
rustok-auth-ui.workspace = true
rustok-graphql.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true
rustok-ui-i18n.workspace = true
