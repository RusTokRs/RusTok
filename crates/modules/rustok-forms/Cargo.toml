[package]
name = "rustok-forms-module"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Form submission intake, abuse controls and lead triage inbox"
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-graphql.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
rustok-api = { workspace = true, features = ["server"] }
rustok-core.workspace = true
rustok-email.workspace = true
rustok-events.workspace = true
rustok-outbox.workspace = true
rustok-web.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
utoipa = { workspace = true, features = ["uuid", "chrono"] }
uuid.workspace = true

[dev-dependencies]
rustok-channel.workspace = true
rustok-test-utils.workspace = true
tokio.workspace = true

[package.metadata.cargo-udeps.ignore]
development = ["rustok-channel", "rustok-test-utils"]
