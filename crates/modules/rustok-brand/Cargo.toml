[package]
name = "rustok-brand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Brand catalog, manufacturers, media presentation, and product associations for RusToK"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
rustok-api.workspace = true
rustok-core.workspace = true
rustok-events.workspace = true
rustok-outbox.workspace = true
rustok-product = { path = "../rustok-product" }
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["rustok-outbox", "rustok-product"]
