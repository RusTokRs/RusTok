[package]
name = "rustok-pages-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SSR-first Leptos admin UI package for the rustok-pages module"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[features]
default = ["ssr"]
csr = [
  "leptos/csr",
  "rustok-auth-ui/csr",
  "rustok-page-builder-admin/csr",
]
hydrate = [
  "leptos/hydrate",
  "rustok-auth-ui/hydrate",
  "rustok-page-builder-admin/hydrate",
  "rustok-media-admin/hydrate",
]
inline-edit-launch = ["dep:url", "dep:uuid"]
ssr = [
  "leptos/ssr",
  "rustok-auth-ui/ssr",
  "rustok-page-builder/server",
  "rustok-page-builder-admin/ssr",
  "rustok-page-builder-admin/browser-js",
  "rustok-media-admin/ssr",
  "dep:async-trait",
  "dep:rustok-api",
  "dep:axum",
  "dep:base64",
  "dep:sha2",
]

[dependencies]
fly = { path = "../../../ui/fly" }
fly-browser = { path = "../../../ui/fly/browser" }
fly-ui = { path = "../../../ui/fly/ui" }
rustok-ui-core.workspace = true
leptos.workspace = true
rustok-auth-ui.workspace = true
rustok-graphql.workspace = true
rustok-page-builder = { path = "../../rustok-page-builder", default-features = false }
rustok-page-builder-admin = { path = "../../rustok-page-builder/admin", default-features = false }
rustok-media-admin = { path = "../../rustok-media/admin", default-features = false }
rustok-ui-i18n.workspace = true
leptos-ui-routing.workspace = true
async-trait = { workspace = true, optional = true }
# The preview response is served with a policy derived from the document it carries (§737).
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rustok-api = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
url = { version = "2.5", optional = true }
uuid = { workspace = true, optional = true }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tokio.workspace = true
