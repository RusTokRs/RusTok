[module]
slug = "taxonomy"
name = "Taxonomy"
version = "0.1.0"
description = "Scope-aware taxonomy dictionary for shared and module-local terms"
ownership = "first_party"
trust_level = "verified"
ui_classification = "capability_only"
[dependencies]
outbox = { version_req = ">=0.1.0" }

[crate]
entry_type = "TaxonomyModule"

[fba.provider]
registry = "contracts/taxonomy-fba-registry.json"
contract_version = "taxonomy.term_names_read.v1"
status = "boundary_ready"
port = "TaxonomyTermNamesReadPort"
profiles = ["embedded_native", "authenticated_grpc"]
