readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rustok-api.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
rustok-content.workspace = true
rustok-core.workspace = true
rustok-events.workspace = true
rustok-outbox.workspace = true
rustok-seo-targets = { workspace = true, features = ["server"] }
rustok-translation-targets.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
slug = "0.1"
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rustok-test-utils.workspace = true
tokio.workspace = true
