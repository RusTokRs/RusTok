[package]
name = "alloy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Alloy runtime and scripting capability"

[dependencies]
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
async-trait.workspace = true
async-graphql.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
anyhow.workspace = true
rustok-web.workspace = true
rustok-api = { workspace = true, features = ["server"] }
rustok-core.workspace = true
rustok-telemetry.workspace = true
rustok-sandbox = { workspace = true, features = ["rhai"] }
rustok-build-source.workspace = true
rustok-modules.workspace = true
semver = "1.0"
sha2.workspace = true
hex.workspace = true
parking_lot = "0.12"
cron = "0.17"
rhai = { workspace = true, features = ["sync", "metadata"] }

[dev-dependencies]
rustok-module-template.workspace = true
