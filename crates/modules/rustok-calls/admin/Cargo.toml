[package]
name = "rustok-calls-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Admin FFA package for WebRTC Calls & Conferencing"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[features]
default = []
csr = ["leptos/csr", "rustok-auth-ui/csr", "rustok-grid-leptos/csr"]
hydrate = ["leptos/hydrate", "rustok-auth-ui/hydrate", "rustok-grid-leptos/hydrate"]
ssr = [
  "leptos/ssr",
  "rustok-auth-ui/ssr",
  "rustok-grid-leptos/ssr",
  "dep:leptos_axum",
  "dep:rustok-core",
  "dep:rustok-calls",
  "rustok-api/server",
]

[dependencies]
rustok-ui-core.workspace = true
rustok-ui-transport.workspace = true
rustok-ui-i18n.workspace = true
rustok-grid.workspace = true
rustok-grid-leptos = { workspace = true, default-features = false }
rustok-ui-leptos.workspace = true
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
rustok-auth-ui.workspace = true
rustok-graphql.workspace = true
leptos-ui-routing.workspace = true
leptos_router.workspace = true
rustok-api = { workspace = true, default-features = false }

rustok-core = { workspace = true, optional = true }
rustok-calls = { path = "..", default-features = false, optional = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["serde"] }
tracing.workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["rustok-auth-ui", "rustok-ui-leptos", "leptos-ui-routing", "leptos_axum", "leptos_router", "rustok-api", "rustok-calls", "rustok-core", "rustok-graphql", "rustok-ui-core", "rustok-ui-transport", "uuid"]
