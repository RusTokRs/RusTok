[package]
name = "rustok-newsletter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Newsletter subscriber management, campaign lifecycle, and delivery orchestration"

[features]
default = ["server"]
server = [
    "dep:async-graphql",
    "dep:async-trait",
    "dep:rustok-api",
    "dep:rustok-core",
    "dep:rustok-email",
    "dep:rustok-events",
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:tracing",
]

[dependencies]
async-graphql = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
chrono.workspace = true
rustok-api = { workspace = true, optional = true, features = ["server"] }
rustok-core = { workspace = true, optional = true }
rustok-email = { workspace = true, optional = true }
rustok-events = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }
utoipa = { workspace = true, features = ["uuid", "chrono"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.cargo-udeps.ignore]
normal = ["rustok-email"]
