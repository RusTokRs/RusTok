[package]
name = "rustok-newsletter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Newsletter subscriber management, campaign lifecycle, and delivery orchestration"

[features]
default = []
server = ["rustok-api/server", "dep:async-graphql"]

[dependencies]
async-graphql = { workspace = true, optional = true }
async-trait.workspace = true
chrono.workspace = true
rustok-api.workspace = true
rustok-core.workspace = true
rustok-email.workspace = true
rustok-events.workspace = true
rustok-newsletter-api.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
utoipa = { workspace = true, features = ["uuid", "chrono"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
