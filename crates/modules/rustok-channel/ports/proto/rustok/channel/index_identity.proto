syntax = "proto3";

package rustok.channel.v1;

service ChannelIndexIdentityService {
  rpc ReadIdentity(ReadIdentityRequest) returns (ReadIdentityResponse);
}

enum IdentitySelector {
  IDENTITY_SELECTOR_UNSPECIFIED = 0;
  IDENTITY_SELECTOR_GENERATION_ONLY = 1;
  IDENTITY_SELECTOR_ALL = 2;
  IDENTITY_SELECTOR_SLUGS = 3;
}

message ReadIdentityRequest {
  string tenant_id = 1;
  IdentitySelector selector = 2;
  repeated string slugs = 3;
  uint64 deadline_ms = 4;
  string correlation_id = 5;
  optional string traceparent = 6;
}

message ReadIdentityResponse {
  string tenant_id = 1;
  uint64 generation = 2;
  repeated string channel_ids = 3;
}
