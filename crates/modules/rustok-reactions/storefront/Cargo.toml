[package]
name = "rustok-reactions-storefront"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Module-owned neutral storefront controls for shared Reactions"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[features]
default = []
hydrate = ["leptos/hydrate", "rustok-auth-ui/hydrate"]
ssr = ["leptos/ssr", "rustok-auth-ui/ssr"]

[dependencies]
rustok-ui-leptos.workspace = true
leptos.workspace = true
rustok-auth-ui.workspace = true
rustok-graphql.workspace = true
rustok-ui-core.workspace = true
rustok-ui-i18n.workspace = true
serde = { workspace = true, features = ["derive"] }
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
