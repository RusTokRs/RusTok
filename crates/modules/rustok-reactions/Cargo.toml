[package]
name = "rustok-reactions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared reaction catalog, actor state, aggregate, and subject orchestration owner"

[features]
default = ["server"]
server = [
  "dep:chrono",
  "dep:rustok-events",
  "dep:rustok-outbox",
  "dep:sea-orm",
  "dep:sea-orm-migration",
  "dep:tracing",
]
graphql = ["server", "dep:async-graphql", "rustok-api/server"]

[dependencies]
async-graphql = { workspace = true, optional = true }
async-trait.workspace = true
chrono = { workspace = true, optional = true }
rustok-api = { workspace = true, features = ["runtime"] }
rustok-core.workspace = true
rustok-events = { workspace = true, optional = true }
rustok-outbox = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
