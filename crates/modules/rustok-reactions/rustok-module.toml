[module]
slug = "reactions"
name = "Reactions"
version = "0.1.0"
description = "Shared bounded reactions with source-owned subject authorization"
ownership = "first_party"
trust_level = "verified"
ui_classification = "storefront_only"

[dependencies]
outbox = { version_req = ">=0.1.0" }

[crate]
entry_type = "ReactionsModule"

[provides.graphql]
query = "graphql::ReactionsQuery"
mutation = "graphql::ReactionsMutation"
runtime_data_factory = "graphql::attach_schema_data"

# Support crate only: embeddable controls (ReactionBar) consumed by other
# modules' storefront compositions. No slot/route is declared, so the
# storefront codegen mounts no page of its own for this module.
[provides.storefront_ui]
leptos_crate = "rustok-reactions-storefront"

[marketplace]
category = "content"
publisher = "rustok"
tags = ["reactions", "social", "engagement"]
description = "Reusable reactions for revisioned subjects owned by platform modules."
