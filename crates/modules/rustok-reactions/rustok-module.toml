[module]
slug = "reactions"
name = "Reactions"
version = "0.1.0"
description = "Shared bounded reactions with source-owned subject authorization"
ownership = "first_party"
trust_level = "verified"
ui_classification = "future_ui"

[dependencies]
outbox = { version_req = ">=0.1.0" }

[crate]
entry_type = "ReactionsModule"

[provides.graphql]
query = "graphql::ReactionsQuery"
mutation = "graphql::ReactionsMutation"
runtime_data_factory = "graphql::attach_schema_data"

# The storefront/ sub-crate is a support crate: it publishes the embeddable
# ReactionBar component that host compositions and other module surfaces
# render for a concrete subject. It owns no storefront route or slot.
[provides.storefront_support]
leptos_crate = "rustok-reactions-storefront"

[provides.storefront_support.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "storefront/locales"

[marketplace]
category = "content"
publisher = "rustok"
tags = ["reactions", "social", "engagement"]
description = "Reusable reactions for revisioned subjects owned by platform modules."
