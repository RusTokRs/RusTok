[module]
slug = "product_relations"
name = "Product Relations"
version = "0.1.0"
description = "Product relations, merchandising associations (cross-sells, up-sells, related, accessories, alternatives) and reordering"
ownership = "first_party"
trust_level = "verified"
ui_classification = "admin_only"
recommended_admin_surfaces = ["leptos-admin"]

[dependencies]
product = { version_req = ">=0.1.0" }

[crate]
entry_type = "ProductRelationsModule"

[provides.admin_ui]
leptos_crate = "rustok-product-relations-admin"
route_segment = "product-relations"
nav_label = "Product Relations"

[provides.admin_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "admin/locales"
