[package]
name = "rustok-product"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Product domain module extracted from rustok-commerce"
repository.workspace = true
readme = "README.md"
autobins = false

[[bin]]
name = "rustok-product-catalog-service"
path = "src/bin/service.rs"
required-features = ["service"]

[[test]]
name = "channel_convergence_service_postgres"
required-features = ["service"]

[features]
default = []
service = ["dep:rustok-telemetry", "dep:tokio-stream", "dep:tonic", "rustok-product-ports/grpc-server", "flex-ports/grpc-client", "rustok-channel-ports/grpc-client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rustok-channel-ports.workspace = true
rustok-product-ports.workspace = true
rustok-taxonomy-ports.workspace = true
rustok-telemetry = { workspace = true, optional = true }
tonic = { workspace = true, optional = true, features = ["tls-ring"] }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
rustok-core.workspace = true
rustok-api.workspace = true
rustok-events.workspace = true
rustok-outbox-storage.workspace = true
rustok-seo-targets = { workspace = true, features = ["server"] }
rustok-translation-targets.workspace = true
flex-ports.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"], optional = true }
unicode-normalization.workspace = true
url = "2.5"
utoipa = { workspace = true, features = ["uuid", "chrono", "decimal"] }
uuid.workspace = true
validator.workspace = true
sha2.workspace = true
hex.workspace = true
regex = "1.12"

[dev-dependencies]
flex.workspace = true
flex-ports = { workspace = true, features = ["grpc-client", "grpc-server"] }
rustok-outbox.workspace = true
rustok-test-utils.workspace = true
rustok-taxonomy.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tonic.workspace = true
rustok-product-ports = { workspace = true, features = ["grpc-client", "grpc-server"] }
