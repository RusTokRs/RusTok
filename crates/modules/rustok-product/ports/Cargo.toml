[package]
name = "rustok-product-ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Canonical FBA ports, DTOs, and optional gRPC transport adapters for RusTok Product"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
grpc-client = [
    "dep:bytes",
    "dep:prost",
    "dep:sha2",
    "dep:subtle",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:protoc-bin-vendored",
    "dep:tonic-prost-build",
]
grpc-server = [
    "dep:bytes",
    "dep:prost",
    "dep:sha2",
    "dep:subtle",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:protoc-bin-vendored",
    "dep:tonic-prost-build",
]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
rustok-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
utoipa = { workspace = true, features = ["uuid", "chrono", "decimal"] }
uuid.workspace = true
validator.workspace = true

# Optional gRPC dependencies
bytes = { version = "1.0", optional = true }
prost = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { version = "2", optional = true }
tonic = { workspace = true, optional = true, features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = { workspace = true, optional = true }

[build-dependencies]
protoc-bin-vendored = { workspace = true, optional = true }
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
