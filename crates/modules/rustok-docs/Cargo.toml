[package]
name = "rustok-docs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Collaborative documents, wiki and knowledge base module powered by Loro CRDT for RusToK"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
loro = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono = { workspace = true, features = ["serde"] }
tracing.workspace = true
async-trait.workspace = true
sea-orm = { workspace = true, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration.workspace = true
rustok-core.workspace = true
rustok-api = { workspace = true, features = ["server", "runtime"] }
rustok-web.workspace = true
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["full", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }


