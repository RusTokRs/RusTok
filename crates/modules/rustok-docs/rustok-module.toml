[module]
slug = "docs"
name = "Collaborative Documents & Wiki"
version = "0.1.0"
description = "Block-based collaborative documents, Wiki and knowledge base powered by Loro CRDT"
ownership = "first_party"
trust_level = "verified"
ui_classification = "full_stack"
recommended_admin_surfaces = ["next-admin", "leptos-admin"]

[marketplace]
category = "productivity"
tags = ["docs", "wiki", "crdt", "collaboration", "notion"]

[dependencies]
outbox = { version_req = ">=0.1.0" }
flex = { version_req = ">=0.1.0" }

[crate]
entry_type = "DocsModule"

[provides.admin_ui]
route_segment = "docs"
nav_label = "Knowledge Base & Docs"

[provides.admin_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
