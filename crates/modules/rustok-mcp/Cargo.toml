[package]
name = "rustok-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "MCP adapter server for RusToK modules"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rustok-api.workspace = true
async-trait.workspace = true
rmcp = { version = "3.1.4", features = ["macros", "server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
schemars = "1.2"
tokio.workspace = true
thiserror.workspace = true
rustok-core.workspace = true
rustok-modules.workspace = true
uuid.workspace = true
tracing.workspace = true
chrono.workspace = true
async-graphql = { workspace = true, optional = true }
alloy = { path = "../alloy" }
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
default = []
migrations = ["dep:sea-orm-migration"]
persistence = ["migrations", "dep:base64", "dep:hex", "dep:rand", "dep:sea-orm"]
auth-context = ["rustok-api/server"]
graphql = ["auth-context", "dep:async-graphql"]

[dev-dependencies]
rustok-sandbox = { workspace = true, features = ["rhai"] }
sea-orm-migration.workspace = true
tokio.workspace = true
