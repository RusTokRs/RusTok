[package]
name = "rustok-comments-storefront-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reusable Leptos storefront authoring UI owned by the Comments capability"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[features]
default = []
hydrate = ["leptos/hydrate", "rustok-auth-ui/hydrate"]
ssr = ["leptos/ssr", "rustok-auth-ui/ssr"]

[dependencies]
leptos.workspace = true
rustok-auth-ui.workspace = true
leptos-ui.workspace = true
rustok-api = { workspace = true, default-features = false }

[dev-dependencies]
serde_json.workspace = true

