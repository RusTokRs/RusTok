[module]
slug = "tasks"
name = "Team Issues & Tasks"
version = "0.1.0"
description = "Team Issues & Tasks capability module for RusToK"
ownership = "first_party"
trust_level = "verified"
ui_classification = "admin_only"
recommended_admin_surfaces = ["leptos-admin"]

[marketplace]
category = "collaboration"
tags = ["tasks"]

[dependencies]
outbox = { version_req = ">=0.1.0" }

[crate]
entry_type = "TasksModule"

[provides.admin_ui]
leptos_crate = "rustok-tasks-admin"
route_segment = "tasks"
nav_label = "Team Issues & Tasks"

[provides.admin_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "admin/locales"
