[package]
name = "rustok-cart-storefront"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Leptos storefront UI package for the rustok-cart module"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
hydrate = ["leptos-auth/hydrate", "leptos/hydrate", "rustok-ui-leptos/hydrate"]
ssr = [
  "leptos-auth/ssr",
  "leptos/ssr",
  "rustok-ui-leptos/ssr",
  "dep:leptos_axum",
  "dep:rustok-cart",
  "dep:rustok-customer",
  "dep:rustok-outbox",
  "dep:rustok-pricing",
  "dep:rustok-product",
  "dep:rustok-inventory",
  "dep:rustok-commerce",
  "dep:rustok-region",
  "dep:sea-orm",
  "rustok-api/server",
]

[dependencies]
leptos-auth.workspace = true
rustok-ui-core.workspace = true
rustok-ui-leptos = { path = "../../../ui/rustok-ui/leptos", default-features = false }
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
rustok-graphql.workspace = true
leptos-ui-routing.workspace = true
rustok-api = { workspace = true, default-features = false }

rustok-ui-i18n.workspace = true
rustok-ui-transport.workspace = true
rustok-cart = { workspace = true, optional = true }
rustok-customer = { workspace = true, optional = true }
rustok-outbox = { workspace = true, optional = true }
rustok-pricing = { workspace = true, optional = true }
rustok-product = { workspace = true, optional = true }
rustok-inventory = { workspace = true, optional = true }
rustok-commerce = { workspace = true, optional = true }
rustok-region = { workspace = true, optional = true }
rustok-pricing-storefront = { workspace = true, default-features = false }
# Database access is only used by the SSR adapter; never link it into the browser island.
sea-orm = { workspace = true, optional = true }
rust_decimal.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3" }
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Document", "Element", "Node", "HtmlElement", "Event", "EventTarget", "CustomEvent", "CustomEventInit", "StorageEvent"] }
