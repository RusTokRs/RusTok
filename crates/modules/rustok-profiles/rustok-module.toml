[module]
slug = "profiles"
name = "Profiles"
version = "0.1.0"
description = "Universal public profile domain for platform users"
ownership = "first_party"
trust_level = "verified"
ui_classification = "storefront_only"

[crate]
entry_type = "ProfilesModule"

[dependencies]
media = { version_req = ">=0.1.0" }
social_graph = { version_req = ">=0.1.0" }
taxonomy = { version_req = ">=0.1.0" }

[provides.graphql]
query = "graphql::ProfilesQuery"
mutation = "graphql::ProfilesMutation"

[provides.storefront_ui]
leptos_crate = "rustok-profiles-storefront"
slot = "home_before_footer"
route_segment = "profiles"
page_title = "Profiles"

[provides.storefront_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "storefront/locales"

[provides.cli]
namespace = "profiles"
factory = "rustok_profiles_cli::command_provider"
