[package]
name = "rustok-profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Universal public profile domain module for RusToK"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[features]
default = ["server"]
server = [
  "dep:chrono",
  "dep:rustok-api",
  "dep:rustok-core",
  "dep:rustok-events",
  "dep:rustok-media",
  "dep:rustok-outbox",
  "dep:rustok-social-graph",
  "dep:rustok-storage",
  "dep:rustok-taxonomy",
  "dep:sea-orm",
  "dep:sea-orm-migration",
  "dep:tracing",
]

[dependencies]
async-graphql = { workspace = true, features = ["dataloader"] }
async-trait.workspace = true
chrono = { workspace = true, optional = true }
rustok-api = { workspace = true, features = ["server"], optional = true }
rustok-core = { workspace = true, optional = true }
rustok-events = { workspace = true, optional = true }
rustok-media = { workspace = true, optional = true }
rustok-outbox = { workspace = true, optional = true }
rustok-social-graph = { path = "../rustok-social-graph", optional = true }
rustok-storage = { workspace = true, optional = true }
rustok-taxonomy = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
rustok-test-utils.workspace = true
serde_json.workspace = true
tokio.workspace = true
