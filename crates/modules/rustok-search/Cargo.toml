[package]
name = "rustok-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core search module for RusTok - Postgres-first search contracts, engine selection, and connector registry"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-graphql = { workspace = true, optional = true }
rustok-core.workspace = true
rustok-api = { workspace = true, features = ["server"] }
rustok-content.workspace = true
rustok-events.workspace = true
rustok-outbox = { workspace = true, optional = true }
rustok-telemetry.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true

[dev-dependencies]
flex.workspace = true
# The Blog projection lifecycle test runs the real owner source and the real Profiles
# port, so the Blog module is a test-only dependency: Search itself still never depends
# on a module crate at runtime.
rustok-blog.workspace = true
rustok-forum.workspace = true
rustok-outbox.workspace = true
rustok-profiles.workspace = true
rustok-taxonomy.workspace = true
tokio.workspace = true

[features]
default = []
graphql = ["dep:async-graphql", "dep:axum", "dep:rustok-outbox", "rustok-api/server"]
