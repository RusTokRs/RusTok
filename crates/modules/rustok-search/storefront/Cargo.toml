[package]
name = "rustok-search-storefront"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Leptos storefront UI package for the rustok-search module"
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = [
  "leptos/ssr",
  "dep:leptos_axum",
  "dep:rustok-search",
  "rustok-api/server",
]

[dependencies]
rustok-ui-core.workspace = true
rustok-ui-i18n.workspace = true
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
rustok-graphql.workspace = true
rustok-ui-transport.workspace = true
leptos-ui-routing.workspace = true
rustok-api.workspace = true
rustok-search = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid.workspace = true
