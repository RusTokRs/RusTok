[package]
name = "rustok-messenger"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Highload distributed team messaging, channels, threads, and E2EE engine for RusToK"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
chrono = { workspace = true, features = ["serde"] }
tracing.workspace = true
async-trait.workspace = true
sea-orm = { workspace = true, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration.workspace = true
rustok-core.workspace = true
rustok-api = { workspace = true, features = ["server", "runtime"] }
rustok-web.workspace = true
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["full", "sync"] }
rustok-events.workspace = true
rustok-notifications.workspace = true
rustok-outbox.workspace = true
rustok-iggy = { workspace = true, optional = true }
async-graphql = { workspace = true, optional = true }

[features]
default = []
graphql = ["dep:async-graphql", "rustok-api/server"]
iggy = ["dep:rustok-iggy"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
