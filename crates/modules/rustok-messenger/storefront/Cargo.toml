[package]
name = "rustok-messenger-storefront"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Storefront FFA package for full-page workstation and contextual floating chat widget"

[lib]
crate-type = ["rlib"]

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = [
  "leptos/ssr",
  "dep:leptos_axum",
  "dep:rustok-core",
  "dep:rustok-messenger",
  "rustok-api/server",
]

[dependencies]
rustok-ui-core.workspace = true
rustok-ui-transport.workspace = true
rustok-ui-i18n.workspace = true
leptos-ui.workspace = true
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
leptos-auth.workspace = true
rustok-graphql.workspace = true
leptos-ui-routing.workspace = true
leptos_router.workspace = true
rustok-api = { workspace = true, default-features = false }

rustok-core = { workspace = true, optional = true }
rustok-messenger = { path = "..", default-features = false, optional = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["serde"] }
tracing.workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["leptos-ui", "leptos-ui-routing", "leptos_axum", "rustok-core", "rustok-messenger"]
