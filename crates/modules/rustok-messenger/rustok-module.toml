[module]
slug = "messenger"
name = "Messenger & Team Chat"
version = "0.1.0"
description = "Highload distributed team messaging, channels, direct messages, monotonic sequence cursors and E2EE"
ownership = "first_party"
trust_level = "verified"
ui_classification = "admin_only"
recommended_admin_surfaces = ["leptos-admin"]

[marketplace]
category = "communication"
tags = ["messenger", "chat", "channels", "realtime", "e2ee", "iggy", "webrtc"]

[dependencies]
outbox = { version_req = ">=0.1.0" }

[crate]
entry_type = "MessengerModule"

[provides.http]
axum_router = "controllers::axum_router"

[provides.graphql]
query = "graphql::MessengerQuery"
mutation = "graphql::MessengerMutation"
runtime_data_factory = "graphql::attach_schema_data"

[provides.admin_ui]
leptos_crate = "rustok-messenger-admin"
route_segment = "messenger"
nav_label = "Messenger"

[provides.admin_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "admin/locales"
