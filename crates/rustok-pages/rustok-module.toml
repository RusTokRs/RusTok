[module]
slug = "pages"
name = "Pages"
version = "0.1.0"
description = "Static pages and published visual documents"
ownership = "first_party"
trust_level = "verified"
ui_classification = "dual_surface"
recommended_admin_surfaces = ["leptos-admin"]

[marketplace]
category = "content"
tags = ["cms", "content", "landing-pages"]

[dependencies]
content = { version_req = ">=0.1.0" }
outbox = { version_req = ">=0.1.0" }

[dependencies.page_builder]
module = "page-builder"
version_req = ">=0.1.0"
mode = "capability_provider"
required_capabilities = ["preview", "tree", "properties", "publish"]
contract = "grapesjs"
contract_version = "1.1"

[crate]
entry_type = "PagesModule"

[provides.graphql]
query = "graphql::PagesQuery"
mutation = "graphql::PagesMutation"
runtime_data_factory = "graphql::attach_schema_data"

[provides.http]
axum_router = "http::axum_router"

[provides.admin_ui]
leptos_crate = "rustok-pages-admin"
route_segment = "pages"
nav_label = "Pages"

[provides.admin_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "admin/locales"

[[provides.admin_ui.child_pages]]
subpath = "all"
title = "All Pages"
nav_label = "All Pages"

[[provides.admin_ui.child_pages]]
subpath = "new"
title = "Add Page"
nav_label = "Add Page"

[provides.storefront_ui]
leptos_crate = "rustok-pages-storefront"
slot = "home_before_footer"
route_segment = "pages"
page_title = "Pages"

[provides.storefront_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "storefront/locales"

[fba.builder_consumer]
provider_module = "page-builder"
contract = "grapesjs"
contract_version = "1.1"
builder_contract_version = "1.1"
consumer_min_version = "1.0"
capabilities = ["preview", "tree", "properties", "publish"]

# Canonical Fly contribution source for the Pages admin consumer. The admin build script derives
# owner version from [module].version and injects ownerProvider/providerVersion into generated
# descriptors, so those identity fields cannot drift in a parallel handwritten Rust manifest.
[fba.builder_consumer.contribution_manifest]
owner_provider = "rustok.pages"
target_providers = { "fly.builtin" = "1" }

[[fba.builder_consumer.contribution_manifest.admin]]
role = "landing_blocks"
id = "rustok.pages.landing-blocks"
provider = "fly.builtin"
required_capabilities = ["tree", "properties"]
blocks = [
  "fly.hero",
  "fly.two_columns",
  "fly.feature_grid",
  "fly.cta",
  "fly.contact_form",
]

[fba.builder_consumer.contribution_manifest.admin.messages]
"pages.builder.contributions.landingBlocks" = "Pages landing blocks"

[fba.builder_consumer.contribution_manifest.admin.metadata]
format = "grapesjs"
surface = "admin"

[[fba.builder_consumer.contribution_manifest.admin]]
role = "metadata"
id = "rustok.pages.metadata"
provider = "rustok.pages"
required_capabilities = ["properties"]
blocks = []

[[fba.builder_consumer.contribution_manifest.admin.property_editors]]
id = "rustok.pages.metadata.editor"
component_type = "rustok-pages-metadata"
provider = "rustok.pages"

[fba.builder_consumer.contribution_manifest.admin.property_editors.accessibility]
label_message_id = "pages.builder.contributions.metadata.label"
description_message_id = "pages.builder.contributions.metadata.description"
keyboard_hint_message_id = ""

[fba.builder_consumer.contribution_manifest.admin.property_editors.property_schema]
format = "page_builder_consumer_properties_v1"
id = "rustok.pages.metadata.schema"
title = "Page metadata"
description = "Versioned Pages metadata. Saving these properties never writes the Fly document."

[[fba.builder_consumer.contribution_manifest.admin.property_editors.property_schema.fields]]
id = "title"
label = "Title"
kind = "text"
required = true
max_bytes = 512

[[fba.builder_consumer.contribution_manifest.admin.property_editors.property_schema.fields]]
id = "slug"
label = "Slug"
kind = "text"
required = true
max_bytes = 512

[[fba.builder_consumer.contribution_manifest.admin.property_editors.property_schema.fields]]
id = "meta_title"
label = "SEO title"
kind = "text"
required = false
max_bytes = 512

[[fba.builder_consumer.contribution_manifest.admin.property_editors.property_schema.fields]]
id = "meta_description"
label = "SEO description"
kind = "text_area"
required = false
max_bytes = 4096

[[fba.builder_consumer.contribution_manifest.admin.property_editors.property_schema.fields]]
id = "template"
label = "Template"
kind = "text"
required = false
max_bytes = 256

[[fba.builder_consumer.contribution_manifest.admin.property_editors.property_schema.fields]]
id = "channel_slugs"
label = "Channels"
kind = "string_list"
required = false
max_bytes = 4096
help = "Comma-separated channel slugs. Leave empty for every channel."
placeholder = "web, mobile"

[fba.builder_consumer.contribution_manifest.admin.messages]
"pages.builder.contributions.metadata.label" = "Page metadata"
"pages.builder.contributions.metadata.description" = "Edit versioned Pages metadata without modifying the Fly document."

[fba.builder_consumer.contribution_manifest.admin.metadata]
persistence = "consumer_facade"
surface = "admin"

[fba.builder_consumer.degraded_modes]
builder_disabled = "admin_builder_readonly_fallback"
preview_disabled = "preview_capability_hidden_keep_read_paths"
publish_disabled = "typed_feature_disabled_error_keep_read_paths"

[fba.builder_consumer.error_catalog]
validation = "validation"
sanitize = "sanitize"
runtime = "runtime"
feature_disabled = "feature-disabled"

[fba.builder_consumer.error_codes]
feature_disabled = "FEATURE_DISABLED"

[fba.builder_consumer.degraded_mode_errors]
builder_disabled = "FEATURE_DISABLED"
preview_disabled = "FEATURE_DISABLED"
publish_disabled = "FEATURE_DISABLED"

[fba.builder_consumer.toggle_profiles]
all_on = [
  "builder.enabled=true",
  "builder.preview.enabled=true",
  "builder.properties.enabled=true",
  "builder.publish.enabled=true",
  "builder.legacy_bridge_readonly=true",
]
publish_off = [
  "builder.enabled=true",
  "builder.preview.enabled=true",
  "builder.properties.enabled=true",
  "builder.publish.enabled=false",
  "builder.legacy_bridge_readonly=true",
]
preview_off = [
  "builder.enabled=true",
  "builder.preview.enabled=false",
  "builder.properties.enabled=true",
  "builder.publish.enabled=false",
  "builder.legacy_bridge_readonly=true",
]
builder_off = [
  "builder.enabled=false",
  "builder.preview.enabled=false",
  "builder.properties.enabled=false",
  "builder.publish.enabled=false",
  "builder.legacy_bridge_readonly=true",
]

[fba.builder_consumer.rollout_policy]
audit_trail = "control_plane_builder_wave_audit"
before_snapshot_required = true
after_snapshot_required = true
decision_required = true
owner_signoff_required = true
rollback_without_redeploy_target_minutes = 10
pilot_smoke = "preview -> properties -> publish(dry)"
rollback_triggers = [
  "runtime_error_rate_above_alert_threshold",
  "publish_latency_p95_above_slo_for_10m",
  "sanitize_failures_above_alert_threshold",
  "storefront_published_read_regression",
]
read_surfaces_guarantee = "pages_owned_list_and_document_read_paths_stay_available_when_builder_capabilities_are_disabled"
