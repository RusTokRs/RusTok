[module]
slug = "forum"
name = "Forum"
version = "0.1.0"
description = "Forum categories, topics, replies, and moderation workflows"
ownership = "first_party"
trust_level = "verified"
ui_classification = "dual_surface"
recommended_admin_surfaces = ["leptos-admin"]

[marketplace]
category = "content"
tags = ["community", "content", "discussions"]

[dependencies]
content = { version_req = ">=0.1.0" }
taxonomy = { version_req = ">=0.1.0" }

[crate]
entry_type = "ForumModule"

[provides.graphql]
query = "graphql::ForumQuery"
mutation = "graphql::ForumMutation"
runtime_data_factory = "graphql::attach_schema_data"

[provides.http]
axum_router = "controllers::axum_router"

[provides.admin_ui]
leptos_crate = "rustok-forum-admin"
route_segment = "forum"
nav_label = "Forum"

[provides.admin_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "admin/locales"

[provides.storefront_ui]
leptos_crate = "rustok-forum-storefront"
slot = "home_after_catalog"
route_segment = "forum"
page_title = "Forum"

[provides.storefront_ui.i18n]
default_locale = "en"
supported_locales = ["en", "ru"]
leptos_locales_path = "storefront/locales"

[[provides.admin_ui.child_pages]]
subpath = "topics"
title = "Forum Topics"
nav_label = "Topics"

[[provides.admin_ui.child_pages]]
subpath = "categories"
title = "Forum Categories"
nav_label = "Categories"

[[provides.admin_ui.child_pages]]
subpath = "rename-slug"
title = "Rename Forum Topic Route"
nav_label = "Rename Topic Route"

[[provides.admin_ui.child_pages]]
subpath = "merge"
title = "Merge Forum Topics"
nav_label = "Merge Topics"

[fba.builder_consumer]
provider_module = "page-builder"
contract = "grapesjs_v1"
contract_version = "1.0"
builder_contract_version = "1.0"
consumer_min_version = "1.0"
catalog_version = "v1"
capabilities = ["preview", "tree", "properties", "publish"]

# Canonical Fly contracts for the Forum Page Builder consumer. Block ids intentionally equal
# widget component types, so the module manifest remains the only identity mapping authority.
# Property editors carry only owner-contract references: the actual JSON schemas and validation
# stay behind the Forum widget catalog/validate endpoints and are not copied into Fly metadata.
[fba.builder_consumer.contribution_manifest]
owner_provider = "rustok.forum"
target_providers = {}
dependencies = []
required_permissions = ["forum_topics:read"]

# Authoring identity and property contracts remain available when preview is disabled.
[[fba.builder_consumer.contribution_manifest.admin]]
role = "widget_catalog"
id = "rustok.forum.widget-catalog"
provider = "rustok.forum"
required_capabilities = ["tree", "properties"]
blocks = [
  "forum.topic_list",
  "forum.topic_detail",
  "forum.reply_stream",
]

[[fba.builder_consumer.contribution_manifest.admin.property_editors]]
id = "rustok.forum.topic-list.properties"
component_type = "forum.topic_list"
provider = "rustok.forum"

[fba.builder_consumer.contribution_manifest.admin.property_editors.accessibility]
label_message_id = "forum.builder.widget.topicList.label"
description_message_id = "forum.builder.widget.topicList.description"
keyboard_hint_message_id = ""

[fba.builder_consumer.contribution_manifest.admin.property_editors.property_schema]
format = "forum_widget_owner_schema_ref_v1"
schema_id = "forum.topic_list.v1"
catalog_endpoint = "/api/forum/widgets/catalog"
validate_endpoint = "/api/forum/widgets/validate"
owner_data_state = "owner_property_editor_ready"

[[fba.builder_consumer.contribution_manifest.admin.property_editors]]
id = "rustok.forum.topic-detail.properties"
component_type = "forum.topic_detail"
provider = "rustok.forum"

[fba.builder_consumer.contribution_manifest.admin.property_editors.accessibility]
label_message_id = "forum.builder.widget.topicDetail.label"
description_message_id = "forum.builder.widget.topicDetail.description"
keyboard_hint_message_id = ""

[fba.builder_consumer.contribution_manifest.admin.property_editors.property_schema]
format = "forum_widget_owner_schema_ref_v1"
schema_id = "forum.topic_detail.v1"
catalog_endpoint = "/api/forum/widgets/catalog"
validate_endpoint = "/api/forum/widgets/validate"
owner_data_state = "owner_property_editor_ready"

[[fba.builder_consumer.contribution_manifest.admin.property_editors]]
id = "rustok.forum.reply-stream.properties"
component_type = "forum.reply_stream"
provider = "rustok.forum"

[fba.builder_consumer.contribution_manifest.admin.property_editors.accessibility]
label_message_id = "forum.builder.widget.replyStream.label"
description_message_id = "forum.builder.widget.replyStream.description"
keyboard_hint_message_id = ""

[fba.builder_consumer.contribution_manifest.admin.property_editors.property_schema]
format = "forum_widget_owner_schema_ref_v1"
schema_id = "forum.reply_stream.v1"
catalog_endpoint = "/api/forum/widgets/catalog"
validate_endpoint = "/api/forum/widgets/validate"
owner_data_state = "owner_property_editor_ready"

[fba.builder_consumer.contribution_manifest.admin.messages]
"forum.builder.contributions.widgetCatalog" = "Forum widgets"
"forum.builder.widget.topicList.label" = "Forum topic list"
"forum.builder.widget.topicList.description" = "Configure a Forum-owned topic list widget."
"forum.builder.widget.topicDetail.label" = "Forum topic detail"
"forum.builder.widget.topicDetail.description" = "Configure a Forum-owned topic detail widget."
"forum.builder.widget.replyStream.label" = "Forum reply stream"
"forum.builder.widget.replyStream.description" = "Configure a Forum-owned reply stream widget."

[fba.builder_consumer.contribution_manifest.admin.metadata]
format = "forum_widget_catalog_v1"
surface = "admin"
catalog_version = "v1"
contract_version = "1.0"
catalog_endpoint = "/api/forum/widgets/catalog"
validate_endpoint = "/api/forum/widgets/validate"
preview_endpoint = "/api/forum/widgets/preview"
catalog_source = "fba.builder_consumer.widgets"
adapter_state = "fly_contract_ready"
preview_data_state = "owner_preview_transport_ready"
property_data_state = "owner_property_editor_ready"
persistence_owner = "forum"
authorization_owner = "forum"

# Preview renderer admission is a separate contribution so preview_off does not remove property
# editing or Fly component identity from an otherwise-authorized Forum widget document.
[[fba.builder_consumer.contribution_manifest.admin]]
role = "widget_preview"
id = "rustok.forum.widget-preview"
provider = "rustok.forum"
required_capabilities = ["preview"]
blocks = []

[[fba.builder_consumer.contribution_manifest.admin.renderers]]
id = "rustok.forum.topic-list.renderer"
component_type = "forum.topic_list"
provider = "rustok.forum"
presentations = ["full", "inline", "preview", "read_only"]

[fba.builder_consumer.contribution_manifest.admin.renderers.accessibility]
label_message_id = "forum.builder.widget.topicList.label"
description_message_id = "forum.builder.widget.topicList.description"
keyboard_hint_message_id = ""

[[fba.builder_consumer.contribution_manifest.admin.renderers]]
id = "rustok.forum.topic-detail.renderer"
component_type = "forum.topic_detail"
provider = "rustok.forum"
presentations = ["full", "inline", "preview", "read_only"]

[fba.builder_consumer.contribution_manifest.admin.renderers.accessibility]
label_message_id = "forum.builder.widget.topicDetail.label"
description_message_id = "forum.builder.widget.topicDetail.description"
keyboard_hint_message_id = ""

[[fba.builder_consumer.contribution_manifest.admin.renderers]]
id = "rustok.forum.reply-stream.renderer"
component_type = "forum.reply_stream"
provider = "rustok.forum"
presentations = ["full", "inline", "preview", "read_only"]

[fba.builder_consumer.contribution_manifest.admin.renderers.accessibility]
label_message_id = "forum.builder.widget.replyStream.label"
description_message_id = "forum.builder.widget.replyStream.description"
keyboard_hint_message_id = ""

[fba.builder_consumer.contribution_manifest.admin.messages]
"forum.builder.widget.topicList.label" = "Forum topic list"
"forum.builder.widget.topicList.description" = "Preview a Forum-owned topic list widget."
"forum.builder.widget.topicDetail.label" = "Forum topic detail"
"forum.builder.widget.topicDetail.description" = "Preview a Forum-owned topic detail widget."
"forum.builder.widget.replyStream.label" = "Forum reply stream"
"forum.builder.widget.replyStream.description" = "Preview a Forum-owned reply stream widget."

[fba.builder_consumer.contribution_manifest.admin.metadata]
format = "forum_widget_preview_v1"
surface = "admin"
catalog_endpoint = "/api/forum/widgets/catalog"
validate_endpoint = "/api/forum/widgets/validate"
preview_endpoint = "/api/forum/widgets/preview"
adapter_state = "fly_contract_ready"
preview_data_state = "owner_preview_transport_ready"
persistence_owner = "forum"
authorization_owner = "forum"

[fba.builder_consumer.error_mapping]
validation = "forum.widget.validation"
sanitize = "forum.widget.sanitize"
rbac = "forum.widget.rbac"
runtime = "forum.widget.runtime"

[fba.builder_consumer.compatibility_matrix]
provider_contract_version = "1.0"
consumer_min_version = "1.0"

[fba.builder_consumer.widgets.topic_list]
data_contract_version = "1.0"
props_schema = "forum.topic_list.v1"
capability_requirements = ["preview"]
fallback_mode = "readonly"

[fba.builder_consumer.widgets.topic_detail]
data_contract_version = "1.0"
props_schema = "forum.topic_detail.v1"
capability_requirements = ["preview", "moderation_view"]
fallback_mode = "degraded"

[fba.builder_consumer.widgets.reply_stream]
data_contract_version = "1.0"
props_schema = "forum.reply_stream.v1"
capability_requirements = ["preview", "moderation_view"]
fallback_mode = "hidden"

[fba.builder_consumer.degraded_modes]
builder_disabled = "forum_widgets_readonly_keep_forum_routes"
preview_disabled = "forum_widget_preview_hidden_keep_forum_routes"
publish_disabled = "forum_widget_publish_feature_disabled_keep_forum_routes"

[fba.builder_consumer.toggle_profiles]
all_on = [
  "builder.enabled=true",
  "builder.preview.enabled=true",
  "builder.properties.enabled=true",
  "builder.publish.enabled=true",
  "builder.legacy_bridge_readonly=true",
]
publish_off = [
  "builder.enabled=true",
  "builder.preview.enabled=true",
  "builder.properties.enabled=true",
  "builder.publish.enabled=false",
  "builder.legacy_bridge_readonly=true",
]
preview_off = [
  "builder.enabled=true",
  "builder.preview.enabled=false",
  "builder.properties.enabled=true",
  "builder.publish.enabled=false",
  "builder.legacy_bridge_readonly=true",
]
builder_off = [
  "builder.enabled=false",
  "builder.preview.enabled=false",
  "builder.properties.enabled=false",
  "builder.publish.enabled=false",
  "builder.legacy_bridge_readonly=true",
]

[fba.builder_consumer.rollout_policy]
audit_trail = "control_plane_builder_wave_audit"
before_snapshot_required = true
after_snapshot_required = true
decision_required = true
owner_signoff_required = true
rollback_without_redeploy_target_minutes = 10
pilot_smoke = "list -> open -> preview -> save_draft -> publish_dry"
rollback_triggers = [
  "runtime_error_rate_above_alert_threshold",
  "publish_latency_p95_above_slo_for_10m",
  "sanitize_failures_above_alert_threshold",
  "storefront_published_read_regression",
]
read_surfaces_guarantee = "forum_owned_list_read_topic_paths_stay_available_when_builder_capabilities_are_disabled"
