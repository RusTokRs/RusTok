[package]
name = "rustok-module-template"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
description = "Canonical independently versioned Rust module component template for RusToK"
repository.workspace = true
include = ["src/**", "assets/**", "README.md", "docs/**", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rustok-module-sdk.workspace = true
rustok-modules.workspace = true
rustok-sandbox.workspace = true
serde_json.workspace = true
thiserror.workspace = true

