[package]
name = "rustok-forms-dioxus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["RusToK Team"]
description = "Dioxus 0.6 structural form components for rustok-forms"
repository = "https://github.com/RusTokRs/RusTok"
documentation = "https://docs.rs/rustok-forms-dioxus"
readme = "README.md"
keywords = ["dioxus", "forms", "ui", "wai-aria", "components"]
categories = ["gui", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { version = "0.6", default-features = false }
rustok-forms = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
