[package]
name = "rustok-forms-leptos"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["RusToK Team"]
description = "Leptos structural form components for rustok-forms"
repository = "https://github.com/RusTokRs/RusTok"
documentation = "https://docs.rs/rustok-forms-leptos"
readme = "README.md"
keywords = ["leptos", "forms", "ui", "wai-aria", "components"]
categories = ["gui", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]
csr = ["leptos/csr"]

[dependencies]
leptos = { workspace = true }
rustok-forms = { workspace = true }
