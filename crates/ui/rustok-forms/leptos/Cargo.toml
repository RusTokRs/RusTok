[package]
name = "rustok-forms-leptos"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["RusToK Team"]
description = "Leptos structural form components for rustok-forms"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]
csr = ["leptos/csr"]

[dependencies]
leptos = { workspace = true }
rustok-forms = { workspace = true }
