[package]
name = "rustok-grid"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["RusToK Team"]
description = "Framework-agnostic DataGrid state machine, column math, and filtering engine for RusToK"
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["datagrid", "table", "pagination", "filtering", "state"]
categories = ["web-programming", "gui", "data-structures"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
