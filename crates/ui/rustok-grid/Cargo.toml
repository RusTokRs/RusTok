[package]
name = "rustok-grid"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["RusToK Team"]
description = "Framework-agnostic DataGrid state machine, column math, and filtering engine for RusToK"
repository = "https://github.com/RusTokRs/RusTok"
documentation = "https://docs.rs/rustok-grid"
readme = "README.md"
keywords = ["datagrid", "table", "pagination", "filtering", "state"]
categories = ["web-programming", "gui", "data-structures"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
