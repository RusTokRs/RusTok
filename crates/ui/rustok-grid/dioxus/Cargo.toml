[package]
name = "rustok-grid-dioxus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["RusToK Team"]
description = "Dioxus 0.7 DataGrid adapter for RusToK"
repository = "https://github.com/RusTokRs/RusTok"
documentation = "https://docs.rs/rustok-grid-dioxus"
readme = "README.md"
keywords = ["dioxus", "datagrid", "table", "ui", "wai-aria"]
categories = ["gui", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { workspace = true }
rustok-grid = { workspace = true }
