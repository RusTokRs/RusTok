[package]
name = "rustok-grid-leptos"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["RusToK Team"]
description = "SSR-first Leptos 0.8 DataGrid adapter for RusToK"
repository = "https://github.com/RusTokRs/RusTok"
documentation = "https://docs.rs/rustok-grid-leptos"
readme = "README.md"
keywords = ["leptos", "datagrid", "table", "ui", "wai-aria"]
categories = ["gui", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]
csr = ["leptos/csr"]

[dependencies]
rustok-grid = { workspace = true }

leptos = { workspace = true }
leptos-use = { workspace = true }
web-sys = { version = "0.3", features = ["Element", "KeyboardEvent", "PointerEvent"] }
