[package]
name = "fly-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Framework-neutral browser runtime, geometry, hit-testing, and iframe bridge for Fly visual editors"

[features]
default = []
wasm-client = [
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:web-sys",
]

[dependencies]
fly = { path = ".." }
fly-ui = { path = "../ui" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Document",
  "DomRectReadOnly",
  "Element",
  "Event",
  "EventTarget",
  "HtmlElement",
  "HtmlIFrameElement",
  "KeyboardEvent",
  "MessageEvent",
  "Node",
  "NodeList",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "Window",
] }
