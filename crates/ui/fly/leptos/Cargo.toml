[package]
name = "fly-leptos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSR-first Leptos adapter foundation for Fly visual editors"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
path = "src/root.rs"

[features]
default = ["ssr"]
ssr = ["leptos/ssr"]
wasm-client = [
  "leptos/hydrate",
  "fly-web/wasm-client",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:web-sys",
]

[dependencies]
fly = { path = ".." }
fly-browser = { path = "../browser" }
fly-ui = { path = "../ui" }
fly-web = { path = "../web" }
leptos.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Document",
  "DomRectReadOnly",
  "Element",
  "Event",
  "EventTarget",
  "FocusEvent",
  "HtmlElement",
  "HtmlIFrameElement",
  "KeyboardEvent",
  "MessageEvent",
  "Node",
  "NodeList",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "Window",
] }

[lints]
workspace = true
