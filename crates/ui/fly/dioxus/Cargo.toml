[package]
name = "fly-dioxus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSR and Web/Desktop Dioxus 0.6 adapter foundation for Fly visual editors"

[features]
default = []
web = ["dioxus/web", "fly-web/wasm-client"]
desktop = ["dioxus/desktop"]

[dependencies]
fly = { path = ".." }
fly-ui = { path = "../ui" }
fly-web = { path = "../web" }
dioxus = { workspace = true }
serde.workspace = true
serde_json.workspace = true
