[package]
name = "rustok-ui-forms"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["RusToK Team"]
description = "Framework-agnostic form state, validation, field contracts, and dirty tracking"
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["forms", "validation", "state", "dirty-tracking", "schema"]
categories = ["web-programming", "gui", "data-structures"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { version = "1.12", default-features = false, features = ["std", "unicode"] }
