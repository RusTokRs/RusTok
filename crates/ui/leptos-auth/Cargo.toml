[package]
name = "leptos-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Leptos authentication context, protected route wrappers, and token refresh hooks"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
csr = []
hydrate = ["leptos/hydrate"]
ssr = [
  "leptos/ssr",
  "dep:leptos_axum",
  "dep:axum",
]

[dependencies]
rustok-ui-auth.workspace = true
leptos = { workspace = true }
leptos_router = { workspace = true }
rustok-graphql.workspace = true
rustok-ui-transport.workspace = true
leptos-use = { workspace = true }
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-storage = { workspace = true }
web-sys = { version = "0.3", features = ["Window", "Location", "Headers", "Storage", "Event", "EventTarget", "CustomEvent", "CustomEventInit"] }
js-sys = { version = "0.3" }

[package.metadata.cargo-udeps.ignore]
normal = ["leptos-use"]
