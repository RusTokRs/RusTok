[package]
name = "rustok-ui-grid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FFA DataGrid engine with column resizing, per-column filters, and Leptos adapter for RusToK"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["leptos"]
leptos = [
    "dep:leptos",
    "dep:leptos-use",
    "dep:iu-leptos",
    "dep:web-sys",
]
ssr = ["leptos?/ssr"]
hydrate = ["leptos?/hydrate"]
csr = ["leptos?/csr"]
dioxus = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rustok-ui-core = { workspace = true }

leptos = { workspace = true, optional = true }
leptos-use = { workspace = true, optional = true }
iu-leptos = { workspace = true, optional = true }
web-sys = { version = "0.3", optional = true, features = ["Element", "PointerEvent"] }
