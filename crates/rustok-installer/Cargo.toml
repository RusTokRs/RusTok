[package]
name = "rustok-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Installer foundation contracts for RusToK"

[features]
default = ["host-runtime", "seed-runtime"]
host-runtime = []
seed-runtime = ["dep:rustok-core"]

[dependencies]
chrono.workspace = true
async-trait.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
rustok-core = { workspace = true, optional = true }
rustok-modules.workspace = true
rustok-runtime.workspace = true

[dev-dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
rustok-api.workspace = true
serde_json.workspace = true
tokio.workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["uuid"]
