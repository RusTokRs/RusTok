[package]
name = "rustok-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Neutral sandbox execution foundation for RusToK"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
rhai = ["dep:rhai", "dep:parking_lot", "dep:email_address"]
wasm-component = ["dep:wasmtime"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt"] }
rhai = { workspace = true, features = ["sync", "metadata"], optional = true }
parking_lot = { version = "0.13", optional = true }
email_address = { version = "0.2.9", optional = true }
wasmtime = { version = "48.0.0", default-features = false, features = ["runtime", "component-model", "cranelift"], optional = true }
