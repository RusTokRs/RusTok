version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rustok-postgres
    environment:
      POSTGRES_USER: rustok
      POSTGRES_PASSWORD: rustok_password
      POSTGRES_DB: rustok_revisions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustok"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:15-alpine
    container_name: rustok-postgres-test
    environment:
      POSTGRES_USER: rustok
      POSTGRES_PASSWORD: rustok_password
      POSTGRES_DB: rustok_revisions_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rustok-revisions-cli
    environment:
      DATABASE_URL: postgres://rustok:rustok_password@postgres:5432/rustok_revisions
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./exports:/home/rustok/exports

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rustok-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rustok.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
