[package]
name = "rustok-revisions-monitoring"
version = "0.1.0"
edition = "2021"
description = "Monitoring and health check server for rustok-revisions"
license = "MIT OR Apache-2.0"

[[bin]]
name = "revisions-monitor"
path = "src/main.rs"

[dependencies]
rustok-revisions = { path = "../rustok-revisions", features = ["seaorm"] }
sea-orm = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
lazy_static = "1.4"
sysinfo = "0.30"
