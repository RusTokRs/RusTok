[workspace]

[package]
name = "rustok-admin-dioxus"
version = "0.1.0"
edition = "2024"
license = "BSL-1.1"
description = "Dioxus host shell scaffolding for RusToK FFA UI (Phase E pilot / standalone)"

[features]
default = ["web"]
web = ["dep:dioxus"]
desktop = ["dep:dioxus"]

[dependencies]
rustok-ui-core = { path = "../../crates/ui/rustok-ui-core" }
rustok-ui-transport = { path = "../../crates/ui/rustok-ui-transport" }
rustok-ui-i18n = { path = "../../crates/ui/rustok-ui-i18n" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dioxus = { version = "0.6", optional = true, default-features = false }
