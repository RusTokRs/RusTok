id: rust-fba-domain-no-adapter-imports
language: rust
severity: error
message: "FBA Domain must not import from adapters or transport. Dependencies point inward: domain defines ports, adapters implement them."
note: |-
  Rule in AGENTS.md and docs/backend/module-backend-implementation.md:
  The domain layer depends only on domain types and port traits.
  Adapters depend on the domain, never the reverse.
files:
  - "crates/modules/**/src/domain/**"
ignores:
  - "**/test.rs"
  - "**/tests.rs"
  - "**/tests/**"
rule:
  any:
    - kind: scoped_identifier
      regex: ^crate::(adapters|adapter|transport|inbound|outbound)\b
      not:
        inside:
          kind: scoped_identifier
    - kind: scoped_type_identifier
      regex: ^crate::(adapters|adapter|transport|inbound|outbound)\b
    - kind: use_declaration
      regex: ^use crate::(adapters|adapter|transport|inbound|outbound)\b
