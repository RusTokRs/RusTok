[files]
# Localized message catalogs and fixture text intentionally contain
# non-English words that are valid for those locales.
extend-exclude = [
  "crates/libs/rustok-core/src/i18n.rs",
  "crates/ui/rustok-grid/locales/fr.ftl",
  "crates/modules/rustok-commerce/tests/catalog_service_test.rs",
  "apps/next-admin/src/styles/globals.css",
  "crates/modules/rustok-ai/src/direct.rs",
  "crates/modules/rustok-ai/src/provider.rs",
  "crates/modules/rustok-commerce/src/controllers/store.rs",
  "crates/modules/rustok-commerce/tests/checkout_service_test.rs",
  "crates/modules/rustok-commerce/tests/graphql_runtime_parity_test.rs",
  "packages/richtext/dist/**",
  "migration-export-output.txt",
  "vendor/**",
  # Vendored upstream patch set; keep spellings and identifiers aligned with upstream.
  "third_party/patches/parcel_css/**",
  "rustok_mobile/**",
  "rustok_mobile/packages/rustok_i18n/lib/src/format/number_symbols.dart",
  "rustok_mobile/packages/rustok_i18n/test/**",
]

[default]
# Preserve generated diagnostic identifiers and intentional fixture/diagram tokens.
extend-ignore-re = [
  "diag_(?:env|script|deployment)_[0-9a-f]+",
  "\\bnl -ba\\b",
  "\\bful_1\\b",
  "\\bReFuNdEd\\b",
  "\\b[Pp]rodukt\\b",
  "\\bOTKs?\\b",
  "(?:FORUM-20BA|forum[-_]20ba|ba1de73|512b6ba)",
  "\\b(?:RTO|JOD|intoto|[Cc]ategorie|[Cc]opie|[Vv]ariante|[Gg]roupe|transitionable|Systemes|systemes|Titel|Suche|Hel)\\b",
  "\\bAuThOrIzEd\\b",
  "\\bsitemap_enabeld\\b",
  "\\bgrep -rin\\b",
  # Mixed-case policy validates case-insensitive parsing in Commerce fixtures.
  "\\bCoNtInUe\\b",
  # This deliberately malformed value verifies rejection by the policy parser.
  '"allwed"\.parse::<VariantAxisPolicy>',
  # French text asserted by the localized grid test.
  '"11–20 sur 42"',
]

[default.extend-words]
Copie = "Copie"
repid = "repid"
ANC = "ANC"
INSERTs = "INSERTs"
INSER = "INSER"
abd = "abd"
mis = "mis"
wrk = "wrk"
ba = "ba"
BA = "BA"
Tilda = "Tilda"
rin = "rin"
OTK = "OTK"
OTKs = "OTKs"
ND = "ND"
mulitline = "mulitline"
nam = "nam"
unparseable = "unparseable"
# `writeable` is the name of an ICU4X crate (see `Cargo.lock`).
writeable = "writeable"
OT = "OT"
FUL = "FUL"
UPDATEs = "UPDATEs"
UPDAT = "UPDAT"
ede = "ede"
