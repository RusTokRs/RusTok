version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Minsk"
    open-pull-requests-limit: 50
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      sea-orm:
        patterns:
          - "sea-orm*"
          - "sea-query*"
          - "sea-schema*"
      rig-ai:
        patterns:
          - "rig*"
      wasm-runtime:
        patterns:
          - "wasmtime*"
          - "wasmparser*"
          - "wit-*"
          - "cranelift-*"
          - "pulley-*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/apps/next-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/apps/next-admin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/apps/admin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/apps/storefront"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-updates:
        patterns: ["*"]

