name: Agent Shipping Option Read Debug

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-Dwarnings"
  CARGO_ENCODED_RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: 0

jobs:
  focused-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Capture focused diagnostics
        run: |
          set +e
          cargo clippy -p rustok-fulfillment -p rustok-commerce --all-features --no-deps -- -D warnings > focused-clippy.log 2>&1
          printf '%s\n' "$?" > focused-clippy-status.txt
          node scripts/verify/verify-fulfillment-shipping-option-read-port.mjs > owner-verifier.log 2>&1
          printf '%s\n' "$?" > owner-verifier-status.txt
          node scripts/verify/verify-commerce-graphql-shipping-option-typed-error.mjs > option-verifier.log 2>&1
          printf '%s\n' "$?" > option-verifier-status.txt
          node scripts/verify/verify-commerce-graphql-shipping-enrichment-typed-error.mjs > enrichment-verifier.log 2>&1
          printf '%s\n' "$?" > enrichment-verifier-status.txt
          exit 0
      - name: Upload focused diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: shipping-option-read-diagnostics
          path: |
            focused-clippy.log
            focused-clippy-status.txt
            owner-verifier.log
            owner-verifier-status.txt
            option-verifier.log
            option-verifier-status.txt
            enrichment-verifier.log
            enrichment-verifier-status.txt
          if-no-files-found: error
          retention-days: 1
