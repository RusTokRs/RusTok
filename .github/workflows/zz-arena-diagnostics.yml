name: ZZ Arena Diagnostics (temporary)

# Temporary scaffolding for PR #4647: the authoring sandbox cannot download
# Actions logs (egress allowlist), so this workflow republishes compiler
# diagnostics as check-run output text readable via the API. Delete before
# the PR leaves draft.

on:
  push:
    branches:
      - arena/b606e380-rustok
    paths:
      - .github/workflows/zz-arena-diagnostics.yml
      - .arena-diag-trigger

permissions:
  contents: read
  checks: write

concurrency:
  group: zz-arena-diagnostics-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  SQLX_OFFLINE: "true"

jobs:
  diag:
    name: Crate-scoped diagnostics digest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Collect and publish diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEADSHA: ${{ github.sha }}
        run: |
          git fetch origin main --quiet
          git diff --name-only origin/main...HEAD > /tmp/changed.txt || true
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request

          PKGS = ["-p", "rustok-modules", "-p", "rustok-api", "-p",
                  "rustok-sandbox-worker", "-p", "rustok-sandbox-transport",
                  "-p", "rustok-distribution"]
          changed = set()
          try:
              changed = {l.strip() for l in open("/tmp/changed.txt") if l.strip()}
          except FileNotFoundError:
              pass

          def post_digest(name, title, summary, text):
              if len(text) > 60000:
                  text = text[:60000] + "\n... [truncated]"
              payload = {
                  "name": name,
                  "head_sha": os.environ["HEADSHA"],
                  "status": "completed",
                  "conclusion": "neutral",
                  "output": {"title": title, "summary": summary, "text": text},
              }
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/check-runs",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print("posted", name, resp.status)
              except Exception as e:  # noqa: BLE001
                  print("FAILED to post", name, e)

          def cargo_json_diag(args):
              err_path = "/tmp/cargo_stderr.txt"
              diags = {}
              with open(err_path, "wb") as errf:
                  proc = subprocess.Popen(args, stdout=subprocess.PIPE,
                                          stderr=errf, text=True, bufsize=1)
                  for line in proc.stdout:
                      line = line.strip()
                      if not line.startswith("{"):
                          continue
                      try:
                          obj = json.loads(line)
                      except Exception:  # noqa: BLE001
                          continue
                      if obj.get("reason") != "compiler-message":
                          continue
                      msg = obj.get("message", {})
                      level = msg.get("level")
                      if level not in ("error", "warning"):
                          continue
                      spans = [s for s in msg.get("spans", []) if s.get("is_primary")]
                      if not spans and msg.get("spans"):
                          spans = msg["spans"][:1]
                      if not spans:
                          key = ("<no-span>", 0, 0, level, msg.get("message", "")[:160])
                          diags.setdefault(key, key)
                          continue
                      s = spans[0]
                      key = (s.get("file_name", "?"), s.get("line_start", 0),
                             s.get("column_start", 0), level,
                             msg.get("message", "")[:200])
                      diags.setdefault(key, key)
                  proc.wait()
              try:
                  tail = open(err_path, encoding="utf-8", errors="replace").read().splitlines()[-30:]
              except Exception:  # noqa: BLE001
                  tail = []
              return proc.returncode, sorted(diags.values()), tail

          def digest_for(label, rc, diags, tail):
              errors = [d for d in diags if d[3] == "error"]
              warns = [d for d in diags if d[3] == "warning"]
              ours = [d for d in errors if d[0] in changed]
              other = [d for d in errors if d[0] not in changed]
              our_warns = [d for d in warns if d[0] in changed]
              lines = [f"rc={rc} errors={len(errors)} (changed files: {len(ours)}) "
                       f"warnings={len(warns)} (changed files: {len(our_warns)})", ""]
              def fmt(d):
                  return f"{d[3]} {d[0]}:{d[1]}:{d[2]}: {d[4]}"
              lines.append("== errors in changed files ==")
              lines += [fmt(d) for d in ours[:120]] or ["(none)"]
              lines.append("")
              lines.append("== errors elsewhere (first 80) ==")
              lines += [fmt(d) for d in other[:80]] or ["(none)"]
              lines.append("")
              lines.append("== warnings in changed files (first 80) ==")
              lines += [fmt(d) for d in our_warns[:80]] or ["(none)"]
              lines.append("")
              lines.append("== stderr tail ==")
              lines += tail
              summary = (f"{label}: rc={rc}, {len(errors)} errors "
                         f"({len(ours)} in changed files), {len(warns)} warnings "
                         f"({len(our_warns)} in changed files)")
              return summary, "\n".join(lines)

          print("changed files vs origin/main:", len(changed), flush=True)

          rc, diags, tail = cargo_json_diag(
              ["cargo", "check", *PKGS, "--all-targets", "--message-format", "json"])
          summary, text = digest_for("cargo check", rc, diags, tail)
          post_digest("Arena diagnostics: cargo check", "cargo check digest", summary, text)
          print(summary, flush=True)

          rc, diags, tail = cargo_json_diag(
              ["cargo", "clippy", *PKGS, "--all-targets", "--message-format", "json"])
          summary, text = digest_for("cargo clippy", rc, diags, tail)
          post_digest("Arena diagnostics: cargo clippy", "cargo clippy digest", summary, text)
          print(summary, flush=True)

          rc, diags, tail = cargo_json_diag(
              ["cargo", "check", "-p", "rustok-modules", "--no-default-features",
               "--all-targets", "--message-format", "json"])
          summary, text = digest_for("cargo check (no-default-features)", rc, diags, tail)
          post_digest("Arena diagnostics: cargo check no-default-features",
                      "cargo check no-default-features digest", summary, text)
          print(summary, flush=True)

          rc, diags, tail = cargo_json_diag(
              ["cargo", "check", "-p", "rustok-distribution", "--all-features",
               "--all-targets", "--message-format", "json"])
          summary, text = digest_for("cargo check rustok-distribution (all-features)", rc, diags, tail)
          post_digest("Arena diagnostics: cargo check distribution all-features",
                      "cargo check distribution all-features digest", summary, text)
          print(summary, flush=True)

          fmt = subprocess.run(["cargo", "fmt", *PKGS, "--", "--check"],
                               capture_output=True, text=True)
          diff_lines = (fmt.stdout + fmt.stderr).splitlines()
          files = []
          for l in diff_lines:
              if l.startswith("Diff in "):
                  f = l[len("Diff in "):].rsplit(" at line ", 1)[0]
                  if f not in files:
                      files.append(f)
          our_fmt = [f for f in files if f in changed]
          text = "\n".join(
              [f"rc={fmt.returncode} files needing fmt: {len(files)} "
               f"(changed: {len(our_fmt)})", "",
               "== changed files needing fmt =="] + (our_fmt or ["(none)"]) +
              ["", "== all files needing fmt (first 120) =="] + files[:120])
          post_digest("Arena diagnostics: cargo fmt", "cargo fmt digest",
                      f"fmt: rc={fmt.returncode}, {len(files)} files "
                      f"({len(our_fmt)} changed)", text)
          print("fmt files:", len(files), "changed:", len(our_fmt), flush=True)
          PY

  tests:
    name: Crate-scoped tests digest
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rustok_test
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Run crate-scoped tests and publish digests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEADSHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time, urllib.request

          CRATES = [
              ("rustok-api", 1200),
              ("rustok-distribution", 1200),
              ("rustok-sandbox-transport", 1200),
              ("rustok-sandbox-worker", 1800),
              ("rustok-modules", 5400),
          ]

          def post_digest(name, title, summary, text):
              if len(text) > 60000:
                  text = text[:60000] + "\n... [truncated]"
              payload = {
                  "name": name,
                  "head_sha": os.environ["HEADSHA"],
                  "status": "completed",
                  "conclusion": "neutral",
                  "output": {"title": title, "summary": summary, "text": text},
              }
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/check-runs",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print("posted", name, resp.status, flush=True)
              except Exception as e:  # noqa: BLE001
                  print("FAILED to post", name, e, flush=True)

          def run_crate_tests(crate, timeout_s):
              out_path = f"/tmp/test_{crate}.log"
              started = time.monotonic()
              timed_out = False
              with open(out_path, "wb") as outf:
                  try:
                      proc = subprocess.run(
                          ["cargo", "test", "-p", crate, "--all-targets",
                           "--no-fail-fast"],
                          stdout=outf, stderr=subprocess.STDOUT,
                          timeout=timeout_s)
                      rc = proc.returncode
                  except subprocess.TimeoutExpired:
                      rc = -1
                      timed_out = True
              elapsed = int(time.monotonic() - started)
              try:
                  lines = open(out_path, encoding="utf-8",
                               errors="replace").read().splitlines()
              except Exception:  # noqa: BLE001
                  lines = []
              results = [l.strip() for l in lines if l.startswith("test result:")]
              passed = failed = ignored = 0
              for r in results:
                  m = re.search(r"(\d+) passed; (\d+) failed; (\d+) ignored", r)
                  if m:
                      passed += int(m.group(1))
                      failed += int(m.group(2))
                      ignored += int(m.group(3))
              failed_names = []
              for l in lines:
                  m = re.match(r"test (\S+) \.\.\. FAILED", l)
                  if m:
                      failed_names.append(m.group(1))
              panic_ctx = []
              current = ""
              idx = 0
              while idx < len(lines) and len(panic_ctx) < 300:
                  l = lines[idx]
                  if l.startswith("---- ") and l.rstrip().endswith("stdout ----"):
                      current = l.strip()
                  if "panicked at" in l:
                      if current:
                          panic_ctx.append(current)
                      panic_ctx.append(l.strip())
                      for extra in lines[idx + 1: idx + 6]:
                          s = extra.strip()
                          if s:
                              panic_ctx.append("    " + s)
                  idx += 1
              errors = [l.strip() for l in lines if l.startswith("error")][:30]
              tail = lines[-25:]
              status = "TIMEOUT" if timed_out else f"rc={rc}"
              head = (f"{status} elapsed={elapsed}s binaries={len(results)} "
                      f"passed={passed} failed={failed} ignored={ignored}")
              body = [head, "", "== per-binary results =="]
              body += results or ["(no test binaries reported)"]
              uniq_failed = sorted(set(failed_names))
              body += ["", f"== failed tests ({len(uniq_failed)}) =="]
              body += uniq_failed[:200] or ["(none)"]
              body += ["", "== panic context (first 40 panics) =="]
              body += panic_ctx[:300] or ["(none)"]
              body += ["", "== error lines (first 30) =="]
              body += errors or ["(none)"]
              body += ["", "== output tail =="] + tail
              summary = f"test {crate}: {head}"
              post_digest(f"Arena diagnostics: test {crate}",
                          f"cargo test {crate}", summary, "\n".join(body))
              print(summary, flush=True)

          for crate, t in CRATES:
              run_crate_tests(crate, t)
          PY

  server:
    name: Server compile digest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check rustok-server and publish digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEADSHA: ${{ github.sha }}
        run: |
          git fetch origin main --quiet
          git diff --name-only origin/main...HEAD > /tmp/changed.txt || true
          python3 - <<'PY'
          import json, os, subprocess, urllib.request

          changed = set()
          try:
              changed = {l.strip() for l in open("/tmp/changed.txt") if l.strip()}
          except FileNotFoundError:
              pass

          def post_digest(name, title, summary, text):
              if len(text) > 60000:
                  text = text[:60000] + "\n... [truncated]"
              payload = {
                  "name": name,
                  "head_sha": os.environ["HEADSHA"],
                  "status": "completed",
                  "conclusion": "neutral",
                  "output": {"title": title, "summary": summary, "text": text},
              }
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/check-runs",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print("posted", name, resp.status)
              except Exception as e:  # noqa: BLE001
                  print("FAILED to post", name, e)

          def run_check(name, args):
              err_path = f"/tmp/server_{name}_stderr.txt"
              diags = {}
              with open(err_path, "wb") as errf:
                  proc = subprocess.Popen(
                      ["cargo"] + args,
                      stdout=subprocess.PIPE, stderr=errf, text=True, bufsize=1)
                  for line in proc.stdout:
                      line = line.strip()
                      if not line.startswith("{"):
                          continue
                      try:
                          obj = json.loads(line)
                      except Exception:  # noqa: BLE001
                          continue
                      if obj.get("reason") != "compiler-message":
                          continue
                      msg = obj.get("message", {})
                      level = msg.get("level")
                      if level not in ("error", "warning"):
                          continue
                      spans = [s for s in msg.get("spans", []) if s.get("is_primary")]
                      if not spans and msg.get("spans"):
                          spans = msg["spans"][:1]
                      if not spans:
                          key = ("<no-span>", 0, 0, level, msg.get("message", "")[:160])
                          diags.setdefault(key, key)
                          continue
                      s = spans[0]
                      key = (s.get("file_name", "?"), s.get("line_start", 0),
                             s.get("column_start", 0), level,
                             msg.get("message", "")[:200])
                      diags.setdefault(key, key)
                  proc.wait()
              rc = proc.returncode
              try:
                  tail = open(err_path, encoding="utf-8", errors="replace").read().splitlines()[-40:]
              except Exception:  # noqa: BLE001
                  tail = []
              diags = sorted(diags.values())
              errors = [d for d in diags if d[3] == "error"]
              warns = [d for d in diags if d[3] == "warning"]
              ours = [d for d in errors if d[0] in changed]
              other = [d for d in errors if d[0] not in changed]
              our_warns = [d for d in warns if d[0] in changed]

              def fmt(d):
                  return f"{d[3]} {d[0]}:{d[1]}:{d[2]}: {d[4]}"

              lines = [f"server check ({name}) rc={rc} errors={len(errors)} "
                       f"(changed files: {len(ours)}) warnings={len(warns)} "
                       f"(changed files: {len(our_warns)})", ""]
              lines.append("== errors in changed files ==")
              lines += [fmt(d) for d in ours[:150]] or ["(none)"]
              lines.append("")
              lines.append("== errors elsewhere (first 80) ==")
              lines += [fmt(d) for d in other[:80]] or ["(none)"]
              lines.append("")
              lines.append("== warnings in changed files (first 80) ==")
              lines += [fmt(d) for d in our_warns[:80]] or ["(none)"]
              lines.append("")
              lines.append("== stderr tail ==")
              lines += tail
              summary = (f"server check ({name}): rc={rc}, {len(errors)} errors "
                         f"({len(ours)} in changed files), {len(warns)} warnings "
                         f"({len(our_warns)} in changed files)")
              post_digest(f"Arena diagnostics: server check ({name})",
                          "cargo check rustok-server digest", summary,
                          "\n".join(lines))
              print(summary, flush=True)

          import re
          _toml = open("apps/server/Cargo.toml", encoding="utf-8").read()
          _default = re.findall(r"\"([^\"]+)\"", re.search(r"^default = \[(.*?)\]", _toml, flags=re.S | re.M).group(1))
          _feats = ",".join(f for f in _default if f != "embed-storefront")
          run_check("default-minus-storefront", ["check", "-p", "rustok-server", "--no-default-features", "--features", _feats, "--message-format", "json"])
          run_check("all-features", ["check", "-p", "rustok-server", "--all-features", "--message-format", "json"])
          PY
