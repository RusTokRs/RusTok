name: Translation Runtime Composition Evidence

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "apps/server/Cargo.toml"
      - "apps/server/src/services/graphql_schema.rs"
      - "apps/server/src/services/app_router.rs"
      - "crates/rustok-index/**"
      - "crates/rustok-translation/admin/src/transport/native_server_adapter.rs"
      - "crates/rustok-translation/docs/implementation-plan.md"
      - "docs/modules/translation-implementation-plan.md"
      - "scripts/verify/verify-translation-admin-boundary.mjs"
      - ".github/workflows/translation-runtime-composition-evidence.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "apps/server/Cargo.toml"
      - "apps/server/src/services/graphql_schema.rs"
      - "apps/server/src/services/app_router.rs"
      - "crates/rustok-index/**"
      - "crates/rustok-translation/admin/src/transport/native_server_adapter.rs"
      - "crates/rustok-translation/docs/implementation-plan.md"
      - "docs/modules/translation-implementation-plan.md"
      - "scripts/verify/verify-translation-admin-boundary.mjs"
      - ".github/workflows/translation-runtime-composition-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translation-runtime-composition-evidence
  cancel-in-progress: true

jobs:
  patch-source:
    name: Apply generated-client protocol evidence patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/translation-router-generated-client-protocol-20260901
      - name: Patch exact Translation application-router request helper
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/server/src/services/app_router.rs")
          source = path.read_text()
          before = '''                .header(header::CONTENT_TYPE, "application/x-www-form-urlencoded")
                .header(header::AUTHORIZATION, format!("Bearer {access_token}"))'''
          after = '''                .header(header::CONTENT_TYPE, "application/x-www-form-urlencoded")
                .header(header::ACCEPT, "application/json")
                .header(header::AUTHORIZATION, format!("Bearer {access_token}"))'''
          if after in source:
              raise SystemExit("generated-client protocol header is already present")
          if source.count(before) != 1:
              raise SystemExit(f"expected exactly one request marker, found {source.count(before)}")
          path.write_text(source.replace(before, after, 1))
      - name: Commit focused request-protocol fix
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "apps/server/src/services/app_router.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/services/app_router.rs
          git commit -m "test(translation): match generated server-fn response protocol"
          git push origin HEAD:test/translation-router-generated-client-protocol-20260901
