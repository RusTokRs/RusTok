name: RBAC Server Compile Repair Once

on:
  push:
    branches:
      - agent/rbac-exact-head-evidence-cycle-001

permissions:
  contents: write

concurrency:
  group: rbac-server-compile-repair-once
  cancel-in-progress: true

jobs:
  repair:
    name: Repair exact server compile drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rbac-exact-head-verification-cycle-001
          fetch-depth: 0
      - name: Verify base and apply bounded repairs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='41e35805294a0af33432a8d78cbe470532ecd78e'
          expected_main='5f95e475dd0dcb56534419e081fe2c6eba1745e9'
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head"
          git fetch origin main --depth=1
          actual_main="$(git rev-parse FETCH_HEAD)"
          test "$actual_main" = "$expected_main"

          python3 <<'PY'
          from pathlib import Path

          replacements = {
              Path('apps/server/src/services/forum_search_contract_consumer.rs'): [
                  (
                      "                    &mut stop_rx,\n                    failure,\n                )\n                .await\n            }\n            Ok(None)",
                      "                    &mut stop_rx,\n                    *failure,\n                )\n                .await\n            }\n            Ok(None)",
                  ),
              ],
              Path('apps/server/src/services/social_graph_index_worker.rs'): [
                  (
                      "                    &mut stop_rx,\n                    failure,\n                )\n                .await\n                {\n                    return;\n                }",
                      "                    &mut stop_rx,\n                    *failure,\n                )\n                .await\n                {\n                    return;\n                }",
                  ),
              ],
              Path('apps/server/src/services/product_index_refresh_worker.rs'): [
                  (
                      "    let Some(delivery) = delivery else {\n        return acknowledge_unrelated(runtime, config, stop_rx, &consumed).await;\n    };",
                      "    let Some(_) = delivery else {\n        return acknowledge_unrelated(runtime, config, stop_rx, &consumed).await;\n    };",
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one bounded replacement, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          git diff --check
          git diff -- \
            apps/server/src/services/forum_search_contract_consumer.rs \
            apps/server/src/services/social_graph_index_worker.rs \
            apps/server/src/services/product_index_refresh_worker.rs

          git config user.name 'RusTok verification agent'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            apps/server/src/services/forum_search_contract_consumer.rs \
            apps/server/src/services/social_graph_index_worker.rs \
            apps/server/src/services/product_index_refresh_worker.rs
          git commit -m 'fix(server): align consumed delivery ownership'
          git push origin HEAD:agent/rbac-exact-head-verification-cycle-001
