name: Taxonomy Lookup Contract

on:
  pull_request:
    paths:
      - "crates/rustok-taxonomy/src/services.rs"
      - "crates/rustok-taxonomy/src/module_term_lookup.rs"
      - "crates/rustok-taxonomy/src/normalization.rs"
      - "crates/rustok-taxonomy/src/route_key_registry.rs"
      - "crates/rustok-taxonomy/src/migrations/**"
      - "crates/rustok-taxonomy/tests/localized_route_lookup.rs"
      - "crates/rustok-taxonomy/Cargo.toml"
      - "crates/rustok-content/src/locale.rs"
      - "crates/rustok-api/src/locale.rs"
      - "Cargo.lock"
      - ".github/workflows/taxonomy-lookup-contract.yml"
  push:
    branches:
      - main
    paths:
      - "crates/rustok-taxonomy/src/services.rs"
      - "crates/rustok-taxonomy/src/module_term_lookup.rs"
      - "crates/rustok-taxonomy/src/normalization.rs"
      - "crates/rustok-taxonomy/src/route_key_registry.rs"
      - "crates/rustok-taxonomy/src/migrations/**"
      - "crates/rustok-taxonomy/tests/localized_route_lookup.rs"
      - "crates/rustok-taxonomy/Cargo.toml"
      - "crates/rustok-content/src/locale.rs"
      - "crates/rustok-api/src/locale.rs"
      - "Cargo.lock"
      - ".github/workflows/taxonomy-lookup-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  CARGO_ENCODED_RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: 0

jobs:
  lookup-contract:
    name: Taxonomy lookup contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run localized route and owner-write contract
        run: cargo test --locked -p rustok-taxonomy --test localized_route_lookup -- --nocapture
