name: Taxonomy Lookup Contract

on:
  pull_request:
    paths:
      - "crates/modules/rustok-taxonomy/src/category_hierarchy.rs"
      - "crates/modules/rustok-taxonomy/src/category_presentation.rs"
      - "crates/modules/rustok-taxonomy/src/dto.rs"
      - "crates/modules/rustok-taxonomy/src/entities/taxonomy_category_presentation.rs"
      - "crates/modules/rustok-taxonomy/src/lib.rs"
      - "crates/modules/rustok-taxonomy/src/services.rs"
      - "crates/modules/rustok-taxonomy/src/module_term_lookup.rs"
      - "crates/modules/rustok-taxonomy/src/normalization.rs"
      - "crates/modules/rustok-taxonomy/src/owner_category_read.rs"
      - "crates/modules/rustok-taxonomy/src/route_key_registry.rs"
      - "crates/modules/rustok-taxonomy/src/migrations/**"
      - "crates/modules/rustok-taxonomy/tests/category_hierarchy.rs"
      - "crates/modules/rustok-taxonomy/tests/category_presentation.rs"
      - "crates/modules/rustok-taxonomy/tests/localized_route_lookup.rs"
      - "crates/modules/rustok-taxonomy/tests/owner_category_read.rs"
      - "crates/modules/rustok-taxonomy/tests/route_key_registry.rs"
      - "crates/modules/rustok-taxonomy/docs/route-registry-recovery.md"
      - "crates/modules/rustok-taxonomy/docs/sql/route-registry-drift.sql"
      - "scripts/verify/verify-taxonomy-route-registry-recovery.mjs"
      - "crates/modules/rustok-taxonomy/Cargo.toml"
      - "crates/modules/rustok-content/src/locale.rs"
      - "crates/libs/rustok-api/src/locale.rs"
      - ".github/workflows/taxonomy-lookup-contract.yml"
  push:
    branches:
      - main
    paths:
      - "crates/modules/rustok-taxonomy/src/category_hierarchy.rs"
      - "crates/modules/rustok-taxonomy/src/category_presentation.rs"
      - "crates/modules/rustok-taxonomy/src/dto.rs"
      - "crates/modules/rustok-taxonomy/src/entities/taxonomy_category_presentation.rs"
      - "crates/modules/rustok-taxonomy/src/lib.rs"
      - "crates/modules/rustok-taxonomy/src/services.rs"
      - "crates/modules/rustok-taxonomy/src/module_term_lookup.rs"
      - "crates/modules/rustok-taxonomy/src/normalization.rs"
      - "crates/modules/rustok-taxonomy/src/owner_category_read.rs"
      - "crates/modules/rustok-taxonomy/src/route_key_registry.rs"
      - "crates/modules/rustok-taxonomy/src/migrations/**"
      - "crates/modules/rustok-taxonomy/tests/category_hierarchy.rs"
      - "crates/modules/rustok-taxonomy/tests/category_presentation.rs"
      - "crates/modules/rustok-taxonomy/tests/localized_route_lookup.rs"
      - "crates/modules/rustok-taxonomy/tests/owner_category_read.rs"
      - "crates/modules/rustok-taxonomy/tests/route_key_registry.rs"
      - "crates/modules/rustok-taxonomy/docs/route-registry-recovery.md"
      - "crates/modules/rustok-taxonomy/docs/sql/route-registry-drift.sql"
      - "scripts/verify/verify-taxonomy-route-registry-recovery.mjs"
      - "crates/modules/rustok-taxonomy/Cargo.toml"
      - "crates/modules/rustok-content/src/locale.rs"
      - "crates/libs/rustok-api/src/locale.rs"
      - ".github/workflows/taxonomy-lookup-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  CARGO_ENCODED_RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: 0

jobs:
  lookup-contract:
    name: Taxonomy lookup contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      - name: Verify route-registry recovery diagnostic
        run: node scripts/verify/verify-taxonomy-route-registry-recovery.mjs
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Run Category hierarchy/presentation/owner, localized route and registry contracts
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo test --locked -p rustok-taxonomy \
            --test category_hierarchy \
            --test category_presentation \
            --test localized_route_lookup \
            --test owner_category_read \
            --test route_key_registry \
            -- --nocapture 2>&1 \
            | tee taxonomy-lookup-contract.log || status=$?
          if [[ "$status" -ne 0 ]]; then
            diagnostic="$(tail -n 40 taxonomy-lookup-contract.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/%3A%3A/g')"
            echo "::error title=Taxonomy lookup contract failed::${diagnostic}"
            exit "$status"
          fi
      - name: Upload lookup contract log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: taxonomy-lookup-contract-log
          path: taxonomy-lookup-contract.log
          if-no-files-found: error
