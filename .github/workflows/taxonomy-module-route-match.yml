name: Taxonomy Module Route Match Contract

on:
  pull_request:
    paths:
      - "crates/rustok-taxonomy/src/module_term_lookup.rs"
      - "crates/rustok-taxonomy/src/lib.rs"
      - "crates/rustok-taxonomy/tests/module_route_match.rs"
      - ".github/workflows/taxonomy-module-route-match.yml"
  push:
    branches:
      - main
    paths:
      - "crates/rustok-taxonomy/src/module_term_lookup.rs"
      - "crates/rustok-taxonomy/src/lib.rs"
      - "crates/rustok-taxonomy/tests/module_route_match.rs"
      - ".github/workflows/taxonomy-module-route-match.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-module-route-match-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  module-route-match-contract:
    name: Taxonomy module route match Rust contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check canonical workspace formatting
        run: cargo fmt --all -- --check
      - name: Run Taxonomy module route match contract
        run: cargo +1.96.0 test --locked -p rustok-taxonomy --test module_route_match -- --nocapture
      - name: Compile Taxonomy owner surface
        run: cargo +1.96.0 check --locked -p rustok-taxonomy --lib
