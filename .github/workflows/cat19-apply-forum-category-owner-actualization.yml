name: CAT19 Apply Forum Category Owner Actualization

on:
  push:
    branches:
      - agent/cat19-forum-category-translation-owner-actualization
    paths:
      - ".github/workflows/cat19-apply-forum-category-owner-actualization.yml"

permissions:
  contents: write

concurrency:
  group: cat19-apply-forum-category-owner-actualization
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-owner-surfaces:
    name: Patch Forum Category owner surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cat19-forum-category-translation-owner-actualization
      - name: Patch bounded Forum ownership surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plan_path = Path("crates/rustok-forum/docs/implementation-plan.md")
          plan = plan_path.read_text()

          replacements = [
              (
                  "last_reviewed: 2026-08-22",
                  "last_reviewed: 2026-08-28",
              ),
              (
                  "Forum owns canonical topic/reply storage, transports, revisions, projections,\nand module UI packages. Shared richtext storage and server projection are live;",
                  "Forum owns canonical topic/reply storage, transports, revisions, projections,\nand module UI packages. Canonical Forum Category identity, localized copy, route\nhistory, hierarchy/order and presentation are Taxonomy-owned after the verified\nCAT-5 cutover; Forum retains the typed same-ID binding plus Forum policy, counters\nand lifecycle state. Shared richtext storage and server projection are live;",
              ),
              (
                  "- category hierarchy and policy;",
                  "- category membership/binding plus Forum policy, counters and lifecycle state;",
              ),
              (
                  "| Translation workflow | `rustok-translation` | Publish exact Forum translation targets and apply owner writes. |",
                  "| Translation workflow | `rustok-translation` | Publish exact Forum-owned topic/reply targets only when explicitly onboarded; Category copy uses Taxonomy's registered `taxonomy/term` provider. |\n| Canonical Category identity, hierarchy, localized copy, routes/aliases and presentation | `rustok-taxonomy` | Keep the typed same-ID binding plus Forum policy/counters/lifecycle; consume canonical Taxonomy Category state and never register a duplicate `forum/category` Translation target. |",
              ),
              (
                  "- a Forum-specific reaction catalog after `rustok-reactions` composition;\n- a reusable Forum-only reputation ledger or universal badge catalog;",
                  "- a Forum-specific reaction catalog after `rustok-reactions` composition;\n- a duplicate Forum Category Translation provider, change cursor or localized donor mirror after the accepted Taxonomy cutover;\n- a reusable Forum-only reputation ledger or universal badge catalog;",
              ),
              (
                  "| `FORUM-25` | `in_progress` | Forum category Translation provider, cursor/progress/PostgreSQL evidence, Arabic admin/storefront catalogs, content-locale SEO/editor boundaries and multilingual/RTL admin read/write surfaces are source-ready. Retain registered-host/runtime provider evidence plus mounted multilingual/RTL browser parity; topic/reply UGC translation remains opt-in rather than an automatic provider. |",
                  "| `FORUM-25` | `in_progress` | The Category backend/Translation ownership cutover is complete: canonical Category copy/routes/hierarchy are Taxonomy-owned, while the duplicate Forum provider, cursor/progress runtime and legacy donor storage are retired and provider-era PostgreSQL evidence is superseded. Arabic admin/storefront catalogs, content-locale SEO/editor boundaries and multilingual/RTL admin read/write surfaces remain source-ready. Retain mounted multilingual/RTL browser parity against Taxonomy-owned Category data; topic/reply UGC translation remains opt-in rather than an automatic provider. |",
              ),
          ]
          for old, new in replacements:
              count = plan.count(old)
              if count != 1:
                  raise SystemExit(f"plan replacement expected once, got {count}: {old[:80]!r}")
              plan = plan.replace(old, new)

          stale_plan = [
              "- category hierarchy and policy;",
              "Forum category Translation provider, cursor/progress/PostgreSQL evidence",
              "Retain registered-host/runtime provider evidence plus mounted multilingual/RTL browser parity",
          ]
          for marker in stale_plan:
              if marker in plan:
                  raise SystemExit(f"stale Forum plan marker survived: {marker}")
          required_plan = [
              "Canonical Forum Category identity, localized copy, route\nhistory, hierarchy/order and presentation are Taxonomy-owned",
              "Category copy uses Taxonomy's registered `taxonomy/term` provider.",
              "never register a duplicate `forum/category` Translation target.",
              "provider-era PostgreSQL evidence is superseded",
          ]
          for marker in required_plan:
              if marker not in plan:
                  raise SystemExit(f"missing Forum plan marker: {marker}")
          plan_path.write_text(plan)

          registry_path = Path("docs/modules/translation-surfaces.json")
          registry = registry_path.read_text()
          old_surface = '''    {
              "id": "forum_categories",
              "owner_slug": "forum",
              "resource_kind": "category",
              "readiness": "pilot_candidate",
              "provider_status": "registered",
              "field_profiles": ["plain_text"],
              "data_classification": ["public"],
              "ai_export": "restricted",
              "evidence_paths": [
                "crates/rustok-forum/docs/implementation-plan.md",
                "crates/rustok-forum/src/services/category_translation_target.rs",
                "crates/rustok-forum/src/services/category_translation_progress.rs",
                "crates/rustok-forum/tests/category_translation_target_postgres.rs",
                "apps/server/src/services/module_event_dispatcher.rs"
              ],
              "blockers": ["Retain registered-host/runtime evidence before enabling this pilot in production."]
            }'''
          new_surface = '''    {
              "id": "forum_categories",
              "owner_slug": "forum",
              "resource_kind": "category",
              "readiness": "excluded",
              "provider_status": "not_registered",
              "field_profiles": ["plain_text", "slug"],
              "data_classification": ["public"],
              "ai_export": "forbidden",
              "evidence_paths": [
                "crates/rustok-forum/docs/implementation-plan.md",
                "crates/rustok-forum/tests/category_taxonomy_translation_provider_retirement.rs",
                "docs/architecture/taxonomy-flex-category-platform-plan.md",
                "crates/rustok-taxonomy/src/translation_target.rs"
              ],
              "exclusion_reason": "Forum Category canonical localized copy, routes, hierarchy and presentation are Taxonomy-owned after the verified CAT-5 cutover. Forum keeps a typed same-ID Category binding plus Forum policy, counters and lifecycle state and must not register a duplicate forum/category Translation target."
            }'''
          count = registry.count(old_surface)
          if count != 1:
              raise SystemExit(f"registry forum_categories block expected once, got {count}")
          registry = registry.replace(old_surface, new_surface)
          for marker in [
              "crates/rustok-forum/src/services/category_translation_target.rs",
              "crates/rustok-forum/src/services/category_translation_progress.rs",
              "crates/rustok-forum/tests/category_translation_target_postgres.rs",
          ]:
              if marker in registry:
                  raise SystemExit(f"retired Forum evidence path survived registry: {marker}")
          registry_path.write_text(registry)
          PY

          git rm crates/rustok-forum/tests/category_translation_target_postgres.rs
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            crates/rustok-forum/docs/implementation-plan.md
            crates/rustok-forum/tests/category_translation_target_postgres.rs
            docs/modules/translation-surfaces.json
          )
          test "${changed[*]}" = "${expected[*]}"
          node scripts/verify/verify-translation-surface-registry.mjs
          git diff -- crates/rustok-forum/docs/implementation-plan.md docs/modules/translation-surfaces.json crates/rustok-forum/tests/category_translation_target_postgres.rs

          git config user.name "CAT-19 docs bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/rustok-forum/docs/implementation-plan.md docs/modules/translation-surfaces.json crates/rustok-forum/tests/category_translation_target_postgres.rs
          git commit -m "docs(forum): align Category Translation owner with Taxonomy"
          git push origin HEAD:agent/cat19-forum-category-translation-owner-actualization
