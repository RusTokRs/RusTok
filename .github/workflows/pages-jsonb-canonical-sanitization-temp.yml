name: Pages JSONB Canonical Sanitization Temp

on:
  push:
    branches:
      - fix/pages-jsonb-canonical-sanitization-20260814
    paths:
      - crates/rustok-page-builder/src/publish_sanitization.rs
      - crates/rustok-pages/tests/sanitized_jsonb_roundtrip_postgres.rs
      - crates/rustok-pages/tests/artifact_loss_rebuild_postgres.rs
      - .github/workflows/pages-jsonb-canonical-sanitization-temp.yml

permissions:
  contents: read

jobs:
  validate:
    name: Canonical sanitization PostgreSQL validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      RUSTOK_PAGES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages-jsonb-canonical-sanitization
          cache-on-failure: false
      - name: Run Page Builder sanitization regressions
        run: cargo test --locked -p rustok-page-builder publish_sanitization -- --nocapture
      - name: Run PostgreSQL JSONB roundtrip regression
        run: cargo test --locked -p rustok-pages --test sanitized_jsonb_roundtrip_postgres -- --nocapture
      - name: Run PostgreSQL artifact-loss rebuild regression
        run: cargo test --locked -p rustok-pages --test artifact_loss_rebuild_postgres -- --nocapture
