name: Product Taxonomy Category Backfill

on:
  pull_request:
    paths:
      - "crates/modules/rustok-product/src/migrations/m20260829_000016_backfill_product_categories_to_taxonomy.rs"
      - "crates/modules/rustok-product/src/migrations/m20260828_000015_add_product_taxonomy_category_binding.rs"
      - "crates/modules/rustok-product/src/migrations/mod.rs"
      - "crates/modules/rustok-product/docs/category-taxonomy-binding.md"
      - "crates/modules/rustok-product/docs/category-locale-contract.md"
      - "scripts/verify/verify-product-taxonomy-category-backfill.mjs"
      - ".github/workflows/product-taxonomy-category-backfill.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill-contract:
    name: Product Taxonomy Category backfill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Verify Product Category backfill contract
        run: node scripts/verify/verify-product-taxonomy-category-backfill.mjs
      - name: Fetch exact PR base
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
      - name: Assert bounded CAT-24 file set when CAT-24 changes
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='crates/modules/rustok-product/src/migrations/m20260829_000016_backfill_product_categories_to_taxonomy.rs'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          if ! printf '%s\n' "$changed" | grep -Fxq "$migration"; then
            echo "CAT-24 migration unchanged; PR-wide CAT-24 slice restriction is not applicable."
            exit 0
          fi
          allowed='^(crates/modules/rustok-product/src/migrations/m20260829_000016_backfill_product_categories_to_taxonomy\.rs|crates/modules/rustok-product/src/migrations/mod\.rs|crates/modules/rustok-product/docs/category-taxonomy-binding\.md|crates/modules/rustok-product/docs/category-locale-contract\.md|scripts/verify/verify-product-taxonomy-category-backfill\.mjs|\.github/workflows/product-taxonomy-category-backfill\.yml)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
      - name: Check Product formatting
        run: cargo fmt --check --manifest-path crates/modules/rustok-product/Cargo.toml
      - name: Compile Product backfill migration
        run: cargo check -p rustok-product --lib
      - name: Check full PR whitespace
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --check "$base" "$head"
