name: Temporary Settings Translation Lock Refresh

on:
  push:
    branches:
      - feat/settings-translation-target-provider-20260904
    paths:
      - .github/workflows/settings-translation-lock-refresh.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Resolve only the Translation-enabled server graph
        run: cargo tree -p rustok-server --no-default-features --features mod-translation >/dev/null
      - name: Require a narrow additive lockfile delta
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          numstat = subprocess.check_output(
              ["git", "diff", "--numstat", "--", "Cargo.lock"], text=True
          ).strip()
          if not numstat:
              raise SystemExit("Cargo.lock was not changed")
          added, deleted, path = numstat.split("\t")
          if path != "Cargo.lock" or int(deleted) != 0 or not (1 <= int(added) <= 25):
              raise SystemExit(f"unexpected lockfile delta: {numstat}")

          diff = subprocess.check_output(
              ["git", "diff", "--", "Cargo.lock"], text=True
          )
          required = [
              '+name = "rustok-modules-translation"',
              '+ "rustok-modules-translation",',
          ]
          missing = [needle for needle in required if needle not in diff]
          if missing:
              raise SystemExit(f"lockfile delta missed expected adapter edges: {missing}")
          PY
      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          git rm .github/workflows/settings-translation-lock-refresh.yml
          git add Cargo.lock
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(translation): refresh settings provider lock"
          git push origin HEAD:"${GITHUB_REF_NAME}"
