name: Agent Forum group-state GraphQL 20AN

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/forum-notification-group-state-graphql-20an'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Recover and execute embedded source applier
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow = '.github/workflows/agent-forum-group-state-graphql-20an.yml'
          source_commit = '0c6fefc31153c313992bea228f13678059a2b58a'
          subprocess.run(
              ['git', 'fetch', '--no-tags', '--depth=1', 'origin', source_commit],
              check=True,
              stdout=subprocess.DEVNULL,
          )
          previous = subprocess.check_output(
              ['git', 'show', f'{source_commit}:{workflow}'],
              text=True,
          )
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n          git config user.name"
          start = previous.index(start_marker) + len(start_marker)
          end = previous.index(end_marker, start)
          raw_script = previous[start:end]
          Path('/tmp/forum-20an-apply.py').write_text('if True:\n' + raw_script)
          subprocess.run(['python3', '/tmp/forum-20an-apply.py'], check=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(notifications): add GraphQL group-state commands"
          git push origin HEAD
