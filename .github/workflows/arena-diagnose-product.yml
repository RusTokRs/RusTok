name: Arena diagnose product subset

on:
  pull_request:
    paths:
      - "crates/modules/rustok-product/**"
      - "crates/modules/rustok-channel/**"
      - "crates/modules/rustok-index/**"
      - "crates/modules/rustok-distribution/**"
      - ".github/workflows/arena-diagnose-product.yml"

permissions:
  contents: read

concurrency:
  group: arena-diagnose-${{ github.head_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  cargo-check-product-subset:
    name: Cargo check product subset (diagnostics)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: arena-diagnose-product
      - name: Cargo check distribution with mod-product
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked -p rustok-distribution --features mod-product --all-targets 2>&1 | tee /tmp/check.log || true
          total=$(grep -cE '^error(\[|:)' /tmp/check.log || true)
          echo "total compile errors: $total"
          if [ "$total" -gt 0 ]; then
            # Emit up to 10 error blocks as workflow annotations so the error
            # text is retrievable through the check-run annotations API.
            awk '/^error(\[|:)/{n++} n>=1 && n<=10' /tmp/check.log \
              | awk 'BEGIN{RS="\n"; block=0; buf=""} /^error(\[|:)/{block++; if(buf!=""){print buf; buf=""}} {if(block<=10){buf=buf"\n"$0; if(length(buf)>900){print buf; buf=""}}} END{if(buf!="")print buf}' \
              | head -10 > /tmp/blocks.txt
            i=0
            while IFS= read -r block; do
              i=$((i+1))
              printf '::error::[arena-diagnose %d/%d]%s\n' "$i" "$total" "$(printf '%s' "$block" | tr '\n' '|' | cut -c1-900)"
            done < /tmp/blocks.txt
            exit 1
          fi
      - name: Cargo test compile promotion packet (no run)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p rustok-distribution --features mod-product --test product_current_schema_promotion_postgres --no-run 2>&1 | tee /tmp/testbuild.log || true
          total=$(grep -cE '^error(\[|:)' /tmp/testbuild.log || true)
          echo "total test-build errors: $total"
          if [ "$total" -gt 0 ]; then
            grep -E '^error(\[|:)' -A12 /tmp/testbuild.log | head -120 > /tmp/blocks.txt
            i=0
            while IFS= read -r line; do
              i=$((i+1))
              printf '::error::[test-build %d/%d]%s\n' "$i" "$total" "$(printf '%s' "$line" | cut -c1-900)"
            done < <(awk '/^error(\[|:)/{n++} n>=1 && n<=10' /tmp/testbuild.log | head -10)
            exit 1
          fi
