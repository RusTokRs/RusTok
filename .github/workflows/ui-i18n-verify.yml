name: UI I18n Verify

on:
  push:
    branches:
      - main
    paths:
      - "crates/ui/rustok-ui-i18n/**"
      - "crates/modules/rustok-notifications/storefront/**"
      - "apps/admin/src/i18n.rs"
      - "scripts/verify/verify-i18n-contract.mjs"
      - "scripts/verify/verify-db-multilingual-contract.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ui-i18n-verify.yml"
  pull_request:
    paths:
      - "crates/ui/rustok-ui-i18n/**"
      - "crates/modules/rustok-notifications/storefront/**"
      - "apps/admin/src/i18n.rs"
      - "scripts/verify/verify-i18n-contract.mjs"
      - "scripts/verify/verify-db-multilingual-contract.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ui-i18n-verify.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, Test, Clippy & WASM
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Ensure WASM target
        run: rustup target add --toolchain "$RUSTUP_TOOLCHAIN" wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Format
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          cargo fmt -p rustok-ui-i18n -- --check > /tmp/crate-fmt.log 2>&1
          crate_status=$?
          rustfmt --edition 2024 --check apps/admin/src/i18n.rs > /tmp/admin-fmt.log 2>&1
          admin_status=$?
          set -e
          {
            echo 'Temporary locale-v2 formatter diagnostics:'
            echo
            echo '```diff'
            cat /tmp/crate-fmt.log
            cat /tmp/admin-fmt.log
            echo '```'
          } > /tmp/locale-v2-fmt.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/locale-v2-fmt.md
          if [ "$crate_status" -ne 0 ] || [ "$admin_status" -ne 0 ]; then
            exit 1
          fi
      - name: Repository i18n contract
        run: node scripts/verify/verify-i18n-contract.mjs
      - name: Test
        run: cargo test -p rustok-ui-i18n --all-features
      - name: Consumer integration
        run: cargo test -p rustok-notifications-storefront
      - name: Clippy
        run: cargo clippy -p rustok-ui-i18n --all-targets --all-features -- -D warnings
      - name: WASM check
        run: cargo check -p rustok-ui-i18n --all-features --target wasm32-unknown-unknown
