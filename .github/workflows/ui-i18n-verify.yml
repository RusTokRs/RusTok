name: UI I18n Verify

on:
  push:
    branches:
      - main
    paths:
      - "crates/ui/rustok-ui-i18n/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ui-i18n-verify.yml"
  pull_request:
    paths:
      - "crates/ui/rustok-ui-i18n/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ui-i18n-verify.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, Test, Clippy & WASM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Ensure WASM target
        run: rustup target add --toolchain 1.96.0 wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Format
        run: cargo fmt -p rustok-ui-i18n -- --check
      - name: Test
        run: cargo test -p rustok-ui-i18n --all-features
      - name: Clippy
        run: cargo clippy -p rustok-ui-i18n --all-targets --all-features -- -D warnings
      - name: WASM check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          cargo check -p rustok-ui-i18n --all-features --target wasm32-unknown-unknown > /tmp/wasm.log 2>&1
          status=$?
          set -e
          {
            echo 'Temporary WASM audit validation output (target installed):'
            echo
            echo '```text'
            tail -n 400 /tmp/wasm.log
            echo '```'
          } > /tmp/wasm-validation.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/wasm-validation.md
          exit "$status"
