name: UI I18n Verify

on:
  push:
    branches:
      - main
    paths:
      - "crates/ui/rustok-ui-i18n/**"
      - "crates/libs/rustok-api/**"
      - "crates/libs/rustok-core/src/i18n.rs"
      - "crates/libs/rustok-core/src/field_schema.rs"
      - "crates/modules/**/locales/**"
      - "crates/modules/*/admin/src/**"
      - "crates/modules/*/storefront/src/**"
      - "crates/modules/rustok-ai/src/metrics.rs"
      - "crates/modules/rustok-modules/src/static_package.rs"
      - "crates/modules/rustok-page-builder/Cargo.toml"
      - "crates/modules/rustok-page-builder/src/locale.rs"
      - "crates/modules/rustok-notifications/storefront/**"
      - "crates/ui/fly/src/runtime_locale.rs"
      # The design-system gates this workflow runs police `crates/ui/**`, the admin and
      # storefront hosts, the token pipeline and the gates themselves. Without these
      # entries a pull request that edits, say, `rustok-ui/leptos/src/button.rs` —
      # exactly the change `verify-ui-parity` and `verify-ui-ds-adoption` exist to
      # catch — triggered no run at all, because only the i18n files were listed.
      - "crates/ui/rustok-ui/**"
      - "crates/ui/rustok-grid/**"
      - "crates/ui/fly/**"
      - "UI/tokens/**"
      - "apps/admin/src/**"
      - "apps/admin/input.css"
      - "apps/admin/tailwind.config.js"
      - "apps/storefront/src/**"
      - "apps/storefront/assets/**"
      - "apps/storefront/tailwind.config.cjs"
      - "scripts/verify/verify-ui-*.mjs"
      - "scripts/verify/verify-csp-inline-style-exceptions.mjs"
      - "scripts/verify/ui-ds-adoption-baseline.json"
      - "apps/admin/locales/**"
      - "apps/admin/src/i18n.rs"
      - "apps/admin/src/main.rs"
      - "apps/storefront/locales/**"
      - "apps/next-admin/messages/**"
      - "apps/next-admin/package.json"
      - "apps/next-admin/src/i18n/**"
      - "apps/next-frontend/messages/**"
      - "apps/next-frontend/package.json"
      - "apps/next-frontend/src/i18n.ts"
      - "apps/next-frontend/src/i18n-config.ts"
      - "scripts/verify/lib/**"
      - "scripts/verify/ui-i18n-argument-baseline.json"
      - "scripts/verify/verify-i18n-contract.mjs"
      - "scripts/verify/verify-ui-i18n-parity.mjs"
      - "scripts/verify/verify-ui-i18n-keys.mjs"
      - "scripts/verify/verify-fly-multilingual.mjs"
      - "scripts/verify/verify-db-multilingual-contract.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ui-i18n-verify.yml"
  pull_request:
    paths:
      - "crates/ui/rustok-ui-i18n/**"
      - "crates/libs/rustok-api/**"
      - "crates/libs/rustok-core/src/i18n.rs"
      - "crates/libs/rustok-core/src/field_schema.rs"
      - "crates/modules/**/locales/**"
      - "crates/modules/*/admin/src/**"
      - "crates/modules/*/storefront/src/**"
      - "crates/modules/rustok-ai/src/metrics.rs"
      - "crates/modules/rustok-modules/src/static_package.rs"
      - "crates/modules/rustok-page-builder/Cargo.toml"
      - "crates/modules/rustok-page-builder/src/locale.rs"
      - "crates/modules/rustok-notifications/storefront/**"
      - "crates/ui/fly/src/runtime_locale.rs"
      # The design-system gates this workflow runs police `crates/ui/**`, the admin and
      # storefront hosts, the token pipeline and the gates themselves. Without these
      # entries a pull request that edits, say, `rustok-ui/leptos/src/button.rs` —
      # exactly the change `verify-ui-parity` and `verify-ui-ds-adoption` exist to
      # catch — triggered no run at all, because only the i18n files were listed.
      - "crates/ui/rustok-ui/**"
      - "crates/ui/rustok-grid/**"
      - "crates/ui/fly/**"
      - "UI/tokens/**"
      - "apps/admin/src/**"
      - "apps/admin/input.css"
      - "apps/admin/tailwind.config.js"
      - "apps/storefront/src/**"
      - "apps/storefront/assets/**"
      - "apps/storefront/tailwind.config.cjs"
      - "scripts/verify/verify-ui-*.mjs"
      - "scripts/verify/verify-csp-inline-style-exceptions.mjs"
      - "scripts/verify/ui-ds-adoption-baseline.json"
      - "apps/admin/locales/**"
      - "apps/admin/src/i18n.rs"
      - "apps/admin/src/main.rs"
      - "apps/storefront/locales/**"
      - "apps/next-admin/messages/**"
      - "apps/next-admin/package.json"
      - "apps/next-admin/src/i18n/**"
      - "apps/next-frontend/messages/**"
      - "apps/next-frontend/package.json"
      - "apps/next-frontend/src/i18n.ts"
      - "apps/next-frontend/src/i18n-config.ts"
      - "scripts/verify/lib/**"
      - "scripts/verify/ui-i18n-argument-baseline.json"
      - "scripts/verify/verify-i18n-contract.mjs"
      - "scripts/verify/verify-ui-i18n-parity.mjs"
      - "scripts/verify/verify-ui-i18n-keys.mjs"
      - "scripts/verify/verify-fly-multilingual.mjs"
      - "scripts/verify/verify-db-multilingual-contract.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ui-i18n-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, Test, Clippy & WASM
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
      # Without this cargo emits ANSI colour codes, which makes every
      # `grep '^error'` in this workflow silently match nothing.
      CARGO_TERM_COLOR: never
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Ensure WASM target
        run: rustup target add --toolchain "$RUSTUP_TOOLCHAIN" wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: ". -> target"
      - name: Format
        run: |
          # A bare `--check` only fails, forcing every reviewer to download the
          # raw log to learn what is unformatted. Publish the diff in the job
          # summary and as annotations instead.
          fmt_log="$(mktemp)"
          status=0
          cargo fmt -p rustok-ui-i18n -- --check >>"$fmt_log" 2>&1 || status=1
          rustfmt --edition 2024 --check \
            apps/admin/src/i18n.rs \
            apps/admin/src/main.rs \
            crates/libs/rustok-api/src/locale.rs \
            crates/modules/rustok-page-builder/src/locale.rs >>"$fmt_log" 2>&1 || status=1
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          {
            echo '### rustfmt differences'
            echo '```diff'
            head -c 60000 "$fmt_log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          grep -oE '^Diff in [^ ]+' "$fmt_log" | sort -u \
            | sed 's|^Diff in |::error file=|; s|$|::rustfmt: file is not formatted|'
          escaped="$(sed 's/%/%25/g' "$fmt_log" | sed -z 's/\n/%0A/g' | head -c 6000)"
          echo "::error title=rustfmt diff::${escaped}"
          cat "$fmt_log"
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Repository i18n contracts
        run: |
          node scripts/verify/verify-i18n-contract.mjs
          node scripts/verify/verify-fly-multilingual.mjs
      - name: UI catalog parity
        run: node scripts/verify/verify-ui-i18n-parity.mjs
      - name: UI key inventory
        run: node scripts/verify/verify-ui-i18n-keys.mjs --strict
      - name: Admin child pages
        # A module that declares `child_pages` and ignores the routed subpath
        # renders the same markup for every secondary-navigation link.
        run: node scripts/verify/verify-ui-child-pages.mjs
      - name: Grid chrome localization
        # 45 tables share one chrome catalog. The locale is provided once by the
        # host and resolved by the adapter, so a call site cannot silently ship
        # English pagination in a Russian admin.
        run: node scripts/verify/verify-ui-grid-messages.mjs
      - name: Grid adapter parity
        # Both `rustok-grid` adapters promise "identical component APIs" in their
        # CRATE_API.md. Nothing checked it, and the audit already found a header
        # that differed in styling plus five prop-level divergences. Every one-sided
        # prop now needs a reason, and an exception that stopped being true fails.
        run: node scripts/verify/verify-ui-grid-adapter-parity.mjs
      - name: Design-token parity
        # tokens.json → base.css → both Tailwind configs → generated Rust/Dart. Three
        # radius scales shipped at once because nothing compared them; a private
        # `--radius` in a host now fails instead of silently forking the scale.
        run: node scripts/verify/verify-ui-token-parity.mjs
      - name: Design-system adoption ratchet
        # 1 322 raw `<button|input|select|textarea>` controls, 21 hand-drawn `<svg>`
        # and 43 DS import sites across 47 crates. The backlog cannot be closed in
        # one commit, so the rule is a ratchet: `raw` and `svg` may only go down,
        # `ds` may only go up.
        run: node scripts/verify/verify-ui-ds-adoption.mjs
      - name: Dark-theme pairing
        # A palette class without a `dark:` pair assumes the light shell. The first
        # sweep over the channel admin missed the class strings that functions
        # return, so this reads every Rust source token instead of `class="…"`.
        run: node scripts/verify/verify-ui-dark-variants.mjs
      - name: CSP inline-style register
        # `style-src-attr 'none'` drops attribute styles silently. This gate keeps
        # the register honest (and it now also scans `crates/ui`, where the grid
        # used to style itself through a `style` attribute).
        run: node scripts/verify/verify-csp-inline-style-exceptions.mjs
      - name: UI Tailwind source coverage
        # A class that no `@source`/`content` entry can see is silently missing
        # from the built stylesheet: the component renders, it just renders
        # unstyled, and only in the admin. This locks both hosts to the roots
        # that actually emit classes, and treats a drift as a build failure.
        run: |
          node scripts/verify/verify-ui-tailwind-sources.mjs
          node --test scripts/verify/verify-ui-tailwind-sources.test.mjs
      - name: Test
        run: cargo test -p rustok-ui-i18n --all-features
      - name: Consumer integration
        run: |
          cargo test -p rustok-notifications-storefront
          cargo test -p rustok-api locale::tests --lib
          cargo test -p rustok-page-builder locale::tests --lib
      - name: Converted consumer packages
        run: |
          # The workspace-wide Cargo Check job in ci.yml is red on main, so the
          # module packages whose Fluent interpolation call sites changed would
          # otherwise have no green compile gate at all.
          check_log="$(mktemp)"
          if cargo check --lib --all-features \
            -p rustok-ai-admin -p rustok-channel-admin -p rustok-comments-admin \
            -p rustok-fulfillment-admin -p rustok-pricing-storefront \
            -p rustok-product-admin -p rustok-product-storefront \
            -p rustok-product-relations-admin -p rustok-brand-admin -p rustok-product-bundles-admin -p rustok-marketplace-seller-admin -p rustok-marketplace-listing-admin \
            >>"$check_log" 2>&1; then
            exit 0
          fi
          {
            echo '### cargo check diagnostics'
            echo '```'
            head -c 60000 "$check_log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          diagnostics="$(grep -E '^(error|warning)(\[|:)' -A 8 "$check_log" || true)"
          if [ -z "$diagnostics" ]; then
            diagnostics="$(tail -c 2500 "$check_log")"
          fi
          escaped="$(printf '%s' "$diagnostics" | tail -c 2500 \
            | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')"
          echo "::error title=cargo-check::${escaped}"
          cat "$check_log"
          exit 1
      - name: Clippy
        run: |
          # Same rationale as the Format step: publish the diagnostics instead
          # of only failing, so a reviewer does not need the raw log.
          clippy_log="$(mktemp)"
          status=0
          cargo clippy -p rustok-ui-i18n --all-targets --all-features -- -D warnings \
            >>"$clippy_log" 2>&1 || status=1
          cargo clippy -p rustok-api -p rustok-page-builder --lib -- -D warnings \
            >>"$clippy_log" 2>&1 || status=1
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          {
            echo '### clippy diagnostics'
            echo '```'
            head -c 60000 "$clippy_log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # GitHub truncates a long annotation, so send the diagnostics rather
          # than the build chatter and keep it well under the limit.
          diagnostics="$(grep -E '^(error|warning)(\[|:)' -A 8 "$clippy_log" || true)"
          if [ -z "$diagnostics" ]; then
            diagnostics="$(tail -c 2500 "$clippy_log")"
          fi
          escaped="$(printf '%s' "$diagnostics" | tail -c 2500 \
            | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')"
          echo "::error title=clippy::${escaped}"
          cat "$clippy_log"
          exit 1
      - name: WASM check
        run: cargo check -p rustok-ui-i18n --all-features --target wasm32-unknown-unknown
