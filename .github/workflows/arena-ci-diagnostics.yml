name: Arena lockfile diagnostics (temporary)

on:
  push:
    branches:
      - arena/2605f28e-rustok
    paths:
      - .github/workflows/arena-ci-diagnostics.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  lockfile:
    name: Diagnose and retest the Cargo lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: fly-page-builder
      - name: Resolve the workspace with a scoped Fly check
        id: resolve
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo check -p fly --no-default-features --lib 2>&1 | tee "$RUNNER_TEMP/resolve.log" || status=$?
          if (( status != 0 )); then
            python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'resolve.log').read_text(errors='replace')[-2800:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Cargo resolve diagnostics::{escaped}')
          PY
          fi
          exit "$status"
      - name: Publish the exact lockfile delta
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-ext-diff --binary -- Cargo.lock > "$RUNNER_TEMP/arena-lock.patch"
          python3 - <<'PY'
          import base64
          import os
          import zlib
          from pathlib import Path
          patch = Path(os.environ['RUNNER_TEMP'], 'arena-lock.patch').read_bytes()
          if not patch:
              print('::error::Cargo did not update the lockfile')
              raise SystemExit(1)
          encoded = base64.b64encode(zlib.compress(patch, 9)).decode('ascii')
          chunks = [encoded[i:i+3000] for i in range(0, len(encoded), 3000)]
          if len(chunks) > 9:
              print(f'::error::Lockfile patch is too large to transfer: {len(chunks)} chunks')
              raise SystemExit(1)
          for index, chunk in enumerate(chunks, 1):
              print(f'::notice title=lockfile patch {index} of {len(chunks)}::{chunk}')
          print(f'Lockfile delta: {len(patch)} bytes')
          PY
      - name: Retest static sanitization inventory with the resolved lockfile
        if: always() && steps.resolve.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo test --locked -p rustok-page-builder --lib -- --list 2>&1 | tee "$RUNNER_TEMP/static.log" || status=$?
          if (( status != 0 )); then
            python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'static.log').read_text(errors='replace')[-2800:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Static inventory diagnostics::{escaped}')
          PY
          fi
          exit "$status"
