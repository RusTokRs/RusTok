name: Pages Cache Consumer Artifact HTTP Diagnostic

on:
  pull_request:
    paths:
      - "crates/rustok-pages/tests/artifact_http_cache_sqlite.rs"
      - "crates/rustok-pages/src/controllers/**"
      - "crates/rustok-pages/src/services/page_builder_artifact.rs"
      - "crates/rustok-pages/src/cache_invalidation.rs"
      - ".github/workflows/pages-cache-consumer-artifact-http-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-cache-consumer-artifact-http-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages-cache-consumer-exact-main-evidence
      - name: Require exact event checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Capture artifact HTTP cache test
        id: test
        shell: bash
        run: |
          set +e
          mkdir -p target/pages-cache-consumer-diagnostic
          RUST_BACKTRACE=full cargo test --locked -p rustok-pages --test artifact_http_cache_sqlite -- --nocapture 2>&1 | tee target/pages-cache-consumer-diagnostic/artifact_http_cache_sqlite.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Archive diagnostic log
        uses: actions/upload-artifact@v7
        with:
          name: pages-cache-consumer-artifact-http-diagnostic-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/pages-cache-consumer-diagnostic/artifact_http_cache_sqlite.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Preserve test conclusion
        shell: bash
        env:
          STATUS: ${{ steps.test.outputs.status }}
        run: test "$STATUS" = "0"
