name: Agent Admin Prettier Evidence

on:
  push:
    branches:
      - agent/admin-prettier-20260814

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/next-admin/package-lock.json
      - name: Install admin dependencies
        working-directory: apps/next-admin
        run: npm ci
      - name: Format exact failing files and print diff
        working-directory: apps/next-admin
        run: |
          npx prettier --write \
            packages/translation/src/types.ts \
            playwright.pages-published-metadata.config.ts \
            tests/pages-published-metadata/browser-evidence.spec.ts \
            tests/pages-published-metadata/global-setup.ts
          git diff --no-color -- \
            packages/translation/src/types.ts \
            playwright.pages-published-metadata.config.ts \
            tests/pages-published-metadata/browser-evidence.spec.ts \
            tests/pages-published-metadata/global-setup.ts
          git diff --check
