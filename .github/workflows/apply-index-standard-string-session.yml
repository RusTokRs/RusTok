name: Apply Index standard string session contract

on:
  push:
    branches:
      - agent/index-standard-string-session
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/index-standard-string-session
          fetch-depth: 0
      - name: Apply guarded source and documentation updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one guarded replacement, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "ops/benches/src/index_storage/connection.rs",
              "use sea_orm::{ConnectOptions, Database, DatabaseConnection};",
              "use sea_orm::{ConnectOptions, ConnectionTrait, Database, DatabaseConnection};",
          )
          replace_exact(
              "ops/benches/src/index_storage/connection.rs",
              '''    Database::connect(options)\n        .await\n        .context("failed to connect to PostgreSQL with a single benchmark session")\n''',
              '''    let db = Database::connect(options)\n        .await\n        .context("failed to connect to PostgreSQL with a single benchmark session")?;\n    db.execute_unprepared("SET standard_conforming_strings = on;")\n        .await\n        .context("failed to pin PostgreSQL standard-conforming string semantics")?;\n    Ok(db)\n''',
          )

          replace_exact(
              "scripts/verify/verify-index-storage-source-oracle.mjs",
              "const benchmarkModule = read('ops/benches/src/index_storage/mod.rs');\n",
              "const benchmarkModule = read('ops/benches/src/index_storage/mod.rs');\nconst connection = read('ops/benches/src/index_storage/connection.rs');\n",
          )
          replace_exact(
              "scripts/verify/verify-index-storage-source-oracle.mjs",
              "for (const marker of [\n  'parse_read_explain_metrics',",
              """for (const marker of [
  'max_connections(1)',
  'SET standard_conforming_strings = on;',
  'failed to pin PostgreSQL standard-conforming string semantics',
]) {
  if (!connection.includes(marker)) {
    fail(`benchmark connection missing deterministic string contract ${marker}`);
  }
}
for (const [label, content] of [
  ['read runner', runner],
  ['mutation runner', mutationRunner],
  ['maintenance runner', maintenanceRunner],
]) {
  if (!content.includes('connect_benchmark_database(&config.database_url).await?')) {
    fail(`${label} must use the shared single-session benchmark connection`);
  }
  if (content.includes('standard_conforming_strings = off')) {
    fail(`${label} overrides deterministic PostgreSQL string semantics`);
  }
}

for (const marker of [
  'parse_read_explain_metrics',""",
          )
          replace_exact(
              "scripts/verify/verify-index-storage-source-oracle.mjs",
              "console.log('[verify-index-storage-source-oracle] source oracle, byte-preserved evidence cores, self-described ordered digests, complete metrics, executable SQL entrypoints, and ADR integrity wiring are independently guarded');",
              "console.log('[verify-index-storage-source-oracle] source oracle, deterministic PostgreSQL string semantics, byte-preserved evidence cores, self-described ordered digests, complete metrics, executable SQL entrypoints, and ADR integrity wiring are independently guarded');",
          )

          replace_exact(
              "crates/rustok-index/docs/storage-benchmark.md",
              """Every executable uses a pool constrained to exactly one physical PostgreSQL
connection. This keeps session settings, temporary execution state, maintenance
statistics, and VACUUM sequencing on one reproducible session per report.
""",
              """Every executable uses a pool constrained to exactly one physical PostgreSQL
connection. This keeps session settings, temporary execution state, maintenance
statistics, and VACUUM sequencing on one reproducible session per report. The
shared connection setup pins `standard_conforming_strings = on` before generated
SQL executes, so string and escape semantics cannot vary with server, database,
or role defaults.
""",
          )

          replace_exact(
              "crates/rustok-index/docs/implementation-plan.md",
              """- [x] Canonicalize configured locales through `LocaleKey` before SQL generation.
- [x] Generate Product, Variant, SalesChannel, tags, prices, timestamps, and links
""",
              """- [x] Canonicalize configured locales through `LocaleKey` before SQL generation.
- [x] Pin the shared single-session PostgreSQL connection to
      `standard_conforming_strings = on` before generated benchmark SQL runs.
- [x] Generate Product, Variant, SalesChannel, tags, prices, timestamps, and links
""",
          )
          plan = Path("crates/rustok-index/docs/implementation-plan.md")
          text = plan.read_text(encoding="utf-8")
          progress = (
              "- 2026-07-24: pinned every M2 benchmark connection to "
              "`standard_conforming_strings = on` before source or candidate SQL runs, "
              "and added a permanent source guard so server, database, or role defaults "
              "cannot change archived SQL semantics. Tests were not run by the assistant.\n"
          )
          if progress not in text:
              if not text.endswith("\n"):
                  text += "\n"
              text += progress
              plan.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/apply-index-standard-string-session.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/benches/src/index_storage/connection.rs \
            scripts/verify/verify-index-storage-source-oracle.mjs \
            crates/rustok-index/docs/storage-benchmark.md \
            crates/rustok-index/docs/implementation-plan.md \
            .github/workflows/apply-index-standard-string-session.yml
          git commit -m "fix(index): pin benchmark string semantics"
          git push origin HEAD:agent/index-standard-string-session
