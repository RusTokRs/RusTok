name: Agent Forum Search locale/date finalize

on:
  push:
    branches:
      - agent/forum-search-locale-date-filter-23b2f3

permissions:
  contents: write

concurrency:
  group: agent-forum-search-locale-date-filter-23b2f3-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/forum-search-locale-date-filter-23b2f3
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Apply final source and plan corrections
        run: python3 scripts/agent/finalize_forum_search_locale_date.py
      - name: Format changed Rust files only
        run: |
          rustfmt --edition 2024 crates/rustok-forum/src/search_projection.rs
          rustfmt --edition 2024 crates/rustok-search/src/forum_storefront_date_execution.rs
          rustfmt --edition 2024 crates/rustok-search/src/forum_storefront_date_execution/types_and_execute.rs
          rustfmt --edition 2024 crates/rustok-search/src/forum_storefront_date_execution/result_scan.rs
          rustfmt --edition 2024 crates/rustok-search/src/forum_storefront_date_execution/normalization.rs
          rustfmt --edition 2024 crates/rustok-search/src/forum_storefront_locale_date_filters.rs
          rustfmt --edition 2024 crates/rustok-search/src/graphql/forum_storefront.rs
          rustfmt --edition 2024 crates/rustok-search/src/lib.rs
          rustfmt --edition 2024 crates/rustok-search/storefront/src/transport/forum_graphql_adapter.rs
          rustfmt --edition 2024 crates/rustok-search/storefront/src/transport/forum_native_server_adapter.rs
          rustfmt --edition 2024 crates/rustok-search/storefront/src/transport/mod.rs
      - name: Commit corrections and restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/cache-redis-status.yml > .github/workflows/cache-redis-status.yml
          rm -f scripts/agent/finalize_forum_search_locale_date.py
          git add -A
          git commit -m "fix(search): finalize Forum locale and date scope"
          git push origin HEAD:agent/forum-search-locale-date-filter-23b2f3
