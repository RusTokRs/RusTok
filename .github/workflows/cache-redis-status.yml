name: Cache Redis status

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  pull_request:
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-redis-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.head_ref != 'agent/blog-admin-richtext-guardrail-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cache-redis-status
      - name: Format
        run: cargo fmt --all --check
      - name: Compile
        run: |
          cargo check -p rustok-cache --lib
          cargo check -p rustok-server --lib
      - name: Redis status tests
        run: |
          cargo test -p rustok-cache redis_status --lib
          cargo test -p rustok-server --test cache_redis_status_architecture_guard --test cache_redis_monitor_architecture_guard
      - name: Clippy
        run: |
          cargo clippy -p rustok-cache --lib -- -D warnings
          cargo clippy -p rustok-server --lib -- -D warnings

  blog-admin-richtext-source:
    if: github.head_ref == 'agent/blog-admin-richtext-guardrail-20260730'
    name: Apply Blog admin richtext source transform
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/blog-admin-richtext-guardrail-20260730
          fetch-depth: 0
      - name: Extract and apply source transform
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/cache-feature-matrix.yml').read_text()
          opening = "          python3 <<'PY'\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index("\n          PY", start)
          block = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          ) + "\n"
          Path('/tmp/apply_blog_admin_guardrail.py').write_text(script)
          PY
          python3 /tmp/apply_blog_admin_guardrail.py
          node --check scripts/verify/verify-blog-admin-boundary.mjs
          node --check scripts/verify/verify-blog-admin-boundary.test.mjs
          python3 -m json.tool crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json >/dev/null
          python3 -m json.tool package.json >/dev/null
          git diff --check
      - name: Commit reconciled source
        shell: bash
        run: |
          git show origin/main:.github/workflows/cache-feature-matrix.yml > .github/workflows/cache-feature-matrix.yml
          git show origin/main:.github/workflows/cache-redis-status.yml > .github/workflows/cache-redis-status.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify/verify-blog-admin-boundary.mjs \
            scripts/verify/verify-blog-admin-boundary.test.mjs \
            crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json \
            crates/rustok-blog/docs/implementation-plan.md \
            package.json \
            .github/workflows/cache-feature-matrix.yml \
            .github/workflows/cache-redis-status.yml
          git commit -m "fix(blog): align admin guardrail with canonical richtext"
          git push origin HEAD:agent/blog-admin-richtext-guardrail-20260730
