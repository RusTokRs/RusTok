name: Cache Redis status

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  pull_request:
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-redis-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.head_ref != 'agent/forum-search-result-eligibility-23b2d'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cache-redis-status
      - name: Format
        run: cargo fmt --all --check
      - name: Compile
        run: |
          cargo check -p rustok-cache --lib
          cargo check -p rustok-server --lib
      - name: Redis status tests
        run: |
          cargo test -p rustok-cache redis_status --lib
          cargo test -p rustok-server --test cache_redis_status_architecture_guard --test cache_redis_monitor_architecture_guard
      - name: Clippy
        run: |
          cargo clippy -p rustok-cache --lib -- -D warnings
          cargo clippy -p rustok-server --lib -- -D warnings

  agent-format-forum-search:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/forum-search-result-eligibility-23b2d' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Format only FORUM-23B2D Rust files
        shell: bash
        run: |
          rustfmt --edition 2024 --config skip_children=true \
            apps/server/src/services/forum_search_result_eligibility.rs \
            apps/server/src/services/mod.rs \
            crates/rustok-forum/src/category_read_transport.rs \
            crates/rustok-forum/src/lib.rs \
            crates/rustok-forum/src/services/mod.rs \
            crates/rustok-forum/src/services/search_result_eligibility.rs \
            crates/rustok-search/src/forum_storefront_execution.rs \
            crates/rustok-search/src/forum_storefront_execution_public.rs \
            crates/rustok-search/src/graphql/forum_storefront.rs \
            crates/rustok-search/src/lib.rs \
            crates/rustok-search/src/storefront_result_eligibility.rs \
            crates/rustok-search/storefront/src/transport/forum_native_server_adapter.rs
      - name: Commit formatting and restore workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/cache-redis-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/server/src/services/forum_search_result_eligibility.rs \
            apps/server/src/services/mod.rs \
            crates/rustok-forum/src/category_read_transport.rs \
            crates/rustok-forum/src/lib.rs \
            crates/rustok-forum/src/services/mod.rs \
            crates/rustok-forum/src/services/search_result_eligibility.rs \
            crates/rustok-search/src/forum_storefront_execution.rs \
            crates/rustok-search/src/forum_storefront_execution_public.rs \
            crates/rustok-search/src/graphql/forum_storefront.rs \
            crates/rustok-search/src/lib.rs \
            crates/rustok-search/src/storefront_result_eligibility.rs \
            crates/rustok-search/storefront/src/transport/forum_native_server_adapter.rs \
            .github/workflows/cache-redis-status.yml
          git commit -m "style(forum): format Search eligibility slice"
          git push origin HEAD:${{ github.head_ref }}
