name: Agent Forum Search plan sync

on:
  pull_request:
    branches:
      - agent/forum-search-durable-ingest-sequence-23b2g1

permissions:
  contents: write

concurrency:
  group: agent-forum-search-b2f4-b2g1-plan-sync
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/forum-search-durable-ingest-sequence-23b2g1
          fetch-depth: 2
      - name: Synchronize canonical plans
        run: python3 scripts/agent/sync_forum_search_current_channel_and_ingest_plans.py
      - name: Commit synchronization and restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/cache-redis-status.yml > .github/workflows/cache-redis-status.yml
          rm -f scripts/agent/sync_forum_search_current_channel_and_ingest_plans.py
          git add -A
          git commit -m "docs(forum): sync current channel and ingest sequence plans"
          git push origin HEAD:agent/forum-search-durable-ingest-sequence-23b2g1
