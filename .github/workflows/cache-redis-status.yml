name: Agent Forum Search kind sync

on:
  pull_request:
    branches:
      - agent/forum-search-kind-filter-23b2f4

permissions:
  contents: write

concurrency:
  group: agent-forum-search-kind-filter-23b2f4
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/forum-search-kind-filter-23b2f4
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Apply exact B2F4 source and plan changes
        run: python3 scripts/agent/apply_forum_search_kind_filter.py
      - name: Format changed Rust files only
        run: |
          rustfmt --edition 2024 crates/rustok-search/src/forum_document_filters.rs
          rustfmt --edition 2024 crates/rustok-search/src/forum_storefront_execution.rs
          rustfmt --edition 2024 crates/rustok-search/src/graphql/forum_storefront.rs
          rustfmt --edition 2024 crates/rustok-search/storefront/src/transport/forum_graphql_adapter.rs
          rustfmt --edition 2024 crates/rustok-search/storefront/src/transport/forum_native_server_adapter.rs
          rustfmt --edition 2024 crates/rustok-search/storefront/src/transport/mod.rs
      - name: Commit synchronization and restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/cache-redis-status.yml > .github/workflows/cache-redis-status.yml
          rm -f scripts/agent/apply_forum_search_kind_filter.py
          git add -A
          git commit -m "feat(search): add Forum document kind filter"
          git push origin HEAD:agent/forum-search-kind-filter-23b2f4
