name: Cache Redis status

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  pull_request:
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-redis-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.head_ref != 'agent/blog-admin-richtext-locale-cutover-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cache-redis-status
      - name: Format
        run: cargo fmt --all --check
      - name: Compile
        run: |
          cargo check -p rustok-cache --lib
          cargo check -p rustok-server --lib
      - name: Redis status tests
        run: |
          cargo test -p rustok-cache redis_status --lib
          cargo test -p rustok-server --test cache_redis_status_architecture_guard --test cache_redis_monitor_architecture_guard
      - name: Clippy
        run: |
          cargo clippy -p rustok-cache --lib -- -D warnings
          cargo clippy -p rustok-server --lib -- -D warnings

  blog-admin-richtext-locale-cutover:
    if: github.head_ref == 'agent/blog-admin-richtext-locale-cutover-20260730'
    name: Cut over Blog admin richtext locale contract
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/blog-admin-richtext-locale-cutover-20260730
          fetch-depth: 0
      - name: Apply fail-closed source transform
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}: {old[:140]!r}")
              target.write_text(text.replace(old, new, 1))

          locale_paths = [
              "crates/rustok-blog/admin/locales/en.json",
              "crates/rustok-blog/admin/locales/ru.json",
          ]
          legacy_locale_keys = ["blog.form.bodyFormat", "blog.form.rawWarning"]
          for locale_path in locale_paths:
              target = Path(locale_path)
              catalog = json.loads(target.read_text())
              for key in legacy_locale_keys:
                  if key not in catalog:
                      raise RuntimeError(f"{locale_path}: expected legacy locale key {key}")
                  del catalog[key]
              target.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n")

          verifier = "scripts/verify/verify-blog-admin-boundary.mjs"
          replace_once(
              verifier,
              'const adminRichtextEvidencePath = "crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json";\n',
              'const adminRichtextEvidencePath = "crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json";\nconst adminEnLocalePath = "crates/rustok-blog/admin/locales/en.json";\nconst adminRuLocalePath = "crates/rustok-blog/admin/locales/ru.json";\n',
          )
          replace_once(
              verifier,
              '  registryPath,\n  adminRichtextEvidencePath,\n',
              '  registryPath,\n  adminRichtextEvidencePath,\n  adminEnLocalePath,\n  adminRuLocalePath,\n',
          )
          replace_once(
              verifier,
              'const adminRichtextEvidence = readJson(adminRichtextEvidencePath);\n',
              'const adminRichtextEvidence = readJson(adminRichtextEvidencePath);\nconst adminEnLocale = readJson(adminEnLocalePath);\nconst adminRuLocale = readJson(adminRuLocalePath);\n',
          )
          replace_once(
              verifier,
              '''for (const marker of legacyRichtextAdminMarkers) {
  assertNotContains(core, marker, `${corePath}: canonical richtext core must not reintroduce legacy admin helper ${marker}`);
  assertNotContains(ui, marker, `${uiPath}: canonical richtext UI must not reintroduce legacy admin helper ${marker}`);
}

''',
              '''for (const marker of legacyRichtextAdminMarkers) {
  assertNotContains(core, marker, `${corePath}: canonical richtext core must not reintroduce legacy admin helper ${marker}`);
  assertNotContains(ui, marker, `${uiPath}: canonical richtext UI must not reintroduce legacy admin helper ${marker}`);
}

const legacyRichtextLocaleKeys = ["blog.form.bodyFormat", "blog.form.rawWarning"];
for (const [localePath, catalog] of [
  [adminEnLocalePath, adminEnLocale],
  [adminRuLocalePath, adminRuLocale],
]) {
  for (const key of legacyRichtextLocaleKeys) {
    if (Object.prototype.hasOwnProperty.call(catalog, key)) {
      fail(`${localePath}: canonical richtext locale catalog must not expose legacy key ${key}`);
    }
  }
}

''',
          )
          replace_once(
              verifier,
              '  adminRichtextEvidence.schema_version !== 1 ||\n',
              '  adminRichtextEvidence.schema_version !== 2 ||\n',
          )
          replace_once(
              verifier,
              '''  adminRichtextEvidence.sources?.core !== corePath ||
  adminRichtextEvidence.sources?.ui !== uiPath ||
  adminRichtextEvidence.verifier !== "scripts/verify/verify-blog-admin-boundary.mjs" ||
''',
              '''  adminRichtextEvidence.sources?.core !== corePath ||
  adminRichtextEvidence.sources?.ui !== uiPath ||
  adminRichtextEvidence.sources?.locales?.en !== adminEnLocalePath ||
  adminRichtextEvidence.sources?.locales?.ru !== adminRuLocalePath ||
  adminRichtextEvidence.verifier !== "scripts/verify/verify-blog-admin-boundary.mjs" ||
''',
          )
          replace_once(
              verifier,
              '''for (const marker of adminRichtextEvidence.forbidden_markers ?? []) {
  assertNotContains(core, marker, `${corePath}: evidence-forbidden legacy richtext marker ${marker}`);
  assertNotContains(ui, marker, `${uiPath}: evidence-forbidden legacy richtext marker ${marker}`);
}

''',
              '''for (const marker of adminRichtextEvidence.forbidden_markers ?? []) {
  assertNotContains(core, marker, `${corePath}: evidence-forbidden legacy richtext marker ${marker}`);
  assertNotContains(ui, marker, `${uiPath}: evidence-forbidden legacy richtext marker ${marker}`);
}
const evidenceLocaleKeys = [...(adminRichtextEvidence.forbidden_locale_keys ?? [])].sort();
const expectedLocaleKeys = [...legacyRichtextLocaleKeys].sort();
if (JSON.stringify(evidenceLocaleKeys) !== JSON.stringify(expectedLocaleKeys)) {
  fail(`${adminRichtextEvidencePath}: forbidden locale key evidence drift`);
}

''',
          )

          test = "scripts/verify/verify-blog-admin-boundary.test.mjs"
          replace_once(
              test,
              '''  writeFixtureFile(root, "crates/rustok-blog/docs/implementation-plan.md", `verify-blog-admin-boundary.mjs ${options.omitModeration ? "" : "moderation"}`);
  writeFixtureFile(root, "crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json", JSON.stringify({
    schema_version: 1,
''',
              '''  writeFixtureFile(root, "crates/rustok-blog/docs/implementation-plan.md", `verify-blog-admin-boundary.mjs ${options.omitModeration ? "" : "moderation"}`);
  const localeCatalog = { "blog.form.body": "Body" };
  if (options.legacyLocaleKeys) {
    localeCatalog["blog.form.bodyFormat"] = "Body format";
    localeCatalog["blog.form.rawWarning"] = "Raw payload warning";
  }
  writeFixtureFile(root, "crates/rustok-blog/admin/locales/en.json", JSON.stringify(localeCatalog));
  writeFixtureFile(root, "crates/rustok-blog/admin/locales/ru.json", JSON.stringify(localeCatalog));
  writeFixtureFile(root, "crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json", JSON.stringify({
    schema_version: 2,
''',
          )
          replace_once(
              test,
              '''    sources: {
      core: "crates/rustok-blog/admin/src/core.rs",
      ui: "crates/rustok-blog/admin/src/ui/leptos.rs"
    },
''',
              '''    sources: {
      core: "crates/rustok-blog/admin/src/core.rs",
      ui: "crates/rustok-blog/admin/src/ui/leptos.rs",
      locales: {
        en: "crates/rustok-blog/admin/locales/en.json",
        ru: "crates/rustok-blog/admin/locales/ru.json"
      }
    },
''',
          )
          replace_once(
              test,
              '''    forbidden_markers: ["blog_post_admin_body_format_select_view", "blog_post_admin_body_format_change_view", "normalize_blog_post_body_format", "blog_post_admin_raw_body_warning_view"],
    verifier: "scripts/verify/verify-blog-admin-boundary.mjs",
''',
              '''    forbidden_markers: ["blog_post_admin_body_format_select_view", "blog_post_admin_body_format_change_view", "normalize_blog_post_body_format", "blog_post_admin_raw_body_warning_view"],
    forbidden_locale_keys: ["blog.form.bodyFormat", "blog.form.rawWarning"],
    verifier: "scripts/verify/verify-blog-admin-boundary.mjs",
''',
          )
          replace_once(
              test,
              '''test("blog admin boundary verifier rejects legacy richtext helpers in UI", () => {
  withRoot({ legacyRichtextUi: true }, (result) => {
    assert.notEqual(result.status, 0);
    assert.match(result.stderr, /canonical richtext UI must not reintroduce legacy admin helper/);
  });
});

''',
              '''test("blog admin boundary verifier rejects legacy richtext helpers in UI", () => {
  withRoot({ legacyRichtextUi: true }, (result) => {
    assert.notEqual(result.status, 0);
    assert.match(result.stderr, /canonical richtext UI must not reintroduce legacy admin helper/);
  });
});

test("blog admin boundary verifier rejects legacy richtext locale keys", () => {
  withRoot({ legacyLocaleKeys: true }, (result) => {
    assert.notEqual(result.status, 0);
    assert.match(result.stderr, /canonical richtext locale catalog must not expose legacy key/);
  });
});

''',
          )

          evidence_path = Path("crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json")
          evidence = json.loads(evidence_path.read_text())
          if evidence.get("schema_version") != 1:
              raise RuntimeError("admin richtext evidence schema version drift before cutover")
          evidence["schema_version"] = 2
          evidence["sources"]["locales"] = {
              "en": "crates/rustok-blog/admin/locales/en.json",
              "ru": "crates/rustok-blog/admin/locales/ru.json",
          }
          evidence["forbidden_locale_keys"] = legacy_locale_keys
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n")

          plan = "crates/rustok-blog/docs/implementation-plan.md"
          replace_once(
              plan,
              '''The Blog admin FFA guardrail now matches the canonical article editor. It
requires typed `RichTextDocument` state and the owner `BlogRichTextEditor`,
rejects reintroduction of body-format selectors and raw-body warnings in both
core and Leptos UI, and validates machine evidence plus self-regression
fixtures. The guardrail is part of the Blog FBA command chain.
''',
              '''The Blog admin FFA guardrail now matches the canonical article editor. It
requires typed `RichTextDocument` state and the owner `BlogRichTextEditor`,
rejects reintroduction of body-format selectors and raw-body warnings in both
core and Leptos UI, removes the dead `blog.form.bodyFormat` and
`blog.form.rawWarning` locale contract from EN/RU catalogs, and validates
machine evidence plus self-regression fixtures. The guardrail is part of the
Blog FBA command chain.
''',
          )
          replace_once(
              plan,
              '''- Blog admin canonical richtext guardrail: `source_verified_no_compile`; the
  FFA verifier requires typed document/editor state, rejects removed selector
  and raw-body helpers, validates machine evidence, and has negative fixtures.
''',
              '''- Blog admin canonical richtext guardrail: `source_verified_no_compile`; the
  FFA verifier requires typed document/editor state, rejects removed selector,
  raw-body helper, and locale-key contracts, validates machine evidence, and has
  negative fixtures.
''',
          )
          replace_once(
              plan,
              '''26. Reconciled the Blog admin FFA guardrail with the canonical article editor:
    removed stale required legacy helpers, added typed editor/document evidence,
    negative regression fixtures, and FBA-chain execution.

## Next results
''',
              '''26. Reconciled the Blog admin FFA guardrail with the canonical article editor:
    removed stale required legacy helpers, added typed editor/document evidence,
    negative regression fixtures, and FBA-chain execution.
27. Removed dead body-format/raw-payload EN/RU locale keys and extended the
    canonical admin evidence, verifier, and self-test to fail closed if those
    legacy UI contracts return.

## Next results
''',
          )
          PY

          node --check scripts/verify/verify-blog-admin-boundary.mjs
          node --check scripts/verify/verify-blog-admin-boundary.test.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [
              "crates/rustok-blog/admin/locales/en.json",
              "crates/rustok-blog/admin/locales/ru.json",
              "crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json",
          ]:
              json.loads(Path(path).read_text())
          PY
          git diff --check
      - name: Commit locale contract cutover
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/cache-redis-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/cache-redis-status.yml \
            crates/rustok-blog/admin/locales/en.json \
            crates/rustok-blog/admin/locales/ru.json \
            crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json \
            crates/rustok-blog/docs/implementation-plan.md \
            scripts/verify/verify-blog-admin-boundary.mjs \
            scripts/verify/verify-blog-admin-boundary.test.mjs
          git diff --cached --check
          git commit -m "fix(blog): remove legacy admin richtext locale contract"
          git push origin HEAD:agent/blog-admin-richtext-locale-cutover-20260730
