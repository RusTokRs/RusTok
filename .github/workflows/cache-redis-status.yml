name: Agent Forum Search durable ingest sequence sync

on:
  pull_request:
    branches:
      - agent/forum-search-durable-ingest-sequence-23b2g1

permissions:
  contents: write

concurrency:
  group: agent-forum-search-durable-ingest-sequence-23b2g1
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/forum-search-durable-ingest-sequence-23b2g1
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Apply exact B2G1 source and plan changes
        run: python3 scripts/agent/apply_forum_search_durable_ingest_sequence.py
      - name: Format changed Rust files only
        run: |
          rustfmt --edition 2024 crates/rustok-search/src/migrations/m20260731_000010_add_forum_projection_ingest_sequence.rs
          rustfmt --edition 2024 crates/rustok-search/src/forum_inbox.rs
          rustfmt --edition 2024 crates/rustok-search/src/forum_reconciliation.rs
      - name: Commit synchronization and restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/cache-redis-status.yml > .github/workflows/cache-redis-status.yml
          rm -f scripts/agent/apply_forum_search_durable_ingest_sequence.py
          git add -A
          git commit -m "feat(search): add durable Forum inbox ingest sequence"
          git push origin HEAD:agent/forum-search-durable-ingest-sequence-23b2g1
