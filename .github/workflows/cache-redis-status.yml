name: Cache Redis status

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  pull_request:
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-redis-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.head_ref != 'agent/storefront-search-product-channel-23b2e2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cache-redis-status
      - name: Format
        run: cargo fmt --all --check
      - name: Compile
        run: |
          cargo check -p rustok-cache --lib
          cargo check -p rustok-server --lib
      - name: Redis status tests
        run: |
          cargo test -p rustok-cache redis_status --lib
          cargo test -p rustok-server --test cache_redis_status_architecture_guard --test cache_redis_monitor_architecture_guard
      - name: Clippy
        run: |
          cargo clippy -p rustok-cache --lib -- -D warnings
          cargo clippy -p rustok-server --lib -- -D warnings

  agent-storefront-search-product-channel:
    if: github.head_ref == 'agent/storefront-search-product-channel-23b2e2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Anchor FTS patch target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path("scripts/agent/patch-storefront-search-product-channel-23b2e2.py")
          text = target.read_text()
          section = text.index("# PostgreSQL Search uses one storefront-only base predicate")
          needle = '''replace_once(
              "crates/rustok-search/src/pg_engine.rs",
              """    query: &SearchQuery,'''
          index = text.find(needle, section)
          if index < 0:
              raise SystemExit("FTS replacement call not found")
          replacement = '''replace_after(
              "crates/rustok-search/src/pg_engine.rs",
              "async fn run_fts_search(\\n",
              """    query: &SearchQuery,'''
          target.write_text(text[:index] + replacement + text[index + len(needle):])
          PY
      - name: Apply deterministic Product channel patch
        run: python3 scripts/agent/patch-storefront-search-product-channel-23b2e2.py
      - name: Format changed Rust files only
        run: |
          rustfmt --edition 2024 \
            crates/rustok-search/src/storefront_product_channel_visibility.rs \
            crates/rustok-search/src/projector.rs \
            crates/rustok-search/src/projector_legacy.rs \
            crates/rustok-search/src/pg_engine.rs \
            crates/rustok-search/src/dictionaries.rs \
            crates/rustok-search/src/suggestions.rs \
            crates/rustok-search/src/graphql/query.rs \
            crates/rustok-search/src/forum_storefront_execution.rs \
            crates/rustok-search/storefront/src/transport/native_server_adapter.rs
      - name: Commit patch and remove temporary agent files
        run: |
          git checkout origin/main -- .github/workflows/cache-redis-status.yml
          rm scripts/agent/patch-storefront-search-product-channel-23b2e2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rustok-search .github/workflows/cache-redis-status.yml scripts/agent
          git commit -m "feat(search): enforce product storefront channels"
          git push origin HEAD:${{ github.head_ref }}
