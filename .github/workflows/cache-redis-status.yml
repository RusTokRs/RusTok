name: Cache Redis status

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  pull_request:
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-redis-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.head_ref != 'agent/forum-search-tag-solved-filter-23b2f2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cache-redis-status
      - name: Format
        run: cargo fmt --all --check
      - name: Compile
        run: |
          cargo check -p rustok-cache --lib
          cargo check -p rustok-server --lib
      - name: Redis status tests
        run: |
          cargo test -p rustok-cache redis_status --lib
          cargo test -p rustok-server --test cache_redis_status_architecture_guard --test cache_redis_monitor_architecture_guard
      - name: Clippy
        run: |
          cargo clippy -p rustok-cache --lib -- -D warnings
          cargo clippy -p rustok-server --lib -- -D warnings

  agent-forum-search-tag-solved-cleanup:
    if: github.head_ref == 'agent/forum-search-tag-solved-filter-23b2f2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Restore minimal Forum projection diff
        run: |
          git checkout origin/main -- crates/rustok-forum/src/search_projection.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/rustok-forum/src/search_projection.rs")
          text = path.read_text()
          old = '        let author_payload = public_author_payload(author.as_ref());\n\n        let created_at = parse_timestamp(&reply.created_at, "reply.created_at")?;'
          new = '        let author_payload = public_author_payload(author.as_ref());\n        let topic_tags = topic.tags.clone();\n\n        let created_at = parse_timestamp(&reply.created_at, "reply.created_at")?;'
          if text.count(old) != 1:
              raise SystemExit("reply topic-tag projection anchor drifted")
          text = text.replace(old, new, 1)
          old = '                "author": author_payload,\n                "parent_reply_id": reply.parent_reply_id,'
          new = '                "author": author_payload,\n                "topic_tags": topic_tags,\n                "parent_reply_id": reply.parent_reply_id,'
          if text.count(old) != 1:
              raise SystemExit("reply topic-tag payload anchor drifted")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format repaired filter only
        run: rustfmt --edition 2024 crates/rustok-search/src/forum_document_filters.rs
      - name: Commit cleanup and restore workflow
        run: |
          git checkout origin/main -- .github/workflows/cache-redis-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rustok-forum/src/search_projection.rs crates/rustok-search/src/forum_document_filters.rs .github/workflows/cache-redis-status.yml
          git commit -m "fix(search): keep Forum filter projection diff minimal"
          git push origin HEAD:${{ github.head_ref }}
