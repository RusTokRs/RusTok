name: Cache Redis status

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  pull_request:
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-redis-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.head_ref != 'agent/storefront-search-trusted-channel-23b2e1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cache-redis-status
      - name: Format
        run: cargo fmt --all --check
      - name: Compile
        run: |
          cargo check -p rustok-cache --lib
          cargo check -p rustok-server --lib
      - name: Redis status tests
        run: |
          cargo test -p rustok-cache redis_status --lib
          cargo test -p rustok-server --test cache_redis_status_architecture_guard --test cache_redis_monitor_architecture_guard
      - name: Clippy
        run: |
          cargo clippy -p rustok-cache --lib -- -D warnings
          cargo clippy -p rustok-server --lib -- -D warnings

  agent-storefront-search-channel:
    if: github.head_ref == 'agent/storefront-search-trusted-channel-23b2e1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Correct deterministic patch target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path("scripts/agent/patch-storefront-search-channel-23b2e1.py")
          text = target.read_text()
          helper_old = '''    count = after.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement after anchor, found {count}\\n{old}"
                  )
              target.write_text(before + after.replace(old, new, 1))'''
          helper_new = '''    if old not in after:
                  raise SystemExit(f"{path}: replacement missing after anchor\\n{old}")
              target.write_text(before + after.replace(old, new, 1))'''
          call_old = '''replace_once(
              "crates/rustok-search/storefront/src/transport/native_server_adapter.rs",
              "        use rustok_api::{HostRuntimeContext, TenantContext};\\n",
              "        use rustok_api::{HostRuntimeContext, RequestContext, TenantContext};\\n",
          )'''
          call_new = '''replace_after(
              "crates/rustok-search/storefront/src/transport/native_server_adapter.rs",
              "async fn storefront_search_native(\\n",
              "        use rustok_api::{HostRuntimeContext, TenantContext};\\n",
              "        use rustok_api::{HostRuntimeContext, RequestContext, TenantContext};\\n",
          )'''
          if text.count(helper_old) != 1:
              raise SystemExit("replace_after helper drifted")
          if text.count(call_old) != 1:
              raise SystemExit("native RequestContext patch target drifted")
          target.write_text(text.replace(helper_old, helper_new, 1).replace(call_old, call_new, 1))
          PY
      - name: Apply deterministic trusted channel patch
        run: python3 scripts/agent/patch-storefront-search-channel-23b2e1.py
      - name: Commit patch and remove temporary agent files
        run: |
          git checkout origin/main -- .github/workflows/cache-redis-status.yml
          rm scripts/agent/patch-storefront-search-channel-23b2e1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rustok-search crates/rustok-forum scripts/verify .github/workflows/cache-redis-status.yml scripts/agent
          git commit -m "feat(search): trust storefront channel context"
          git push origin HEAD:${{ github.head_ref }}
