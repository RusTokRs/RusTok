name: Cache Redis status

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  pull_request:
    paths:
      - "crates/rustok-cache/src/redis_status.rs"
      - "crates/rustok-cache/Cargo.toml"
      - "crates/rustok-telemetry/src/lib.rs"
      - "apps/server/src/services/cache_redis_status_monitor.rs"
      - "apps/server/src/services/event_transport_factory.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/cache_redis_status_architecture_guard.rs"
      - "apps/server/tests/cache_redis_monitor_architecture_guard.rs"
      - ".github/workflows/cache-redis-status.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-redis-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.head_ref != 'agent/storefront-search-product-channel-23b2e2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cache-redis-status
      - name: Format
        run: cargo fmt --all --check
      - name: Compile
        run: |
          cargo check -p rustok-cache --lib
          cargo check -p rustok-server --lib
      - name: Redis status tests
        run: |
          cargo test -p rustok-cache redis_status --lib
          cargo test -p rustok-server --test cache_redis_status_architecture_guard --test cache_redis_monitor_architecture_guard
      - name: Clippy
        run: |
          cargo clippy -p rustok-cache --lib -- -D warnings
          cargo clippy -p rustok-server --lib -- -D warnings

  agent-storefront-search-product-channel-reconciliation:
    if: github.head_ref == 'agent/storefront-search-product-channel-23b2e2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Correct reconciliation staging count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path("scripts/agent/patch-storefront-search-product-channel-reconciliation-23b2e2.py")
          text = target.read_text()
          old = '''replace_all(
              projector,
              "PRODUCT_CHANNEL_VISIBILITY_DRIFT_COUNT_SQL",
              "PRODUCT_CHANNEL_VISIBILITY_LEGACY_COUNT_SQL",
              3,
          )'''
          new = '''replace_all(
              projector,
              "PRODUCT_CHANNEL_VISIBILITY_DRIFT_COUNT_SQL",
              "PRODUCT_CHANNEL_VISIBILITY_LEGACY_COUNT_SQL",
              6,
          )'''
          if text.count(old) != 1:
              raise SystemExit("Product channel reconciliation count target drifted")
          target.write_text(text.replace(old, new, 1))
          PY
      - name: Wire bounded startup reconciliation
        run: python3 scripts/agent/patch-storefront-search-product-channel-reconciliation-23b2e2.py
      - name: Format changed Rust files only
        run: |
          rustfmt --edition 2024 \
            crates/rustok-search/src/product_channel_reconciliation.rs \
            crates/rustok-search/src/projector.rs \
            apps/server/src/services/search_product_channel_reconciliation.rs \
            apps/server/src/services/server_bootstrap.rs
      - name: Commit reconciliation and remove temporary files
        run: |
          git checkout origin/main -- .github/workflows/cache-redis-status.yml
          rm scripts/agent/patch-storefront-search-product-channel-reconciliation-23b2e2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server crates/rustok-search crates/rustok-forum scripts/verify .github/workflows/cache-redis-status.yml scripts/agent
          git commit -m "feat(search): reconcile legacy Product channel projections"
          git push origin HEAD:${{ github.head_ref }}
