name: Blog Taxonomy Category Translation Docs

on:
  pull_request:
    paths:
      - "docs/modules/translation-implementation-plan.md"
      - "docs/modules/translation-surfaces.json"
      - "crates/modules/rustok-translation/docs/README.md"
      - "crates/modules/rustok-translation/docs/implementation-plan.md"
      - "crates/modules/rustok-blog/docs/implementation-plan-current.md"
      - "crates/modules/rustok-taxonomy/src/translation_target.rs"
      - "scripts/verify/verify-blog-taxonomy-category-translation-docs.mjs"
      - ".github/workflows/blog-taxonomy-category-translation-docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/modules/translation-implementation-plan.md"
      - "docs/modules/translation-surfaces.json"
      - "crates/modules/rustok-translation/docs/README.md"
      - "crates/modules/rustok-translation/docs/implementation-plan.md"
      - "crates/modules/rustok-blog/docs/implementation-plan-current.md"
      - "crates/modules/rustok-taxonomy/src/translation_target.rs"
      - "scripts/verify/verify-blog-taxonomy-category-translation-docs.mjs"
      - ".github/workflows/blog-taxonomy-category-translation-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  translation-owner-docs-contract:
    name: Blog Category Translation owner docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify Blog Category canonical Translation owner
        run: node scripts/verify/verify-blog-taxonomy-category-translation-docs.mjs
