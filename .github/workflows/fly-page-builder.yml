name: Fly Page Builder

on:
  push:
    branches: [main]
    paths:
      - "crates/ui/fly/**"
      - "crates/modules/rustok-page-builder/**"
      - "crates/modules/rustok-page-builder-storefront/**"
      - "crates/modules/rustok-pages/**"
      - "apps/admin/src/main.rs"
      - "apps/admin/src/app/shell.rs"
      - "apps/admin/Cargo.toml"
      - "apps/next-admin/packages/blog/**"
      - "apps/next-admin/src/app/dashboard/blog/**"
      - "scripts/verify/verify-fly-*.mjs"
      - "scripts/verify/verify-pages-current-only.mjs"
      - ".github/workflows/fly-page-builder.yml"
  pull_request:
    paths:
      - "crates/ui/fly/**"
      - "crates/modules/rustok-page-builder/**"
      - "crates/modules/rustok-page-builder-storefront/**"
      - "crates/modules/rustok-pages/**"
      - "apps/admin/src/main.rs"
      - "apps/admin/src/app/shell.rs"
      - "apps/admin/Cargo.toml"
      - "apps/next-admin/packages/blog/**"
      - "apps/next-admin/src/app/dashboard/blog/**"
      - "scripts/verify/verify-fly-*.mjs"
      - "scripts/verify/verify-pages-current-only.mjs"
      - ".github/workflows/fly-page-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  format:
    name: Focused formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - name: Check focused formatting
        run: >-
          cargo fmt
          -p fly
          -p fly-ui
          -p fly-web
          -p fly-browser
          -p fly-leptos
          -p fly-dioxus
          -p rustok-page-builder-admin
          -p rustok-pages
          -p rustok-pages-admin
          -p rustok-pages-storefront
          -p rustok-admin
          -- --check

  verify:
    name: Focused tests and source guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: fly-page-builder
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Run Fly core tests
        run: cargo test -p fly --all-targets

      # `--lib` used to be passed here, which silently skipped every integration test under
      # `crates/ui/fly/browser/tests/` - eight adapter contract suites that never ran in CI.
      - name: Run Fly browser contract tests
        if: ${{ !cancelled() }}
        run: cargo test -p fly-browser --all-targets

      - name: Run Fly UI and web runtime tests
        if: ${{ !cancelled() }}
        run: cargo test -p fly-ui -p fly-web --all-targets

      - name: Check Fly framework adapters
        if: ${{ !cancelled() }}
        run: cargo check -p fly-leptos -p fly-dioxus --all-targets

      - name: Run Page Builder admin unit tests
        if: ${{ !cancelled() }}
        run: cargo test -p rustok-page-builder-admin --lib

      - name: Run Pages domain unit tests
        if: ${{ !cancelled() }}
        run: cargo test -p rustok-pages --lib

      - name: Run Pages integration unit tests
        if: ${{ !cancelled() }}
        run: cargo test -p rustok-pages-admin --lib

      - name: Check Pages storefront
        if: ${{ !cancelled() }}
        run: cargo check -p rustok-pages-storefront --lib

      - name: Check Page Builder storefront
        if: ${{ !cancelled() }}
        run: cargo check -p rustok-page-builder-storefront --lib

      - name: Check admin SSR Page Builder endpoint
        if: ${{ !cancelled() }}
        run: cargo check -p rustok-admin --bin rustok-admin --no-default-features --features ssr

      - name: Lint Fly
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy
          -p fly
          -p fly-ui
          -p fly-web
          -p fly-leptos
          -p fly-dioxus
          --all-targets -- -D warnings

      - name: Lint Fly browser and Page Builder integrations
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy
          -p fly-browser
          -p rustok-page-builder-admin
          -p rustok-pages
          -p rustok-pages-admin
          -p rustok-pages-storefront
          --lib -- -D warnings

      # The wasm-only code behind `cfg(target_arch = "wasm32")` compiled in no CI job before this.
      - name: Check Fly browser runtime on wasm32
        if: ${{ !cancelled() }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown -p fly-web --features wasm-client
          cargo check --target wasm32-unknown-unknown -p fly-leptos --features wasm-client

      - name: Verify Fly admin runtime
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-admin-runtime.mjs

      - name: Verify Fly admin browser runtime
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-admin-browser-runtime.mjs

      - name: Verify Fly command transactions
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-command-transactions.mjs

      - name: Verify Fly snapshots
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-snapshots.mjs

      - name: Verify Fly interaction capabilities
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-interaction-capabilities.mjs

      - name: Verify Fly multilingual runtime
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-multilingual.mjs

      - name: Verify every Fly gate is wired into CI
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-gates-are-wired.mjs

      - name: Verify Fly standalone workspace template
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-standalone-workspace.mjs

      - name: Verify Fly dependency boundaries
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-dependency-boundaries.mjs

      - name: Verify current-only Pages runtime
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-pages-current-only.mjs

      - name: Verify SSR-first architecture
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-ssr-first.mjs

      - name: Verify Fly contribution access
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-ui-contributions.mjs

      - name: Verify landing readiness wiring
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-landing-readiness.mjs

      - name: Verify internal links end to end
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-internal-links.mjs

      - name: Verify actions forms and fields end to end
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-actions-forms.mjs

      - name: Verify SSR assets end to end
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-ssr-assets.mjs

      - name: Verify editor capability policy
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-ui-capability-policy.mjs

      - name: Verify capability denial response
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-capability-denial-response.mjs
