name: Fly Page Builder

on:
  push:
    branches: [main]
    paths:
      - "crates/ui/fly/**"
      - "crates/modules/rustok-page-builder/**"
      - "crates/modules/rustok-page-builder-storefront/**"
      - "crates/modules/rustok-pages/**"
      - "apps/admin/src/main.rs"
      - "apps/admin/src/app/shell.rs"
      - "apps/admin/Cargo.toml"
      - "apps/next-admin/packages/blog/**"
      - "apps/next-admin/src/app/dashboard/blog/**"
      - "scripts/verify/verify-fly-*.mjs"
      - "scripts/verify/verify-pages-current-only.mjs"
      - ".github/workflows/fly-page-builder.yml"
      - "docs/modules/pages-page-builder-parity-continuation-plan.md"
      - "docs/modules/page-builder-parity-actualization-2026-08-06-inline-edit.md"
      - "docs/modules/pages-page-builder-authenticated-inline-edit-adapter-packet-2026-08-06.md"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-authenticated-inline-edit-adapter.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-runtime-context.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-consumer-readiness.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-admin-provider-status.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-provider-health-deployment-metrics.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-provider-health-runtime-observation.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-scenario-release.mjs"
      - "crates/modules/rustok-pages/scripts/verify/verify-pages-builder-provider-health-consumer-binding.mjs"
  pull_request:
    paths:
      - "crates/ui/fly/**"
      - "crates/modules/rustok-page-builder/**"
      - "crates/modules/rustok-page-builder-storefront/**"
      - "crates/modules/rustok-pages/**"
      - "apps/admin/src/main.rs"
      - "apps/admin/src/app/shell.rs"
      - "apps/admin/Cargo.toml"
      - "apps/next-admin/packages/blog/**"
      - "apps/next-admin/src/app/dashboard/blog/**"
      - "scripts/verify/verify-fly-*.mjs"
      - "scripts/verify/verify-pages-current-only.mjs"
      - ".github/workflows/fly-page-builder.yml"
      - "docs/modules/pages-page-builder-parity-continuation-plan.md"
      - "docs/modules/page-builder-parity-actualization-2026-08-06-inline-edit.md"
      - "docs/modules/pages-page-builder-authenticated-inline-edit-adapter-packet-2026-08-06.md"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-authenticated-inline-edit-adapter.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-runtime-context.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-consumer-readiness.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-admin-provider-status.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-provider-health-deployment-metrics.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-provider-health-runtime-observation.mjs"
      - "crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-scenario-release.mjs"
      - "crates/modules/rustok-pages/scripts/verify/verify-pages-builder-provider-health-consumer-binding.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  format:
    name: Focused formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Check focused formatting
        run: >-
          cargo fmt
          -p fly
          -p fly-ui
          -p fly-web
          -p fly-browser
          -p fly-leptos
          -p fly-dioxus
          -p rustok-page-builder-admin
          -p rustok-pages
          -p rustok-pages-admin
          -p rustok-pages-storefront
          -p rustok-admin
          -- --check

  verify:
    name: Focused tests and source guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: fly-page-builder
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Run Fly core tests
        run: cargo test -p fly --all-targets

      # `--lib` used to be passed here, which silently skipped every integration test under
      # `crates/ui/fly/browser/tests/` - eight adapter contract suites that never ran in CI.
      - name: Run Fly browser contract tests
        if: ${{ !cancelled() }}
        run: cargo test -p fly-browser --all-targets

      - name: Run Fly UI and web runtime tests
        if: ${{ !cancelled() }}
        run: cargo test -p fly-ui -p fly-web --all-targets

      - name: Check Fly framework adapters
        if: ${{ !cancelled() }}
        run: cargo check -p fly-leptos -p fly-dioxus --all-targets

      # The adapters' non-default features built in no job before this. `fly-leptos` defaults to
      # `ssr` and `fly-dioxus` to no renderer at all, so the combinations below — the ones actually
      # shipped — were never compiled by CI.
      # The standalone extraction path. `fly` builds without `rustok-ui-i18n` only in this
      # configuration, so without a job for it the self-contained locale resolver would rot
      # exactly like the verification gates that no workflow ran.
      - name: Check Fly without the platform i18n dependency
        if: ${{ !cancelled() }}
        run: |
          cargo check -p fly --no-default-features --all-targets
          cargo test -p fly --no-default-features --lib

      - name: Check Fly adapter feature combinations
        if: ${{ !cancelled() }}
        run: |
          # `fly-dioxus --features desktop` resolves wry/tao, whose `*-sys` crates read pkg-config
          # metadata for GTK and WebKit. None of that is on a bare runner, so the check died in
          # `glib-sys`' build script with "Package glib-2.0 was not found in the pkg-config search
          # path" — after the toolchain step started working, a red X that had nothing to do with
          # the adapter. Only headers and `.pc` files are needed here: the job type-checks, it does
          # not link or run a window.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          cargo check -p fly-dioxus --features desktop
          cargo check -p fly-leptos --no-default-features
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown -p fly-dioxus --features web
          cargo check --target wasm32-unknown-unknown -p fly-leptos --no-default-features --features wasm-client

      - name: Run Page Builder admin unit tests
        if: ${{ !cancelled() }}
        run: cargo test -p rustok-page-builder-admin --lib

      - name: Run Pages domain unit tests
        if: ${{ !cancelled() }}
        run: cargo test -p rustok-pages --lib

      - name: Run Pages integration unit tests
        if: ${{ !cancelled() }}
        run: cargo test -p rustok-pages-admin --lib

      - name: Check Pages storefront
        if: ${{ !cancelled() }}
        run: cargo check -p rustok-pages-storefront --lib

      - name: Check Page Builder storefront
        if: ${{ !cancelled() }}
        run: cargo check -p rustok-page-builder-storefront --lib

      - name: Check admin SSR Page Builder endpoint
        if: ${{ !cancelled() }}
        run: cargo check -p rustok-admin --bin rustok-admin --no-default-features --features ssr

      - name: Lint Fly
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy
          -p fly
          -p fly-ui
          -p fly-web
          -p fly-leptos
          -p fly-dioxus
          --all-targets -- -D warnings

      - name: Lint Fly browser and Page Builder integrations
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy
          -p fly-browser
          -p rustok-page-builder-admin
          -p rustok-pages
          -p rustok-pages-admin
          -p rustok-pages-storefront
          --lib -- -D warnings

      # The wasm-only code behind `cfg(target_arch = "wasm32")` compiled in no CI job before this.
      - name: Check Fly browser runtime on wasm32
        if: ${{ !cancelled() }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown -p fly-web --features wasm-client
          cargo check --target wasm32-unknown-unknown -p fly-leptos --features wasm-client

      # The 1353-line browser asset shipped with no syntax gate at all. Note the spelling:
      # `node --check` on this path is a no-op, because the file is `.js` but uses `export`, so
      # Node detects an ES module and `--check` then reports nothing whatever the file contains.
      - name: Check Fly browser asset syntax
        if: ${{ !cancelled() }}
        run: node --input-type=module --check < crates/ui/fly/browser/assets/fly-browser.js

      - name: Verify Fly admin runtime
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-admin-runtime.mjs

      - name: Verify Fly admin browser runtime
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-admin-browser-runtime.mjs

      - name: Verify Fly command transactions
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-command-transactions.mjs

      - name: Verify Fly snapshots
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-snapshots.mjs

      - name: Verify Fly interaction capabilities
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-interaction-capabilities.mjs

      - name: Verify Fly multilingual runtime
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-multilingual.mjs

      # The authenticated inline-edit adapter slice kept its own verifier, but nothing ran it, so
      # its pins rotted: two doc phrases had been reworded and the authorization pin had been
      # written against a method chain rustfmt never produces. Run it where its files change.
      - name: Verify authenticated inline-edit adapter contract
        if: ${{ !cancelled() }}
        run: node crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-authenticated-inline-edit-adapter.mjs

      # The runtime context contract gained its compatibility and migration halves in the same
      # slice; the verifier pins those APIs and the pipeline stage order, so run it here too.
      - name: Verify runtime context compatibility and migration APIs
        if: ${{ !cancelled() }}
        run: node crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-runtime-context.mjs

      # These crate-local gates were written alongside the provider-status and
      # provider-health slices but no workflow ran them, so they drifted out of
      # the code they describe. Run each where its files live.
      - name: Verify admin provider status contract
        if: ${{ !cancelled() }}
        run: node crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-admin-provider-status.mjs

      - name: Verify provider health deployment metrics source
        if: ${{ !cancelled() }}
        run: node crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-provider-health-deployment-metrics.mjs

      - name: Verify provider health runtime observation source
        if: ${{ !cancelled() }}
        run: node crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-provider-health-runtime-observation.mjs

      - name: Verify scenario release gate wiring
        if: ${{ !cancelled() }}
        run: node crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-scenario-release.mjs

      - name: Verify Pages provider-health consumer binding
        if: ${{ !cancelled() }}
        run: node crates/modules/rustok-pages/scripts/verify/verify-pages-builder-provider-health-consumer-binding.mjs

      # The readiness gate is parameterised by consumer module; run both supported consumers.
      - name: Verify Page Builder consumer readiness (pages)
        if: ${{ !cancelled() }}
        run: node crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-consumer-readiness.mjs pages

      - name: Verify Page Builder consumer readiness (forum)
        if: ${{ !cancelled() }}
        run: node crates/modules/rustok-page-builder/scripts/verify/verify-page-builder-consumer-readiness.mjs forum

      - name: Verify every Fly gate is wired into CI
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-gates-are-wired.mjs

      - name: Verify Fly standalone workspace template
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-standalone-workspace.mjs

      - name: Verify Fly dependency boundaries
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-dependency-boundaries.mjs

      - name: Verify current-only Pages runtime
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-pages-current-only.mjs

      - name: Verify SSR-first architecture
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-ssr-first.mjs

      - name: Verify Fly contribution access
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-ui-contributions.mjs

      - name: Verify landing readiness wiring
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-landing-readiness.mjs

      - name: Verify internal links end to end
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-internal-links.mjs

      - name: Verify actions forms and fields end to end
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-actions-forms.mjs

      - name: Verify SSR assets end to end
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-ssr-assets.mjs

      - name: Verify editor capability policy
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-ui-capability-policy.mjs

      - name: Verify capability denial response
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-fly-capability-denial-response.mjs

  advisories:
    name: Dependency advisories (advisory only)
    runs-on: ubuntu-latest
    # Non-blocking on purpose: the repository already carries a backlog of advisories on the
    # default branch, so gating here would turn every Fly change red for unrelated reasons. The
    # job exists so that a *newly introduced* advisory is visible in the PR instead of invisible.
    # Flip `continue-on-error` to false once `cargo audit` is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit --deny warnings
