name: Forum Remediation Oracle (temporary)

# Temporary compile/test oracle for the forum logic-review remediation PR.
# Converts cargo diagnostics into check annotations so results are readable
# without job-log access. Delete this file once the PR is verified.

on:
  pull_request:
    paths:
      - ".github/workflows/forum-remediation-oracle.yml"
      - "crates/modules/rustok-forum/**"
  push:
    branches:
      - "arena/fa9dd997-rustok"
    paths:
      - ".github/workflows/forum-remediation-oracle.yml"
      - "crates/modules/rustok-forum/**"

permissions:
  contents: read

jobs:
  oracle:
    name: Forum oracle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: rustfmt (forum crate only)
        run: |
          cargo fmt -p rustok-forum -- --check > /tmp/fmt.out 2>&1 || true
          python3 - << 'PYEOF'
          import os, re
          seen = []
          for raw in open('/tmp/fmt.out'):
              m = re.match(r'Diff in (.+?) at line (\d+):', raw)
              if m:
                  path = os.path.relpath(m.group(1), os.environ['GITHUB_WORKSPACE'])
                  if path not in [p for p, _ in seen]:
                      seen.append((path, m.group(2)))
          for path, line in seen[:45]:
              print(f'::warning file={path},line={line}::rustfmt diff starts here')
          print(f'::notice::fmt diff files: {len(seen)}')
          PYEOF
      - name: cargo check (forum crate, all targets)
        run: |
          set -o pipefail
          cargo check -p rustok-forum --all-targets --message-format=json 2>/dev/null | python3 -c "
          import json, sys
          emitted = 0
          errors = 0
          for raw in sys.stdin:
              try:
                  payload = json.loads(raw)
              except Exception:
                  continue
              if payload.get('reason') != 'compiler-message':
                  continue
              msg = payload.get('message') or {}
              level = msg.get('level')
              if level not in ('error', 'warning'):
                  continue
              if level == 'error':
                  errors += 1
              if emitted >= 50:
                  continue
              spans = msg.get('spans') or []
              primary = next((s for s in spans if s.get('is_primary')), spans[0] if spans else {})
              text = (msg.get('message') or '').replace('%', '%25').replace('\\n', ' ').replace('\\r', ' ')
              code = (msg.get('code') or {}).get('code') or level
              fname = primary.get('file_name', 'crates/modules/rustok-forum')
              line = primary.get('line_start', 1)
              col = primary.get('column_start', 1)
              kind = 'error' if level == 'error' else 'warning'
              print(f'::{kind} file={fname},line={line},col={col}::{code}: {text}')
              emitted += 1
          print(f'::notice::cargo check errors: {errors}')
          sys.exit(1 if errors else 0)
          "
      - name: clippy (forum crate)
        run: |
          set -o pipefail
          cargo clippy -p rustok-forum --all-targets --message-format=json 2>/dev/null | python3 -c "
          import json, sys
          emitted = 0
          lints = 0
          for raw in sys.stdin:
              try:
                  payload = json.loads(raw)
              except Exception:
                  continue
              if payload.get('reason') != 'compiler-message':
                  continue
              msg = payload.get('message') or {}
              if msg.get('level') != 'warning':
                  continue
              lints += 1
              if emitted >= 50:
                  continue
              spans = msg.get('spans') or []
              primary = next((s for s in spans if s.get('is_primary')), spans[0] if spans else {})
              text = (msg.get('message') or '').replace('%', '%25').replace('\n', ' ')
              code = (msg.get('code') or {}).get('code') or 'clippy'
              fname = primary.get('file_name', 'crates/modules/rustok-forum')
              line = primary.get('line_start', 1)
              col = primary.get('column_start', 1)
              print(f'::warning file={fname},line={line},col={col}::{code}: {text}')
              emitted += 1
          print(f'::notice::clippy warnings: {lints}')
          "
      - name: remediation-relevant forum test suites
        run: |
          set +e
          export CARGO_BUILD_JOBS=2 CARGO_TERM_COLOR=never
          cargo test -p rustok-forum \
            --test logic_review_remediation_sqlite \
            --test subscription_levels_sqlite \
            --test subscription_levels_contract \
            --test moderation_semantics_sqlite \
            --test reply_create_audience_enforcement_sqlite \
            --test solutions \
            > /tmp/tests.out 2>&1
          s1=$?
          echo "batch1 exit: $s1" >> /tmp/tests.out
          df -h / /tmp >> /tmp/tests.out 2>&1
          free -m >> /tmp/tests.out 2>&1
          cargo test -p rustok-forum \
            --test subscription_reconciliation_sqlite \
            --test subscriptions \
            --test moderation_audience_policy_sqlite \
            --test moderation_report_sqlite \
            --test reply_update_window \
            --test reply_position_integrity_sqlite \
            --test solution_reconciliation_sqlite \
            --test counter_reconciliation_sqlite \
            --test graphql_stats_and_vote_tenant_scope_sqlite \
            --test topic_bulk_read_state_sqlite \
            --test read_state_transport_contract \
            --test storefront_read_state_sqlite \
            --test notification_recipient_topic_subscription_audience_sqlite \
            >> /tmp/tests.out 2>&1
          s2=$?
          echo "batch2 exit: $s2" >> /tmp/tests.out
          status=0
          if [ "$s1" != "0" ] || [ "$s2" != "0" ]; then status=1; fi
          python3 - << 'PYEOF'
          lines = open('/tmp/tests.out', errors='replace').read().splitlines()
          results = [l for l in lines if l.startswith('test result:')]
          failed = [l for l in lines if 'FAILED' in l or 'panicked at' in l]
          exits = [l for l in lines if 'batch' in l and 'exit:' in l]
          print(f'::notice::test binaries finished: {len(results)}; {exits}; result lines: {results[:19]}')
          for line in failed[:20]:
              print('::error::' + line.replace('%', '%25')[:280])
          if not results:
              for line in lines[-25:]:
                  print('::error::tail: ' + line.replace('%', '%25')[:280])
          PYEOF
          exit $status
