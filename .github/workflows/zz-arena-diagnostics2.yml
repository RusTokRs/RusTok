name: ZZ Arena Diagnostics 2 (temporary)

# Temporary scaffolding for PR #4647: replicates the repo's own PR checks
# that fail on this branch and republishes their output as check-run text
# (the authoring sandbox cannot download Actions logs). Delete before merge.

on:
  push:
    branches:
      - arena/b606e380-rustok
    paths:
      - .github/workflows/zz-arena-diagnostics2.yml
      - .arena-diag-trigger

permissions:
  contents: read
  checks: write

concurrency:
  group: zz-arena-diagnostics2-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  SQLX_OFFLINE: "true"

jobs:
  lock-fmt-xtask:
    name: Lock, fmt, platform contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: arena-diag2-lock-fmt-xtask
      - name: Run replicated checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEADSHA: ${{ github.sha }}
          JOBNAME: lock-fmt-xtask
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          STEPS = [
            ("cargo metadata --locked", "cargo metadata --locked --format-version 1 > /tmp/meta.json && echo LOCK_OK", None, {}),
            ("cargo fmt -p rustok-modules (apply) + patch",
             "cargo fmt -p rustok-modules && git diff --stat -- ':!Cargo.lock' && git diff -- ':!Cargo.lock' > fmt.patch && wc -l fmt.patch && cargo fmt -p rustok-modules -- --check && echo FMT_CLEAN", None, {}),
            ("cargo xtask validate-manifest", "cargo xtask validate-manifest", None, {}),
            ("cargo xtask module validate", "cargo xtask module validate", None, {}),
          ]
          results = []
          for name, cmd, cwd, extra in STEPS:
              env = dict(os.environ); env.update(extra)
              p = subprocess.run(["bash", "-lc", cmd], cwd=cwd, env=env, capture_output=True, text=True)
              results.append((name, p.returncode, (p.stdout or "") + (p.stderr or "")))
          summary = "; ".join(f"{n}: rc={rc}" for n, rc, _ in results)
          def render(rows):
              t = summary + "\n"
              for n, rc, out in rows:
                  t += f"\n===== {n} rc={rc} =====\n" + "\n".join(out.splitlines()[-150:]) + "\n"
              return t
          text = render(results)
          if len(text) > 60000:
              text = render([r for r in results if r[1] != 0] or results)
          if len(text) > 60000:
              text = text[:60000] + "\n... [truncated]"
          payload = {"name": f"Arena diagnostics2: {os.environ['JOBNAME']}", "head_sha": os.environ["HEADSHA"],
                     "status": "completed", "conclusion": "neutral",
                     "output": {"title": os.environ["JOBNAME"], "summary": summary[:900], "text": text}}
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/check-runs",
              data=json.dumps(payload).encode(),
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(req) as resp:
                  print("posted", resp.status)
          except Exception as e:
              print("FAILED to post digest:", e)
          import base64
          try:
              patch_bytes = open("fmt.patch", "rb").read()
          except FileNotFoundError:
              patch_bytes = b""
          if patch_bytes:
              b64 = base64.b64encode(patch_bytes).decode()
              chunks = [b64[i:i+50000] for i in range(0, len(b64), 50000)]
              for i, chunk in enumerate(chunks):
                  p2 = {"name": f"Arena diagnostics2: fmt-patch {i+1}/{len(chunks)}",
                        "head_sha": os.environ["HEADSHA"], "status": "completed",
                        "conclusion": "neutral",
                        "output": {"title": f"fmt.patch base64 chunk {i+1} of {len(chunks)}",
                                   "summary": f"fmt.patch {len(patch_bytes)} bytes, chunk {i+1}/{len(chunks)}",
                                   "text": chunk}}
                  req2 = urllib.request.Request(
                      f"https://api.github.com/repos/{os.environ['REPO']}/check-runs",
                      data=json.dumps(p2).encode(),
                      headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                               "Accept": "application/vnd.github+json",
                               "Content-Type": "application/json"}, method="POST")
                  try:
                      with urllib.request.urlopen(req2) as resp:
                          print("posted chunk", i + 1, resp.status)
                  except Exception as e:
                      print("FAILED chunk", i + 1, e)
          print(summary)
          PY
      - name: Upload lock and fmt patches
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arena-diag2-patches-${{ github.run_id }}
          path: |
            lock.patch
            fmt.patch
          if-no-files-found: warn
          retention-days: 7

