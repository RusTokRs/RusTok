name: Pages Published Metadata Browser Source Check

on:
  push:
    branches:
      - agent/pages-published-metadata-browser-evidence-20260813
    paths:
      - ".github/workflows/pages-published-metadata-browser-source-check.yml"

permissions:
  contents: write

concurrency:
  group: pages-published-metadata-browser-source-check
  cancel-in-progress: true

jobs:
  source-check:
    name: Verify published metadata browser evidence source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Actualize metadata source guards to current owner boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          stable_plan_markers = [
              "`source-ready` means code, contracts, build source or retained harness source exists.",
              "Pages and Page Builder remain one vertical pipeline with explicit owners:",
              "Pages owns persistence, lifecycle, immutable bindings",
              "Pages admin owns the optional same-origin authoring launch control",
              "Page Builder/Fly owns the reviewed document, sanitizer, runtime materialization",
              "No build, workflow, Docker, HTTP or browser execution is claimed by source inspection.",
          ]

          def replace_plan_block(text, first_old_marker, require_call):
              start_token = "for (const marker of [\n  " + json.dumps(first_old_marker) + ","
              start = text.index(start_token)
              end_token = "]) {\n  " + require_call + "\n}"
              end = text.index(end_token, start) + len(end_token)
              marker_lines = "\n".join(f"  {json.dumps(marker)}," for marker in stable_plan_markers)
              replacement = "for (const marker of [\n" + marker_lines + "\n]) {\n  " + require_call + "\n}"
              return text[:start] + replacement + text[end:]

          properties = Path("crates/rustok-pages/scripts/verify/verify-pages-metadata-properties.mjs")
          text = properties.read_text(encoding="utf-8")
          replacements = {
              '  "ContributionDescriptor {",\n':
                  '  "ContributionDescriptor {\\n        id:",\n  "ContributionDescriptor { id:",\n',
              '  "ModuleContributionManifest {",\n':
                  '  "ModuleContributionManifest {\\n        admin:",\n  "ModuleContributionManifest { admin:",\n',
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f"metadata-properties guard pre-state drifted: {before.strip()}")
              text = text.replace(before, after, 1)
          old_request = '"let request = MetadataPatchRequest {"'
          new_request = '"let request = PageMetadataPatch {"'
          if text.count(old_request) != 2 or new_request in text:
              raise SystemExit("metadata-properties request marker pre-state drifted")
          text = text.replace(old_request, new_request)
          text = replace_plan_block(
              text,
              "Registered metadata surfaces: source-complete",
              'requireMarker(parityPlan, marker, "Pages/Page Builder parity continuation plan");',
          )
          properties.write_text(text, encoding="utf-8")

          revision = Path("crates/rustok-pages/scripts/verify/verify-pages-metadata-revision-isolation.mjs")
          text = revision.read_text(encoding="utf-8")
          source_decl = 'const sourcePath = "crates/rustok-pages/admin/src/metadata_properties.rs";\n'
          model_decl = 'const modelPath = "crates/rustok-pages/admin/src/model.rs";\n'
          if text.count(source_decl) != 1 or model_decl in text:
              raise SystemExit("revision guard model source pre-state drifted")
          text = text.replace(source_decl, source_decl + model_decl, 1)

          source_read = 'const source = read(sourcePath);\n'
          model_read = 'const model = read(modelPath);\n'
          if text.count(source_read) != 1 or model_read in text:
              raise SystemExit("revision guard model read pre-state drifted")
          text = text.replace(source_read, source_read + model_read, 1)

          old_patch_block = '''const patchRequest = between(
            source,
            "struct MetadataPatchRequest {",
            "trait PagesMetadataTransport",
            "metadata-only patch request",
          );'''.replace("          ", "")
          new_patch_block = '''const patchRequestStart = model.indexOf("pub struct PageMetadataPatch {");
          const patchRequest = patchRequestStart < 0 ? "" : model.slice(patchRequestStart);'''.replace("          ", "")
          if text.count(old_patch_block) != 1 or new_patch_block in text:
              raise SystemExit("revision guard patch DTO pre-state drifted")
          text = text.replace(old_patch_block, new_patch_block, 1)

          old_trait = '"fn patch_metadata(&self, request: MetadataPatchRequest)"'
          new_trait = '"fn patch_metadata(&self, request: PageMetadataPatch)"'
          if text.count(old_trait) != 1 or new_trait in text:
              raise SystemExit("revision guard transport DTO pre-state drifted")
          text = text.replace(old_trait, new_trait, 1)

          for marker in [
              '  "request.expected_version",\n',
              '  "request.locale",\n',
              '  "request.title",\n',
              '  "request.slug",\n',
              '  "request.meta_title",\n',
              '  "request.meta_description",\n',
              '  "request.template",\n',
              '  "request.channel_slugs",\n',
          ]:
              if text.count(marker) != 1:
                  raise SystemExit(f"revision guard server transport marker pre-state drifted: {marker.strip()}")
              text = text.replace(marker, "", 1)

          old_save = '"let request = MetadataPatchRequest {"'
          new_save = '"let request = PageMetadataPatch {"'
          if text.count(old_save) != 1 or new_save in text:
              raise SystemExit("revision guard save marker pre-state drifted")
          text = text.replace(old_save, new_save, 1)
          text = replace_plan_block(
              text,
              "Metadata revision/isolation source packet: ready, unvalidated",
              'requireText(plan, marker, "Pages/Page Builder parity plan");',
          )
          revision.write_text(text, encoding="utf-8")

          published = Path("crates/rustok-pages/scripts/verify/verify-pages-published-metadata-surface.mjs")
          text = published.read_text(encoding="utf-8")
          text = replace_plan_block(
              text,
              "Registered metadata surfaces: source-complete",
              'requireText(parityPlan, marker, "parity continuation plan");',
          )
          published.write_text(text, encoding="utf-8")

          browser = Path("crates/rustok-pages/scripts/verify/verify-pages-published-metadata-browser-evidence-harness.mjs")
          text = browser.read_text(encoding="utf-8")
          text = replace_plan_block(
              text,
              "Their execution and the published browser packet remain open",
              'requireText(plan, marker, "parity continuation plan");',
          )
          browser.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Verify consumer properties source
        run: node crates/rustok-pages/scripts/verify/verify-pages-metadata-properties.mjs
      - name: Verify metadata revision isolation source
        run: node crates/rustok-pages/scripts/verify/verify-pages-metadata-revision-isolation.mjs
      - name: Verify published metadata surface source
        run: node crates/rustok-pages/scripts/verify/verify-pages-published-metadata-surface.mjs
      - name: Verify published metadata browser harness source
        run: node crates/rustok-pages/scripts/verify/verify-pages-published-metadata-browser-evidence-harness.mjs
      - name: Commit guard actualization and remove source-check workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/pages-published-metadata-browser-source-check.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/rustok-pages/scripts/verify/verify-pages-metadata-properties.mjs \
            crates/rustok-pages/scripts/verify/verify-pages-metadata-revision-isolation.mjs \
            crates/rustok-pages/scripts/verify/verify-pages-published-metadata-surface.mjs \
            crates/rustok-pages/scripts/verify/verify-pages-published-metadata-browser-evidence-harness.mjs
          git rm -- "$workflow"
          git commit \
            -m "test(pages): actualize metadata evidence source guards" \
            -m "Follow generated contribution runtime, owner-owned PageMetadataPatch DTO, and the current canonical source-ready/owner policy without weakening conflict-before-patch or Fly document isolation checks."
          git push origin HEAD:agent/pages-published-metadata-browser-evidence-20260813
