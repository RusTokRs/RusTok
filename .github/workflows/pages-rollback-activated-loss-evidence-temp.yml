name: Pages Rollback Activated Loss Recovery Evidence Temp

on:
  push:
    branches:
      - pages-rollback-activated-loss-evidence-20260814
    paths:
      - ".github/workflows/pages-rollback-activated-loss-evidence-temp.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/rustok-pages/**"
      - "crates/rustok-page-builder/contracts/page-builder-fba-registry.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-rollback-activated-loss-evidence-temp-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/rustok_pages_rollback_activated_loss_evidence
  RUSTOK_PAGES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rustok_pages_rollback_activated_loss_evidence

jobs:
  evidence:
    name: Rollback-activated loss recovery PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustok_pages_rollback_activated_loss_evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rustok_pages_rollback_activated_loss_evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages-rollback-activated-loss-evidence
      - name: Verify rollback-activated recovery source
        run: node crates/rustok-pages/scripts/verify/verify-pages-rollback-activated-artifact-loss-recovery.mjs
      - name: Execute rollback-activated recovery PostgreSQL evidence
        run: cargo test --locked -p rustok-pages --test artifact_loss_after_rollback_activation_recovery_postgres -- --nocapture
      - name: Check Pages targets
        run: cargo check --locked -p rustok-pages --all-targets
