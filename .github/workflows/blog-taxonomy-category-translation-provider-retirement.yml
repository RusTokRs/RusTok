name: Blog Taxonomy Category Translation Provider Retirement

on:
  pull_request:
    paths:
      - "crates/rustok-blog/src/lib.rs"
      - "crates/rustok-blog/src/services/mod.rs"
      - "crates/rustok-blog/src/translation_evidence.rs"
      - "crates/rustok-blog/src/translation_target.rs"
      - "crates/rustok-blog/src/translation_target_tests.rs"
      - "crates/rustok-blog/tests/category_translation_target_postgres_test.rs"
      - "crates/rustok-blog/tests/category_taxonomy_translation_provider_retirement.rs"
      - "crates/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs"
      - "scripts/verify/verify-blog-category-hierarchy-command.mjs"
      - "apps/server/src/services/module_event_dispatcher.rs"
      - ".github/workflows/blog-taxonomy-category-translation-provider-retirement.yml"
  push:
    branches:
      - main
    paths:
      - "crates/rustok-blog/src/lib.rs"
      - "crates/rustok-blog/src/services/mod.rs"
      - "crates/rustok-blog/src/translation_evidence.rs"
      - "crates/rustok-blog/src/translation_target.rs"
      - "crates/rustok-blog/src/translation_target_tests.rs"
      - "crates/rustok-blog/tests/category_translation_target_postgres_test.rs"
      - "crates/rustok-blog/tests/category_taxonomy_translation_provider_retirement.rs"
      - "crates/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs"
      - "scripts/verify/verify-blog-category-hierarchy-command.mjs"
      - "apps/server/src/services/module_event_dispatcher.rs"
      - ".github/workflows/blog-taxonomy-category-translation-provider-retirement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-taxonomy-category-translation-provider-retirement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  provider-retirement-contract:
    name: Blog Taxonomy Category Translation provider retirement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check scoped Rust formatting
        run: |
          rustfmt +1.96.0 --edition 2024 --check --config skip_children=true \
            crates/rustok-blog/src/lib.rs \
            crates/rustok-blog/src/services/mod.rs
          rustfmt +1.96.0 --edition 2024 --check \
            crates/rustok-blog/src/translation_evidence.rs \
            crates/rustok-blog/tests/category_taxonomy_translation_provider_retirement.rs \
            crates/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs
      - name: Verify hierarchy separation after provider retirement
        run: node scripts/verify/verify-blog-category-hierarchy-command.mjs
      - name: Run Category Translation provider retirement contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_translation_provider_retirement -- --nocapture
      - name: Re-run canonical Category mutation response contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_mutation_response_cutover -- --nocapture
      - name: Re-run Blog Taxonomy Category read cutover contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_read_cutover -- --nocapture
      - name: Compile Blog owner surface with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo +1.96.0 check --locked -p rustok-blog --lib
      - name: Compile server host composition
        run: cargo +1.96.0 check --locked -p rustok-server --no-default-features --features mod-blog
