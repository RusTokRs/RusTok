name: Settings Translation Target PostgreSQL Evidence

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "apps/server/**"
      - "crates/rustok-migrations/**"
      - "crates/rustok-modules/**"
      - "crates/rustok-modules-translation/**"
      - "crates/rustok-outbox/**"
      - "crates/rustok-translation-targets/**"
      - "docs/modules/translation-implementation-plan.md"
      - "docs/modules/translation-surfaces.json"
      - ".github/workflows/settings-translation-target-postgres.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "apps/server/**"
      - "crates/rustok-migrations/**"
      - "crates/rustok-modules/**"
      - "crates/rustok-modules-translation/**"
      - "crates/rustok-outbox/**"
      - "crates/rustok-translation-targets/**"
      - "docs/modules/translation-implementation-plan.md"
      - "docs/modules/translation-surfaces.json"
      - ".github/workflows/settings-translation-target-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-translation-target-postgres
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUSTOK_MIGRATION_SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  postgres-evidence:
    name: Settings translation PostgreSQL multi-replica/replay/cursor evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Require exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: settings-translation-target-postgres
      - name: Check focused PostgreSQL test formatting
        run: rustfmt +${RUST_TOOLCHAIN} --edition 2024 --check apps/server/tests/static_settings_translation_target_postgres.rs
      - name: Compile Settings PostgreSQL translation evidence
        run: cargo test --locked -p rustok-server --test static_settings_translation_target_postgres --no-default-features --features mod-translation --no-run
      - name: Execute Settings PostgreSQL translation evidence
        run: cargo test --locked -p rustok-server --test static_settings_translation_target_postgres --no-default-features --features mod-translation -- --ignored --nocapture
