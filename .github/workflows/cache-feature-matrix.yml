name: Cache feature matrix

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-cache/**"
      - "crates/rustok-core/**"
      - ".github/workflows/cache-feature-matrix.yml"
  pull_request:
    paths:
      - "crates/rustok-cache/**"
      - "crates/rustok-core/**"
      - ".github/workflows/cache-feature-matrix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-feature-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-only:
    if: github.head_ref != 'agent/blog-admin-richtext-guardrail-20260730'
    name: Memory-only cache contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cache-feature-matrix
      - name: Compile all targets without Redis
        run: cargo check -p rustok-cache --all-targets --no-default-features
      - name: Test without Redis
        run: cargo test -p rustok-cache --no-default-features
      - name: Clippy all targets without Redis
        run: cargo clippy -p rustok-cache --all-targets --no-default-features -- -D warnings

  blog-admin-richtext-guardrail:
    if: github.head_ref == 'agent/blog-admin-richtext-guardrail-20260730'
    name: Reconcile Blog admin richtext guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/blog-admin-richtext-guardrail-20260730
          fetch-depth: 0
      - name: Apply fail-closed source transform
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1))

          verifier = "scripts/verify/verify-blog-admin-boundary.mjs"
          test = "scripts/verify/verify-blog-admin-boundary.test.mjs"
          plan = "crates/rustok-blog/docs/implementation-plan.md"
          evidence_path = "crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json"

          replace_once(
              verifier,
              '''function readRepo(relativePath) {
            return readFileSync(repoPath(relativePath), "utf8");
          }

          function fail(message) {''',
