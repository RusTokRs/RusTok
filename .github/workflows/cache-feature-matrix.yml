name: Cache feature matrix

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-cache/**"
      - "crates/rustok-core/**"
      - ".github/workflows/cache-feature-matrix.yml"
  pull_request:
    paths:
      - "crates/rustok-cache/**"
      - "crates/rustok-core/**"
      - ".github/workflows/cache-feature-matrix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-feature-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-only:
    if: github.head_ref != 'agent/blog-fba-storefront-gate-20260730'
    name: Memory-only cache contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cache-feature-matrix
      - name: Compile all targets without Redis
        run: cargo check -p rustok-cache --all-targets --no-default-features
      - name: Test without Redis
        run: cargo test -p rustok-cache --no-default-features
      - name: Clippy all targets without Redis
        run: cargo clippy -p rustok-cache --all-targets --no-default-features -- -D warnings

  blog-fba-storefront-gate:
    if: github.head_ref == 'agent/blog-fba-storefront-gate-20260730'
    name: Lock Blog FBA storefront source gate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/blog-fba-storefront-gate-20260730
          fetch-depth: 0
      - name: Apply fail-closed source transform
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}: {old[:140]!r}")
              target.write_text(text.replace(old, new, 1))

          package_path = "package.json"
          registry_path = "crates/rustok-blog/contracts/blog-fba-registry.json"
          verifier_path = "scripts/verify/verify-blog-fba.mjs"
          plan_path = "crates/rustok-blog/docs/implementation-plan.md"

          replace_once(
              package_path,
              '"verify:blog:fba": "node scripts/verify/verify-blog-fba.mjs && npm run verify:blog:admin-boundary && npm run verify:blog:graphql-richtext-boundary && npm run verify:blog:richtext-offline-backfill && npm run verify:blog:forum-ui-ownership && node scripts/verify/verify-consumer-fba-runtime-order.mjs"',
              '"verify:blog:fba": "node scripts/verify/verify-blog-fba.mjs && npm run verify:blog:admin-boundary && npm run verify:blog:storefront-boundary && npm run verify:blog:graphql-richtext-boundary && npm run verify:blog:richtext-offline-backfill && npm run verify:blog:forum-ui-ownership && node scripts/verify/verify-consumer-fba-runtime-order.mjs"',
          )

          replace_once(registry_path, '"schema_version": 1,', '"schema_version": 2,')
          replace_once(
              registry_path,
              '''    "consumer_runtime_order_smoke_runner": "scripts/verify/verify-consumer-fba-runtime-order.mjs"
          },
          "event_projection": {''',
              '''    "consumer_runtime_order_smoke_runner": "scripts/verify/verify-consumer-fba-runtime-order.mjs"
          },
          "verification_chain": {
            "package_script": "verify:blog:fba",
            "steps": [
              "node scripts/verify/verify-blog-fba.mjs",
              "npm run verify:blog:admin-boundary",
              "npm run verify:blog:storefront-boundary",
              "npm run verify:blog:graphql-richtext-boundary",
              "npm run verify:blog:richtext-offline-backfill",
              "npm run verify:blog:forum-ui-ownership",
              "node scripts/verify/verify-consumer-fba-runtime-order.mjs"
            ],
            "source_gates": {
              "admin_boundary": {
                "verifier": "scripts/verify/verify-blog-admin-boundary.mjs",
                "evidence": "crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json"
              },
              "storefront_boundary": {
                "verifier": "scripts/verify/verify-blog-storefront-boundary.mjs",
                "evidence": "crates/rustok-blog/contracts/evidence/blog-storefront-richtext-view.json"
              },
              "graphql_richtext_boundary": {
                "verifier": "scripts/verify/verify-blog-graphql-richtext-boundary.mjs",
                "evidence": "crates/rustok-blog/contracts/evidence/blog-graphql-richtext-boundary.json"
              },
              "richtext_offline_backfill": {
                "verifier": "scripts/verify/verify-blog-richtext-offline-backfill.mjs",
                "evidence": "crates/rustok-blog/contracts/evidence/blog-richtext-offline-backfill.json"
              },
              "forum_ui_ownership": {
                "verifier": "scripts/verify/verify-blog-forum-ui-ownership.mjs",
                "evidence": "crates/rustok-blog/contracts/evidence/blog-forum-ui-ownership.json"
              }
            }
          },
          "event_projection": {''',
          )

          replace_once(
              verifier_path,
              '''function sameSet(actual, expected, label) {
            const a = [...actual].sort().join('|');
            const e = [...expected].sort().join('|');
            if (a !== e) fail(`${label} drift: expected ${e}, got ${a}`);
          }
          ''',
              '''function sameSet(actual, expected, label) {
            const a = [...actual].sort().join('|');
            const e = [...expected].sort().join('|');
            if (a !== e) fail(`${label} drift: expected ${e}, got ${a}`);
          }
          function sameList(actual, expected, label) {
            const a = JSON.stringify(actual);
            const e = JSON.stringify(expected);
            if (a !== e) fail(`${label} drift: expected ${e}, got ${a}`);
          }
          ''',
          )
          replace_once(
              verifier_path,
              '''const providerPath = 'crates/rustok-comments/contracts/comments-fba-registry.json';
          const registry = json(registryPath);''',
              '''const providerPath = 'crates/rustok-comments/contracts/comments-fba-registry.json';
          const packageJsonPath = 'package.json';
          const expectedVerificationSteps = [
            'node scripts/verify/verify-blog-fba.mjs',
            'npm run verify:blog:admin-boundary',
            'npm run verify:blog:storefront-boundary',
            'npm run verify:blog:graphql-richtext-boundary',
            'npm run verify:blog:richtext-offline-backfill',
            'npm run verify:blog:forum-ui-ownership',
            'node scripts/verify/verify-consumer-fba-runtime-order.mjs',
          ];
          const expectedSourceGates = {
            admin_boundary: {
              verifier: 'scripts/verify/verify-blog-admin-boundary.mjs',
              evidence: 'crates/rustok-blog/contracts/evidence/blog-admin-richtext-boundary.json',
            },
            storefront_boundary: {
              verifier: 'scripts/verify/verify-blog-storefront-boundary.mjs',
              evidence: 'crates/rustok-blog/contracts/evidence/blog-storefront-richtext-view.json',
            },
            graphql_richtext_boundary: {
              verifier: 'scripts/verify/verify-blog-graphql-richtext-boundary.mjs',
              evidence: 'crates/rustok-blog/contracts/evidence/blog-graphql-richtext-boundary.json',
            },
            richtext_offline_backfill: {
              verifier: 'scripts/verify/verify-blog-richtext-offline-backfill.mjs',
              evidence: 'crates/rustok-blog/contracts/evidence/blog-richtext-offline-backfill.json',
            },
            forum_ui_ownership: {
              verifier: 'scripts/verify/verify-blog-forum-ui-ownership.mjs',
              evidence: 'crates/rustok-blog/contracts/evidence/blog-forum-ui-ownership.json',
            },
          };
          const registry = json(registryPath);''',
          )
          replace_once(
              verifier_path,
              '''const richtextInventory = json(richtextInventoryPath);
          const provider = json(providerPath);

          if (registry.schema_version !== 1) fail('registry schema_version drift');
          if (registry.module !== 'blog' || registry.role !== 'consumer' || !['in_progress', 'boundary_ready'].includes(registry.status)) fail('registry identity/status drift');''',
              '''const richtextInventory = json(richtextInventoryPath);
          const provider = json(providerPath);
          const packageJson = json(packageJsonPath);

          if (registry.schema_version !== 2) fail('registry schema_version drift');
          if (registry.module !== 'blog' || registry.role !== 'consumer' || !['in_progress', 'boundary_ready'].includes(registry.status)) fail('registry identity/status drift');
          if (registry.verification_chain?.package_script !== 'verify:blog:fba') fail('verification chain package script drift');
          sameList(registry.verification_chain?.steps ?? [], expectedVerificationSteps, 'registry verification chain steps');
          const packageScript = packageJson.scripts?.['verify:blog:fba'];
          if (typeof packageScript !== 'string') fail('package.json missing verify:blog:fba script');
          sameList(packageScript.split(' && '), expectedVerificationSteps, 'package verification chain steps');
          const sourceGates = registry.verification_chain?.source_gates ?? {};
          sameSet(Object.keys(sourceGates), Object.keys(expectedSourceGates), 'registry source gate names');
          for (const [gateName, expectedGate] of Object.entries(expectedSourceGates)) {
            const gate = sourceGates[gateName];
            if (gate?.verifier !== expectedGate.verifier || gate?.evidence !== expectedGate.evidence) {
              fail(`registry source gate ${gateName} path drift`);
            }
            for (const filePath of [expectedGate.verifier, expectedGate.evidence]) {
              if (!fs.existsSync(filePath)) fail(`registry source gate ${gateName} missing ${filePath}`);
            }
          }''',
          )
          replace_once(
              verifier_path,
              "console.log('[verify-blog-fba] blog FBA comments consumer metadata, richtext cutover inventory, static evidence, and no-compile fallback smoke are consistent');",
              "console.log('[verify-blog-fba] Blog FBA registry, exact admin/storefront/richtext source-gate chain, comments consumer metadata, and no-compile evidence are consistent');",
          )

          replace_once(
              plan_path,
              '''machine evidence plus self-regression fixtures. The guardrail is part of the
          Blog FBA command chain.

          The Blog storefront selected-post path now consumes the owner read projection''',
              '''machine evidence plus self-regression fixtures. The guardrail is part of the
          Blog FBA command chain.

          The Blog FBA source-gate chain is now registry-locked. The package command must
          preserve the exact admin, storefront, GraphQL richtext, offline backfill, Forum UI
          ownership, and consumer runtime-order sequence; the FBA verifier also checks every
          registered verifier/evidence path. Storefront can no longer disappear from the
          aggregate gate while the module still claims `core_transport_ui` readiness.

          The Blog storefront selected-post path now consumes the owner read projection''',
          )
          replace_once(
              plan_path,
              '''- FBA status: `boundary_ready` (`core_transport_ui`).
          - Load protection:''',
              '''- FBA status: `boundary_ready` (`core_transport_ui`).
          - Blog FBA source-gate chain: `source_verified_no_compile`; registry schema v2
            locks the exact package order and requires admin, storefront, GraphQL richtext,
            offline backfill, Forum ownership, and consumer runtime-order gates.
          - Load protection:''',
          )
          replace_once(
              plan_path,
              '''27. Removed dead body-format/raw-payload EN/RU locale keys and extended the
              canonical admin evidence, verifier, and self-test to fail closed if those
              legacy UI contracts return.

          ## Next results''',
              '''27. Removed dead body-format/raw-payload EN/RU locale keys and extended the
              canonical admin evidence, verifier, and self-test to fail closed if those
              legacy UI contracts return.
          28. Locked the Blog FBA package command to registry schema v2 and restored the
              missing storefront boundary gate, with exact ordered-step and source-path
              validation in the aggregate verifier.

          ## Next results''',
          )
          PY
          node --check scripts/verify/verify-blog-fba.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('crates/rustok-blog/contracts/blog-fba-registry.json').read_text())
          package = json.loads(Path('package.json').read_text())
          expected = registry['verification_chain']['steps']
          actual = package['scripts']['verify:blog:fba'].split(' && ')
          if expected != actual:
              raise RuntimeError(f'package/registry chain mismatch: {actual!r}')
          if 'npm run verify:blog:storefront-boundary' not in actual:
              raise RuntimeError('storefront boundary missing from Blog FBA chain')
          for gate in registry['verification_chain']['source_gates'].values():
              for path in gate.values():
                  if not Path(path).is_file():
                      raise RuntimeError(f'missing registered Blog FBA source gate file: {path}')
          PY
          git diff --check
      - name: Commit Blog FBA source-gate closure
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/cache-feature-matrix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/cache-feature-matrix.yml \
            package.json \
            crates/rustok-blog/contracts/blog-fba-registry.json \
            crates/rustok-blog/docs/implementation-plan.md \
            scripts/verify/verify-blog-fba.mjs
          git diff --cached --check
          git commit -m "fix(blog): include storefront in FBA source gates"
          git push origin HEAD:agent/blog-fba-storefront-gate-20260730
