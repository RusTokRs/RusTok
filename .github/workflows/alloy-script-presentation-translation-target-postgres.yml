name: RBAC Translation Presentation Storage Verifier

on:
  push:
    branches:
      - translation-rbac-storage-verifier

permissions:
  contents: write

concurrency:
  group: rbac-translation-presentation-storage-verifier
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_BRANCH: translation-rbac-presentation-storage

jobs:
  verify-and-publish:
    name: Verify and publish RBAC presentation storage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
      - name: Register RBAC presentation owner storage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/modules/rustok-rbac/src/lib.rs")
          text = path.read_text()
          replacements = [
              (
                  "mod m20260803_000001_canonicalize_artifact_permissions;\npub mod ports;",
                  "mod m20260803_000001_canonicalize_artifact_permissions;\nmod m20260914_000001_role_permission_presentations;\npub mod ports;\nmod presentation;",
              ),
              (
                  "pub use ports::*;\npub use repair::{",
                  "pub use ports::*;\npub use presentation::{\n    RbacPermissionPresentation, RbacPresentationStoreError, RbacRolePresentation,\n    SeaOrmRbacPresentationStore,\n};\npub use repair::{",
              ),
              (
                  "            Box::new(m20260803_000001_canonicalize_artifact_permissions::Migration),\n        ]",
                  "            Box::new(m20260803_000001_canonicalize_artifact_permissions::Migration),\n            Box::new(m20260914_000001_role_permission_presentations::Migration),\n        ]",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one registration anchor: {old!r}; found {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format focused RBAC sources
        shell: bash
        run: |
          rustfmt +${RUST_TOOLCHAIN} --edition 2024 \
            crates/modules/rustok-rbac/src/lib.rs \
            crates/modules/rustok-rbac/src/m20260914_000001_role_permission_presentations.rs \
            crates/modules/rustok-rbac/src/presentation.rs
          git diff --check
      - name: Run RBAC owner lib tests
        run: cargo test --locked -p rustok-rbac --lib -- --nocapture
      - name: Publish verified target branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/modules/rustok-rbac/src/lib.rs \
            crates/modules/rustok-rbac/src/m20260914_000001_role_permission_presentations.rs \
            crates/modules/rustok-rbac/src/presentation.rs
          git commit -m "feat(rbac): add localized presentation storage"
          git push origin HEAD:${TARGET_BRANCH}
