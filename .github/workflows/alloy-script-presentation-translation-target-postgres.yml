name: Alloy Script Presentation Translation PostgreSQL Evidence

on:
  push:
    branches:
      - translation-alloy-script-presentation-postgres-evidence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_SHA: ${{ github.sha }}
  BASE_SHA: d76ce83fc02ac0c2e41c3b85ab7b5cc5fe1e0a44
  FIX_BRANCH: translation-alloy-script-presentation-evidence-fixes

jobs:
  postgres-evidence:
    name: Alloy script presentation registered provider PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RUSTOK_MIGRATION_SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply focused compile fixes and Rust formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_one(
              "crates/modules/alloy/src/authoring.rs",
              "authoring: Some(runtime.authoring),",
              "authoring: Some(runtime.authoring_store),",
          )
          replace_one(
              "crates/modules/alloy/src/storage/presentation.rs",
              "ActiveModelTrait, ConnectionTrait, DatabaseConnection, DatabaseTransaction, EntityTrait,\n    QueryFilter, QueryOrder, Set,",
              "ActiveModelTrait, ConnectionTrait, DatabaseConnection, DatabaseTransaction, EntityTrait,\n    ExprTrait, QueryFilter, QueryOrder, Set,",
          )

          path = Path("crates/modules/alloy/src/storage/presentation_translation.rs")
          text = path.read_text()
          needle = ".execute(Statement::from_sql_and_values("
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f"{path}: expected exactly two unborrowed execute statements, found {count}")
          path.write_text(text.replace(needle, ".execute(&Statement::from_sql_and_values("))

          replace_one(
              "crates/modules/alloy/src/storage/translation_target.rs",
              "use sea_orm::{ConnectionTrait, DatabaseBackend, DatabaseConnection, FromQueryResult, Statement};",
              "use sea_orm::{DatabaseBackend, DatabaseConnection, FromQueryResult, Statement};",
          )
          PY

          rustfmt +${RUST_TOOLCHAIN} --edition 2024 \
            apps/server/tests/alloy_script_presentation_translation_target_postgres.rs \
            apps/server/src/services/alloy_translation_target.rs \
            crates/modules/alloy/src/authoring.rs \
            crates/modules/alloy/src/model/presentation.rs \
            crates/modules/alloy/src/storage/presentation.rs \
            crates/modules/alloy/src/storage/presentation_translation.rs \
            crates/modules/alloy/src/storage/translation_target.rs \
            crates/modules/alloy/src/migrations/m20260913_000010_add_script_presentations.rs \
            crates/modules/alloy/src/migrations/m20260914_000011_add_script_presentation_translation_change_plane.rs

          git diff --binary -- \
            apps/server/tests/alloy_script_presentation_translation_target_postgres.rs \
            apps/server/src/services/alloy_translation_target.rs \
            crates/modules/alloy/src/authoring.rs \
            crates/modules/alloy/src/model/presentation.rs \
            crates/modules/alloy/src/storage/presentation.rs \
            crates/modules/alloy/src/storage/presentation_translation.rs \
            crates/modules/alloy/src/storage/translation_target.rs \
            crates/modules/alloy/src/migrations/m20260913_000010_add_script_presentations.rs \
            crates/modules/alloy/src/migrations/m20260914_000011_add_script_presentation_translation_change_plane.rs \
            > /tmp/alloy-evidence-fixes.patch
      - name: Upload focused fix patch
        uses: actions/upload-artifact@v4
        with:
          name: alloy-evidence-fixes
          path: /tmp/alloy-evidence-fixes.patch
          if-no-files-found: error
          retention-days: 3
      - name: Compile Alloy script presentation registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-alloy
          --test alloy_script_presentation_translation_target_postgres
          --no-run
      - name: Run Alloy script presentation registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-alloy
          --test alloy_script_presentation_translation_target_postgres
          -- --ignored --nocapture
      - name: Publish verified fix branch from exact main
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "$BASE_SHA"
          git apply /tmp/alloy-evidence-fixes.patch
          git add \
            apps/server/tests/alloy_script_presentation_translation_target_postgres.rs \
            apps/server/src/services/alloy_translation_target.rs \
            crates/modules/alloy/src/authoring.rs \
            crates/modules/alloy/src/model/presentation.rs \
            crates/modules/alloy/src/storage/presentation.rs \
            crates/modules/alloy/src/storage/presentation_translation.rs \
            crates/modules/alloy/src/storage/translation_target.rs \
            crates/modules/alloy/src/migrations/m20260913_000010_add_script_presentations.rs \
            crates/modules/alloy/src/migrations/m20260914_000011_add_script_presentation_translation_change_plane.rs
          git diff --cached --check
          git commit -m "fix(alloy): close script presentation evidence compile gaps"
          git push origin "HEAD:refs/heads/$FIX_BRANCH"
