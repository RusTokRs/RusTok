name: Alloy Script Presentation Translation PostgreSQL Evidence

on:
  push:
    branches:
      - translation-alloy-postmerge-exact-evidence

permissions:
  contents: write

concurrency:
  group: alloy-script-presentation-promotion-publisher
  cancel-in-progress: true

jobs:
  publish-promotion-docs:
    name: Publish Alloy pilot promotion parity update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: translation-alloy-script-presentation-pilot-promotion
          persist-credentials: true
      - name: Update only Alloy Script Presentation parity row
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/modules/translation-surfaces.json")
          text = path.read_text()
          marker = '      "id": "alloy_script_presentation",'
          if text.count(marker) != 1:
              raise SystemExit(f"expected exactly one Alloy marker, found {text.count(marker)}")
          marker_at = text.index(marker)
          start = text.rfind("    {\n", 0, marker_at)
          end = text.find("\n    },", marker_at)
          if start < 0 or end < 0:
              raise SystemExit("could not isolate Alloy parity row")
          old = text[start:end + len("\n    }")]
          if '"readiness": "blocked"' not in old:
              raise SystemExit("Alloy row is no longer blocked; refusing stale replacement")
          new = "\n".join([
              "    {",
              '      "id": "alloy_script_presentation",',
              '      "owner_slug": "alloy",',
              '      "resource_kind": "script_presentation",',
              '      "readiness": "pilot_candidate",',
              '      "provider_status": "registered",',
              '      "field_profiles": ["plain_text"],',
              '      "data_classification": ["tenant_private"],',
              '      "ai_export": "forbidden",',
              '      "evidence_paths": [',
              '        "crates/modules/alloy/docs/translation-plan.md",',
              '        "crates/modules/alloy/src/model/presentation.rs",',
              '        "crates/modules/alloy/src/storage/presentation.rs",',
              '        "crates/modules/alloy/src/storage/presentation_translation.rs",',
              '        "crates/modules/alloy/src/storage/translation_target.rs",',
              '        "crates/modules/alloy/src/migrations/m20260913_000010_add_script_presentations.rs",',
              '        "crates/modules/alloy/src/migrations/m20260914_000011_add_script_presentation_translation_change_plane.rs",',
              '        "apps/server/src/services/alloy_translation_target.rs",',
              '        "apps/server/src/services/mod.rs",',
              '        "apps/server/tests/alloy_script_presentation_translation_target_postgres.rs",',
              '        ".github/workflows/alloy-script-presentation-translation-target-postgres.yml"',
              '      ],',
              '      "blockers": ["Production enablement remains an operator rollout decision; repository-hosted PostgreSQL migration/backfill, tenant-isolation, canonical authoring, multi-replica CAS, replay-after-later-change, hard-delete lifecycle, aggregate progress and frozen ChangeCursor evidence is retained by the focused Alloy Script Presentation test/workflow, including exact post-merge main run 34841105202 on 60e3463e7ff0e88eedb988ecfa2ccc70a3a266f7 (1 passed, 0 failed). Operational Script.name and executable/configuration/security-sensitive state remain outside Translation."]',
              "    }",
          ])
          path.write_text(text[:start] + new + text[end + len("\n    }"):])
          PY
          python3 -m json.tool docs/modules/translation-surfaces.json >/dev/null
          git diff --check
          git diff -- docs/modules/translation-surfaces.json
      - name: Commit promotion parity update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modules/translation-surfaces.json
          git commit -m "docs(translation): promote Alloy script presentation pilot"
          git push origin HEAD:translation-alloy-script-presentation-pilot-promotion
