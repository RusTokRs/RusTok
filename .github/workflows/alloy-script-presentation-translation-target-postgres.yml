name: Alloy Script Presentation Translation PostgreSQL Evidence

on:
  pull_request:
    paths:
      - "apps/server/Cargo.toml"
      - "apps/server/src/services/alloy_translation_target.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/alloy_script_presentation_translation_target_postgres.rs"
      - "crates/modules/alloy/docs/translation-plan.md"
      - "crates/modules/alloy/src/authoring.rs"
      - "crates/modules/alloy/src/migration.rs"
      - "crates/modules/alloy/src/migrations/**"
      - "crates/modules/alloy/src/model/presentation.rs"
      - "crates/modules/alloy/src/storage/**"
      - "crates/modules/rustok-translation-targets/**"
      - "crates/utils/rustok-migrations/**"
      - "docs/modules/translation-surfaces.json"
      - ".github/workflows/alloy-script-presentation-translation-target-postgres.yml"
  push:
    branches:
      - main
    paths:
      - "apps/server/Cargo.toml"
      - "apps/server/src/services/alloy_translation_target.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/alloy_script_presentation_translation_target_postgres.rs"
      - "crates/modules/alloy/docs/translation-plan.md"
      - "crates/modules/alloy/src/authoring.rs"
      - "crates/modules/alloy/src/migration.rs"
      - "crates/modules/alloy/src/migrations/**"
      - "crates/modules/alloy/src/model/presentation.rs"
      - "crates/modules/alloy/src/storage/**"
      - "crates/modules/rustok-translation-targets/**"
      - "crates/utils/rustok-migrations/**"
      - "docs/modules/translation-surfaces.json"
      - ".github/workflows/alloy-script-presentation-translation-target-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  postgres-evidence:
    name: Alloy script presentation registered provider PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RUSTOK_MIGRATION_SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check focused Rust formatting
        shell: bash
        run: |
          rustfmt +${RUST_TOOLCHAIN} --edition 2024 --check \
            apps/server/tests/alloy_script_presentation_translation_target_postgres.rs \
            apps/server/src/services/alloy_translation_target.rs \
            crates/modules/alloy/src/authoring.rs \
            crates/modules/alloy/src/model/presentation.rs \
            crates/modules/alloy/src/storage/presentation.rs \
            crates/modules/alloy/src/storage/presentation_translation.rs \
            crates/modules/alloy/src/storage/translation_target.rs \
            crates/modules/alloy/src/migrations/m20260913_000010_add_script_presentations.rs \
            crates/modules/alloy/src/migrations/m20260914_000011_add_script_presentation_translation_change_plane.rs
      - name: Compile Alloy script presentation registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-alloy
          --test alloy_script_presentation_translation_target_postgres
          --no-run
      - name: Run Alloy script presentation registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-alloy
          --test alloy_script_presentation_translation_target_postgres
          -- --ignored --nocapture
