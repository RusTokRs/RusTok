name: Patch RBAC installation scope binding

on:
  push:
    branches:
      - agent/core-rbac-cycle-001-20260803
    paths:
      - .github/workflows/patch-rbac-installation-scope-binding.yml

permissions:
  contents: write

concurrency:
  group: patch-rbac-installation-scope-binding
  cancel-in-progress: false

