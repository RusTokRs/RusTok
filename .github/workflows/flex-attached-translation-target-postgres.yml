name: Flex Attached Translation Target PostgreSQL Evidence

on:
  pull_request:
    paths:
      - "apps/server/src/services/flex_attached_translation_owner.rs"
      - "apps/server/src/services/flex_attached_translation_progress_owner.rs"
      - "apps/server/src/services/flex_attached_values.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/taxonomy_category_flex_translation_target_postgres.rs"
      - "crates/modules/flex/src/attached_translation_*.rs"
      - "crates/modules/flex/src/attached_field_policy.rs"
      - "crates/modules/flex/src/migrations/**"
      - "crates/modules/flex/src/lib.rs"
      - "crates/modules/rustok-taxonomy/src/owner_category_revision.rs"
      - "crates/modules/rustok-taxonomy/src/lib.rs"
      - "crates/modules/rustok-translation-targets/**"
      - "crates/platform/rustok-outbox/**"
      - "crates/platform/rustok-migrations/**"
      - ".github/workflows/flex-attached-translation-target-postgres.yml"
  push:
    branches:
      - main
    paths:
      - "apps/server/src/services/flex_attached_translation_owner.rs"
      - "apps/server/src/services/flex_attached_translation_progress_owner.rs"
      - "apps/server/src/services/flex_attached_values.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/taxonomy_category_flex_translation_target_postgres.rs"
      - "crates/modules/flex/src/attached_translation_*.rs"
      - "crates/modules/flex/src/attached_field_policy.rs"
      - "crates/modules/flex/src/migrations/**"
      - "crates/modules/flex/src/lib.rs"
      - "crates/modules/rustok-taxonomy/src/owner_category_revision.rs"
      - "crates/modules/rustok-taxonomy/src/lib.rs"
      - "crates/modules/rustok-translation-targets/**"
      - "crates/platform/rustok-outbox/**"
      - "crates/platform/rustok-migrations/**"
      - ".github/workflows/flex-attached-translation-target-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  postgres-evidence:
    name: Flex attached registered provider PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RUSTOK_MIGRATION_SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check focused Rust formatting
        shell: bash
        run: |
          rustfmt +${RUST_TOOLCHAIN} --edition 2024 --check \
            apps/server/tests/taxonomy_category_flex_translation_target_postgres.rs
      - name: Compile Flex attached registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-taxonomy,mod-flex
          --test taxonomy_category_flex_translation_target_postgres
          --no-run
      - name: Run Flex attached registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-taxonomy,mod-flex
          --test taxonomy_category_flex_translation_target_postgres
          -- --ignored --nocapture
