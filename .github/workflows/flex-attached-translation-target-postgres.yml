name: Flex Attached Translation Target PostgreSQL Evidence

on:
  pull_request:
    paths:
      - "crates/modules/flex/src/attached_translation.rs"
      - "crates/modules/flex/src/attached_translation_changes.rs"
      - "crates/modules/flex/src/attached_translation_guard.rs"
      - "crates/modules/flex/src/attached_translation_policy_target.rs"
      - "crates/modules/flex/src/attached_translation_progress_target.rs"
      - "crates/modules/flex/src/attached_translation_storage.rs"
      - "crates/modules/flex/src/attached_translation_target.rs"
      - "crates/modules/flex/src/attached.rs"
      - "crates/modules/flex/src/attached_definitions.rs"
      - "crates/modules/flex/src/attached_field_policy.rs"
      - "crates/modules/flex/src/migrations/**"
      - "crates/modules/rustok-taxonomy/src/category_delete.rs"
      - "crates/modules/rustok-taxonomy/src/owner_category_revision.rs"
      - "apps/server/src/services/flex_attached_translation_owner.rs"
      - "apps/server/src/services/flex_attached_translation_progress_owner.rs"
      - "apps/server/src/services/flex_attached_values.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/flex_attached_translation_target_postgres.rs"
      - ".github/workflows/flex-attached-translation-target-postgres.yml"
  push:
    branches:
      - main
    paths:
      - "crates/modules/flex/src/attached_translation.rs"
      - "crates/modules/flex/src/attached_translation_changes.rs"
      - "crates/modules/flex/src/attached_translation_guard.rs"
      - "crates/modules/flex/src/attached_translation_policy_target.rs"
      - "crates/modules/flex/src/attached_translation_progress_target.rs"
      - "crates/modules/flex/src/attached_translation_storage.rs"
      - "crates/modules/flex/src/attached_translation_target.rs"
      - "crates/modules/flex/src/attached.rs"
      - "crates/modules/flex/src/attached_definitions.rs"
      - "crates/modules/flex/src/attached_field_policy.rs"
      - "crates/modules/flex/src/migrations/**"
      - "crates/modules/rustok-taxonomy/src/category_delete.rs"
      - "crates/modules/rustok-taxonomy/src/owner_category_revision.rs"
      - "apps/server/src/services/flex_attached_translation_owner.rs"
      - "apps/server/src/services/flex_attached_translation_progress_owner.rs"
      - "apps/server/src/services/flex_attached_values.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/flex_attached_translation_target_postgres.rs"
      - ".github/workflows/flex-attached-translation-target-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUSTOK_MIGRATION_SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  postgres-evidence:
    name: Registered provider PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check focused Rust formatting
        run: >-
          rustfmt +1.96.0 --edition 2024 --check
          apps/server/tests/flex_attached_translation_target_postgres.rs
      - name: Compile registered provider evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-taxonomy,mod-flex
          --test flex_attached_translation_target_postgres --no-run
      - name: Run registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-taxonomy,mod-flex
          --test flex_attached_translation_target_postgres
          -- --ignored --nocapture --test-threads=1
