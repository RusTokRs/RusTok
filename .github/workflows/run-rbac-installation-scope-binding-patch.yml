name: Run RBAC installation scope binding patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-rbac-installation-scope-binding.yml
      - .github/workflows/run-rbac-installation-scope-binding-patch.yml

permissions:
  contents: write

concurrency:
  group: run-rbac-installation-scope-binding-patch
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'agent/core-rbac-cycle-001-20260803'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/core-rbac-cycle-001-20260803
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Apply exact installation identity patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/patch-rbac-installation-scope-binding.yml')
          workflow = workflow_path.read_text()
          start_marker = '      - name: Apply exact installation identity patch\n        run: |\n'
          end_marker = '\n      - name: Format changed Rust sources\n'
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('embedded exact patch boundaries are not unique')

          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          output = []
          in_single_triple = False
          in_double_triple = False
          for raw_line in body.splitlines():
              if in_single_triple or in_double_triple:
                  line = raw_line
              elif raw_line:
                  if not raw_line.startswith('          '):
                      raise SystemExit(
                          'embedded exact patch has an unexpected outer indentation: '
                          + raw_line[:40]
                      )
                  line = raw_line[10:]
              else:
                  line = ''

              output.append(line)
              if line.count("'''") % 2 == 1:
                  in_single_triple = not in_single_triple
              if line.count('"""') % 2 == 1:
                  in_double_triple = not in_double_triple

          if in_single_triple or in_double_triple:
              raise SystemExit('embedded exact patch has an unterminated triple-quoted literal')

          lines = output

          label = '    "upgrade binding count assertion",'
          if lines.count(label) != 1:
              raise SystemExit(
                  'upgrade binding count label: expected one match, found '
                  + str(lines.count(label))
              )
          label_index = lines.index(label)
          if label_index < 4 or lines[label_index + 1] != ')':
              raise SystemExit('upgrade binding count block shape changed')
          lines[label_index - 4 : label_index + 2] = [
              'binding_definition_count = \'    assert_eq!(count(&db, "rbac_artifact_permission_definitions").await, 1);\'',
              'binding_definition_count_with_installation = \'    assert_eq!(count(&db, "rbac_artifact_permission_installations").await, 1);\\n    assert_eq!(count(&db, "rbac_artifact_permission_definitions").await, 1);\'',
              'binding_definition_count_matches = upgrade.count(binding_definition_count)',
              'if binding_definition_count_matches != 2:',
              '    raise SystemExit(',
              '        "upgrade binding count assertion: expected two matches, found "',
              '        + str(binding_definition_count_matches)',
              '    )',
              'upgrade = upgrade.replace(',
              '    binding_definition_count,',
              '    binding_definition_count_with_installation,',
              ')',
          ]

          label = '    "verifier binding migration marker",'
          if lines.count(label) != 1:
              raise SystemExit(
                  'verifier binding migration label: expected one match, found '
                  + str(lines.count(label))
              )
          label_index = lines.index(label)
          if label_index < 4 or lines[label_index + 1] != ')':
              raise SystemExit('verifier binding migration block shape changed')
          lines[label_index - 4 : label_index + 2] = [
              'verifier_definition_marker = \'  "rbac_artifact_permission_definitions_new",\'',
              'verifier_definition_with_installation = \'  "rbac_artifact_permission_installations_new",\\n  "rbac_artifact_permission_definitions_new",\'',
              'verifier_definition_matches = verifier.count(verifier_definition_marker)',
              'if verifier_definition_matches != 2:',
              '    raise SystemExit(',
              '        "verifier binding migration marker: expected two matches, found "',
              '        + str(verifier_definition_matches)',
              '    )',
              'verifier = verifier.replace(',
              '    verifier_definition_marker,',
              '    verifier_definition_with_installation,',
              ')',
          ]

          label = '    "verifier binding immutability marker",'
          if lines.count(label) != 1:
              raise SystemExit(
                  'verifier binding immutability label: expected one match, found '
                  + str(lines.count(label))
              )
          label_index = lines.index(label)
          if label_index < 4 or lines[label_index + 1] != ')':
              raise SystemExit('verifier binding immutability block shape changed')
          lines[label_index - 4 : label_index + 2] = [
              'verifier_immutability_marker = \'  "rustok_reject_artifact_permission_definition_update",\'',
              'verifier_immutability_with_installation = \'  "rustok_reject_artifact_permission_installation_update",\\n  "rustok_reject_artifact_permission_definition_update",\'',
              'verifier_immutability_matches = verifier.count(verifier_immutability_marker)',
              'if verifier_immutability_matches != 2:',
              '    raise SystemExit(',
              '        "verifier binding immutability marker: expected two matches, found "',
              '        + str(verifier_immutability_matches)',
              '    )',
              'verifier = verifier.replace(',
              '    verifier_immutability_marker,',
              '    verifier_immutability_with_installation,',
              ')',
          ]

          Path('/tmp/apply-rbac-installation-binding.sh').write_text(
              '\n'.join(lines) + '\n'
          )
          PY

          bash /tmp/apply-rbac-installation-binding.sh

      - name: Format changed Rust sources
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        run: cargo fmt --all

      - name: Verify RBAC source contract
        run: node scripts/verify/verify-rbac-artifact-permission-tenant-integrity.mjs

      - name: Check RBAC crate
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: cargo check --locked -p rustok-rbac --all-features

      - name: Run artifact permission regressions
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: |
          cargo test --locked -p rustok-rbac --lib artifact_permission_catalog
          cargo test --locked -p rustok-rbac --test artifact_permission_upgrade_sqlite
          cargo test --locked -p rustok-rbac --test artifact_permission_tenant_integrity_sqlite
          cargo test --locked -p rustok-rbac --test artifact_permission_outbox_sqlite

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/rustok-rbac/src/artifact_permission_catalog.rs \
            crates/rustok-rbac/src/m20260803_000001_canonicalize_artifact_permissions.rs \
            crates/rustok-rbac/tests/artifact_permission_upgrade_sqlite.rs \
            crates/rustok-rbac/tests/artifact_permission_tenant_integrity_sqlite.rs \
            crates/rustok-rbac/tests/artifact_permission_outbox_sqlite.rs \
            scripts/verify/verify-rbac-artifact-permission-tenant-integrity.mjs
          git commit -m "fix(rbac): bind permission vocabulary to installation scope"
          git push origin HEAD:agent/core-rbac-cycle-001-20260803
