name: FORUM-24B merge route alias sync

on:
  push:
    branches:
      - feat/forum-24b-merge-route-aliases
    paths:
      - .github/forum24b_merge_route_alias_patch.py
      - .github/workflows/forum24b-merge-route-alias-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/forum-24b-merge-route-aliases
          fetch-depth: 1
      - name: Apply FORUM-24B owner composition
        run: python .github/forum24b_merge_route_alias_patch.py
      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/forum24b_merge_route_alias_patch.py .github/workflows/forum24b-merge-route-alias-sync.yml
          git add \
            crates/rustok-forum/src/services/topic_route.rs \
            crates/rustok-forum/src/services/topic_merge.rs \
            crates/rustok-forum/docs/README.md \
            crates/rustok-forum/docs/implementation-plan.md
          git commit -m "feat(forum): compose merge route aliases"
          git push origin HEAD:feat/forum-24b-merge-route-aliases
