name: Temporary Blog Comments canonical writer check

on:
  pull_request:
    branches:
      - agent/tmp-blog-comments-writer-check-base-20260803

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Check event and outbox sources
        run: |
          cargo +1.96.0 check -p rustok-events --locked
          cargo +1.96.0 check -p rustok-outbox --tests --locked
      - name: Check Blog server composition
        run: cargo +1.96.0 check -p rustok-server --no-default-features --features mod-blog --tests --locked
