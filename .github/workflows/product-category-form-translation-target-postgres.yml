name: Product Category Form Translation PostgreSQL Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_SHA: ${{ github.sha }}

jobs:
  postgres-evidence:
    name: Product Category Form registered provider PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RUSTOK_MIGRATION_SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check focused Rust formatting
        shell: bash
        run: >-
          rustfmt +${RUST_TOOLCHAIN} --edition 2024 --check
          apps/server/tests/product_category_form_translation_target_postgres.rs
          crates/modules/rustok-product/src/services/catalog_schema_service/categories/translation.rs
          crates/modules/rustok-product/src/migrations/m20260913_000028_add_product_category_form_translation_change_journal.rs
          crates/modules/rustok-product/src/services/write_transaction.rs
          apps/server/src/services/module_event_dispatcher.rs
      - name: Compile Product Category Form registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-product
          --test product_category_form_translation_target_postgres
          --no-run
      - name: Run Product Category Form registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-product
          --test product_category_form_translation_target_postgres
          -- --ignored --nocapture
