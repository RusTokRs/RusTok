name: FORUM-24D topic slug rename sync

on:
  push:
    branches:
      - feat/forum-24d-topic-slug-rename
    paths:
      - .github/forum24d_slug_rename_sync.py
      - .github/workflows/forum24d-topic-slug-rename-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/forum-24d-topic-slug-rename
          fetch-depth: 1
      - name: Apply FORUM-24D owner composition
        run: python .github/forum24d_slug_rename_sync.py
      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/forum24d_slug_rename_sync.py .github/workflows/forum24d-topic-slug-rename-sync.yml
          git add crates/rustok-forum/src/services/topic_route.rs \
                  crates/rustok-forum/src/services/topic_owner.rs \
                  crates/rustok-forum/src/services/topic_facade.rs \
                  crates/rustok-forum/src/services/mod.rs \
                  crates/rustok-forum/src/lib.rs \
                  crates/rustok-forum/docs/README.md \
                  crates/rustok-forum/docs/implementation-plan.md
          git commit -m "feat(forum): compose localized topic slug rename"
          git push origin HEAD:feat/forum-24d-topic-slug-rename
