name: SEO Translation PostgreSQL Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_SHA: ${{ github.sha }}

jobs:
  postgres-evidence:
    name: SEO registered provider PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RUSTOK_MIGRATION_SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check focused Rust formatting
        shell: bash
        run: >-
          rustfmt +${RUST_TOOLCHAIN} --edition 2024 --check
          apps/server/tests/seo_translation_target_postgres.rs
      - name: Compile SEO registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-seo,mod-translation
          --test seo_translation_target_postgres
          --no-run
      - name: Run SEO registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-seo,mod-translation
          --test seo_translation_target_postgres
          -- --ignored --nocapture
