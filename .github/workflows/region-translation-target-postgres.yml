name: Region Translation Target PostgreSQL Evidence

on:
  pull_request:
    paths:
      - "apps/server/src/services/module_event_dispatcher.rs"
      - "apps/server/tests/region_translation_target_postgres.rs"
      - "crates/modules/rustok-region/src/**"
      - "crates/modules/rustok-outbox/**"
      - "crates/modules/rustok-translation-targets/**"
      - "crates/utils/rustok-migrations/**"
      - ".github/workflows/region-translation-target-postgres.yml"
  push:
    branches:
      - main
    paths:
      - "apps/server/src/services/module_event_dispatcher.rs"
      - "apps/server/tests/region_translation_target_postgres.rs"
      - "crates/modules/rustok-region/src/**"
      - "crates/modules/rustok-outbox/**"
      - "crates/modules/rustok-translation-targets/**"
      - "crates/utils/rustok-migrations/**"
      - ".github/workflows/region-translation-target-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  postgres-evidence:
    name: Region registered provider PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RUSTOK_MIGRATION_SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check focused Rust formatting
        shell: bash
        run: |
          rustfmt +${RUST_TOOLCHAIN} --edition 2024 --check \
            apps/server/tests/region_translation_target_postgres.rs \
            crates/modules/rustok-region/src/services/region.rs \
            crates/modules/rustok-region/src/services/translation.rs \
            crates/modules/rustok-region/src/services/translation_progress.rs \
            crates/modules/rustok-region/src/translation_changes.rs \
            crates/modules/rustok-region/src/translation_target.rs
      - name: Compile Region registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-region
          --test region_translation_target_postgres
          --no-run
      - name: Run Region registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-region
          --test region_translation_target_postgres
          -- --ignored --nocapture
