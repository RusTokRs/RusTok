name: Product Category Closure Write Retirement

on:
  pull_request:
    paths:
      - "crates/rustok-product/src/services/catalog_schema_service/categories.rs"
      - "crates/rustok-product/docs/category-taxonomy-binding.md"
      - "scripts/verify/verify-product-category-closure-write-retirement.mjs"
      - ".github/workflows/product-category-closure-write-retirement.yml"
      - ".github/workflows/product-taxonomy-category-directory-order.yml"

permissions:
  contents: read

concurrency:
  group: product-category-closure-write-retirement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  closure-write-retirement-contract:
    name: Product Category closure write retirement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Verify Product Category closure write retirement contract
        run: node scripts/verify/verify-product-category-closure-write-retirement.mjs
      - name: Fetch exact PR base
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
      - name: Assert bounded CAT-32 file set when CAT-32 runtime or verifier changes
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          anchors='^(crates/rustok-product/src/services/catalog_schema_service/categories\.rs|scripts/verify/verify-product-category-closure-write-retirement\.mjs)$'
          if ! printf '%s\n' "$changed" | grep -Eq "$anchors"; then
            echo "CAT-32 runtime/verifier unchanged; PR-wide CAT-32 slice restriction is not applicable."
            exit 0
          fi
          allowed='^(crates/rustok-product/src/services/catalog_schema_service/categories\.rs|crates/rustok-product/docs/category-taxonomy-binding\.md|scripts/verify/verify-product-category-closure-write-retirement\.mjs|\.github/workflows/product-category-closure-write-retirement\.yml|\.github/workflows/product-taxonomy-category-directory-order\.yml)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
      - name: Check Product formatting
        run: cargo fmt --check --manifest-path crates/rustok-product/Cargo.toml
      - name: Run Product Category closure backend regression
        run: cargo test -p rustok-product --lib category_closure_write_is_non_postgres_only -- --nocapture
      - name: Preserve Taxonomy hierarchy consumer regressions
        run: cargo test -p rustok-product --lib category_taxonomy_hierarchy -- --nocapture
      - name: Compile Product Category closure write retirement
        run: cargo check -p rustok-product --lib
      - name: Check full PR whitespace
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --check "$base" "$head"
