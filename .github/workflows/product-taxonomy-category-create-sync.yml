name: Product Taxonomy Category Create Sync

on:
  pull_request:
    paths:
      - "crates/rustok-product/src/services/catalog_schema_service/categories.rs"
      - "crates/rustok-product/docs/category-taxonomy-binding.md"
      - "crates/rustok-product/docs/category-locale-contract.md"
      - "scripts/verify/verify-product-taxonomy-category-create-sync.mjs"
      - ".github/workflows/product-taxonomy-category-create-sync.yml"

permissions:
  contents: read

concurrency:
  group: product-taxonomy-category-create-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-sync-contract:
    name: Product Taxonomy Category create sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Verify Product Category create sync contract
        run: node scripts/verify/verify-product-taxonomy-category-create-sync.mjs
      - name: Fetch exact PR base
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
      - name: Assert bounded CAT-25 file set
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          allowed='^(crates/rustok-product/src/services/catalog_schema_service/categories\.rs|crates/rustok-product/docs/category-taxonomy-binding\.md|crates/rustok-product/docs/category-locale-contract\.md|scripts/verify/verify-product-taxonomy-category-create-sync\.mjs|\.github/workflows/product-taxonomy-category-create-sync\.yml)$'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
      - name: Check Product formatting
        run: cargo fmt --check --manifest-path crates/rustok-product/Cargo.toml
      - name: Run Product Category Taxonomy create unit regressions
        run: cargo test -p rustok-product --lib category_taxonomy_create -- --nocapture
      - name: Compile Product Category create sync
        run: cargo check -p rustok-product --lib
      - name: Check full PR whitespace
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --check "$base" "$head"
