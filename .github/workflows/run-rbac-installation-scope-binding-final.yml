name: Run final RBAC installation binding gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-rbac-installation-scope-binding-final.yml

permissions:
  contents: write

concurrency:
  group: run-rbac-installation-scope-binding-final
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'agent/core-rbac-cycle-001-20260803'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/core-rbac-cycle-001-20260803
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.96.0

      - name: Apply verified base patch
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/run-rbac-installation-scope-binding-patch.yml")
            step = workflow.fetch("jobs").fetch("patch-and-verify").fetch("steps").find do |candidate|
              candidate["name"] == "Apply exact installation identity patch"
            end
            abort("base patch step is missing") unless step && step["run"]
            File.write("/tmp/apply-rbac-installation-binding-base.sh", step.fetch("run"))
          '
          bash /tmp/apply-rbac-installation-binding-base.sh

      - name: Finalize installation identity storage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path(
              "crates/rustok-rbac/src/"
              "m20260803_000001_canonicalize_artifact_permissions.rs"
          )
          migration = migration_path.read_text()

          rename_marker = (
              "            \"ALTER TABLE "
              "rbac_artifact_permission_installations_new RENAME TO "
              "rbac_artifact_permission_installations\",\n"
          )
          if migration.count(rename_marker) != 1:
              raise SystemExit(
                  "installation parent rename: expected one match, found "
                  + str(migration.count(rename_marker))
              )
          migration = migration.replace(rename_marker, "", 1)

          staging = "rbac_artifact_permission_installations_new"
          if migration.count(staging) != 6:
              raise SystemExit(
                  "installation staging references: expected six matches, found "
                  + str(migration.count(staging))
              )
          migration = migration.replace(
              staging,
              "rbac_artifact_permission_installations",
          )

          insert_anchor = "\n".join([
              "        connection",
              "            .execute(Statement::from_sql_and_values(",
              "                backend,",
              "                sql,",
          ])
          if migration.count(insert_anchor) != 1:
              raise SystemExit(
                  "translation insert anchor: expected one match, found "
                  + str(migration.count(insert_anchor))
              )
          insert_index = migration.index(insert_anchor)
          prefix = migration[:insert_index]
          insert_tail = migration[insert_index:]
          for old, new, label in [
              ("translation_id.into(),", "translation_id_value,", "translation id bind"),
              ("definition_id.into(),", "definition_id_value,", "definition id bind"),
          ]:
              if insert_tail.count(old) != 1:
                  raise SystemExit(
                      f"{label}: expected one INSERT-tail match, found {insert_tail.count(old)}"
                  )
              insert_tail = insert_tail.replace(old, new, 1)
          migration = prefix + insert_tail

          identity_binding = "\n".join([
              "        let (translation_id_value, definition_id_value):",
              "            (sea_orm::Value, sea_orm::Value) = match backend {",
              "                DbBackend::Postgres => (translation_id.into(), definition_id.into()),",
              "                DbBackend::Sqlite => (",
              "                    translation_id.to_string().into(),",
              "                    definition_id.to_string().into(),",
              "                ),",
              "                _ => unreachable!(),",
              "            };",
              "        connection",
              "            .execute(Statement::from_sql_and_values(",
              "                backend,",
              "                sql,",
          ])
          migration = migration.replace(insert_anchor, identity_binding, 1)
          migration_path.write_text(migration)

          upgrade_path = Path(
              "crates/rustok-rbac/tests/artifact_permission_upgrade_sqlite.rs"
          )
          upgrade = upgrade_path.read_text()
          if upgrade.count(staging) != 1:
              raise SystemExit(
                  "upgrade installation rollback assertion: expected one match, found "
                  + str(upgrade.count(staging))
              )
          upgrade_path.write_text(
              upgrade.replace(
                  staging,
                  "rbac_artifact_permission_installations",
              )
          )

          verifier_path = Path(
              "scripts/verify/verify-rbac-artifact-permission-tenant-integrity.mjs"
          )
          verifier = verifier_path.read_text()
          if verifier.count(staging) != 2:
              raise SystemExit(
                  "verifier installation table markers: expected two matches, found "
                  + str(verifier.count(staging))
              )
          verifier_path.write_text(
              verifier.replace(
                  staging,
                  "rbac_artifact_permission_installations",
              )
          )
          PY

      - name: Canonicalize SQLite assignment identities
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          assignment_path = Path(
              "crates/rustok-rbac/src/artifact_permission_assignment.rs"
          )
          assignment = assignment_path.read_text()

          helper_anchor = "fn ensure_supported_backend("
          helpers = "\n".join([
              "fn uuid_value(backend: DbBackend, value: Uuid) -> sea_orm::Value {",
              "    match backend {",
              "        DbBackend::Postgres => value.into(),",
              "        DbBackend::Sqlite => value.to_string().into(),",
              "        _ => unreachable!(\"unsupported database backend was validated\"),",
              "    }",
              "}",
              "",
              "fn uuid_from_row(",
              "    backend: DbBackend,",
              "    row: &sea_orm::QueryResult,",
              "    column: &str,",
              ") -> Result<Uuid, ArtifactPermissionAssignmentError> {",
              "    match backend {",
              "        DbBackend::Postgres => row.try_get(\"\", column).map_err(database_error),",
              "        DbBackend::Sqlite => {",
              "            let value: String =",
              "                row.try_get(\"\", column).map_err(database_error)?;",
              "            Uuid::parse_str(&value).map_err(|error| {",
              "                ArtifactPermissionAssignmentError::Database(format!(",
              "                    \"artifact permission UUID column `{column}` contains invalid value `{value}`: {error}\"",
              "                ))",
              "            })",
              "        }",
              "        _ => unreachable!(\"unsupported database backend was validated\"),",
              "    }",
              "}",
              "",
          ])
          assignment = replace_once(
              assignment,
              helper_anchor,
              helpers + helper_anchor,
              "assignment UUID helpers",
          )

          authorizer_values = "\n".join([
              "                vec![",
              "                    user_id.into(),",
              "                    tenant_id.into(),",
              "                    installation_id.into(),",
              "                    permission_key.into(),",
              "                    tenant_scope.into(),",
              "                ],",
          ])
          authorizer_text_values = "\n".join([
              "                vec![",
              "                    uuid_value(backend, user_id),",
              "                    uuid_value(backend, tenant_id),",
              "                    uuid_value(backend, installation_id),",
              "                    permission_key.into(),",
              "                    tenant_scope.into(),",
              "                ],",
          ])
          assignment = replace_once(
              assignment,
              authorizer_values,
              authorizer_text_values,
              "authorizer UUID values",
          )

          expression_replacements = [
              ("operation_id.into(),", "uuid_value(backend, operation_id),", 1),
              ("command.tenant_id.into(),", "uuid_value(backend, command.tenant_id),", 5),
              ("command.role_id.into(),", "uuid_value(backend, command.role_id),", 4),
              ("artifact_permission.id.into(),", "uuid_value(backend, artifact_permission.id),", 3),
              ("command.actor_id.into(),", "uuid_value(backend, command.actor_id),", 2),
              (
                  "rustok_core::generate_id().into(),",
                  "uuid_value(backend, rustok_core::generate_id()),",
                  1,
              ),
              (
                  "command.installation_id.into(),",
                  "uuid_value(backend, command.installation_id),",
                  1,
              ),
          ]
          for old, new, expected in expression_replacements:
              count = assignment.count(old)
              if count != expected:
                  raise SystemExit(
                      f"assignment UUID expression `{old}`: expected {expected}, found {count}"
                  )
              assignment = assignment.replace(old, new)

          assignment = replace_once(
              assignment,
              '                role_id: row.try_get("", "role_id").map_err(database_error)?,',
              '                role_id: uuid_from_row(backend, &row, "role_id")?,',
              "stored operation role decode",
          )
          assignment = replace_once(
              assignment,
              "\n".join([
                  "                artifact_permission_id: row",
                  "                    .try_get(\"\", \"artifact_permission_id\")",
                  "                    .map_err(database_error)?,",
              ]),
              '                artifact_permission_id: uuid_from_row(backend, &row, "artifact_permission_id")?,',
              "stored operation permission decode",
          )
          assignment = replace_once(
              assignment,
              '                actor_id: row.try_get("", "actor_id").map_err(database_error)?,',
              '                actor_id: uuid_from_row(backend, &row, "actor_id")?,',
              "stored operation actor decode",
          )
          assignment = replace_once(
              assignment,
              '                id: row.try_get("", "id").map_err(database_error)?,',
              '                id: uuid_from_row(backend, &row, "id")?,',
              "permission identity decode",
          )
          assignment = replace_once(
              assignment,
              "\n".join([
                  "                installation_id: row",
                  "                    .try_get(\"\", \"installation_id\")",
                  "                    .map_err(database_error)?,",
              ]),
              '                installation_id: uuid_from_row(backend, &row, "installation_id")?,',
              "installation identity decode",
          )
          assignment_path.write_text(assignment)

          outbox_path = Path(
              "crates/rustok-rbac/tests/artifact_permission_outbox_sqlite.rs"
          )
          outbox = outbox_path.read_text()
          outbox = replace_once(
              outbox,
              "vec![role_id.into(), tenant_id.into()]",
              "vec![role_id.to_string().into(), tenant_id.to_string().into()]",
              "outbox role TEXT seed",
          )
          outbox = replace_once(
              outbox,
              "vec![actor_id.into(), tenant_id.into()]",
              "vec![actor_id.to_string().into(), tenant_id.to_string().into()]",
              "outbox actor TEXT seed",
          )

          definition_start = outbox.index("async fn insert_definition(")
          definition_end = outbox.index(
              "async fn insert_corrupt_parallel_definition(",
              definition_start,
          )
          definition = outbox[definition_start:definition_end]
          for old, new, expected in [
              (
                  "artifact_permission_id.into(),",
                  "artifact_permission_id.to_string().into(),",
                  1,
              ),
              (
                  "installation_id.into(),",
                  "installation_id.to_string().into(),",
                  2,
              ),
          ]:
              if definition.count(old) != expected:
                  raise SystemExit(
                      f"outbox definition seed `{old}`: expected {expected}, found {definition.count(old)}"
                  )
              definition = definition.replace(old, new)
          outbox = outbox[:definition_start] + definition + outbox[definition_end:]

          corrupt_start = outbox.index(
              "async fn insert_corrupt_parallel_definition("
          )
          corrupt_end = outbox.index(
              "#[allow(clippy::too_many_arguments)]",
              corrupt_start,
          )
          corrupt = outbox[corrupt_start:corrupt_end]
          for old, new, expected in [
              (
                  "artifact_permission_id.into(),",
                  "artifact_permission_id.to_string().into(),",
                  1,
              ),
              (
                  "installation_id.into(),",
                  "installation_id.to_string().into(),",
                  1,
              ),
          ]:
              if corrupt.count(old) != expected:
                  raise SystemExit(
                      f"outbox corrupt seed `{old}`: expected {expected}, found {corrupt.count(old)}"
                  )
              corrupt = corrupt.replace(old, new)
          outbox = outbox[:corrupt_start] + corrupt + outbox[corrupt_end:]

          remaining_start = outbox.index("    let remaining_id: Uuid = db")
          remaining_end = outbox.index(
              "    assert_eq!(remaining_id, tenant_permission_id);",
              remaining_start,
          )
          remaining_replacement = "\n".join([
              "    let remaining_id_text: String = db",
              "        .query_one(Statement::from_string(",
              "            db.get_database_backend(),",
              "            \"SELECT artifact_permission_id FROM rbac_artifact_role_permissions LIMIT 1\"",
              "                .to_string(),",
              "        ))",
              "        .await",
              "        .expect(\"query remaining grant\")",
              "        .expect(\"remaining grant\")",
              "        .try_get(\"\", \"artifact_permission_id\")",
              "        .expect(\"decode remaining identity text\");",
              "    let remaining_id = Uuid::parse_str(&remaining_id_text)",
              "        .expect(\"parse remaining identity\");",
              "",
          ])
          outbox = (
              outbox[:remaining_start]
              + remaining_replacement
              + outbox[remaining_end:]
          )
          outbox_path.write_text(outbox)
          PY

      - name: Format changed Rust sources
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        run: cargo fmt --all

      - name: Verify RBAC source contract
        run: node scripts/verify/verify-rbac-artifact-permission-tenant-integrity.mjs

      - name: Check RBAC crate
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: cargo check --locked -p rustok-rbac --all-features

      - name: Run artifact permission regressions
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: |
          cargo test --locked -p rustok-rbac --lib artifact_permission_catalog
          cargo test --locked -p rustok-rbac --test artifact_permission_upgrade_sqlite
          cargo test --locked -p rustok-rbac --test artifact_permission_tenant_integrity_sqlite
          cargo test --locked -p rustok-rbac --test artifact_permission_outbox_sqlite

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/rustok-rbac/src/artifact_permission_assignment.rs \
            crates/rustok-rbac/src/artifact_permission_catalog.rs \
            crates/rustok-rbac/src/m20260803_000001_canonicalize_artifact_permissions.rs \
            crates/rustok-rbac/tests/artifact_permission_upgrade_sqlite.rs \
            crates/rustok-rbac/tests/artifact_permission_tenant_integrity_sqlite.rs \
            crates/rustok-rbac/tests/artifact_permission_outbox_sqlite.rs \
            scripts/verify/verify-rbac-artifact-permission-tenant-integrity.mjs
          git commit -m "fix(rbac): bind permission vocabulary to installation scope"
          git push origin HEAD:agent/core-rbac-cycle-001-20260803
