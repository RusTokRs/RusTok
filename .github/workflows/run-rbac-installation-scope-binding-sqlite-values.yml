name: Run RBAC SQLite UUID value gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-rbac-installation-scope-binding-sqlite-values.yml

permissions:
  contents: write

concurrency:
  group: run-rbac-installation-scope-binding-sqlite-values
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'agent/core-rbac-cycle-001-20260803'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/core-rbac-cycle-001-20260803
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.96.0

      - name: Apply verified installation binding patches
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/run-rbac-installation-scope-binding-final.yml")
            steps = workflow.fetch("jobs").fetch("patch-and-verify").fetch("steps")
            ["Apply verified base patch", "Use final installation parent name"].each_with_index do |name, index|
              step = steps.find { |candidate| candidate["name"] == name }
              abort("verified step #{name} is missing") unless step && step["run"]
              path = "/tmp/verified-rbac-step-#{index}.sh"
              File.write(path, step.fetch("run"))
              abort("verified step #{name} failed") unless system("bash", path)
            end
          '

      - name: Bind SQLite UUIDs as text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path(
              'crates/rustok-rbac/src/'
              'm20260803_000001_canonicalize_artifact_permissions.rs'
          )
          migration = migration_path.read_text()
          old = '''                vec![
                    translation_id.into(),
                    definition_id.into(),
                    locale.into(),
                    value.label.clone().into(),
                    value.description.clone().into(),
                    registered_at.into(),
                ],'''
          new = '''                match backend {
                    DbBackend::Postgres => vec![
                        translation_id.into(),
                        definition_id.into(),
                        locale.into(),
                        value.label.clone().into(),
                        value.description.clone().into(),
                        registered_at.into(),
                    ],
                    DbBackend::Sqlite => vec![
                        translation_id.to_string().into(),
                        definition_id.to_string().into(),
                        locale.into(),
                        value.label.clone().into(),
                        value.description.clone().into(),
                        registered_at.into(),
                    ],
                    _ => unreachable!(),
                },'''
          if migration.count(old) != 1:
              raise SystemExit(
                  'translation identity bind vector: expected one match, found '
                  + str(migration.count(old))
              )
          migration_path.write_text(migration.replace(old, new, 1))
          PY

      - name: Format changed Rust sources
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        run: cargo fmt --all

      - name: Verify RBAC source contract
        run: node scripts/verify/verify-rbac-artifact-permission-tenant-integrity.mjs

      - name: Check RBAC crate
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: cargo check --locked -p rustok-rbac --all-features

      - name: Run artifact permission regressions
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: |
          cargo test --locked -p rustok-rbac --lib artifact_permission_catalog
          cargo test --locked -p rustok-rbac --test artifact_permission_upgrade_sqlite
          cargo test --locked -p rustok-rbac --test artifact_permission_tenant_integrity_sqlite
          cargo test --locked -p rustok-rbac --test artifact_permission_outbox_sqlite

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/rustok-rbac/src/artifact_permission_catalog.rs \
            crates/rustok-rbac/src/m20260803_000001_canonicalize_artifact_permissions.rs \
            crates/rustok-rbac/tests/artifact_permission_upgrade_sqlite.rs \
            crates/rustok-rbac/tests/artifact_permission_tenant_integrity_sqlite.rs \
            crates/rustok-rbac/tests/artifact_permission_outbox_sqlite.rs \
            scripts/verify/verify-rbac-artifact-permission-tenant-integrity.mjs
          git commit -m "fix(rbac): bind permission vocabulary to installation scope"
          git push origin HEAD:agent/core-rbac-cycle-001-20260803
