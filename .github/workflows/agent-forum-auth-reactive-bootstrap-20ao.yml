name: Agent Forum auth-reactive bootstrap 20AO

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/forum-notification-auth-reactive-bootstrap-20ao'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Apply FORUM-20AO source slice
        shell: bash
        run: |
          python3 .github/agent/forum-20ao/part1_runtime.py
          python3 .github/agent/forum-20ao/part2_plans.py
          python3 .github/agent/forum-20ao/part3_docs.py
          python3 .github/agent/forum-20ao/part4_guards.py

          rm -rf .github/agent/forum-20ao
          rm .github/workflows/agent-forum-auth-reactive-bootstrap-20ao.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(notifications): refresh inbox on auth changes"
          git push origin HEAD
