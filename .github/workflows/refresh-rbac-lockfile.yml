name: Refresh RBAC verification lockfile

on:
  push:
    branches:
      - agent/core-rbac-cycle-001-20260803
    paths:
      - .github/workflows/refresh-rbac-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-rbac-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/core-rbac-cycle-001-20260803
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Resolve lockfile with Cargo
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo metadata --format-version 1 >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import difflib

          before = Path('/tmp/Cargo.lock.before').read_text()
          after = Path('Cargo.lock').read_text()
          marker = '[[package]]\nname = "rustok-forum"\n'
          start = before.index(marker)
          end = before.index('\n[[package]]', start + len(marker))
          block = before[start:end]
          needle = ' "toml 1.1.2+spec-1.1.0",\n "tracing",\n'
          replacement = ' "toml 1.1.2+spec-1.1.0",\n "tower",\n "tracing",\n'
          if needle not in block:
              raise SystemExit('expected rustok-forum dependency boundary is absent')
          expected = before[:start] + block.replace(needle, replacement, 1) + before[end:]
          if after != expected:
              print('Cargo produced an unexpected lockfile diff:')
              print(''.join(difflib.unified_diff(
                  before.splitlines(True),
                  after.splitlines(True),
                  fromfile='Cargo.lock.before',
                  tofile='Cargo.lock.after',
              )))
              raise SystemExit(1)
          PY

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock for forum router test"
          git push origin HEAD:agent/core-rbac-cycle-001-20260803
