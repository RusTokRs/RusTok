name: Apply Return Completion Order Owner Cutover

on:
  push:
    branches:
      - agent/commerce-return-completion-order-owner-ports-20260812

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  CARGO_ENCODED_RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: 0

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fix ambiguous patch marker
        run: python3 scripts/tmp/fix-return-completion-owner-patcher.py
      - name: Apply source patch
        run: python3 scripts/tmp/apply-return-completion-order-owner-cutover.py
      - name: Apply Order owner compatibility fixes
        run: python3 scripts/tmp/apply-return-completion-order-port-exhaustive-fix.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify source cutover
        run: node scripts/verify/verify-commerce-return-completion-order-owner-port-cutover.mjs
      - name: Check Commerce
        run: cargo check -p rustok-commerce --all-features
        env:
          PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
      - name: Test return-completion transport guard
        shell: bash
        run: |
          CARGO_MANIFEST_DIR="$PWD/apps/server" rustc --test apps/server/tests/commerce_return_completion_transport_guard.rs -o /tmp/commerce_return_completion_transport_guard
          /tmp/commerce_return_completion_transport_guard
      - name: Check diff
        run: git diff --check
      - name: Commit verified source
        shell: bash
        run: |
          git add \
            .github/workflows/ecommerce-hardening.yml \
            apps/server/tests/commerce_return_completion_transport_guard.rs \
            crates/rustok-commerce/docs/return-completion-order-owner-port-cutover-2026-08-12.md \
            crates/rustok-commerce/src/controllers/admin/changes.rs \
            crates/rustok-commerce/src/controllers/admin/mod.rs \
            crates/rustok-commerce/src/controllers/admin/returns.rs \
            crates/rustok-commerce/src/controllers/return_completion_operations.rs \
            crates/rustok-commerce/src/graphql/mutations/fulfillment.rs \
            crates/rustok-commerce/src/graphql_runtime.rs \
            crates/rustok-commerce/src/services/post_order.rs \
            crates/rustok-commerce/src/services/return_completion_orchestration.rs \
            crates/rustok-commerce/src/services/return_completion_recovery.rs \
            scripts/verify/verify-commerce-return-completion-order-owner-port-cutover.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(commerce): route return completion Order calls through owner ports"
          git push origin HEAD:${GITHUB_REF_NAME}
