name: Next Fluent Verify

on:
  push:
    branches:
      - main
    paths:
      - "packages/next-fluent/**"
      - ".github/workflows/next-fluent-verify.yml"
  pull_request:
    paths:
      - "packages/next-fluent/**"
      - ".github/workflows/next-fluent-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/next-fluent/package-lock.json
      - name: Install dependencies
        working-directory: packages/next-fluent
        run: npm ci
      - name: Verify package
        working-directory: packages/next-fluent
        run: npm run verify
