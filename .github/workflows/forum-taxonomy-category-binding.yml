name: Forum Taxonomy Category Binding Contract

on:
  pull_request:
    paths:
      - "crates/modules/rustok-forum/src/entities/forum_category_taxonomy_binding.rs"
      - "crates/modules/rustok-forum/src/entities/mod.rs"
      - "crates/modules/rustok-forum/src/migrations/m20260823_000029_add_forum_taxonomy_category_binding.rs"
      - "crates/modules/rustok-forum/src/migrations/mod.rs"
      - "crates/modules/rustok-forum/src/services/category.rs"
      - "crates/modules/rustok-forum/src/services/category_mutation_support.rs"
      - "crates/modules/rustok-forum/src/services/category_import.rs"
      - "crates/modules/rustok-forum/src/services/category_projection_owner.rs"
      - "crates/modules/rustok-forum/src/services/mod.rs"
      - "crates/modules/rustok-forum/tests/category_taxonomy_binding.rs"
      - "docs/migrations/backfill-contracts.json"
      - "scripts/verify/verify-forum-taxonomy-category-binding.mjs"
      - ".github/workflows/forum-taxonomy-category-binding.yml"
  push:
    branches:
      - main
    paths:
      - "crates/modules/rustok-forum/src/entities/forum_category_taxonomy_binding.rs"
      - "crates/modules/rustok-forum/src/entities/mod.rs"
      - "crates/modules/rustok-forum/src/migrations/m20260823_000029_add_forum_taxonomy_category_binding.rs"
      - "crates/modules/rustok-forum/src/migrations/mod.rs"
      - "crates/modules/rustok-forum/src/services/category.rs"
      - "crates/modules/rustok-forum/src/services/category_mutation_support.rs"
      - "crates/modules/rustok-forum/src/services/category_import.rs"
      - "crates/modules/rustok-forum/src/services/category_projection_owner.rs"
      - "crates/modules/rustok-forum/src/services/mod.rs"
      - "crates/modules/rustok-forum/tests/category_taxonomy_binding.rs"
      - "docs/migrations/backfill-contracts.json"
      - "scripts/verify/verify-forum-taxonomy-category-binding.mjs"
      - ".github/workflows/forum-taxonomy-category-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    name: Forum Taxonomy Category binding source contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify staged Forum Category binding boundary
        run: node scripts/verify/verify-forum-taxonomy-category-binding.mjs

  rust-contract:
    name: Forum Taxonomy Category binding Rust contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check current CAT-5 boundary Rust formatting
        shell: bash
        run: |
          rustfmt +1.96.0 --edition 2024 --check \
            crates/modules/rustok-forum/src/entities/forum_category_taxonomy_binding.rs \
            crates/modules/rustok-forum/src/services/category_mutation_support.rs \
            crates/modules/rustok-forum/src/services/category.rs \
            crates/modules/rustok-forum/src/services/category_projection_owner.rs
      - name: Run Forum Taxonomy Category binding runtime contract
        run: cargo test --locked -p rustok-forum --test category_taxonomy_binding -- --nocapture
      - name: Compile Forum binding and migration registry
        run: cargo check --locked -p rustok-forum --lib
