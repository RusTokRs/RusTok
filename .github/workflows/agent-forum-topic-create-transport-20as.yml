name: Agent Forum topic-create transport composition 20AS

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/forum-topic-create-transport-composition-20as'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair FORUM-20AS staging inputs
        run: python scripts/agent/fix_forum_20as_staging.py
      - name: Apply FORUM-20AS source slice
        run: python scripts/agent/apply_forum_20as.py
      - name: Commit source slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat(forum): compose topic-create audience transports"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
