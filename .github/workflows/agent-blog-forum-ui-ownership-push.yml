name: Agent Blog Forum UI ownership push

on:
  push:
    branches:
      - agent/blog-forum-ui-ownership-20260730

permissions:
  contents: write

jobs:
  finalize-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blog-forum-ui-ownership-20260730
          fetch-depth: 0
      - name: Apply fail-closed source transform
        shell: bash
        run: |
          python3 scripts/agent/apply_blog_forum_ui_ownership.py
          rm scripts/agent/apply_blog_forum_ui_ownership.py
          rm .github/workflows/agent-blog-forum-ui-ownership.yml
          rm .github/workflows/agent-blog-forum-ui-ownership-push.yml
          node --check scripts/verify/verify-blog-forum-ui-ownership.mjs
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); JSON.parse(require('fs').readFileSync('crates/rustok-blog/contracts/evidence/blog-forum-ui-ownership.json', 'utf8'));"
          git diff --check
      - name: Commit final source slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(blog): finalize Forum UI ownership cutover"
          git push origin HEAD:agent/blog-forum-ui-ownership-20260730
