name: Blog Category Hierarchy Contract

on:
  pull_request:
    paths:
      - "crates/modules/rustok-blog/src/dto/category.rs"
      - "crates/modules/rustok-blog/src/dto/category_command.rs"
      - "crates/modules/rustok-blog/src/dto/mod.rs"
      - "crates/modules/rustok-blog/src/services/category.rs"
      - "crates/modules/rustok-blog/src/services/category_command.rs"
      - "crates/modules/rustok-blog/src/services/mod.rs"
      - "crates/modules/rustok-blog/src/controllers/categories.rs"
      - "crates/modules/rustok-blog/src/controllers/mod.rs"
      - "crates/modules/rustok-blog/src/controllers/openapi.rs"
      - "crates/modules/rustok-blog/src/entities/blog_category.rs"
      - "crates/modules/rustok-blog/src/migrations/m20260812_000017_enforce_blog_category_hierarchy.rs"
      - "crates/modules/rustok-blog/src/translation_target_tests.rs"
      - "crates/modules/rustok-blog/tests/category_hierarchy.rs"
      - "crates/modules/rustok-blog/docs/category-hierarchy-contract.md"
      - "scripts/verify/verify-blog-category-hierarchy-command.mjs"
      - "crates/modules/rustok-blog/Cargo.toml"
      - ".github/workflows/blog-category-hierarchy-contract.yml"
  push:
    branches:
      - main
    paths:
      - "crates/modules/rustok-blog/src/dto/category.rs"
      - "crates/modules/rustok-blog/src/dto/category_command.rs"
      - "crates/modules/rustok-blog/src/dto/mod.rs"
      - "crates/modules/rustok-blog/src/services/category.rs"
      - "crates/modules/rustok-blog/src/services/category_command.rs"
      - "crates/modules/rustok-blog/src/services/mod.rs"
      - "crates/modules/rustok-blog/src/controllers/categories.rs"
      - "crates/modules/rustok-blog/src/controllers/mod.rs"
      - "crates/modules/rustok-blog/src/controllers/openapi.rs"
      - "crates/modules/rustok-blog/src/entities/blog_category.rs"
      - "crates/modules/rustok-blog/src/migrations/m20260812_000017_enforce_blog_category_hierarchy.rs"
      - "crates/modules/rustok-blog/src/translation_target_tests.rs"
      - "crates/modules/rustok-blog/tests/category_hierarchy.rs"
      - "crates/modules/rustok-blog/docs/category-hierarchy-contract.md"
      - "scripts/verify/verify-blog-category-hierarchy-command.mjs"
      - "crates/modules/rustok-blog/Cargo.toml"
      - ".github/workflows/blog-category-hierarchy-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  CARGO_ENCODED_RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: 0

jobs:
  category-hierarchy-contract:
    name: Blog category hierarchy contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify Blog category hierarchy source contract
        run: node scripts/verify/verify-blog-category-hierarchy-command.mjs
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Run Blog category hierarchy unit contract
        run: cargo test --locked -p rustok-blog --lib category_command::tests -- --nocapture
      - name: Run Blog category hierarchy integration contract
        run: cargo test --locked -p rustok-blog --test category_hierarchy -- --nocapture
      - name: Run Blog translation/hierarchy separation regression
        run: >-
          cargo test --locked -p rustok-blog --lib
          category_update_advances_exact_locale_and_owner_change_revisions -- --nocapture
