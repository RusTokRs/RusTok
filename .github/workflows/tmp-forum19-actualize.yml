name: Temporary FORUM-19 actualization patcher

on:
  push:
    branches:
      - agent/forum19-actualize-completion-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/forum19-actualize-completion-20260901
          fetch-depth: 0
      - name: Apply verified FORUM-19 handoff updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          def replace_tail(path, marker, new_tail):
              p = Path(path)
              text = p.read_text()
              if text.count(marker) != 1:
                  raise SystemExit(f"{path}: expected exactly one tail marker, found {text.count(marker)}")
              prefix, _ = text.split(marker, 1)
              p.write_text(prefix + new_tail.rstrip() + "\n")

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f"{path}: non-unique boundary start={text.count(start)} end={text.count(end)}")
              before, rest = text.split(start, 1)
              _, after = rest.split(end, 1)
              p.write_text(before + replacement.rstrip() + "\n\n" + end + after)

          forum_plan = "crates/rustok-forum/docs/implementation-plan.md"
          forum_doc = "crates/rustok-forum/docs/forum-19-moderation-subject-adapter.md"
          moderation_plan = "crates/rustok-moderation/docs/implementation-plan.md"
          recovery_doc = "crates/rustok-moderation/docs/application-operator-recovery.md"
          contract_path = "crates/rustok-forum/contracts/forum-moderation-subject-adapter.json"
          verifier_path = "scripts/verify/verify-forum-moderation-subject-adapter.mjs"

          replace_once(
              forum_doc,
              "Status: **bounded source-ready slice / maintainer execution pending**",
              "Status: **bounded implementation complete / production promotion deferred**",
          )
          replace_once(
              forum_doc,
              "Authorized admin transport/RBAC, explicit fresh-revision re-review flow and retained runtime evidence remain pending owner/host work.",
              "Authorized recovery GraphQL transport/RBAC and explicit fresh-revision re-review are now present. Repository-executable PostgreSQL/SQLite, concurrency, host-composition and scheduler evidence is retained; only deployment-dependent production promotion is deferred.",
          )
          replace_tail(
              forum_doc,
              "## Maintainer verification handoff",
              '''## Verification and production handoff

The bounded FORUM-19 implementation is complete in repository source. The follow-up slices that were previously listed as pending are already merged:

- dedicated `moderation_cases` RBAC plus the authorized recovery command port (#3202);
- host-owned authenticated GraphQL recovery transport (#3206);
- replay-safe fresh-revision -> new case -> new immutable decision re-review (#3209);
- PostgreSQL owner/recovery/application/dispatcher/lost-response/scheduler evidence (#3211, #3213, #3216, #3217, #3219, #3221);
- SQLite/PostgreSQL migration parity, executable host-composition failure coverage and Forum revision/concurrency/effect evidence (#3225, #3226, #3230, #3232, #3234).

The repository still intentionally does **not** claim a module-owned Moderation admin UI, a typed public application-lifecycle event family, support for every neutral Moderation effect, or production rollout/release readiness. `SetVisibility(Unpublished)` remains a distinct unsupported effect, and temporary/restriction effects still require exact expiry-safe Forum owner semantics before any future admission.

Deployment-dependent promotion is tracked only by `PROD-FORUM-19` in the Forum plan. Pending production validation does not reopen FORUM-19 implementation unless it exposes a genuine source/backend regression.''',
          )

          replace_once(
              recovery_doc,
              "Status: **owner recovery + authorized GraphQL recovery/re-review transport source-ready / maintainer execution pending**",
              "Status: **owner recovery + authorized GraphQL recovery/re-review transport implemented / production promotion deferred**",
          )
          replace_once(
              recovery_doc,
              "- retained runtime, PostgreSQL, SQLite or concurrency evidence.\n",
              "",
          )
          replace_tail(
              recovery_doc,
              "## Maintainer verification handoff",
              '''## Verification and promotion handoff

The recovery/RBAC/GraphQL/re-review implementation is retained by the existing source verifiers plus later repository evidence. PostgreSQL recovery parity landed in #3213; application-operation/dispatcher/lost-response/scheduler evidence landed in #3216, #3217, #3219 and #3221; SQLite/PostgreSQL migration and host-composition evidence landed in #3225/#3226.

The transport remains deliberately UI-agnostic. A module-owned Moderation admin UI is broader product work, not a prerequisite for the completed recovery transport or the bounded FORUM-19 producer integration. Deployment-dependent promotion belongs to the final production-validation phase rather than reopening these implementation slices.''',
          )

          replace_once(
              forum_plan,
              "Retained\nscheduler/runtime/recovery/concurrency evidence and authorized admin transport\nremain pending.",
              "Authorized recovery GraphQL transport/RBAC and fresh-revision re-review are now\npresent, and the repository retains the PostgreSQL/SQLite, scheduler, host-composition,\nlost-response and Forum concurrency/accounting evidence. Deployment-dependent promotion\nis deferred to the final production-validation phase.",
          )

          old_row = "| `FORUM-19` | `in_progress` | Neutral `forum_topic`/`forum_post` adapter factories, dedicated Forum moderation subject revision clocks, shared receipt/revision fencing, trusted application callers, permanent topic lock, exact reply Hidden/Removed/RejectPublication, optional host materialization, Moderation-owned durable application operations, bounded one-attempt exact adapter dispatch, shared `ModuleWorkScheduler`, atomic application/case audit lifecycle, same-decision human operator requeue for rejected/operator-review, and truthful legacy-terminal reconciliation without domain invocation are source-ready. Applied decisions cannot be requeued; true stale-revision re-review requires a fresh case/new immutable decision. Retain host/scheduler/recovery plus PostgreSQL/SQLite migration/lease/dispatch/lost-response/concurrency and Forum accounting/event/tombstone/solution evidence; keep `Unpublished` distinct/fail-closed. Remaining code/product work is authorized Moderation admin transport/RBAC and explicit fresh-revision re-review flow. Moderation keeps cases, decisions, appeals and audit. |"
          new_row = "| `FORUM-19` | `done` | Bounded Forum/Moderation integration is complete: neutral topic/reply adapters, Forum-owned revision fencing and exact supported effects, Moderation-owned durable dispatch/scheduler/audit/recovery, dedicated `moderation_cases` RBAC, authorized recovery GraphQL transport, replay-safe fresh-revision new-case/new-decision re-review, and retained PostgreSQL/SQLite/host/concurrency/lost-response/accounting evidence are present. `Unpublished`, temporary restrictions and broader neutral effects remain separate future feature scope rather than lossy approximations. Deployment/promotion evidence is deferred to `PROD-FORUM-19`; Moderation keeps cases, decisions, appeals and audit. |"
          replace_once(forum_plan, old_row, new_row)

          release_marker = "## Release gates"
          prod19 = '''### PROD-FORUM-19 — Moderation composed deployment/promotion validation — DEFERRED

After the remaining Forum source/backend queue is exhausted, retain deployment-level proof for the selected production distribution: Moderation owner/runtime selection, real background-worker lifecycle, recovery operator access and representative Forum decision application under the deployed host configuration. Capture the exact deployment/release provenance required by the final release gate.

This item does **not** absorb repository-executable engineering gates. SQLite/PostgreSQL migration/operation tests, host composition profiles, scheduler concurrency/stop tests, lost-response replay and Forum revision/effect/accounting tests remain implementation evidence and are already retained in the repository. Pending deployment promotion does not reopen FORUM-19 unless it exposes a genuine implementation regression.

'''
          replace_once(forum_plan, release_marker, prod19 + release_marker)

          replace_between(
              forum_plan,
              "For FORUM-19, retain server composition evidence",
              "## Verification checklist",
              '''FORUM-19 implementation is complete. Do not reopen it for deployment-only promotion; track deployed-host/runtime/release proof under `PROD-FORUM-19`. Unsupported `SetVisibility(Unpublished)`, temporary restrictions and other neutral effects remain fail-closed until a separately accepted feature slice defines exact Forum owner semantics. The broader Moderation admin UI, public event family and additional producer adapters remain Moderation-platform work rather than Forum-owned recovery or queue logic.''',
          )

          replace_once(
              moderation_plan,
              "The remaining orchestration code gap is no longer same-decision requeue or legacy-terminal\nreconciliation. Remaining owner/product work is the authorized admin transport/UI for these\ncommands and the explicit fresh-case/new-decision re-review workflow, plus retained runtime,\nconcurrency and database evidence before promotion.",
              "The previously open FORUM-19 orchestration gaps are closed: dedicated `moderation_cases`\nRBAC, the authorized recovery GraphQL transport and the explicit fresh-revision -> new case ->\nnew immutable decision re-review workflow are present. Repository-executable PostgreSQL/SQLite,\nhost-composition, dispatcher, scheduler, lost-response and concurrency evidence is also retained.\nA module-owned admin UI remains broader Moderation product work; deployment promotion is deferred\nto final production validation rather than keeping the bounded Forum integration open.",
          )

          source_marker = "\n## Next priorities\n"
          source_addition = '''
- dedicated Moderation recovery authorization through `moderation_cases:override` / effective
  `moderation_cases:manage`, with tenant permission vocabulary supplied by platform RBAC;
- host-owned authenticated GraphQL recovery transport for same-decision requeue, legacy-terminal
  reconciliation and fresh-revision re-review;
- replay-safe fresh-revision re-review that creates a new case and immutable decision without
  retargeting historical truth;
- retained repository evidence for PostgreSQL owner/recovery/application/dispatcher/scheduler and
  lost-response behavior, SQLite/PostgreSQL operation migration parity, host-composition failures,
  and Forum revision/concurrency/effect/accounting boundaries.
'''
          replace_once(moderation_plan, source_marker, source_addition + source_marker)

          replace_between(
              moderation_plan,
              "## Next priorities",
              "## Invariants",
              '''## Next priorities

1. Publish the remaining typed transactional/public Moderation application event contracts without turning the internal `moderation_events` audit ledger into an accidental cross-domain API.
2. Integrate Groups as the membership-scoped expiry reference adapter, then continue the accepted producer sequence (Blog, Comments, Pages, Reviews, Marketplace, Media, Messaging and Profiles) through `rustok-moderation-api` without cross-owner persistence reads.
3. Add versioned policies, premoderation, automated assessment providers, appeals and capability-scoped account sanctions while preserving immutable decision/effect identity and owner-side application evidence.
4. Build the broader module-owned Moderation admin queue/case/application UI over the existing authorized ports and transport. The recovery GraphQL boundary already exists; UI navigation is not a security boundary.
5. Keep Forum `SetVisibility(Unpublished)` and temporary/restriction effects fail-closed until Forum owns exact distinct lifecycle/expiry-safe semantics; do not approximate unsupported effects to existing statuses.''',
          )

          if "## Final production validation — DEFERRED" not in Path(moderation_plan).read_text():
              p = Path(moderation_plan)
              text = p.read_text().rstrip()
              text += '''\n\n## Final production validation — DEFERRED\n\nDeployment-dependent promotion is collected after the remaining Moderation source/backend product queue is exhausted. Live deployment selection, operator credentials, observed background-worker behavior and release provenance do not keep an otherwise complete implementation slice open.\n\nRepository-executable engineering evidence is not deferred: SQLite/PostgreSQL migrations and owner contracts, concurrency/lease/replay tests, host composition profiles, source verifiers and isolated runtime scheduler tests remain part of the implementation boundary that changes them.\n'''
              p.write_text(text)

          contract = json.loads(Path(contract_path).read_text())
          contract["implementation_status"] = "complete"
          contract["production_validation"] = "deferred"
          contract["completion_boundary"] = (
              "FORUM-19 bounded implementation is complete; deployment-dependent promotion is deferred "
              "to final production validation and does not reopen implementation unless it exposes a regression"
          )
          recovery = contract["owner_application_operation"]["operator_recovery"]
          recovery["authorized_transport"] = (
              "host-owned apps/server GraphQL transport requires tenant match, human user principal, "
              "moderation_cases:override effective authority, enabled moderation module and non-nil root idempotency"
          )
          recovery["fresh_revision_rereview"] = (
              "authorized GraphQL workflow composes read + open_case + assign_case + decide_case with deterministic "
              "receipt identities to create a new case and immutable decision at an explicit newer producer revision"
          )
          contract["not_claimed"] = [
              "Moderation-owned bespoke polling loop outside the shared ModuleWorkScheduler",
              "typed cross-domain application lifecycle outbox event family",
              "module-owned Moderation admin UI for recovery",
              "automatic replacement decision or silent retargeting after escalation",
              "SetVisibility Unpublished support",
              "all neutral Moderation effect coverage",
              "production deployment or rollout validation",
              "release readiness",
          ]
          Path(contract_path).write_text(json.dumps(contract, indent=2) + "\n")

          replace_once(
              verifier_path,
              'const replyOwner = fs.readFileSync("crates/rustok-forum/src/services/reply_owner.rs", "utf8");\n',
              'const replyOwner = fs.readFileSync("crates/rustok-forum/src/services/reply_owner.rs", "utf8");\nconst recoveryTransport = fs.readFileSync("apps/server/src/graphql/moderation_recovery.rs", "utf8");\n',
          )
          replace_once(
              verifier_path,
              'if (contract.capability_owner !== "rustok-moderation") {\n  throw new Error("Moderation ownership must remain with rustok-moderation");\n}\n',
              'if (contract.capability_owner !== "rustok-moderation") {\n  throw new Error("Moderation ownership must remain with rustok-moderation");\n}\nif (contract.implementation_status !== "complete") {\n  throw new Error("FORUM-19 bounded implementation must be complete");\n}\nif (contract.production_validation !== "deferred" || !contract.completion_boundary?.includes("deployment-dependent promotion")) {\n  throw new Error("FORUM-19 production validation must be deferred without reopening implementation");\n}\nfor (const marker of [\n  "requeue_moderation_application",\n  "reconcile_legacy_moderation_application",\n  "create_moderation_rereview",\n  "auth.is_human_user_principal()",\n  "Permission::MODERATION_CASES_OVERRIDE",\n  "require_module_enabled(ctx, MODULE_SLUG).await?",\n]) {\n  requireText(recoveryTransport, marker, `Moderation recovery GraphQL transport is missing ${marker}`);\n}\n',
          )
          replace_once(
              verifier_path,
              'if (!contract.not_claimed.includes("complete FORUM-19 effect coverage")) {\n  throw new Error("bounded slice must not claim complete FORUM-19 coverage");\n}\n',
              'if (!contract.not_claimed.includes("all neutral Moderation effect coverage")) {\n  throw new Error("completed bounded FORUM-19 slice must not claim every neutral Moderation effect");\n}\nfor (const staleClaim of [\n  "authorized admin transport or UI for operator recovery",\n  "retained operator recovery execution evidence",\n  "retained host composition execution evidence",\n  "retained runtime decision application execution",\n  "retained multi-host scheduler race and graceful shutdown evidence",\n  "PostgreSQL concurrency evidence",\n  "SQLite evidence",\n]) {\n  if (contract.not_claimed.includes(staleClaim)) {\n    throw new Error(`FORUM-19 contract still carries completed evidence as not claimed: ${staleClaim}`);\n  }\n}\n',
          )
          PY

          node scripts/verify/verify-forum-moderation-subject-adapter.mjs
          node scripts/verify/verify-moderation-application-operator-recovery.mjs
          node scripts/verify/verify-moderation-recovery-graphql-transport.mjs
          python3 -m json.tool crates/rustok-forum/contracts/forum-moderation-subject-adapter.json >/dev/null
          git diff --check

          rm .github/workflows/tmp-forum19-actualize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(forum): actualize FORUM-19 completion"
          git push origin HEAD:agent/forum19-actualize-completion-20260901
