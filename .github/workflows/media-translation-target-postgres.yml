name: Media Translation Target PostgreSQL Evidence

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "apps/server/Cargo.toml"
      - "apps/server/src/services/app_runtime.rs"
      - "apps/server/src/services/module_event_dispatcher.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/media_translation_composition.rs"
      - "crates/rustok-media/**"
      - "crates/rustok-translation-targets/**"
      - "crates/rustok-outbox/**"
      - "crates/rustok-storage/**"
      - "docs/modules/translation-implementation-plan.md"
      - "crates/rustok-translation/docs/implementation-plan.md"
      - "crates/rustok-media/docs/implementation-plan.md"
      - ".github/workflows/media-translation-target-postgres.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "apps/server/Cargo.toml"
      - "apps/server/src/services/app_runtime.rs"
      - "apps/server/src/services/module_event_dispatcher.rs"
      - "apps/server/src/services/mod.rs"
      - "apps/server/tests/media_translation_composition.rs"
      - "crates/rustok-media/**"
      - "crates/rustok-translation-targets/**"
      - "crates/rustok-outbox/**"
      - "crates/rustok-storage/**"
      - "docs/modules/translation-implementation-plan.md"
      - "crates/rustok-translation/docs/implementation-plan.md"
      - "crates/rustok-media/docs/implementation-plan.md"
      - ".github/workflows/media-translation-target-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-translation-target-postgres
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUSTOK_MEDIA_TRANSLATION_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/rustok_media_translation_evidence

jobs:
  postgres-evidence:
    name: Media translation PostgreSQL replica/runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustok_media_translation_evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rustok_media_translation_evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Run actions/checkout@v7
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Require exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Run dtolnay/rust-toolchain@master
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Run Swatinem/rust-cache@v2
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: media-translation-target-postgres

      - name: Check focused evidence formatting
        run: >-
          cargo fmt --check --
          crates/rustok-media/tests/translation_target_postgres.rs
          apps/server/tests/media_translation_composition.rs

      - name: Compile Media PostgreSQL translation evidence
        run: cargo test --locked -p rustok-media --test translation_target_postgres --no-run

      - name: Execute Media PostgreSQL translation evidence
        run: >-
          cargo test --locked -p rustok-media --test translation_target_postgres --
          --ignored --nocapture

      - name: Compile isolated Media server composition
        run: >-
          cargo test --locked -p rustok-server --no-default-features --features mod-media
          --test media_translation_composition --no-run

      - name: Execute isolated Media server composition
        run: >-
          cargo test --locked -p rustok-server --no-default-features --features mod-media
          --test media_translation_composition -- --nocapture
