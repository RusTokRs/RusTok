name: Index Storage ADR Applier

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  actions: read
  contents: write

jobs:
  apply:
    name: Archive evidence and accept JSONB ADR
    if: ${{ github.head_ref == 'agent/index-accept-jsonb-storage-adr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download validated replacement evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          root=/tmp/index-storage-adr
          mkdir -p "$root/100k" "$root/1m" "$root/comparison"
          download_artifact() {
            local id="$1"
            local output="$2"
            local directory="$3"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${id}/zip" \
              --output "$output"
            unzip -q "$output" -d "$directory"
          }
          download_artifact 8637846191 "$root/index-storage-100k-eae5f742.zip" "$root/100k"
          download_artifact 8638163701 "$root/index-storage-1m-eae5f742.zip" "$root/1m"
          download_artifact 8638169338 "$root/index-storage-comparison-eae5f742.zip" "$root/comparison"

          node scripts/verify/index-storage-tooling.mjs packet \
            --scale 100k --root "$root/100k"
          node scripts/verify/index-storage-tooling.mjs packet \
            --scale 1m --root "$root/1m"

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/index-storage-adr')
          comparison = json.loads((root / 'comparison/comparison.json').read_text())
          assert comparison['decision_ready'] is True
          assert comparison['methodology']['automatic_winner_selection'] is False
          assert {item['scale'] for item in comparison['scales']} == {'100k', '1m'}
          for item in comparison['scales']:
              provenance = item['provenance']
              assert provenance['repository'] == 'RusTokRs/RusTok'
              assert provenance['commit'] == 'eae5f74241e9431bffe2fd8c43cd046fc1c1f679'
              assert provenance['run_id'] == '30222913450'
          PY

      - name: Build accepted decision and synchronize documentation
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/index-storage-adr
          archive=crates/rustok-index/docs/evidence/2026-07-27-postgresql-storage
          mkdir -p "$archive"
          cp "$root/index-storage-100k-eae5f742.zip" "$archive/"
          cp "$root/index-storage-1m-eae5f742.zip" "$archive/"
          cp "$root/index-storage-comparison-eae5f742.zip" "$archive/"
          cp "$root/comparison/comparison.json" "$archive/comparison.json"
          cp "$root/comparison/comparison.md" "$archive/comparison.md"

          actual_sha="$(sha256sum "$archive/comparison.json" | cut -d' ' -f1)"
          test "$actual_sha" = 7d10a3de9f62cf315d578794d1b69caa9a45d72847d1480cd24f9a9da4e9bbd8

          node scripts/verify/index-storage-tooling.mjs prepare \
            --comparison "$archive/comparison.json" \
            --selected jsonb \
            --owner "RusToK platform / Index module" \
            --date 2026-07-27 \
            --output "$archive/decision.json"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('crates/rustok-index/docs/evidence/2026-07-27-postgresql-storage/decision.json')
          decision = json.loads(path.read_text())
          decision.update({
              'status': 'accepted',
              'selection_rationale': 'Select JSONB entity rows as the canonical generic Index storage. JSONB is the simplest candidate that satisfies the owner-published, schema-agnostic Index boundary without source-specific tables or base-table DDL for every new field. The replacement 1m packet shows a materially better overall operational profile than typed EAV: 4.25 GiB versus 8.14 GiB of schema storage, 127,965 ms versus 427,256 ms load time, 0.08 ms versus 152.45 ms warm keyset latency, 10.68 ms versus 100.72 ms warm exact-count latency, 149.59 ms versus 188.79 ms update latency, 1,029,145 versus 1,346,681 median maximum-node WAL bytes for the update workload, and 3,124 ms versus 16,490 ms VACUUM duration. JSONB also keeps one logical entity in one source-versioned row while preserving independent relational links. Hot projection is faster and smaller in several measurements, but it is not eligible as the canonical generic representation because it hard-codes entity-specific columns and rollout code.',
              'rejection_rationales': {
                  'typed_eav': 'Reject typed EAV because the corrected replacement evidence does not provide a decisive benefit that offsets its higher physical and operational complexity. At 1m it uses 8.14 GiB versus JSONB at 4.25 GiB, loads in 427,256 ms versus 127,965 ms, expands each logical entity into an envelope plus many field rows, produces substantially worse keyset and exact-count latency, records higher update WAL, and requires 16,490 ms VACUUM versus 3,124 ms. Its faster equality and tag probes do not justify the additional joins, ordinals, deduplication, mutation fan-out, field-row diagnostics, and rebuild surface for the canonical engine.',
                  'hot_projection': 'Reject hot projection as canonical storage despite its best measured size and latency. The prototype encodes Product, Variant, and SalesChannel as dedicated typed tables; every new owner-published entity or indexed field would require Index-core DDL, migrations, query code, and operational rollout. That violates the accepted generic Index ownership boundary and prevents ordinary module/schema registration from making a new entity queryable. A future optional derived hot projection or cache may be proposed only through a separate ADR with its own consistency, rebuild, and evidence contract.',
              },
              'operational_tradeoffs': 'The production model uses a constrained relational envelope plus validated JSONB payloads and independent relational links. Registry validation remains mandatory because PostgreSQL cannot enforce every dynamic field type inside JSONB. Every read, mutation, maintenance, rebuild, and diagnostic path must constrain tenant, module, entity, schema version, entity ID, and locale. Typed filtering and ordering use deterministic schema-managed expression indexes; a general GIN index is optional and may be created only for measured containment workloads. The index manager owns stable names, predicates, concurrent creation, readiness, reindexing, retirement, and per-schema diagnostics. Payload updates rewrite one entity row and can create WAL and tuple churn, so operators must track table/index bytes, WAL, dead tuples, autovacuum lag, and query-plan drift. The initial canonical tables remain unpartitioned because partitioning was not part of the M2 evidence; all primary and secondary keys remain tenant-leading so a later measured shadow migration may introduce tenant-hash partitioning without changing logical identity. Production health must not depend on VACUUM FULL or other exclusive rewrites.',
              'migration_strategy': 'M3 creates a generic entity table keyed by tenant, module, entity, schema version, entity ID, and locale, with monotonic source_version, schema fingerprint/version metadata, and a JSONB payload. A separate link table stores complete source and target identities, link name, and ordinal. Inbox deduplication, entity upsert/delete, and complete outgoing-link replacement execute in one transaction and reject stale source versions. Secondary indexes are derived from registry-declared filterable/sortable fields and built concurrently through an observable index-management job; no source-domain table or bespoke entity table is introduced. Initial population uses paginated IndexSource scan/load into shadow storage, followed by exact entity/link cardinality, digest, schema-fingerprint, and checkpoint parity checks. Cutover occurs only after the shadow store is query-equivalent and caught up through the mutation inbox. The archived comparison and accepted decision are retained before removing the typed EAV and hot benchmark prototypes.',
              'rollback_strategy': 'There is no production Index persistence to preserve before M3, so the first rollout is additive and remains disabled until shadow backfill and parity verification succeed. During rollout, source modules remain authoritative and the previous storage adapter/configuration and checkpoint are retained for a bounded verification window. A failed cutover disables the JSONB adapter, restores the prior routing/configuration, discards or quarantines the shadow tables, and rebuilds from owner-provided IndexSource streams; it never falls back to typed EAV or hot projection and never reads source-module tables directly. After the verification window, rollback continues to mean recreate a clean JSONB store from authoritative sources and replay the durable inbox from the last accepted checkpoint rather than attempting an in-place reverse migration.',
          })
          path.write_text(json.dumps(decision, indent=2, ensure_ascii=False) + '\n')
          PY

          node scripts/verify/index-storage-tooling.mjs render \
            --comparison "$archive/comparison.json" \
            --decision "$archive/decision.json" \
            --output DECISIONS/2026-07-24-index-storage-layout.md
          node scripts/verify/index-storage-tooling.mjs verify-adr \
            --comparison "$archive/comparison.json" \
            --decision "$archive/decision.json" \
            --adr DECISIONS/2026-07-24-index-storage-layout.md

          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'missing marker in {path}: {old[:80]}')
              file.write_text(text.replace(old, new, 1))

          replace('DECISIONS/README.md',
                  '| [2026-07-24](./2026-07-24-index-storage-layout.md) | Physical PostgreSQL layout for the Index Engine | Proposed |',
                  '| [2026-07-24](./2026-07-24-index-storage-layout.md) | Physical PostgreSQL layout for the Index Engine | Accepted |')

          path = Path('crates/rustok-index/docs/implementation-plan.md')
          text = path.read_text()
          replacements = {
              '- M2 read/query harness: `historical smoke/100k archived; replacement 100k/1m pending`': '- M2 read/query harness: `replacement 100k/1m archived from run 30222913450`',
              '- M2 transactional mutation/WAL harness: `historical smoke/100k archived; replacement 100k/1m pending`': '- M2 transactional mutation/WAL harness: `replacement 100k/1m archived from run 30222913450`',
              '- M2 persistent churn/VACUUM harness: `historical smoke/100k archived; replacement 100k/1m pending`': '- M2 persistent churn/VACUUM harness: `replacement 100k/1m archived from run 30222913450`',
              '- M2 comparison provenance contract: `complete`': '- M2 comparison provenance contract: `complete`\n- M2 storage decision: `JSONB accepted; rejected prototype deletion pending`',
              '- Production persistence: intentionally absent until the M2 ADR selects a model': '- Production persistence: intentionally absent until M3 implements the accepted JSONB model',
              '- [ ] Run and archive replacement 100k Product-locale row read, mutation, and\n      maintenance evidence after the full-identity corrections.': '- [x] Run and archive replacement 100k Product-locale row read, mutation, and\n      maintenance evidence after the full-identity corrections.',
              '- [ ] Run and archive replacement 1m Product-locale row read, mutation, and\n      maintenance evidence from the same commit as replacement 100k.': '- [x] Run and archive replacement 1m Product-locale row read, mutation, and\n      maintenance evidence from the same commit as replacement 100k.',
              '- [ ] Compare warm/cold buffers, planner stability, execution latency, ingestion\n      throughput, relation size, WAL, dead tuples, vacuum behavior, and operational\n      complexity.': '- [x] Compare warm/cold buffers, planner stability, execution latency, ingestion\n      throughput, relation size, WAL, dead tuples, vacuum behavior, and operational\n      complexity.',
              '- [ ] Record the selected model and rejected alternatives in an ADR.': '- [x] Record the selected model and rejected alternatives in an ADR.',
              'M2 remains open until replacement same-commit PostgreSQL evidence is archived and\nthe storage ADR is accepted. Implementing or correcting the harness does not\nselect a model.': 'Replacement same-commit PostgreSQL evidence is archived and the accepted ADR\nselects JSONB as canonical generic storage. M2 remains open only for deletion of\nthe rejected typed-EAV and hot-projection benchmark prototypes; implementing or\ncorrecting the harness alone did not select the model.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing plan marker: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('crates/rustok-index/docs/storage-benchmark.md')
          text = path.read_text()
          for old, new in {
              '- Production migrations: intentionally absent': '- Production migrations: intentionally absent pending M3 implementation',
              '- Replacement evidence: same-commit 100k and 1m packets pending after full-identity corrections': '- Replacement evidence: validated same-commit 100k and 1m packets from Actions run `30222913450` on `eae5f74241e9431bffe2fd8c43cd046fc1c1f679`',
              '- 1m evidence: enabled on `INDEX_BENCH_LARGE_RUNNER` when configured, otherwise `ubuntu-latest`, with a fail-closed 35 GB free-disk check': '- 1m evidence: validated on `ubuntu-latest` after the fail-closed 35 GB free-disk check',
              '- Storage decision ADR: Proposed; acceptance waits on replacement 100k/1m evidence and the generated comparison': '- Storage decision ADR: Accepted; JSONB is the canonical generic entity storage model',
          }.items():
              if old not in text:
                  raise SystemExit(f'missing benchmark marker: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          replace('crates/rustok-index/docs/storage-comparison.md',
                  'The canonical proposed decision record is\n[`DECISIONS/2026-07-24-index-storage-layout.md`](../../../DECISIONS/2026-07-24-index-storage-layout.md).',
                  'The canonical accepted decision record is\n[`DECISIONS/2026-07-24-index-storage-layout.md`](../../../DECISIONS/2026-07-24-index-storage-layout.md).')
          replace('crates/rustok-index/docs/storage-evidence-runbook.md',
                  'M2 remains open until the replacement packets are archived, the comparison is reviewed, and the ADR is accepted.\nOnly after that decision may the rejected prototype implementations and schemas\nbe deleted.',
                  'The canonical replacement run is `30222913450` on commit\n`eae5f74241e9431bffe2fd8c43cd046fc1c1f679`. Both validated packets, the\ndecision-ready comparison, and the accepted decision are archived under\n`docs/evidence/2026-07-27-postgresql-storage/`. The accepted ADR selects JSONB.\nM2 remains open only until the rejected typed-EAV and hot-projection benchmark\nimplementations and schemas are deleted.')

          path = Path('crates/rustok-index/docs/storage-operational-review.md')
          text = path.read_text()
          marker = '## ADR completion checklist\n'
          addition = '''## Accepted decision\n\nThe replacement same-commit run `30222913450` completed the validated `100k`,\n`1m`, and decision-ready comparison on commit\n`eae5f74241e9431bffe2fd8c43cd046fc1c1f679`. The accepted ADR selects JSONB\nentity rows as canonical generic storage. Typed EAV did not produce a decisive\nmeasured advantage over its additional row, join, mutation, and maintenance\nsurface. Hot projection remains ineligible as canonical storage because it\nhard-codes source-specific schemas; it may only return as a separately measured\nderived projection.\n\n'''
          if marker not in text:
              raise SystemExit('missing operational review marker')
          path.write_text(text.replace(marker, addition + marker, 1))

          path = Path('crates/rustok-index/docs/README.md')
          text = path.read_text()
          pairs = [
              ('It treats the hot typed\nprojection as a best-case baseline rather than an eligible canonical generic\nmodel and leaves the JSONB versus typed-EAV decision open for corrected scale\nevidence.', 'It treats the hot typed projection as a best-case baseline rather than an\neligible canonical generic model. Replacement same-commit evidence selected JSONB\nover typed EAV because JSONB preserved the generic boundary with materially lower\nsize, load, mutation, keyset/count, and maintenance cost.'),
              ('The archived smoke and original 100k packets remain historical diagnostics. The\nstorage ADR requires replacement same-commit `100k`/`1m` evidence generated after\nthe identity corrections, the generated comparison, and explicit rejection\nreasons. No production migration may be added before the ADR is accepted.', 'The archived smoke and original 100k packets remain historical diagnostics.\nActions run `30222913450` produced validated replacement `100k`/`1m` packets and\na decision-ready comparison on one commit. The accepted storage ADR selects JSONB;\nproduction migrations remain absent until M3 implements that model.'),
              ('- M2 replacement 100k/1m evidence and ADR: `pending`', '- M2 replacement 100k/1m evidence and ADR: `complete`'),
              ('- Production migrations: intentionally absent pending M2 benchmark evidence', '- Production migrations: intentionally absent pending M3 JSONB implementation'),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f'missing README marker: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          decision_sha="$(sha256sum "$archive/decision.json" | cut -d' ' -f1)"
          test "$decision_sha" = ae77267776a38264c9432618459fb80559962842877596fc156ebd4e3a12e883

          cat > "$archive/README.md" <<'EOF'
          # Accepted Index PostgreSQL storage evidence

          This directory preserves the exact decision inputs and the original validated
          GitHub Actions artifacts for the accepted Index PostgreSQL storage ADR.

          - Workflow run: `30222913450`
          - Repository commit: `eae5f74241e9431bffe2fd8c43cd046fc1c1f679`
          - PostgreSQL image: `postgres:16`
          - Packet contract: `v2`
          - Result digest contract: `ordered_length_prefixed_json_v1`
          - Repetitions: `3`
          - Churn cycles: `5`
          - Selected model: `jsonb`
          - Comparison SHA-256: `7d10a3de9f62cf315d578794d1b69caa9a45d72847d1480cd24f9a9da4e9bbd8`
          - Decision SHA-256: `ae77267776a38264c9432618459fb80559962842877596fc156ebd4e3a12e883`

          The three ZIP files are the original Actions artifacts. `comparison.json`,
          `comparison.md`, and `decision.json` are extracted exact files used by
          `DECISIONS/2026-07-24-index-storage-layout.md`.

          Verify the accepted ADR from the repository root with:

          ```bash
          node scripts/verify/index-storage-tooling.mjs verify-adr \
            --comparison crates/rustok-index/docs/evidence/2026-07-27-postgresql-storage/comparison.json \
            --decision crates/rustok-index/docs/evidence/2026-07-27-postgresql-storage/decision.json \
            --adr DECISIONS/2026-07-24-index-storage-layout.md
          ```

          The failed predecessor run `30220486083` is diagnostic only and is not part of
          this archive.
          EOF
          sed -i 's/^          //' "$archive/README.md"

          node scripts/verify/index-storage-tooling.mjs verify-adr \
            --comparison "$archive/comparison.json" \
            --decision "$archive/decision.json" \
            --adr DECISIONS/2026-07-24-index-storage-layout.md

      - name: Publish clean ADR commit
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/index-storage-adr-applier.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(index): accept JSONB storage ADR"
          git push origin "HEAD:${HEAD_REF}"
