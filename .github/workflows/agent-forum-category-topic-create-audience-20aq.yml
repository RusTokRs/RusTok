name: Agent Forum category topic-create audience 20AQ

on:
  push:
    branches:
      - agent/forum-category-topic-create-audience-20aq
    paths:
      - .github/workflows/agent-forum-category-topic-create-audience-20aq.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-forum-category-topic-create-audience-20aq.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/forum-category-topic-create-audience-20aq
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply FORUM-20AQ source slice
        run: python scripts/agent/apply_forum_20aq.py
      - name: Commit source slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(forum): add category topic-create audience policy"
          git push origin HEAD:agent/forum-category-topic-create-audience-20aq
