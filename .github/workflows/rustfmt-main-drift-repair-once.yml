name: One-shot main rustfmt drift repair

on:
  push:
    branches:
      - agent/rustfmt-main-drift-20260813
    paths:
      - ".github/workflows/rustfmt-main-drift-repair-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/rustfmt-main-drift-20260813
          fetch-depth: 1

      - name: Install exact rustfmt toolchain
        shell: bash
        run: rustup toolchain install 1.97.1 --component rustfmt --profile minimal --no-self-update

      - name: Apply bounded workspace rustfmt repair
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --all
          rm .github/workflows/rustfmt-main-drift-repair-once.yml

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/rustfmt-main-drift-repair-once.yml \
            crates/rustok-build/src/module_manifest_contribution.rs \
            crates/rustok-content-orchestration/src/lib.rs \
            crates/rustok-taxonomy/tests/route_registry_contention_postgres.rs | sort)"
          test "$actual" = "$expected"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/rustfmt-main-drift-repair-once.yml \
            crates/rustok-build/src/module_manifest_contribution.rs \
            crates/rustok-content-orchestration/src/lib.rs \
            crates/rustok-taxonomy/tests/route_registry_contention_postgres.rs
          git diff --cached --check
          git commit -m "style: apply current workspace rustfmt"
          git push origin HEAD:agent/rustfmt-main-drift-20260813
