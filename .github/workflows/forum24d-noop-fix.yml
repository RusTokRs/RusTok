name: FORUM-24D no-op fix

on:
  push:
    branches:
      - feat/forum-24d-topic-slug-rename
    paths:
      - .github/forum24d_noop_fix.py
      - .github/workflows/forum24d-noop-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/forum-24d-topic-slug-rename
          fetch-depth: 1
      - name: Keep exact replay side-effect free
        run: python .github/forum24d_noop_fix.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/forum24d_noop_fix.py .github/workflows/forum24d-noop-fix.yml
          git add crates/rustok-forum/src/services/topic_owner.rs
          git commit -m "fix(forum): keep slug rename replay side-effect free"
          git push origin HEAD:feat/forum-24d-topic-slug-rename
