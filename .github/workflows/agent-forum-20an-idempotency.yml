name: Agent Forum 20AN exact idempotency

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/forum-notification-group-state-graphql-20an'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Preserve exact idempotency key
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          graphql_path = Path("crates/rustok-notifications/src/graphql.rs")
          graphql = graphql_path.read_text()
          start = graphql.index("fn parse_idempotency_key(value: String) -> Result<String> {")
          end = graphql.index("\n}\n", start) + 3
          block = graphql[start:end]
          if block.count("    let value = value.trim();\n") != 1:
              raise SystemExit("GraphQL idempotency trim anchor is missing")
          block = block.replace("    let value = value.trim();\n", "", 1)
          if block.count("    Ok(value.to_string())\n") != 1:
              raise SystemExit("GraphQL idempotency return anchor is missing")
          block = block.replace("    Ok(value.to_string())\n", "    Ok(value)\n", 1)
          graphql_path.write_text(graphql[:start] + block + graphql[end:])

          proof_path = Path("crates/rustok-notifications/storefront/tests/group_state_graphql_contract.rs")
          proof = proof_path.read_text()
          proof_anchor = "    assert!(OWNER_PORT.contains(\"NotificationInboxGroupStateService\"));\n"
          if proof.count(proof_anchor) != 1:
              raise SystemExit("source proof owner-service anchor is missing")
          proof_path.write_text(proof.replace(proof_anchor, proof_anchor + "    assert!(!OWNER_GRAPHQL.contains(\"let value = value.trim();\"));\n", 1))

          verifier_path = Path("scripts/verify/verify-forum-notification-inbox-group-state-graphql.mjs")
          verifier = verifier_path.read_text()
          verifier_anchor = "requireText(\n  port,\n  \"NotificationInboxGroupStateService\",\n  \"owner port must reuse group state service\",\n);\n"
          verifier_guard = "rejectText(\n  owner,\n  \"let value = value.trim();\",\n  \"GraphQL idempotency keys must remain exact opaque values\",\n);\n"
          if verifier.count(verifier_anchor) != 1:
              raise SystemExit("verifier owner-service anchor is missing")
          verifier_path.write_text(verifier.replace(verifier_anchor, verifier_anchor + verifier_guard, 1))

          Path(".github/workflows/agent-forum-20an-idempotency.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(notifications): preserve exact GraphQL idempotency keys"
          git push origin HEAD
