name: FORUM-24A fixture fix

on:
  push:
    branches:
      - feat/forum-24a-topic-route-identity
    paths:
      - .github/forum24a_fix.py
      - .github/workflows/forum24a-fixture-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/forum-24a-topic-route-identity
          fetch-depth: 1
      - name: Apply fixture correction
        run: python .github/forum24a_fix.py
      - name: Commit fixture correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/forum24a_fix.py .github/workflows/forum24a-fixture-fix.yml
          git add crates/rustok-forum/tests/topic_route_identity_sqlite.rs
          git commit -m "test(forum): use owner topic tombstone path"
          git push origin HEAD:feat/forum-24a-topic-route-identity
