name: Tenant hardening

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-tenant/**"
      - "crates/rustok-auth/cli/**"
      - "apps/storefront/src/shared/context/enabled_modules.rs"
      - "apps/storefront/src/shared/context/enabled_modules_native_server_adapter.rs"
      - "apps/storefront/docs/implementation-plan.md"
      - "apps/server/tests/lifecycle_bypass_guard.rs"
      - "apps/server/src/services/tenant_locale_generation*.rs"
      - "scripts/verify/verify-tenant-fba.mjs"
      - "scripts/verify/verify-tenant-locale-policy-migration.mjs"
      - "scripts/verify/verify-tenant-hardening-workflow.mjs"
      - "docs/migrations/backfill-contracts.json"
      - "docs/verification/PLATFORM_VERIFICATION_PLAN.md"
      - ".github/workflows/tenant-hardening.yml"
  pull_request:
    paths:
      - "crates/rustok-tenant/**"
      - "crates/rustok-auth/cli/**"
      - "apps/storefront/src/shared/context/enabled_modules.rs"
      - "apps/storefront/src/shared/context/enabled_modules_native_server_adapter.rs"
      - "apps/storefront/docs/implementation-plan.md"
      - "apps/server/tests/lifecycle_bypass_guard.rs"
      - "apps/server/src/services/tenant_locale_generation*.rs"
      - "scripts/verify/verify-tenant-fba.mjs"
      - "scripts/verify/verify-tenant-locale-policy-migration.mjs"
      - "scripts/verify/verify-tenant-hardening-workflow.mjs"
      - "docs/migrations/backfill-contracts.json"
      - "docs/verification/PLATFORM_VERIFICATION_PLAN.md"
      - ".github/workflows/tenant-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tenant-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TENANT_RUST_FILES: >-
    apps/storefront/src/shared/context/enabled_modules.rs
    apps/storefront/src/shared/context/enabled_modules_native_server_adapter.rs
    crates/rustok-auth/cli/src/lib.rs
    crates/rustok-tenant/src/dto/mod.rs
    crates/rustok-tenant/src/lib.rs
    crates/rustok-tenant/src/migrations/m20260726_000001_enforce_tenant_locale_policy.rs
    crates/rustok-tenant/src/ports.rs
    crates/rustok-tenant/src/services/tenant_service.rs
    crates/rustok-tenant/tests/integration.rs
    crates/rustok-tenant/tests/locale_policy_concurrency_postgres.rs
    crates/rustok-tenant/tests/tenant_ensure_concurrency_postgres.rs

jobs:
  focused-contract:
    name: Focused tenant contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tenant-hardening
      - name: Format focused tenant files
        run: rustfmt --edition 2024 $TENANT_RUST_FILES
      - name: Publish focused formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git diff --check
          if git diff --quiet -- $TENANT_RUST_FILES; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $TENANT_RUST_FILES
          git commit -m "style(tenant): apply focused rustfmt"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Static tenant contracts
        run: |
          node scripts/verify/verify-tenant-locale-policy-migration.mjs
          node scripts/verify/verify-tenant-hardening-workflow.mjs
          npm run verify:tenant:fba
      - name: Compile tenant and storefront boundaries
        run: |
          cargo check -p rustok-tenant --tests
          cargo check -p rustok-storefront
          cargo check -p rustok-auth-cli --tests
      - name: Focused unit and lifecycle guards
        run: |
          cargo test -p rustok-auth-cli oauth_create_app -- --nocapture
          cargo test -p rustok-tenant tenant_locale_policy --test integration -- --nocapture
          cargo test -p rustok-tenant --test integration tenant_mutations_always_publish_outbox_events -- --nocapture
          cargo test -p rustok-server --test lifecycle_bypass_guard
      - name: Module contracts
        run: |
          cargo xtask module validate tenant
          cargo xtask module validate auth

  postgres-concurrency:
    name: PostgreSQL tenant concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustok_tenant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rustok_tenant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RUSTOK_TENANT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rustok_tenant
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tenant-hardening-postgres
      - name: Concurrent tenant provisioning
        run: cargo test -p rustok-tenant --test tenant_ensure_concurrency_postgres -- --nocapture
      - name: Concurrent locale-policy idempotency
        run: cargo test -p rustok-tenant --test locale_policy_concurrency_postgres -- --nocapture

  redis-recovery:
    name: Tenant locale Redis recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RUSTOK_CACHE_REAL_REDIS_URL: redis://127.0.0.1:6379/
      RUSTOK_CACHE_REDIS_SERVER_BIN: /usr/bin/redis-server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tenant-hardening-redis
      - name: Install Redis controls
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
          redis-cli -h 127.0.0.1 -p 6379 ping
      - name: Tenant locale generation source guards
        run: cargo test -p rustok-server --test tenant_locale_generation_guard
      - name: Tenant locale live Redis recovery
        run: cargo test -p rustok-server tenant_locale_generation --lib -- --ignored --nocapture --test-threads=1
