name: Tenant hardening

on:
  push:
    branches: [main]
    paths:
      - "crates/rustok-tenant/**"
      - "crates/rustok-auth/cli/**"
      - "apps/storefront/src/shared/context/enabled_modules.rs"
      - "apps/storefront/src/shared/context/enabled_modules_native_server_adapter.rs"
      - "apps/storefront/docs/implementation-plan.md"
      - "apps/server/tests/lifecycle_bypass_guard.rs"
      - "apps/server/src/services/tenant_locale_generation*.rs"
      - "scripts/verify/verify-tenant-fba.mjs"
      - "scripts/verify/verify-tenant-locale-policy-migration.mjs"
      - "scripts/verify/verify-tenant-hardening-workflow.mjs"
      - "docs/migrations/backfill-contracts.json"
      - "docs/verification/PLATFORM_VERIFICATION_PLAN.md"
      - ".github/workflows/tenant-hardening.yml"
  pull_request:
    paths:
      - "crates/rustok-tenant/**"
      - "crates/rustok-auth/cli/**"
      - "apps/storefront/src/shared/context/enabled_modules.rs"
      - "apps/storefront/src/shared/context/enabled_modules_native_server_adapter.rs"
      - "apps/storefront/docs/implementation-plan.md"
      - "apps/server/tests/lifecycle_bypass_guard.rs"
      - "apps/server/src/services/tenant_locale_generation*.rs"
      - "scripts/verify/verify-tenant-fba.mjs"
      - "scripts/verify/verify-tenant-locale-policy-migration.mjs"
      - "scripts/verify/verify-tenant-hardening-workflow.mjs"
      - "docs/migrations/backfill-contracts.json"
      - "docs/verification/PLATFORM_VERIFICATION_PLAN.md"
      - ".github/workflows/tenant-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tenant-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TENANT_RUST_FILES: >-
    apps/storefront/src/shared/context/enabled_modules.rs
    apps/storefront/src/shared/context/enabled_modules_native_server_adapter.rs
    crates/rustok-auth/cli/src/lib.rs
    crates/rustok-tenant/admin/src/transport/native_server_adapter.rs
    crates/rustok-tenant/src/dto/mod.rs
    crates/rustok-tenant/src/lib.rs
    crates/rustok-tenant/src/migrations/m20260726_000001_enforce_tenant_locale_policy.rs
    crates/rustok-tenant/src/ports.rs
    crates/rustok-tenant/src/services/tenant_service.rs
    crates/rustok-tenant/tests/integration.rs
    crates/rustok-tenant/tests/locale_policy_concurrency_postgres.rs
    crates/rustok-tenant/tests/tenant_ensure_concurrency_postgres.rs

jobs:
  focused-contract:
    name: Focused tenant contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tenant-hardening
      - name: Format focused tenant files
        run: rustfmt --edition 2024 $TENANT_RUST_FILES
      - name: Update tenant verification handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one handoff marker, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          plan = "crates/rustok-tenant/docs/implementation-plan.md"
          replace_once(
              plan,
              "The configured slug remains isolated to the GraphQL\ntransport as a host-routing hint. The tenant FBA verifier forbids slug arguments\nand `get_tenant_by_slug` in the native adapter.\n",
              "The configured slug remains isolated to the GraphQL\ntransport as a host-routing hint. The tenant FBA verifier forbids slug arguments\nand `get_tenant_by_slug` in the native adapter.\n\nThe Tenant Admin bootstrap no longer reconstructs effective module availability\nfrom raw `tenant_modules` rows. It resolves the active composition snapshot and\nuses `ModuleControlPlane::effective_policy(...).resolve_enabled(tenant.id)`, while\nraw overrides remain explanatory metadata only. Manifest defaults and dependency\nclosure therefore match the server and storefront control-plane contract.\n",
          )
          replace_once(plan, "- trusted storefront native module-state reads through resolved `TenantContext`,\n  with configured slug use restricted to the GraphQL transport branch;\n", "- trusted storefront native module-state reads through resolved `TenantContext`,\n  with configured slug use restricted to the GraphQL transport branch;\n- effective Tenant Admin module badges from the active composition and\n  `ModuleControlPlane`, never raw tenant override rows as policy authority;\n")
          replace_once(plan, "- Findings: `P0=0, P1=7, P2=1, P3=0`", "- Findings: `P0=0, P1=8, P2=1, P3=0`")
          replace_once(plan, "made storefront native enabled-module reads use resolved TenantContext instead of a client slug; added MySQL", "made storefront native enabled-module reads use resolved TenantContext instead of a client slug; made Tenant Admin render ModuleControlPlane effective policy instead of raw tenant overrides; added MySQL")
          replace_once(plan, "lifecycle/storefront compilation and real MySQL migration evidence is pending", "lifecycle/tenant-admin/storefront compilation and real MySQL migration evidence is pending")
          replace_once(plan, "storefront native adapter has no tenant argument and extracts rustok_api::TenantContext before list_tenant_modules(tenant.id);", "storefront native adapter has no tenant argument and extracts rustok_api::TenantContext before list_tenant_modules(tenant.id); Tenant Admin resolves the active composition through ModuleControlPlane and uses resolve_enabled(tenant.id) for badges;")

          master = "docs/verification/PLATFORM_VERIFICATION_PLAN.md"
          replace_once(master, "a storefront native module-state reader that trusted a client slug instead of resolved TenantContext, missing MySQL", "a storefront native module-state reader that trusted a client slug instead of resolved TenantContext, a Tenant Admin projection that treated raw tenant overrides as effective policy, missing MySQL")
          replace_once(master, "`core/tenant` remains in progress after seven fixed P1 findings and one fixed P2:", "`core/tenant` remains in progress after eight fixed P1 findings and one fixed P2:")
          replace_once(master, "`TenantContext` scope for native storefront module-state reads; equivalent\none-default-locale enforcement", "`TenantContext` scope for native storefront module-state reads; control-plane effective\nmodule policy for Tenant Admin badges; equivalent one-default-locale enforcement")
          replace_once(master, "Same-SHA Rust, both PostgreSQL races, PostgreSQL fixture, real MySQL, storefront/native\nparity, Redis recovery", "Same-SHA Rust, both PostgreSQL races, PostgreSQL fixture, real MySQL, tenant-admin/storefront/native\nparity, Redis recovery")
          PY
      - name: Publish focused formatting and handoff
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git diff --check
          if git diff --quiet -- $TENANT_RUST_FILES crates/rustok-tenant/docs/implementation-plan.md docs/verification/PLATFORM_VERIFICATION_PLAN.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $TENANT_RUST_FILES crates/rustok-tenant/docs/implementation-plan.md docs/verification/PLATFORM_VERIFICATION_PLAN.md
          git commit -m "style(tenant): format and sync verification handoff"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Static tenant contracts
        run: |
          node scripts/verify/verify-tenant-locale-policy-migration.mjs
          node scripts/verify/verify-tenant-hardening-workflow.mjs
          npm run verify:tenant:fba
      - name: Compile tenant, admin and storefront boundaries
        run: |
          cargo check -p rustok-tenant --tests
          cargo check -p rustok-tenant-admin --features ssr
          cargo check -p rustok-storefront
          cargo check -p rustok-auth-cli --tests
      - name: Focused unit and lifecycle guards
        run: |
          cargo test -p rustok-auth-cli oauth_create_app -- --nocapture
          cargo test -p rustok-tenant tenant_locale_policy --test integration -- --nocapture
          cargo test -p rustok-tenant --test integration tenant_mutations_always_publish_outbox_events -- --nocapture
          cargo test -p rustok-server --test lifecycle_bypass_guard
      - name: Module contracts
        run: |
          cargo xtask module validate tenant
          cargo xtask module validate auth

  postgres-concurrency:
    name: PostgreSQL tenant concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustok_tenant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rustok_tenant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RUSTOK_TENANT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rustok_tenant
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tenant-hardening-postgres
      - name: Concurrent tenant provisioning
        run: cargo test -p rustok-tenant --test tenant_ensure_concurrency_postgres -- --nocapture
      - name: Concurrent locale-policy idempotency
        run: cargo test -p rustok-tenant --test locale_policy_concurrency_postgres -- --nocapture

  redis-recovery:
    name: Tenant locale Redis recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RUSTOK_CACHE_REAL_REDIS_URL: redis://127.0.0.1:6379/
      RUSTOK_CACHE_REDIS_SERVER_BIN: /usr/bin/redis-server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tenant-hardening-redis
      - name: Install Redis controls
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
          redis-cli -h 127.0.0.1 -p 6379 ping
      - name: Tenant locale generation source guards
        run: cargo test -p rustok-server --test tenant_locale_generation_guard
      - name: Tenant locale live Redis recovery
        run: cargo test -p rustok-server tenant_locale_generation --lib -- --ignored --nocapture --test-threads=1
