name: FORUM-21X source sync

on:
  push:
    branches:
      - feat/forum-21x-reply-range-admin
    paths:
      - .github/workflows/forum21x-source-sync.yml
      - .github/forum21x_patch.py

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply FORUM-21X source composition
        run: python .github/forum21x_patch.py
      - name: Commit synchronized source
        shell: bash
        run: |
          rm -f .github/forum21x_patch.py
          rm -f .github/workflows/forum21x-source-sync.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(forum): register reply range admin workflow"
          git push origin HEAD:feat/forum-21x-reply-range-admin
