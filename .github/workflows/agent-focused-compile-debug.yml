name: Agent Focused Compile Debug

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-Dwarnings"
  CARGO_ENCODED_RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: 0

jobs:
  focused-compile-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Capture focused compiler output
        run: |
          set +e
          cargo check -p rustok-commerce --all-features > focused-compile.log 2>&1
          status=$?
          printf '%s\n' "$status" > focused-compile-status.txt
          tail -n 250 focused-compile.log > focused-compile-tail.log
          exit 0
      - name: Upload focused compiler output
        uses: actions/upload-artifact@v4
        with:
          name: focused-compile-debug
          path: |
            focused-compile.log
            focused-compile-tail.log
            focused-compile-status.txt
          if-no-files-found: error
          retention-days: 1
