name: Taxonomy Category Flex Donor Contract

on:
  pull_request:
    paths:
      - "crates/flex/Cargo.toml"
      - "crates/flex/src/attached_definitions.rs"
      - "crates/flex/src/attached_storage.rs"
      - "crates/flex/src/entity_type.rs"
      - "crates/flex/src/graphql/mod.rs"
      - "crates/flex/src/lib.rs"
      - "crates/flex/src/cache_generation.rs"
      - "crates/flex/src/migrations/**"
      - "crates/flex/tests/generic_attached_definitions.rs"
      - "crates/flex/tests/generic_attached_storage.rs"
      - "crates/flex/tests/postgres_generic_attached_storage.rs"
      - "crates/rustok-taxonomy/src/lib.rs"
      - "crates/rustok-taxonomy/src/owner_identity.rs"
      - "crates/rustok-taxonomy/tests/owner_identity.rs"
      - "crates/rustok-taxonomy/docs/implementation-plan.md"
      - "apps/server/src/services/field_definition_registry_bootstrap.rs"
      - "apps/server/src/services/flex_attached_values.rs"
      - "scripts/verify/verify-taxonomy-category-flex-donor.mjs"
      - ".github/workflows/taxonomy-category-flex-donor-contract.yml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - "crates/flex/Cargo.toml"
      - "crates/flex/src/attached_definitions.rs"
      - "crates/flex/src/attached_storage.rs"
      - "crates/flex/src/entity_type.rs"
      - "crates/flex/src/graphql/mod.rs"
      - "crates/flex/src/lib.rs"
      - "crates/flex/src/cache_generation.rs"
      - "crates/flex/src/migrations/**"
      - "crates/flex/tests/generic_attached_definitions.rs"
      - "crates/flex/tests/generic_attached_storage.rs"
      - "crates/flex/tests/postgres_generic_attached_storage.rs"
      - "crates/rustok-taxonomy/src/lib.rs"
      - "crates/rustok-taxonomy/src/owner_identity.rs"
      - "crates/rustok-taxonomy/tests/owner_identity.rs"
      - "crates/rustok-taxonomy/docs/implementation-plan.md"
      - "apps/server/src/services/field_definition_registry_bootstrap.rs"
      - "apps/server/src/services/flex_attached_values.rs"
      - "scripts/verify/verify-taxonomy-category-flex-donor.mjs"
      - ".github/workflows/taxonomy-category-flex-donor-contract.yml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-category-flex-donor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    name: Category Flex donor source contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify Taxonomy Category donor boundaries
        run: node scripts/verify/verify-taxonomy-category-flex-donor.mjs

  rust-contract:
    name: Category Flex donor Rust contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check CAT-4 Rust formatting only
        shell: bash
        run: |
          rustfmt +1.96.0 --edition 2024 --check \
            crates/flex/src/attached_definitions.rs \
            crates/flex/src/attached_storage.rs \
            crates/flex/src/entity_type.rs \
            crates/flex/src/graphql/mod.rs \
            crates/flex/src/migrations/m20260822_000001_create_generic_attached_donor_storage.rs \
            crates/flex/tests/generic_attached_definitions.rs \
            crates/flex/tests/generic_attached_storage.rs \
            crates/flex/tests/postgres_generic_attached_storage.rs \
            crates/rustok-taxonomy/src/owner_identity.rs \
            crates/rustok-taxonomy/tests/owner_identity.rs \
            apps/server/src/services/field_definition_registry_bootstrap.rs \
            apps/server/src/services/flex_attached_values.rs
      - name: Run generic attached definition contracts
        run: cargo test --locked -p flex --test generic_attached_definitions -- --nocapture
      - name: Run generic attached value storage contract
        run: cargo test --locked -p flex --test generic_attached_storage -- --nocapture
      - name: Run bounded Taxonomy owner identity contract
        run: cargo test --locked -p rustok-taxonomy --test owner_identity -- --nocapture
      - name: Compile host registration and owner guard
        run: cargo check --locked -p rustok-server --no-default-features --features mod-taxonomy,mod-flex --lib

  postgres-contract:
    name: Category Flex donor PostgreSQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustok_flex_cat4
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rustok_flex_cat4"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RUSTOK_FLEX_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/rustok_flex_cat4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Run PostgreSQL generic Category donor contract
        run: cargo test --locked -p flex --test postgres_generic_attached_storage -- --ignored --nocapture
