name: Diag auth (TEMPORARY arena/551d146c)

# Temporary diagnostic workflow for PR #4646. Delete before merge.
on:
  push:
    branches:
      - "arena/551d146c-rustok"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_ENCODED_RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SQLX_OFFLINE: true
  TMPDIR: /var/tmp

jobs:
  autofmt-changed:
    name: Autofmt PR-changed files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Format files changed vs merge-base
        run: |
          set -x
          BASE=$(git merge-base origin/main HEAD)
          echo "::notice::autofmt merge-base=$BASE"
          git diff --name-only "$BASE"...HEAD -- '*.rs' > /tmp/changed_rs.txt
          # Drop deleted paths; git add --pathspec-from-file is fatal on them.
          : > /tmp/existing_rs.txt
          while IFS= read -r f; do
            if [ -f "$f" ]; then echo "$f" >> /tmp/existing_rs.txt; fi
          done < /tmp/changed_rs.txt
          echo "::notice::autofmt changed .rs files: $(wc -l < /tmp/existing_rs.txt)"
          while IFS= read -r f; do
            rustfmt --edition 2024 "$f"
          done < /tmp/existing_rs.txt
          git add --pathspec-from-file=/tmp/existing_rs.txt
          git diff --cached --stat | tail -3
          if git diff --cached --quiet; then
            echo "::notice::autofmt: no formatting changes needed"
            exit 0
          fi
          git config user.name "diag-autofmt"
          git config user.email "diag-autofmt@users.noreply.github.com"
          git commit -m "style: rustfmt on PR-changed files (diag autofmt)"
          git push origin HEAD:arena/551d146c-rustok
          echo "::notice::autofmt: pushed formatting commit

  diagnose:
    name: Diagnose check/clippy/fmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: fmt check (file list)
        shell: bash {0}
        run: |
          cargo fmt --all -- --check 2>/dev/null \
            | grep '^Diff in ' \
            | sed 's/^Diff in //; s/ at line.*//' \
            | sort -u > /tmp/fmt_files.txt
          echo "fmt-dirty files: $(wc -l < /tmp/fmt_files.txt)"
      - name: Extract errors helper
        run: |
          git fetch origin main --depth=200 >/dev/null 2>&1 || true
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo HEAD)
          git diff --name-only "$BASE"...HEAD > /tmp/touched_files.txt 2>/dev/null || : > /tmp/touched_files.txt
          cat > /tmp/extract.py <<'PY'
          import json, sys
          try:
              touched = set(open('/tmp/touched_files.txt').read().split())
          except Exception:
              touched = set()
          seen = set()
          out = []
          ann = []
          def esc(s):
              return s.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          for line in sys.stdin:
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  obj = json.loads(line)
              except Exception:
                  continue
              if obj.get('reason') != 'compiler-message':
                  continue
              msg = obj.get('message') or {}
              level = msg.get('level')
              if level not in ('error', 'warning'):
                  continue
              rendered = (msg.get('rendered') or msg.get('message') or '').strip()
              first = rendered.split('\n')[0] if rendered else ''
              code = (msg.get('code') or {}).get('code', '') if msg.get('code') else ''
              span = None
              for sp in msg.get('spans') or []:
                  if sp.get('is_primary'):
                      span = sp
                      break
              if span is None and msg.get('spans'):
                  span = msg['spans'][0]
              if span:
                  loc = f"[E_{span['file_name']}:{span['line_start']}:{span['column_start']}]"
              else:
                  loc = "[E_nolocation]"
              key = loc + first
              if key in seen:
                  continue
              seen.add(key)
              tag = 'TOUCHED' if (span and span['file_name'] in touched) else 'FOREIGN'
              out.append(f"{tag} {level} {code} {loc} {first}")
              if span and len(ann) < 40:
                  ann.append(f"::{level} file={span['file_name']},line={span['line_start']},col={span['column_start']}::{esc(first)}")
          with open(sys.argv[1], 'w') as fh:
              fh.write('\n'.join(out[:400]))
              fh.write(f"\n-- total unique: {len(out)}\n")
          for a in ann:
              print(a)
          PY
      - name: cargo check (json)
        shell: bash {0}
        run: |
          cargo check --workspace --all-targets --all-features --keep-going --message-format=json 2>/dev/null \
            | python3 /tmp/extract.py /tmp/check_errors.txt
          tail -1 /tmp/check_errors.txt || true
      - name: cargo check apps (dead_code demoted)
        shell: bash {0}
        env:
          RUSTFLAGS: "-Dwarnings -Adead_code"
          CARGO_ENCODED_RUSTFLAGS: "-Dwarnings\x1f-Adead_code"
        run: |
          cargo check -p rustok-server -p rustok-admin -p rustok-storefront --all-targets --all-features --keep-going --message-format=json 2>/dev/null \
            | python3 /tmp/extract.py /tmp/apps_errors.txt
          tail -1 /tmp/apps_errors.txt || true
      - name: cargo clippy (json)
        shell: bash {0}
        run: |
          cargo clippy --workspace --all-targets --no-deps --keep-going --message-format=json -- -D warnings 2>/dev/null \
            | python3 /tmp/extract.py /tmp/clippy_errors.txt
          tail -1 /tmp/clippy_errors.txt || true
      - name: wasm check UI crates
        shell: bash {0}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p leptos-auth --features csr --target wasm32-unknown-unknown --message-format=json 2>/dev/null \
            | python3 /tmp/extract.py /tmp/wasm_errors.txt
          tail -1 /tmp/wasm_errors.txt || true
      - name: cargo test (touched crates)
        shell: bash {0}
        run: |
          run_tests() {
            echo "=== cargo test $* ==="
            cargo test "$@" 2>&1 | tail -n 600 | grep -E "^test .* FAILED|panicked at|assertion .* failed|^failures:|test result:|error\[|^error:" | head -100
          }
          {
            run_tests -p rustok-auth --lib --tests
            run_tests -p rustok-rbac --lib --tests
            run_tests -p rustok-events --lib --tests
            run_tests -p leptos-auth --lib
            run_tests -p rustok-ui-auth --lib
            run_tests -p rustok-migrations --lib --tests
            run_tests -p rustok-server --lib auth
          } > /tmp/test_results.txt 2>&1
          wc -l /tmp/test_results.txt
      - name: Post PR comment with results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash {0}
        run: |
          {
            echo "### 🔬 Diag results for ${GITHUB_SHA:0:8} (temporary workflow)"
            echo
            echo "#### cargo fmt --check — dirty files ($(wc -l < /tmp/fmt_files.txt 2>/dev/null || echo '?'))"
            echo '```'
            head -c 6000 /tmp/fmt_files.txt 2>/dev/null
            echo '```'
            echo "#### cargo check --workspace --all-targets --all-features"
            echo '```'
            head -c 24000 /tmp/check_errors.txt 2>/dev/null
            echo '```'
            echo "#### cargo check apps (rustok-server/admin/storefront, dead_code demoted)"
            echo '```'
            grep -v '^FOREIGN warning dead_code' /tmp/apps_errors.txt 2>/dev/null | head -c 24000
            echo '```'
            echo "#### cargo clippy — TOUCHED files only (foreign count at end)"
            echo '```'
            grep '^TOUCHED' /tmp/clippy_errors.txt 2>/dev/null | head -c 12000
            echo "-- foreign clippy total: $(grep -c '^FOREIGN' /tmp/clippy_errors.txt 2>/dev/null || echo 0)"
            echo '```'
            echo "#### wasm check (leptos-auth csr)"
            echo '```'
            head -c 8000 /tmp/wasm_errors.txt 2>/dev/null
            echo '```'
            echo "#### cargo test (touched crates; failures + result lines)"
            echo '```'
            head -c 20000 /tmp/test_results.txt 2>/dev/null
            echo '```'
          } > /tmp/comment.md
          gh pr comment 4646 --body-file /tmp/comment.md
