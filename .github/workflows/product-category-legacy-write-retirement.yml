name: Product Category Legacy Write Retirement

on:
  pull_request:
    paths:
      - "crates/rustok-product/src/services/catalog_schema_service/categories.rs"
      - "crates/rustok-product/docs/category-taxonomy-binding.md"
      - "crates/rustok-product/docs/category-locale-contract.md"
      - "crates/rustok-taxonomy/docs/implementation-plan.md"
      - "scripts/verify/verify-product-category-legacy-write-retirement.mjs"
      - ".github/workflows/product-category-legacy-write-retirement.yml"
      - ".github/workflows/product-category-seo-seam.yml"

permissions:
  contents: read

concurrency:
  group: product-category-legacy-write-retirement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  legacy-write-retirement-contract:
    name: Product Category legacy write retirement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Fetch exact PR base
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
      - name: Verify Product Category legacy write retirement contract when CAT-28 changes
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          verifier='scripts/verify/verify-product-category-legacy-write-retirement.mjs'
          changed="$(git diff --name-only "$base" "$head")"
          if ! printf '%s\n' "$changed" | grep -Fxq "$verifier"; then
            echo "CAT-28 verifier unchanged; historical CAT-28 source verifier is not applicable."
            exit 0
          fi
          node scripts/verify/verify-product-category-legacy-write-retirement.mjs
      - name: Assert bounded CAT-28 file set when CAT-28 changes
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          verifier='scripts/verify/verify-product-category-legacy-write-retirement.mjs'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          if ! printf '%s\n' "$changed" | grep -Fxq "$verifier"; then
            echo "CAT-28 verifier unchanged; PR-wide CAT-28 slice restriction is not applicable."
            exit 0
          fi
          allowed='^(crates/rustok-product/src/services/catalog_schema_service/categories\.rs|crates/rustok-product/docs/category-taxonomy-binding\.md|crates/rustok-product/docs/category-locale-contract\.md|crates/rustok-taxonomy/docs/implementation-plan\.md|scripts/verify/verify-product-category-legacy-write-retirement\.mjs|\.github/workflows/product-category-legacy-write-retirement\.yml|\.github/workflows/product-category-seo-seam\.yml)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
      - name: Check Product formatting
        run: cargo fmt --check --manifest-path crates/rustok-product/Cargo.toml
      - name: Run Product Category legacy write backend regression
        run: cargo test -p rustok-product --lib category_legacy_translation_write_is_non_postgres_only -- --nocapture
      - name: Compile Product Category write retirement
        run: cargo check -p rustok-product --lib
      - name: Check full PR whitespace
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --check "$base" "$head"
