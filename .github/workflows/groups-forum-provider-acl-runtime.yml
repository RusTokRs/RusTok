name: Groups Forum Provider ACL Runtime Evidence

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "apps/server/Cargo.toml"
      - "apps/server/src/services/forum_audience_group_facts.rs"
      - "apps/server/src/services/forum_audience_group_facts/owner_backed_tests.rs"
      - "apps/server/src/services/module_event_dispatcher.rs"
      - "crates/rustok-groups/src/membership_enforcement.rs"
      - "crates/rustok-groups/src/membership_enforcement_command.rs"
      - "crates/rustok-groups/src/membership_enforcement_transaction.rs"
      - "crates/rustok-groups/src/migrations/**"
      - "crates/rustok-groups/contracts/groups-effective-membership-access.json"
      - "crates/rustok-groups/contracts/groups-fba-registry.json"
      - "crates/rustok-groups/docs/membership-enforcement-access-path-integration-contract.md"
      - "crates/rustok-forum/contracts/forum-audience-group-facts-host-runtime.json"
      - "scripts/verify/verify-forum-audience-group-facts-host-runtime.mjs"
      - "scripts/verify/verify-groups-membership-enforcement-access-path-integration.mjs"
      - ".github/workflows/groups-forum-provider-acl-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "apps/server/Cargo.toml"
      - "apps/server/src/services/forum_audience_group_facts.rs"
      - "apps/server/src/services/forum_audience_group_facts/owner_backed_tests.rs"
      - "apps/server/src/services/module_event_dispatcher.rs"
      - "crates/rustok-groups/src/membership_enforcement.rs"
      - "crates/rustok-groups/src/membership_enforcement_command.rs"
      - "crates/rustok-groups/src/membership_enforcement_transaction.rs"
      - "crates/rustok-groups/src/migrations/**"
      - "crates/rustok-groups/contracts/groups-effective-membership-access.json"
      - "crates/rustok-groups/contracts/groups-fba-registry.json"
      - "crates/rustok-groups/docs/membership-enforcement-access-path-integration-contract.md"
      - "crates/rustok-forum/contracts/forum-audience-group-facts-host-runtime.json"
      - "scripts/verify/verify-forum-audience-group-facts-host-runtime.mjs"
      - "scripts/verify/verify-groups-membership-enforcement-access-path-integration.mjs"
      - ".github/workflows/groups-forum-provider-acl-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: groups-forum-provider-acl-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUSTOK_GROUPS_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/rustok_groups_forum_acl_evidence

jobs:
  runtime-evidence:
    name: Forum audience Groups owner-backed SQLite/PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustok_groups_forum_acl_evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rustok_groups_forum_acl_evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Require exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: groups-forum-provider-acl-runtime
      - name: Verify Groups Forum provider ACL source boundary
        run: node scripts/verify/verify-groups-membership-enforcement-access-path-integration.mjs
      - name: Verify upstream Forum audience composition source boundary
        run: node scripts/verify/verify-forum-audience-group-facts-host-runtime.mjs
      - name: Check owner-backed evidence formatting
        run: rustfmt +1.96.0 --edition 2024 --check apps/server/src/services/forum_audience_group_facts/owner_backed_tests.rs
      - name: Execute SQLite owner-clock provider ACL evidence
        run: cargo test --locked -p rustok-server --features mod-forum,mod-groups forum_group_facts_follow_groups_owner_clock_sqlite -- --nocapture
      - name: Execute PostgreSQL owner-clock provider ACL evidence
        run: cargo test --locked -p rustok-server --features mod-forum,mod-groups forum_group_facts_follow_groups_owner_clock_postgres -- --ignored --nocapture
