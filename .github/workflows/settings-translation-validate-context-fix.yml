name: Temporary Settings Translation Validation Context Fix

on:
  push:
    branches:
      - feat/settings-translation-target-provider-20260904
    paths:
      - .github/workflows/settings-translation-validate-context-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'RusTokRs/RusTok'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/settings-translation-target-provider-20260904
          fetch-depth: 0
      - name: Restore read-only patch validation context
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/server/src/static_settings_translation_target.rs")
          text = path.read_text()
          old = '''    async fn validate_patch(
              &self,
              context: PortContext,
              request: TranslationPatchRequest,
          ) -> Result<TranslationPatchValidation, PortError> {
              validate_translation_apply_context(&context)?;
              authorize(&context, Action::Update)?;
          '''
          new = '''    async fn validate_patch(
              &self,
              context: PortContext,
              request: TranslationPatchRequest,
          ) -> Result<TranslationPatchValidation, PortError> {
              validate_translation_read_context(&context)?;
              authorize(&context, Action::Update)?;
          '''
          if text.count(old) != 1:
              raise SystemExit(f"validate_patch anchor count drifted: {text.count(old)}")
          path.write_text(text.replace(old, new))
      - name: Verify patch scope
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "apps/server/src/static_settings_translation_target.rs"
      - name: Commit final contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/static_settings_translation_target.rs
          git rm .github/workflows/settings-translation-validate-context-fix.yml
          git commit -m "fix(translation): keep settings patch validation read-only"
          git push origin HEAD:feat/settings-translation-target-provider-20260904
