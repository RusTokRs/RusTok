name: Index Selected Storage Cleanup Applier

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    name: Apply and validate JSONB-only cleanup
    if: ${{ github.head_ref == 'agent/index-remove-rejected-prototypes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Apply selected-storage cleanup patch
        shell: bash
        run: |
          set -euo pipefail
          payload=.tmp/index-rejected-prototype-cleanup.patch.gz.b64
          base64 -d "$payload" | gzip -d > /tmp/index-rejected-prototype-cleanup.patch
          git apply --check /tmp/index-rejected-prototype-cleanup.patch
          git apply /tmp/index-rejected-prototype-cleanup.patch

      - name: Format selected benchmark Rust
        run: cargo fmt --manifest-path ops/benches/Cargo.toml

      - name: Verify Index storage contracts and fixtures
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify/index-storage-tooling.mjs contract
          node --test scripts/verify/index-storage-validator-arguments.test.mjs
          node scripts/verify/index-storage-tooling.mjs fixtures

      - name: Check selected benchmark binaries
        run: cargo check -p rustok-benchmarks --bins

      - name: Test selected Index storage library surface
        run: cargo test -p rustok-benchmarks --lib index_storage

      - name: Publish clean cleanup commit
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .tmp/index-rejected-prototype-cleanup.patch.gz.b64
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/index-rejected-prototype-cleanup-snapshot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(index): finalize selected storage benchmark"
          git push origin "HEAD:${HEAD_REF}"
