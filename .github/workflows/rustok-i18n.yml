name: rustok_i18n packages

on:
  pull_request:
    paths:
      - 'rustok_mobile/packages/rustok_i18n/**'
      - 'rustok_mobile/packages/rustok_flutter_i18n/**'
      - '.github/workflows/rustok-i18n.yml'
  push:
    branches:
      - main
    paths:
      - 'rustok_mobile/packages/rustok_i18n/**'
      - 'rustok_mobile/packages/rustok_flutter_i18n/**'
      - '.github/workflows/rustok-i18n.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  core:
    name: Dart core (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustok_mobile/packages/rustok_i18n
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.0.0'
      - run: dart pub get
      # TEMPORARY DIAGNOSTIC (remove before merge)
      - name: CLI typegen (fails on invalid input)
        run: >-
          dart run bin/i18n_cli.dart typegen
          --input example/locales/en.ftl
          --output example/generated/smoke_messages.g.dart
          --className SmokeMessages
      - name: Diagnostic: typegen output
        if: failure()
        run: |
          dart run bin/i18n_cli.dart typegen \
            --input example/locales/en.ftl \
            --output example/generated/smoke_messages.g.dart \
            --className SmokeMessages > /tmp/tg.log 2>&1 || true
          cat /tmp/tg.log
          sed -n '1,40p' /tmp/tg.log | while IFS= read -r l; do printf '::error::%s\n' "${l//%/%25}"; done
      # TEMPORARY DIAGNOSTIC (remove before merge)
      - name: Run dart analyze
        if: always()
        run: |
          dart analyze > /tmp/an.log 2>&1; code=$?
          tail -n 60 /tmp/an.log
          tail -n 60 /tmp/an.log | while IFS= read -r l; do printf '::error::AN %s\n' "${l//%/%25}"; done
          exit $code
      # TEMPORARY DIAGNOSTIC (remove before merge)
      - name: Run dart test
        run: dart test --reporter github
      - name: CLI parity check (fails on mismatch)
        run: dart run bin/i18n_cli.dart check --dir example/locales --baseline en

  tooling:
    name: Tooling contracts (Python + Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustok_mobile/tooling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Package contract tests (no Dart SDK required)
        run: python3 -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: i18n simulation + parity script
        run: node scripts/verify_i18n_simulation.mjs

  flutter:
    name: Flutter wrapper (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustok_mobile/packages/rustok_flutter_i18n
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      # TEMPORARY DIAGNOSTIC (remove before merge)
      - name: Run flutter analyze
        run: |
          flutter analyze > /tmp/fa.log 2>&1; code=$?
          tail -n 60 /tmp/fa.log
          tail -n 60 /tmp/fa.log | while IFS= read -r l; do printf '::error::FA %s\n' "${l//%/%25}"; done
          exit $code
      # TEMPORARY DIAGNOSTIC (remove before merge)
      - name: Run flutter test
        if: always()
        run: |
          flutter test > /tmp/ft.log 2>&1; code=$?
          tail -n 80 /tmp/ft.log
          grep -nE '\[E\]|Expected:|Actual:|Which:|Undefined|error •|Error:' /tmp/ft.log | head -n 40 | while IFS= read -r l; do printf '::error::FT %s\n' "${l//%/%25}"; done
          exit $code
