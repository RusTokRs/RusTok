name: Agent Forum Search locale/date sync v2

on:
  push:
    branches:
      - agent/forum-search-locale-date-filter-23b2f3

permissions:
  contents: write

concurrency:
  group: agent-forum-search-locale-date-filter-23b2f3
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/forum-search-locale-date-filter-23b2f3
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Adapt exact anchors with known repeated source text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/agent/apply_forum_search_locale_date.py")
          content = path.read_text()
          old = '''    if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              write(path, content.replace(old, new, 1))
          '''
          new = '''    if count != 1:
                  repeated_forum_verifier = (
                      path == "crates/rustok-forum/docs/implementation-plan.md"
                      and old == "node scripts/verify/verify-forum-search-tag-solved-filter.mjs\\ncargo check -p rustok-search"
                      and count == 2
                  )
                  if repeated_forum_verifier:
                      write(path, content.replace(old, new, 1))
                      return
                  forum_compatibility_section = (
                      path == "crates/rustok-forum/docs/implementation-plan.md"
                      and old == "### Compatibility and degraded mode\\n\\nNo database migration"
                      and count > 1
                  )
                  if forum_compatibility_section:
                      anchor = content.index("### Delivered in `FORUM-23B2F2`")
                      index = content.index(old, anchor)
                      write(path, content[:index] + new + content[index + len(old):])
                      return
                  repeated_native_signature = (
                      path == "crates/rustok-search/storefront/src/transport/forum_native_server_adapter.rs"
                      and old == "    tags: Vec<String>,\\n    solved: Option<bool>,\\n) -> Result<SearchPreviewPayload, ServerFnError>"
                      and count == 2
                  )
                  if repeated_native_signature:
                      index = content.rindex(old)
                      write(path, content[:index] + new + content[index + len(old):])
                      return
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              write(path, content.replace(old, new, 1))
          '''
          if content.count(old) != 1:
              raise SystemExit("staging helper anchor drift")
          content = content.replace(old, new, 1)
          content = content.replace("published_at >= *from", "published_at >= from.clone()")
          content = content.replace("published_at <= *to", "published_at <= to.clone()")
          path.write_text(content)
          PY
      - name: Apply exact source and plan changes
        run: python3 scripts/agent/apply_forum_search_locale_date.py
      - name: Format changed Rust files only
        run: |
          rustfmt --edition 2024 crates/rustok-search/src/forum_document_filters.rs
          rustfmt --edition 2024 crates/rustok-search/src/forum_storefront_execution.rs
          rustfmt --edition 2024 crates/rustok-search/src/graphql/forum_storefront.rs
          rustfmt --edition 2024 crates/rustok-search/storefront/src/transport/forum_graphql_adapter.rs
          rustfmt --edition 2024 crates/rustok-search/storefront/src/transport/forum_native_server_adapter.rs
          rustfmt --edition 2024 crates/rustok-search/storefront/src/transport/mod.rs
      - name: Commit synchronization and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/agent-forum-search-locale-date-sync.yml
          rm -f .github/workflows/agent-forum-search-locale-date-sync-v2.yml
          rm -f scripts/agent/apply_forum_search_locale_date.py
          git add -A
          git commit -m "feat(search): add Forum locale and date filters"
          git push origin HEAD:agent/forum-search-locale-date-filter-23b2f3
