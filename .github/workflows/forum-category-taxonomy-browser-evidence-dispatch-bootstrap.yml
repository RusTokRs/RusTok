name: Forum Category Taxonomy Browser Evidence Dispatch Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/forum-category-taxonomy-browser-evidence-dispatch-bootstrap.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch CAT-5 mounted browser evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve sole GitHub environment and dispatch CAT-5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: forum-category-taxonomy-browser-evidence.yml
        run: |
          set -euo pipefail

          environments_json="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/environments?per_page=100"
          )"

          total_count="$(jq -er '.total_count' <<<"$environments_json")"
          page_count="$(jq -er '.environments | length' <<<"$environments_json")"

          if [[ "$total_count" != "$page_count" ]]; then
            echo "Refusing to dispatch: environment listing is paginated (${page_count}/${total_count})." >&2
            exit 1
          fi

          if [[ "$total_count" != "1" ]]; then
            echo "Refusing to dispatch: expected exactly one configured GitHub environment, found ${total_count}." >&2
            echo "Configured environments:" >&2
            jq -r '.environments[]?.name | "  - \(.)"' <<<"$environments_json" >&2
            exit 1
          fi

          target_environment="$(jq -er '.environments[0].name | select(type == "string" and length > 0)' <<<"$environments_json")"
          dispatch_payload="$(
            jq -cn \
              --arg ref "main" \
              --arg target_environment "$target_environment" \
              '{ref: $ref, inputs: {target_environment: $target_environment}}'
          )"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            --input - <<<"$dispatch_payload"

          echo "Dispatched ${TARGET_WORKFLOW} from main with target_environment=${target_environment}."
