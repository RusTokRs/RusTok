name: Arena debug (Fly build probe)
# TEMPORARY debugging workflow for the arena/37f687be-rustok session: CI job logs are not
# downloadable from this environment, so each probe reports through check-run annotations
# (`gh api .../check-runs/<id>/annotations`), which are readable through the API.
on:
  push:
    branches:
      - arena/37f687be-rustok
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: arena-debug-fly-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.96.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TERM_COLOR: never
        run: |
          set +e
          annotate() {
            label="$1"; code="$2"; file="$3"
            block=$(awk 'BEGIN{f=0} /^error(\[|:)/{f=1} f{print}' "$file" | head -c 1200)
            if [ -z "$block" ]; then block=$(tail -c 1200 "$file"); fi
            block=$(printf '%s' "$block" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$label exit=$code::$block"
          }
          probe() {
            label="$1"; shift
            : > /tmp/probe.txt
            echo "### $*" >> /tmp/probe.txt
            "$@" >> /tmp/probe.txt 2>&1
            code=$?
            echo "### exit=$code" >> /tmp/probe.txt
            annotate "$label" "$code" /tmp/probe.txt
            tail -c 20000 /tmp/probe.txt > /tmp/tail.txt
            {
              echo "probe: $label ($(git rev-parse --short HEAD))"
              echo '```'
              cat /tmp/tail.txt
              echo '```'
            } > /tmp/comment.txt
            gh pr comment 4602 --body-file /tmp/comment.txt
          }
          probe "step19 clippy (exact)" cargo clippy -p fly-browser -p rustok-page-builder-admin -p rustok-pages -p rustok-pages-admin -p rustok-pages-storefront --lib -- -D warnings
          probe "grid clippy default" cargo clippy -p rustok-grid -p rustok-grid-leptos -p rustok-ui-core --all-targets -- -D warnings
          probe "grid clippy all-features" cargo clippy -p rustok-grid -p rustok-grid-leptos -p rustok-ui-core --all-targets --all-features -- -D warnings
          probe "product clippy default" cargo clippy -p rustok-product-admin -p rustok-product-storefront --all-targets -- -D warnings
          probe "product clippy all-features" cargo clippy -p rustok-product-admin -p rustok-product-storefront --all-targets --all-features -- -D warnings
          probe "fmt changed files" node scripts/audit/rustfmt_check.mjs crates/ui/rustok-grid/src/pagination.rs crates/modules/rustok-product/storefront/src/core.rs
