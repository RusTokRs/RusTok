name: Arena debug (Fly build probe)
# TEMPORARY debugging workflow for the arena/37f687be-rustok session: CI job logs are not
# downloadable from this environment, so the failing compiler output is posted as a pull request
# comment, which is readable through the API. Delete before the PR is merged.
on:
  push:
    branches:
      - arena/37f687be-rustok
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.96.0"
          components: clippy,rustfmt
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          probe() {
            label="$1"; shift
            : > /tmp/probe.txt
            echo "### $*" >> /tmp/probe.txt
            "$@" >> /tmp/probe.txt 2>&1
            echo "### exit=$?" >> /tmp/probe.txt
            tail -c 20000 /tmp/probe.txt > /tmp/tail.txt
            {
              echo "probe: $label ($(git rev-parse --short HEAD))"
              echo '```'
              cat /tmp/tail.txt
              echo '```'
            } > /tmp/comment.txt
            gh pr comment 4602 --body-file /tmp/comment.txt
          }
          probe "clippy fly" cargo clippy -p fly -p fly-ui -p fly-web -p fly-leptos -p fly-dioxus --all-targets -- -D warnings
          probe "clippy integrations" cargo clippy -p fly-browser -p rustok-page-builder-admin -p rustok-pages -p rustok-pages-admin -p rustok-pages-storefront --lib -- -D warnings
          probe "clippy host" cargo clippy -p rustok-page-builder -p rustok-page-builder-storefront -p rustok-forms --all-targets -- -D warnings
          probe "wasm fly-web" cargo check --target wasm32-unknown-unknown -p fly-web --features wasm-client
          probe "wasm fly-leptos" cargo check --target wasm32-unknown-unknown -p fly-leptos --no-default-features --features wasm-client
          probe "wasm fly-dioxus" cargo check --target wasm32-unknown-unknown -p fly-dioxus --features web
          probe "fly-dioxus desktop" cargo check -p fly-dioxus --features desktop
          probe "fly-leptos no-default" cargo check -p fly-leptos --no-default-features
          probe "pages unit tests" cargo test -p rustok-pages --lib --quiet
          probe "admin ssr endpoint" cargo check -p rustok-admin --bin rustok-admin --no-default-features --features ssr
          probe "pages storefront" cargo check -p rustok-pages-storefront --lib
          probe "workspace fmt" cargo fmt --all -- --check
