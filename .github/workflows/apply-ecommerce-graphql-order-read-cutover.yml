name: Apply ecommerce GraphQL order read cutover

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ecommerce-graphql-order-read-cutover-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          patch_path=.github/patches/ecommerce-graphql-order-read-cutover.patch
          workflow_path=.github/workflows/apply-ecommerce-graphql-order-read-cutover.yml
          if [[ ! -f "$patch_path" ]]; then
            echo "Patch already consumed"
            exit 0
          fi
          git apply --index "$patch_path"
          git rm "$patch_path" "$workflow_path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(commerce): use order read port in GraphQL"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
