name: One-off FS17 Action Pin Migration

on:
  push:
    branches: [audit/fs-17-dependencies-supply-chain]
    paths:
      - .github/workflows/one-off-pin-migration-actions.yml
      - scripts/maintenance/pin-workflow-actions.py

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pin-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Pin all mutable action references
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.head_commit.message }}" != "audit(fs-17): run global action pin migration" ]]; then
            echo "Migration trigger commit does not match; exiting."
            exit 0
          fi
          python3 scripts/maintenance/pin-workflow-actions.py
          git diff --check

      - name: Commit immutable action refs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No mutable action references remain."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'security(ci): pin all mutable workflow actions'
          git push origin HEAD:audit/fs-17-dependencies-supply-chain
