name: Pricing Price List Translation PostgreSQL Evidence

on:
  pull_request:
    paths:
      - "apps/server/src/services/module_event_dispatcher.rs"
      - "apps/server/tests/pricing_price_list_translation_target_postgres.rs"
      - "crates/modules/rustok-pricing/src/**"
      - "crates/modules/rustok-pricing/tests/price_list_owner_port_runtime.rs"
      - "crates/modules/rustok-pricing-persistence/**"
      - "crates/modules/rustok-outbox/**"
      - "crates/modules/rustok-translation-targets/**"
      - "crates/utils/rustok-migrations/**"
      - ".github/workflows/pricing-price-list-translation-target-postgres.yml"
  push:
    branches:
      - main
    paths:
      - "apps/server/src/services/module_event_dispatcher.rs"
      - "apps/server/tests/pricing_price_list_translation_target_postgres.rs"
      - "crates/modules/rustok-pricing/src/**"
      - "crates/modules/rustok-pricing/tests/price_list_owner_port_runtime.rs"
      - "crates/modules/rustok-pricing-persistence/**"
      - "crates/modules/rustok-outbox/**"
      - "crates/modules/rustok-translation-targets/**"
      - "crates/utils/rustok-migrations/**"
      - ".github/workflows/pricing-price-list-translation-target-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: "1.96.0"
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  postgres-evidence:
    name: Pricing price-list registered provider PostgreSQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RUSTOK_MIGRATION_SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check focused Rust formatting
        shell: bash
        run: |
          rustfmt +${RUST_TOOLCHAIN} --edition 2024 --check \
            apps/server/tests/pricing_price_list_translation_target_postgres.rs \
            crates/modules/rustok-pricing/src/lib.rs \
            crates/modules/rustok-pricing/src/price_list_owner_port.rs \
            crates/modules/rustok-pricing/src/services/mod.rs \
            crates/modules/rustok-pricing/src/services/price_list_owner.rs \
            crates/modules/rustok-pricing/src/services/translation.rs \
            crates/modules/rustok-pricing/src/translation_changes.rs \
            crates/modules/rustok-pricing/src/translation_target.rs \
            crates/modules/rustok-pricing/tests/price_list_owner_port_runtime.rs
      - name: Run Price List owner port semantics
        run: >-
          cargo test --locked -p rustok-pricing
          --test price_list_owner_port_runtime
      - name: Compile Pricing registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-pricing
          --test pricing_price_list_translation_target_postgres
          --no-run
      - name: Run Pricing registered provider PostgreSQL evidence
        run: >-
          cargo test --locked -p rustok-server --no-default-features
          --features mod-pricing
          --test pricing_price_list_translation_target_postgres
          -- --ignored --nocapture
