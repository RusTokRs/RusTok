name: Pages Terminal Inventory Recompute 5 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - crates/rustok-page-builder/contracts/evidence/pages-page-builder-terminal-evidence-inventory-source.json
      - scripts/verify/verify-pages-page-builder-terminal-evidence-inventory.mjs
      - scripts/evidence/inventory-pages-page-builder-terminal-readiness.mjs
      - scripts/evidence/inventory-pages-page-builder-terminal-readiness.test.mjs
      - crates/rustok-page-builder/contracts/page-builder-fba-registry.json
      - crates/rustok-pages/docs/implementation-plan.md
      - docs/modules/pages-page-builder-terminal-evidence-inventory-actualization-2026-08-14.md
      - .github/workflows/pages-terminal-inventory-recompute-5-validation.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate five-blocker terminal inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify terminal inventory source
        run: node scripts/verify/verify-pages-page-builder-terminal-evidence-inventory.mjs
      - name: Run terminal inventory evaluator tests
        run: node --test scripts/evidence/inventory-pages-page-builder-terminal-readiness.test.mjs
