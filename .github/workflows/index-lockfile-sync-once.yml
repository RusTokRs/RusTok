name: Index Lockfile Sync Once

on:
  push:
    branches:
      - agent/index-runtime-evidence-cursor-20260812
    paths:
      - .github/workflows/index-lockfile-sync-once.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-lockfile:
    if: >-
      github.event.head_commit.message == 'chore(index): stage one-off lockfile sync'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/index-runtime-evidence-cursor-20260812
          fetch-depth: 0

      - name: Remove stale direct rustok-api lock edge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('Cargo.lock')
          source = path.read_text()
          match = re.search(
              r'(?ms)^\[\[package\]\]\nname = "rustok-index"\n.*?(?=^\[\[package\]\]|\Z)',
              source,
          )
          if match is None:
              raise SystemExit('rustok-index package block missing from Cargo.lock')
          block = match.group(0)
          marker = ' "rustok-api",\n'
          if block.count(marker) != 1:
              raise SystemExit('expected exactly one rustok-api edge in rustok-index lock block')
          updated_block = block.replace(marker, '', 1)
          updated = source[:match.start()] + updated_block + source[match.end():]
          if source.count(marker) - updated.count(marker) != 1:
              raise SystemExit('lockfile edit escaped rustok-index package block')
          path.write_text(updated)
          PY
          git diff --check
          test "$(git diff --numstat -- Cargo.lock)" = $'0\t1\tCargo.lock'
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          test "$(git diff --cached --name-only)" = 'Cargo.lock'
          test "$(git diff --cached --numstat -- Cargo.lock)" = $'0\t1\tCargo.lock'
          git commit -m 'chore(index): synchronize lockfile boundary'
          git push origin HEAD:agent/index-runtime-evidence-cursor-20260812
