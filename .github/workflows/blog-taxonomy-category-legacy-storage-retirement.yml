name: Blog Taxonomy Category Legacy Storage Retirement

on:
  pull_request:
    paths:
      - "crates/modules/rustok-blog/src/entities/blog_category.rs"
      - "crates/modules/rustok-blog/src/entities/mod.rs"
      - "crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema.rs"
      - "crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema/schema/tables/categories.rs"
      - "crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema/schema/postgres.rs"
      - "crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema/schema/sqlite.rs"
      - "crates/modules/rustok-blog/src/migrations/mod.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_legacy_storage_retirement.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_dual_write.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_read_cutover.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs"
      - "crates/modules/rustok-blog/tests/post_category_name_projection.rs"
      - "scripts/verify/verify-blog-taxonomy-category-dual-write.mjs"
      - ".github/workflows/blog-taxonomy-category-legacy-storage-retirement.yml"
  push:
    branches:
      - main
    paths:
      - "crates/modules/rustok-blog/src/entities/blog_category.rs"
      - "crates/modules/rustok-blog/src/entities/mod.rs"
      - "crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema.rs"
      - "crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema/schema/tables/categories.rs"
      - "crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema/schema/postgres.rs"
      - "crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema/schema/sqlite.rs"
      - "crates/modules/rustok-blog/src/migrations/mod.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_legacy_storage_retirement.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_dual_write.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_read_cutover.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs"
      - "crates/modules/rustok-blog/tests/post_category_name_projection.rs"
      - "scripts/verify/verify-blog-taxonomy-category-dual-write.mjs"
      - ".github/workflows/blog-taxonomy-category-legacy-storage-retirement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  legacy-storage-retirement-contract:
    name: Blog Taxonomy Category legacy storage retirement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Check touched Rust formatting
        run: |
          rustfmt +1.96.0 --edition 2024 --check --config skip_children=true \
            crates/modules/rustok-blog/src/entities/mod.rs \
            crates/modules/rustok-blog/src/migrations/mod.rs \
            crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema.rs
          rustfmt +1.96.0 --edition 2024 --check \
            crates/modules/rustok-blog/src/entities/blog_category.rs \
            crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema/schema/tables/categories.rs \
            crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema/schema/postgres.rs \
            crates/modules/rustok-blog/src/migrations/m20261029_000001_create_blog_schema/schema/sqlite.rs \
            crates/modules/rustok-blog/tests/category_taxonomy_legacy_storage_retirement.rs \
            crates/modules/rustok-blog/tests/category_taxonomy_dual_write.rs \
            crates/modules/rustok-blog/tests/category_taxonomy_read_cutover.rs \
            crates/modules/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs \
            crates/modules/rustok-blog/tests/post_category_name_projection.rs
      - name: Verify canonical Category command boundary
        run: node scripts/verify/verify-blog-taxonomy-category-dual-write.mjs
      - name: Verify Category legacy storage retirement source contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_legacy_storage_retirement -- --nocapture
      - name: Run Category commands after donor storage retirement
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_dual_write -- --nocapture
      - name: Re-run canonical Category mutation response contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_mutation_response_cutover -- --nocapture
      - name: Re-run Blog Taxonomy Category read cutover contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_read_cutover -- --nocapture
      - name: Re-run post Category-name projection contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test post_category_name_projection -- --nocapture
      - name: Re-run Blog Taxonomy Category delete lifecycle contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_delete_lifecycle -- --nocapture
      - name: Compile Blog owner surface with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo +1.96.0 check --locked -p rustok-blog --lib
