name: Forum Taxonomy Category Read Cutover Contract

on:
  pull_request:
    paths:
      - "crates/rustok-forum/src/services/category_owner.rs"
      - "crates/rustok-forum/src/services/category_visibility_list.rs"
      - "crates/rustok-forum/src/services/category_taxonomy_read.rs"
      - "crates/rustok-forum/tests/category_taxonomy_read_cutover.rs"
      - "crates/rustok-taxonomy/src/owner_category_read.rs"
      - ".github/workflows/forum-taxonomy-category-read-cutover.yml"
  push:
    branches:
      - main
    paths:
      - "crates/rustok-forum/src/services/category_owner.rs"
      - "crates/rustok-forum/src/services/category_visibility_list.rs"
      - "crates/rustok-forum/src/services/category_taxonomy_read.rs"
      - "crates/rustok-forum/tests/category_taxonomy_read_cutover.rs"
      - "crates/rustok-taxonomy/src/owner_category_read.rs"
      - ".github/workflows/forum-taxonomy-category-read-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forum-taxonomy-category-read-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  read-cutover-contract:
    name: Forum Taxonomy Category read cutover Rust contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check canonical workspace formatting
        run: cargo fmt --all -- --check
      - name: Run Forum Taxonomy Category read cutover contract
        run: cargo +1.96.0 test --locked -p rustok-forum --test category_taxonomy_read_cutover -- --nocapture
      - name: Compile Forum category owner surface
        run: cargo +1.96.0 check --locked -p rustok-forum --lib
