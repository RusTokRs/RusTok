name: Agent Blog richtext storage cutover

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-blog-richtext-storage-cutover.yml
      - scripts/agent/blog_richtext_storage_cutover.py.gz.b64

permissions:
  contents: write

jobs:
  apply-source-cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blog-richtext-storage-cutover-20260730
          fetch-depth: 0
      - name: Apply fail-closed source transform
        shell: bash
        run: |
          base64 --decode scripts/agent/blog_richtext_storage_cutover.py.gz.b64 | gzip --decompress > scripts/agent/apply_blog_richtext_storage_cutover.py
          rm scripts/agent/blog_richtext_storage_cutover.py.gz.b64
          python scripts/agent/apply_blog_richtext_storage_cutover.py
          git diff --check
      - name: Commit source cutover
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(blog): complete article richtext source cutover"
          git push origin HEAD:agent/blog-richtext-storage-cutover-20260730
