name: Agent Blog richtext storage cutover

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-blog-richtext-storage-cutover.yml
      - 'scripts/agent/blog_richtext_storage_cutover.part*'

permissions:
  contents: write

concurrency:
  group: agent-blog-richtext-storage-cutover
  cancel-in-progress: true

jobs:
  apply-source-cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blog-richtext-storage-cutover-20260730
          fetch-depth: 0
      - name: Apply fail-closed source transform
        shell: bash
        run: |
          wc -c scripts/agent/blog_richtext_storage_cutover.part*
          sha256sum scripts/agent/blog_richtext_storage_cutover.part*
          cat scripts/agent/blog_richtext_storage_cutover.part* > /tmp/blog-cutover.b64
          wc -c /tmp/blog-cutover.b64
          sha256sum /tmp/blog-cutover.b64
          test "$(wc -c < /tmp/blog-cutover.b64)" -eq 15044
          test "$(sha256sum /tmp/blog-cutover.b64 | cut -d' ' -f1)" = "66c6f00ff5207058459541fe8b1f52ca2fa0a55343a3c51686d23a0a42c74741"
          base64 --decode /tmp/blog-cutover.b64 | gzip --decompress > scripts/agent/apply_blog_richtext_storage_cutover.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent/apply_blog_richtext_storage_cutover.py')
          source = path.read_text(encoding='utf-8')

          owner_old = r'''once(svc, "            body,\n            body_format,\n            content_json,\n            content,\n", "            content,\n")'''
          owner_new = r'''once(svc, "        let CreatePostInput {\n            locale,\n            title,\n            body,\n            body_format,\n            content_json,\n            content,\n", "        let CreatePostInput {\n            locale,\n            title,\n            content,\n")'''
          if source.count(owner_old) != 1:
              raise RuntimeError(f'owner create hotfix expected once, got {source.count(owner_old)}')
          source = source.replace(owner_old, owner_new, 1)

          create_old = """once(gql, '''    pub body: Option<String>,
              pub body_format: Option<String>,
              pub content_json: Option<Value>,
              pub content: Option<RichTextDocument>,
          ''', '''    pub content: RichTextDocument,
          ''')"""
          create_new = """once(gql, '''#[derive(InputObject)]
          pub struct CreatePostInput {
              pub locale: String,
              pub title: String,
              pub body: Option<String>,
              pub body_format: Option<String>,
              pub content_json: Option<Value>,
              pub content: Option<RichTextDocument>,
          ''', '''#[derive(InputObject)]
          pub struct CreatePostInput {
              pub locale: String,
              pub title: String,
              pub content: RichTextDocument,
          ''')"""
          update_old = """once(gql, '''    pub body: Option<String>,
              pub body_format: Option<String>,
              pub content_json: Option<Value>,
              pub content: Option<RichTextDocument>,
          ''', '''    pub content: Option<RichTextDocument>,
          ''')"""
          update_new = """once(gql, '''#[derive(InputObject)]
          pub struct UpdatePostInput {
              pub locale: Option<String>,
              pub title: Option<String>,
              pub body: Option<String>,
              pub body_format: Option<String>,
              pub content_json: Option<Value>,
              pub content: Option<RichTextDocument>,
          ''', '''#[derive(InputObject)]
          pub struct UpdatePostInput {
              pub locale: Option<String>,
              pub title: Option<String>,
              pub content: Option<RichTextDocument>,
          ''')"""
          for label, old, new in [
              ('graphql create', create_old, create_new),
              ('graphql update', update_old, update_new),
          ]:
              if source.count(old) != 1:
                  raise RuntimeError(f'{label} hotfix expected once, got {source.count(old)}')
              source = source.replace(old, new, 1)

          orchestration_old = """once(orch, '''            body: Set(translation.body.clone()),
              body_format: Set(translation.body_format.clone()),
              created_at: Set(translation.created_at),
          ''', '''            body: Set(translation.body.clone()),
              created_at: Set(translation.created_at),
          ''')"""
          orchestration_new = """once(orch, '''            seo_description: Set(None),
              body: Set(translation.body.clone()),
              body_format: Set(translation.body_format.clone()),
              created_at: Set(translation.created_at),
          ''', '''            seo_description: Set(None),
              body: Set(translation.body.clone()),
              created_at: Set(translation.created_at),
          ''')"""
          if source.count(orchestration_old) != 1:
              raise RuntimeError(
                  f'orchestration Blog storage hotfix expected once, got {source.count(orchestration_old)}'
              )
          source = source.replace(orchestration_old, orchestration_new, 1)

          path.write_text(source, encoding='utf-8')
          PY
          rm scripts/agent/blog_richtext_storage_cutover.part*
          rm -f scripts/agent/blog_richtext_storage_cutover.py.gz.b64
          rm -f scripts/agent/archive-link.md
          python3 scripts/agent/apply_blog_richtext_storage_cutover.py
          git diff --check
      - name: Commit source cutover
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(blog): complete article richtext source cutover"
          git push origin HEAD:agent/blog-richtext-storage-cutover-20260730
