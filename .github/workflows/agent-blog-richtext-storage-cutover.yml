name: Agent Blog richtext storage cutover

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-blog-richtext-storage-cutover.yml
      - 'scripts/agent/blog_richtext_storage_cutover.part*'

permissions:
  contents: write

concurrency:
  group: agent-blog-richtext-storage-cutover
  cancel-in-progress: true

jobs:
  apply-source-cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blog-richtext-storage-cutover-20260730
          fetch-depth: 0
      - name: Apply fail-closed source transform
        shell: bash
        run: |
          wc -c scripts/agent/blog_richtext_storage_cutover.part*
          sha256sum scripts/agent/blog_richtext_storage_cutover.part*
          cat scripts/agent/blog_richtext_storage_cutover.part* > /tmp/blog-cutover.b64
          wc -c /tmp/blog-cutover.b64
          sha256sum /tmp/blog-cutover.b64
          test "$(wc -c < /tmp/blog-cutover.b64)" -eq 15044
          test "$(sha256sum /tmp/blog-cutover.b64 | cut -d' ' -f1)" = "66c6f00ff5207058459541fe8b1f52ca2fa0a55343a3c51686d23a0a42c74741"
          base64 --decode /tmp/blog-cutover.b64 | gzip --decompress > scripts/agent/apply_blog_richtext_storage_cutover.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent/apply_blog_richtext_storage_cutover.py')
          source = path.read_text(encoding='utf-8')
          old = '''once(svc, "            body,\n            body_format,\n            content_json,\n            content,\n", "            content,\n")'''
          new = '''once(svc, "        let CreatePostInput {\n            locale,\n            title,\n            body,\n            body_format,\n            content_json,\n            content,\n", "        let CreatePostInput {\n            locale,\n            title,\n            content,\n")'''
          if source.count(old) != 1:
              raise RuntimeError(f'owner create hotfix expected once, got {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm scripts/agent/blog_richtext_storage_cutover.part*
          rm -f scripts/agent/blog_richtext_storage_cutover.py.gz.b64
          rm -f scripts/agent/archive-link.md
          python3 scripts/agent/apply_blog_richtext_storage_cutover.py
          git diff --check
      - name: Commit source cutover
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(blog): complete article richtext source cutover"
          git push origin HEAD:agent/blog-richtext-storage-cutover-20260730
