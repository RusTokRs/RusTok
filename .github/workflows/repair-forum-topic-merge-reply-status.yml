name: Repair Forum topic merge reply status

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-forum-topic-merge-reply-status.yml

permissions:
  contents: write

concurrency:
  group: repair-forum-topic-merge-reply-status
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/forum-topic-merge-reply-status-20260803'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/forum-topic-merge-reply-status-20260803
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.96.0

      - name: Restore status-owned solution validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('crates/rustok-forum/src/services/topic_merge.rs')
          service = service_path.read_text()
          old = '''        .filter(forum_reply::Column::TopicId.eq(topic_id))
                  .filter(forum_reply::Column::DeletedAt.is_null())
                  .filter(forum_reply::Column::Status.eq(ReplyStatus::Approved))'''
          new = '''        .filter(forum_reply::Column::TopicId.eq(topic_id))
                  .filter(forum_reply::Column::Status.eq(ReplyStatus::Approved))'''
          count = service.count(old)
          if count != 1:
              raise SystemExit(f'Forum solution predicate: expected one match, found {count}')
          service_path.write_text(service.replace(old, new, 1))

          verifier_path = Path('scripts/verify/verify-forum-topic-merge-owner.mjs')
          verifier = verifier_path.read_text()
          anchor = '''assert.ok(!service.includes("Forum topic merge requires source and target topics in the same category"));
          assert.ok(!service.includes("FORUM_TOPIC_MERGED_CROSS_CATEGORY_SCHEMA_VERSION"));'''
          replacement = '''assert.ok(!service.includes("Forum topic merge requires source and target topics in the same category"));
          assert.ok(service.includes("forum_reply::Column::Status.eq(ReplyStatus::Approved)"));
          assert.ok(!service.includes("forum_reply::Column::DeletedAt"));
          assert.ok(!service.includes("FORUM_TOPIC_MERGED_CROSS_CATEGORY_SCHEMA_VERSION"));'''
          count = verifier.count(anchor)
          if count != 1:
              raise SystemExit(f'Forum verifier predicate guard: expected one match, found {count}')
          verifier = verifier.replace(anchor, replacement, 1)

          graphql_anchor = '''const graphql = read(paths.graphql);
          const ordinaryTest = read(paths.ordinaryTest);'''
          graphql_replacement = '''const graphql = read(paths.graphql);
          const graphqlProduction = graphql.split("#[cfg(test)]", 1)[0];
          const ordinaryTest = read(paths.ordinaryTest);'''
          count = verifier.count(graphql_anchor)
          if count != 1:
              raise SystemExit(f'Forum verifier GraphQL production slice: expected one match, found {count}')
          verifier = verifier.replace(graphql_anchor, graphql_replacement, 1)

          transport_anchor = '''includesAll(
            graphql,
            ['''
          transport_replacement = '''includesAll(
            graphqlProduction,
            ['''
          count = verifier.count(transport_anchor)
          if count != 1:
              raise SystemExit(f'Forum verifier GraphQL transport scope: expected one match, found {count}')
          verifier = verifier.replace(transport_anchor, transport_replacement, 1)

          forbidden_anchor = '''assert.ok(!graphql.includes(forbidden), `GraphQL transport contains forbidden marker: ${forbidden}`);'''
          forbidden_replacement = '''assert.ok(
            !graphqlProduction.includes(forbidden),
            `GraphQL transport contains forbidden marker: ${forbidden}`,
          );'''
          count = verifier.count(forbidden_anchor)
          if count != 1:
              raise SystemExit(f'Forum verifier forbidden transport scope: expected one match, found {count}')
          verifier = verifier.replace(forbidden_anchor, forbidden_replacement, 1)

          machine_anchor = '''assert.equal(adminContract.compatibility.migration_added, false);'''
          machine_replacement = '''assert.equal(adminContract.compatibility.migration_added, false);
          assert.equal(adminContract.leptos_admin.transport_state, "single_adapter_graphql");'''
          count = verifier.count(machine_anchor)
          if count != 1:
              raise SystemExit(f'Forum verifier admin transport contract: expected one match, found {count}')
          verifier = verifier.replace(machine_anchor, machine_replacement, 1)

          docs_anchor = '''    "single-adapter GraphQL state",'''
          docs_replacement = '''    "explicit GraphQL-only adapter state",'''
          count = verifier.count(docs_anchor)
          if count != 1:
              raise SystemExit(f'Forum verifier admin handoff wording: expected one match, found {count}')
          verifier_path.write_text(verifier.replace(docs_anchor, docs_replacement, 1))
          PY

      - name: Ensure Index lock edges
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Cargo.lock')
          text = path.read_text()
          old = ''' "rust_decimal",
           "rustok-core",
           "rustok-events",
           "sea-orm",'''
          new = ''' "rust_decimal",
           "rustok-api",
           "rustok-core",
           "rustok-events",
           "rustok-runtime",
           "sea-orm",'''
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 1 and new_count == 0:
              path.write_text(text.replace(old, new, 1))
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f'Index lock dependency block: expected exactly one old or new shape, '
                  f'found old={old_count}, new={new_count}'
              )
          PY

      - name: Format Forum repair
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        run: cargo fmt --all

      - name: Verify Forum owner source contract
        run: node scripts/verify/verify-forum-topic-merge-owner.mjs

      - name: Check Forum library
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: cargo check --locked -p rustok-forum --lib

      - name: Run ordinary topic merge regressions
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: cargo test --locked -p rustok-forum --test topic_merge_sqlite

      - name: Run solution resolution regressions
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: cargo test --locked -p rustok-forum --test topic_merge_solution_resolution_sqlite

      - name: Run cross-category merge regressions
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: cargo test --locked -p rustok-forum --test topic_merge_cross_category_sqlite

      - name: Commit verified Forum repair
        run: |
          git checkout -- Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rustok-forum/src/services/topic_merge.rs scripts/verify/verify-forum-topic-merge-owner.mjs
          git diff --cached --quiet && { echo "expected Forum repair is missing" >&2; exit 1; }
          test -z "$(git status --short --untracked-files=no | grep -vE '^(M | M)(crates/rustok-forum/src/services/topic_merge.rs|scripts/verify/verify-forum-topic-merge-owner.mjs)$')"
          git commit -m "fix(forum): validate merge solutions by reply status"
          git push origin HEAD:fix/forum-topic-merge-reply-status-20260803
