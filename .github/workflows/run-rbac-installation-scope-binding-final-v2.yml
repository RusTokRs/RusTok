name: Run final RBAC installation binding gate v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-rbac-installation-scope-binding-final-v2.yml

permissions:
  contents: write

concurrency:
  group: run-rbac-installation-scope-binding-final-v2
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'agent/core-rbac-cycle-001-20260803'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/core-rbac-cycle-001-20260803
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.96.0

      - name: Apply corrected verified patches
        run: |
          ruby -ryaml <<'RUBY'
          workflow = YAML.load_file('.github/workflows/run-rbac-installation-scope-binding-final.yml')
          steps = workflow.fetch('jobs').fetch('patch-and-verify').fetch('steps')

          names = [
            'Apply verified base patch',
            'Finalize installation identity storage',
            'Canonicalize SQLite assignment identities',
          ]
          scripts = names.map do |name|
            step = steps.find { |candidate| candidate['name'] == name }
            abort("verified step #{name} is missing") unless step && step['run']
            step.fetch('run').dup
          end

          assignment = scripts.fetch(2)
          replacements = {
            '("command.tenant_id.into(),", "uuid_value(backend, command.tenant_id),", 5),' =>
              '("command.tenant_id.into(),", "uuid_value(backend, command.tenant_id),", 4),',
            '("command.role_id.into(),", "uuid_value(backend, command.role_id),", 4),' =>
              '("command.role_id.into(),", "uuid_value(backend, command.role_id),", 3),',
          }
          replacements.each do |old, new_value|
            abort("assignment harness marker is not unique: #{old}") unless assignment.scan(old).length == 1
            assignment.sub!(old, new_value)
          end

          marker = "expression_replacements = [\n"
          abort('assignment expression marker is not unique') unless assignment.scan(marker).length == 1
          role_lookup = <<~'PYTHON'
            assignment = replace_once(
                assignment,
                "vec![command.role_id.into(), command.tenant_id.into()]",
                "vec![uuid_value(backend, command.role_id), uuid_value(backend, command.tenant_id)]",
                "role existence UUID values",
            )

          PYTHON
          assignment.sub!(marker, role_lookup + marker)
          scripts[2] = assignment

          scripts.each_with_index do |script, index|
            path = "/tmp/verified-rbac-v2-step-#{index}.sh"
            File.write(path, script)
            abort("verified patch step #{names[index]} failed") unless system('bash', path)
          end
          RUBY

      - name: Format changed Rust sources
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        run: cargo fmt --all

      - name: Verify RBAC source contract
        run: node scripts/verify/verify-rbac-artifact-permission-tenant-integrity.mjs

      - name: Check RBAC crate
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: cargo check --locked -p rustok-rbac --all-features

      - name: Run artifact permission regressions
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          CARGO_INCREMENTAL: 0
        run: |
          cargo test --locked -p rustok-rbac --lib artifact_permission_catalog
          cargo test --locked -p rustok-rbac --test artifact_permission_upgrade_sqlite
          cargo test --locked -p rustok-rbac --test artifact_permission_tenant_integrity_sqlite
          cargo test --locked -p rustok-rbac --test artifact_permission_outbox_sqlite

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/rustok-rbac/src/artifact_permission_assignment.rs \
            crates/rustok-rbac/src/artifact_permission_catalog.rs \
            crates/rustok-rbac/src/m20260803_000001_canonicalize_artifact_permissions.rs \
            crates/rustok-rbac/tests/artifact_permission_upgrade_sqlite.rs \
            crates/rustok-rbac/tests/artifact_permission_tenant_integrity_sqlite.rs \
            crates/rustok-rbac/tests/artifact_permission_outbox_sqlite.rs \
            scripts/verify/verify-rbac-artifact-permission-tenant-integrity.mjs
          git commit -m "fix(rbac): bind permission vocabulary to installation scope"
          git push origin HEAD:agent/core-rbac-cycle-001-20260803
