name: RBAC Source Repair Once

on:
  push:
    branches:
      - agent/rbac-exact-head-evidence-cycle-001

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rbac-exact-head-verification-cycle-001
          fetch-depth: 0
      - name: Apply guarded source and evidence repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9e311126fae48787e8f7cbf9ce1e0d983f4482db"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5f95e475dd0dcb56534419e081fe2c6eba1745e9"
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          worker = "apps/server/src/services/product_index_refresh_worker.rs"
          replace_once(worker, "use tokio::task::JoinHandle;\n", "")
          replace_once(
              worker,
              "pub struct ProductIndexRefreshWorkerHandle {\n    instance_id: u64,\n    handle: JoinHandle<()>,\n}\n\nimpl ProductIndexRefreshWorkerHandle {\n    pub fn instance_id(&self) -> u64 {\n        self.instance_id\n    }\n\n    pub fn is_ready(&self) -> bool {\n        !self.handle.is_finished()\n    }\n}\n",
              "pub struct ProductIndexRefreshWorkerHandle;\n",
          )
          replace_once(
              worker,
              "    ctx.shared_insert(ProductIndexRefreshWorkerHandle {\n        instance_id,\n        handle: tokio::spawn(product_index_refresh_worker_loop(runtime, config, stop_rx)),\n    });\n",
              "    tokio::spawn(product_index_refresh_worker_loop(runtime, config, stop_rx));\n    ctx.shared_insert(ProductIndexRefreshWorkerHandle);\n",
          )

          plan = "crates/rustok-rbac/docs/implementation-plan.md"
          replace_once(
              plan,
              "### P0 — runtime evidence\n\n",
              "### P0. Database concurrency and multi-replica recovery evidence\n\nStatus: `in_progress`\n\n- [ ] Exercise at least two server replicas with Redis available, unavailable, and restarted while retaining bounded convergence evidence.\n- [ ] Exercise CLI system-role repair while live replicas are running and prove durable-generation recovery without process restart.\n\n",
          )

          master = "docs/verification/PLATFORM_VERIFICATION_PLAN.md"
          replace_once(
              master,
              "  packets; live negative transports; native operator parity; FFA/FBA promotion evidence.\n",
              "  packets; live negative transports; native operator parity; FFA/FBA promotion evidence.\n- Retained packets for multi-replica Redis recovery remain absent; watchdog, CLI repair,\n  incident, and final same-revision runtime evidence therefore remain mandatory.\n",
          )

          redis_doc = "crates/rustok-rbac/docs/two-process-redis-restart-evidence.md"
          replace_once(
              redis_doc,
              "The observer starts the canonical RBAC cache invalidation listener but does not\nstart the durable-generation watchdog.",
              "The observer starts the canonical RBAC cache invalidation listener but does not start the durable-generation watchdog.",
          )
          replace_once(
              redis_doc,
              "A second Admin user is primed in the same observer. The parent stops the isolated\nRedis process",
              "A second Admin user is primed in the same observer. The parent stops the isolated Redis process",
          )
          replace_once(
              redis_doc,
              "The parent then restarts `redis-server` on the same loopback port. The existing\nobserver process must reconnect.",
              "The parent then restarts `redis-server` on the same loopback port. The existing observer process must reconnect.",
          )
          replace_once(
              redis_doc,
              "The canonical cursor remains `core/rbac` and the full multi-replica P0 gate remains\nopen until",
              "The canonical cursor remains `core/rbac` and the full multi-replica P0 gate remains open until",
          )

          cli_doc = "crates/rustok-rbac/docs/cli-live-repair-propagation-evidence.md"
          replace_once(
              cli_doc,
              "context, cache listener and durable-generation watchdog. Redis configuration is\nexplicitly removed from every child process.",
              "context, cache listener and durable-generation watchdog. Redis configuration is explicitly removed from every child process.",
          )
          replace_once(
              cli_doc,
              "the registered `rustok-rbac-cli` command provider. The runtime contains only the\nPostgreSQL connection and settings object. It does not receive a server cache\nservice, process-local invalidation bus or Redis handle.",
              "the registered `rustok-rbac-cli` command provider. The runtime contains only the PostgreSQL connection and settings object. It does not receive a server cache service, process-local invalidation bus or Redis handle.",
          )
          PY
          cargo fmt --all -- --check
          node scripts/verify/verify-rbac-two-process-redis-restart-source.mjs
          node scripts/verify/verify-rbac-cli-live-repair-propagation-source.mjs
          git diff --check
          git diff -- apps/server/src/services/product_index_refresh_worker.rs crates/rustok-rbac/docs/implementation-plan.md crates/rustok-rbac/docs/two-process-redis-restart-evidence.md crates/rustok-rbac/docs/cli-live-repair-propagation-evidence.md docs/verification/PLATFORM_VERIFICATION_PLAN.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/services/product_index_refresh_worker.rs crates/rustok-rbac/docs/implementation-plan.md crates/rustok-rbac/docs/two-process-redis-restart-evidence.md crates/rustok-rbac/docs/cli-live-repair-propagation-evidence.md docs/verification/PLATFORM_VERIFICATION_PLAN.md
          git commit -m "fix(rbac): unblock exact-head recovery evidence"
          git push origin HEAD:agent/rbac-exact-head-verification-cycle-001
