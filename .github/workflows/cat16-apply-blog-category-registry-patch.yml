name: CAT16 Apply Blog Category Registry Patch

on:
  push:
    branches:
      - agent/cat16-blog-category-central-registry
    paths:
      - ".github/workflows/cat16-apply-blog-category-registry-patch.yml"

permissions:
  contents: write

concurrency:
  group: cat16-apply-blog-category-registry-patch
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/cat16-blog-category-central-registry
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Patch only stale Blog Category registry claims
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/modules/registry.md")
          text = path.read_text()
          replacements = [
              (
                  "Registered `blog/category` Translation target exposes exact category copy through owner CAS, durable receipts, cursor evidence, and transactional Search reindex; Blog post copy and Taxonomy-owned tags remain outside the pilot.",
                  "Blog Category canonical copy is Taxonomy-owned through the same-ID Blog-to-Taxonomy binding and the registered `taxonomy/term` Translation target; Blog post copy remains a separate future Blog-owned editorial surface.",
              ),
              (
                  "Mounted Leptos persistence/reload parity, Next rejection/reload, live comments errors, delivery, retry, recovery, and Blog Translation concurrency/cursor recovery execution remain required for `transport_verified`.",
                  "Mounted Leptos persistence/reload parity, Next rejection/reload, live comments errors, delivery, retry, and recovery remain required for `transport_verified`; canonical Category Translation concurrency/cursor recovery is Taxonomy-owned and tracked with the Taxonomy provider.",
              ),
              (
                  "Blog domain, posts, categories, tags, transport/UI; registered exact `blog/category` Translation target with owner-local revisions, durable receipts, change cursor, and Search reindex",
                  "Blog domain, posts, Category bindings, tags, transport/UI; canonical Category localized copy and Translation are Taxonomy-owned through the same-ID binding, while Blog retains Blog-specific membership/settings and post/editorial ownership",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one registry marker, got {count}: {old}")
              text = text.replace(old, new)
          path.write_text(text)
      - name: Verify bounded diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "docs/modules/registry.md"
          git diff -- docs/modules/registry.md
      - name: Commit registry patch
        shell: bash
        run: |
          git config user.name "CAT-16 docs bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/modules/registry.md
          git commit -m "docs(modules): actualize Blog Category ownership row"
          git push origin HEAD:agent/cat16-blog-category-central-registry
