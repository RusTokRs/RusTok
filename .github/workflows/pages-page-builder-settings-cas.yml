name: Pages Page Builder Settings CAS

on:
  pull_request:
    paths:
      - "crates/modules/rustok-modules/src/operation_store.rs"
      - ".github/workflows/pages-page-builder-settings-cas.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  settings-cas:
    name: Atomic module settings CAS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: pages-page-builder-settings-cas
      - name: Check rustok-modules formatting
        run: cargo fmt -p rustok-modules -- --check
      - name: Run module settings persistence and CAS tests
        if: ${{ !cancelled() }}
        run: cargo test -p rustok-modules --lib settings_
