name: Pages Page Builder Settings CAS

on:
  pull_request:
    paths:
      - "crates/modules/rustok-modules/src/operation_store.rs"
      - ".github/workflows/pages-page-builder-settings-cas.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  settings-cas:
    name: Atomic module settings CAS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: pages-page-builder-settings-cas
      - name: Check rustok-modules formatting
        run: cargo fmt -p rustok-modules -- --check
      - name: Run module settings persistence and CAS tests
        if: ${{ !cancelled() }}
        run: cargo test -p rustok-modules --lib settings_
