      - "crates/rustok-page-builder/scripts/verify/verify-pages-page-builder-plan-parity.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-runner:
    name: Provider-health, Pages gate and Forum admission/source evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify deployment identity evidence source
        if: ${{ !cancelled() }}
        run: node crates/rustok-page-builder/scripts/verify/verify-page-builder-provider-health-deployment-identity.mjs
      - name: Verify deployment evaluator evidence source
        if: ${{ !cancelled() }}
        run: node crates/rustok-page-builder/scripts/verify/verify-page-builder-provider-health-deployment-evaluator.mjs
      - name: Verify binding owner acceptance source
        if: ${{ !cancelled() }}
        run: node crates/rustok-pages/scripts/verify/verify-pages-builder-provider-health-owner-acceptance.mjs
      - name: Verify runtime evidence harness source
        if: ${{ !cancelled() }}
        run: node crates/rustok-pages/scripts/verify/verify-pages-builder-provider-health-runtime-harness.mjs
      - name: Verify observed-health owner acceptance source
        if: ${{ !cancelled() }}
        run: node crates/rustok-pages/scripts/verify/verify-pages-builder-provider-health-observed-acceptance.mjs
      - name: Verify observed-health owner acceptance runner test source
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-pages-builder-provider-health-owner-runner-tests.mjs
      - name: Observed-health owner acceptance runner synthetic tests
        if: ${{ !cancelled() }}
        run: node scripts/evidence/accept-pages-builder-provider-health-runtime.test.mjs
      - name: Verify Pages reference-consumer gate acceptance source
        if: ${{ !cancelled() }}
        run: node crates/rustok-pages/scripts/verify/verify-pages-reference-consumer-gate-acceptance.mjs
      - name: Verify Pages gate owner acceptance runner test source
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-pages-reference-consumer-gate-owner-runner-tests.mjs
      - name: Pages gate owner acceptance runner synthetic tests
        if: ${{ !cancelled() }}
        run: node scripts/evidence/accept-pages-reference-consumer-gate.test.mjs
      - name: Verify Forum Wave admission source
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-forum-page-builder-wave-admission.mjs
      - name: Verify Forum Wave admission runner test source
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-forum-page-builder-wave-admission-runner-tests.mjs
      - name: Forum Wave admission runner synthetic tests
        if: ${{ !cancelled() }}
        run: node scripts/evidence/admit-forum-page-builder-wave.test.mjs
      - name: Verify Forum Wave evidence freshness source-ready packet
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-forum-wave-evidence-freshness.mjs
      - name: Verify Forum Wave live admission lineage source-ready packet
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-forum-wave-admission-lineage.mjs
      - name: Forum Wave live admission lineage synthetic tests
        if: ${{ !cancelled() }}
        run: node scripts/verify/verify-forum-wave-admission-lineage.test.mjs
      - name: Verify Pages and Page Builder plan parity
        if: ${{ !cancelled() }}
        run: node crates/rustok-page-builder/scripts/verify/verify-pages-page-builder-plan-parity.mjs
