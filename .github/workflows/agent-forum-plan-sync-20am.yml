              "`FORUM-20R/20S/20T/20U/20V/20W/20X/20Y/20Z/20AA/20AB/20AC/20AD/20AE/20AF/20AG/20AH/20AI/20AJ/20AK/20AL/20AM` source and documentation slices.",
          )

          replace_once(
              owner_readme,
              "- `NotificationInboxReconcileService` and bounded reconciliation request/page contracts;\n- `rustok_notifications::api`, `entities`, `model`, and `migrations`.",
