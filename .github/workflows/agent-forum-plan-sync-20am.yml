'''
          new_verifier = r'''for (const sync of [contract.canonical_plan_sync, contract.notifications_local_plan_sync]) {
  if (
    sync?.status !== "synchronized_by_FORUM-20AM" ||
    sync.required_ledger_through !== "FORUM-20AL" ||
