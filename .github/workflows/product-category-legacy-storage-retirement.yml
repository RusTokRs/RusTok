name: Product Category Legacy Storage Retirement

on:
  pull_request:
    paths:
      - "crates/rustok-product/src/migrations/m20260829_000018_retire_product_category_legacy_translations.rs"
      - "crates/rustok-product/src/migrations/mod.rs"
      - "crates/rustok-product/src/services/catalog_schema_service/categories.rs"
      - "crates/rustok-product/docs/category-taxonomy-binding.md"
      - "crates/rustok-product/docs/category-locale-contract.md"
      - "crates/rustok-taxonomy/docs/implementation-plan.md"
      - "docs/architecture/database.md"
      - "docs/migrations/backfill-contracts.json"
      - "scripts/verify/verify-product-category-legacy-storage-retirement.mjs"
      - ".github/workflows/product-category-legacy-storage-retirement.yml"
      - ".github/workflows/product-category-legacy-write-retirement.yml"
      - ".github/workflows/product-category-seo-seam.yml"

permissions:
  contents: read

concurrency:
  group: product-category-legacy-storage-retirement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  legacy-storage-retirement-contract:
    name: Product Category legacy storage retirement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Fetch exact PR base
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
      - name: Verify Product Category legacy storage retirement contract when CAT-29 changes
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='crates/rustok-product/src/migrations/m20260829_000018_retire_product_category_legacy_translations.rs'
          verifier='scripts/verify/verify-product-category-legacy-storage-retirement.mjs'
          changed="$(git diff --name-only "$base" "$head")"
          if ! printf '%s\n' "$changed" | grep -Fxq "$migration" \
            && ! printf '%s\n' "$changed" | grep -Fxq "$verifier"; then
            echo "CAT-29 runtime/verifier unchanged; historical CAT-29 source verifier is not applicable."
            exit 0
          fi
          node scripts/verify/verify-product-category-legacy-storage-retirement.mjs
      - name: Assert bounded CAT-29 file set when CAT-29 changes
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='crates/rustok-product/src/migrations/m20260829_000018_retire_product_category_legacy_translations.rs'
          verifier='scripts/verify/verify-product-category-legacy-storage-retirement.mjs'
          allowed='^(crates/rustok-product/src/migrations/m20260829_000018_retire_product_category_legacy_translations\.rs|crates/rustok-product/src/migrations/mod\.rs|crates/rustok-product/docs/category-taxonomy-binding\.md|crates/rustok-product/docs/category-locale-contract\.md|crates/rustok-taxonomy/docs/implementation-plan\.md|docs/architecture/database\.md|docs/migrations/backfill-contracts\.json|scripts/verify/verify-product-category-legacy-storage-retirement\.mjs|\.github/workflows/product-category-legacy-storage-retirement\.yml|\.github/workflows/product-category-legacy-write-retirement\.yml|\.github/workflows/product-category-seo-seam\.yml)$'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          if ! printf '%s\n' "$changed" | grep -Fxq "$migration" \
            && ! printf '%s\n' "$changed" | grep -Fxq "$verifier"; then
            echo "CAT-29 runtime/verifier unchanged; PR-wide CAT-29 slice restriction is not applicable."
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
      - name: Check Product formatting
        run: cargo fmt --check --manifest-path crates/rustok-product/Cargo.toml
      - name: Preserve non-PostgreSQL donor runtime regression
        run: cargo test -p rustok-product --lib category_legacy_translation_write_is_non_postgres_only -- --nocapture
      - name: Compile Product Category storage retirement
        run: cargo check -p rustok-product --lib
      - name: Check full PR whitespace
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --check "$base" "$head"
