name: Temporary Forum production-deferral patcher

on:
  push:
    branches:
      - agent/taxonomy-defer-production-validation-20260901
    paths:
      - ".github/workflows/tmp-forum-production-deferral-patcher.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/taxonomy-defer-production-validation-20260901
      - name: Align Forum-25 with deferred production validation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          plan = "crates/rustok-forum/docs/implementation-plan.md"
          old_row = "| `FORUM-25` | `in_progress` | The Category backend/Translation ownership cutover is complete: canonical Category copy/routes/hierarchy are Taxonomy-owned, while the duplicate Forum provider, cursor/progress runtime and legacy donor storage are retired and provider-era PostgreSQL evidence is superseded. Arabic admin/storefront catalogs, content-locale SEO/editor boundaries and multilingual/RTL admin read/write surfaces remain source-ready. Retain mounted multilingual/RTL browser parity against Taxonomy-owned Category data; topic/reply UGC translation remains opt-in rather than an automatic provider. |"
          new_row = "| `FORUM-25` | `done` | Category backend/Translation implementation is complete: canonical Category copy/routes/hierarchy are Taxonomy-owned, the duplicate Forum provider/cursor/progress runtime and legacy donor storage are retired, and Arabic/admin/storefront locale boundaries are source-ready. Mounted multilingual/RTL browser execution is deferred to the final production-validation phase and does not keep FORUM-25 open; topic/reply UGC translation remains opt-in rather than an automatic provider. |"
          replace_once(plan, old_row, new_row)

          final_section = (
              "## Final production validation — DEFERRED\n\n"
              "Deployment-dependent evidence is collected after the remaining Forum source/backend product queue is\n"
              "exhausted. A live tenant, maintainer credential, mounted browser fixture or observed rollout does not\n"
              "keep an otherwise complete Forum implementation task open. Production-only checks are appended here\n"
              "instead of being used as intermediate ledger blockers.\n\n"
              "Repository-executable engineering gates are **not** deferred: focused source/runtime tests, SQLite/\n"
              "PostgreSQL migration evidence, composition profiles, schema checks and browser harnesses that can run\n"
              "against isolated test fixtures remain part of the task that changes their boundary.\n\n"
              "### PROD-FORUM-25 — Category multilingual/RTL mounted evidence — DEFERRED\n\n"
              "Execute the retained `Forum Category Taxonomy Browser Evidence` `workflow_dispatch` from `main` only\n"
              "after a prepared Taxonomy-backed Forum admin/storefront fixture and authenticated GitHub environment\n"
              "exist. The mounted multilingual/RTL job must execute rather than skip and its successful run URL/ID\n"
              "plus exact `main` head SHA must be retained. Until then the browser packet remains production evidence\n"
              "pending without reopening FORUM-25 or TAXONOMY-CAT-5 implementation.\n\n"
          )
          p = Path(plan)
          text = p.read_text()
          marker = "## Release gates\n"
          if final_section in text or text.count(marker) != 1:
              raise SystemExit("Forum final-production insertion precondition failed")
          p.write_text(text.replace(marker, final_section + marker, 1))

          verifier = "scripts/verify/verify-forum-taxonomy-category-translation-owner.mjs"
          replace_once(
              verifier,
              "  requireText(plan, 'Retain mounted multilingual/RTL browser parity against Taxonomy-owned Category data');\n  requireText(plan, '| `FORUM-25` | `in_progress` |', 'FORUM-25 remains in progress');",
              "  requireText(plan, 'Mounted multilingual/RTL browser execution is deferred to the final production-validation phase');\n  requireText(plan, '| `FORUM-25` | `done` |', 'FORUM-25 implementation is complete');\n  requireText(plan, '## Final production validation — DEFERRED', 'Forum final production-validation phase');\n  requireText(plan, 'without reopening FORUM-25 or TAXONOMY-CAT-5 implementation', 'Forum Category deferred production evidence boundary');",
          )
          PY
          rm -f .github/workflows/tmp-forum-production-deferral-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(forum): close FORUM-25 implementation scope"
          git push origin HEAD:agent/taxonomy-defer-production-validation-20260901
