name: Forum Admin Locale Switch Contract

on:
  pull_request:
    paths:
      - "crates/modules/rustok-forum/admin/**"
      - "crates/modules/rustok-forum/docs/forum-28-admin-locale-switch-contract.md"
      - "scripts/verify/verify-forum-admin-locale-switch.mjs"
      - ".github/workflows/forum-admin-locale-switch-contract.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify locale-switch source contract
        run: node scripts/verify/verify-forum-admin-locale-switch.mjs

  rust-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Test locale-switch policy
        run: cargo test --locked -p rustok-forum-admin locale_switch -- --nocapture
      - name: Check Forum admin package
        run: cargo check --locked -p rustok-forum-admin
