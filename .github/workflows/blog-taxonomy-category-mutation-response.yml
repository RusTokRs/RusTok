name: Blog Taxonomy Category Mutation Response Contract

on:
  pull_request:
    paths:
      - "crates/modules/rustok-blog/src/services/category_owner.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_dual_write.rs"
      - ".github/workflows/blog-taxonomy-category-mutation-response.yml"
  push:
    branches:
      - main
    paths:
      - "crates/modules/rustok-blog/src/services/category_owner.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs"
      - "crates/modules/rustok-blog/tests/category_taxonomy_dual_write.rs"
      - ".github/workflows/blog-taxonomy-category-mutation-response.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutation-response-contract:
    name: Blog Taxonomy Category mutation response
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check touched Rust leaf formatting
        run: |
          rustfmt +1.96.0 --edition 2024 --check \
            crates/modules/rustok-blog/src/services/category_owner.rs \
            crates/modules/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs \
            crates/modules/rustok-blog/tests/category_taxonomy_dual_write.rs
      - name: Run canonical Category mutation response contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_mutation_response_cutover -- --nocapture
      - name: Re-run Blog Taxonomy Category read cutover contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_read_cutover -- --nocapture
      - name: Re-run Blog Taxonomy Category dual-write contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_dual_write -- --nocapture
      - name: Compile Blog Category owner surface
        run: cargo +1.96.0 check --locked -p rustok-blog --lib
