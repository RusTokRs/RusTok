name: Blog Taxonomy Category Mutation Response Contract

on:
  pull_request:
    paths:
      - "crates/rustok-blog/src/services/category_owner.rs"
      - "crates/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs"
      - ".github/workflows/blog-taxonomy-category-mutation-response.yml"
  push:
    branches:
      - main
    paths:
      - "crates/rustok-blog/src/services/category_owner.rs"
      - "crates/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs"
      - ".github/workflows/blog-taxonomy-category-mutation-response.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-taxonomy-category-mutation-response-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutation-response-contract:
    name: Blog Taxonomy Category mutation response
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check touched Rust leaf formatting
        run: |
          rustfmt +1.96.0 --edition 2024 --check \
            crates/rustok-blog/src/services/category_owner.rs \
            crates/rustok-blog/tests/category_taxonomy_mutation_response_cutover.rs
      - name: Run canonical Category mutation response contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_mutation_response_cutover -- --nocapture
      - name: Re-run Blog Taxonomy Category read cutover contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_read_cutover -- --nocapture
      - name: Re-run Blog Taxonomy Category dual-write contract
        run: cargo +1.96.0 test --locked -p rustok-blog --test category_taxonomy_dual_write -- --nocapture
      - name: Compile Blog Category owner surface
        run: cargo +1.96.0 check --locked -p rustok-blog --lib
