name: Product Category Closure Invariant Retirement

on:
  pull_request:
    paths:
      - "crates/rustok-product/src/migrations/m20260829_000019_retire_product_category_closure_invariant.rs"
      - "crates/rustok-product/src/migrations/mod.rs"
      - "crates/rustok-product/docs/category-taxonomy-binding.md"
      - "docs/migrations/backfill-contracts.json"
      - "scripts/verify/verify-product-category-closure-invariant-retirement.mjs"
      - ".github/workflows/product-category-closure-invariant-retirement.yml"
      - ".github/workflows/product-category-closure-write-retirement.yml"

permissions:
  contents: read

concurrency:
  group: product-category-closure-invariant-retirement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTOK_MIGRATION_SMOKE_ADMIN_URL: postgres://rustok_migration:rustok_migration@localhost:5432/postgres

jobs:
  closure-invariant-retirement-contract:
    name: Product Category closure invariant retirement
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Product Category closure invariant retirement contract
        run: node scripts/verify/verify-product-category-closure-invariant-retirement.mjs
      - name: Fetch exact PR base
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
      - name: Assert bounded CAT-33 file set
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(crates/rustok-product/src/migrations/m20260829_000019_retire_product_category_closure_invariant\.rs|crates/rustok-product/src/migrations/mod\.rs|crates/rustok-product/docs/category-taxonomy-binding\.md|docs/migrations/backfill-contracts\.json|scripts/verify/verify-product-category-closure-invariant-retirement\.mjs|\.github/workflows/product-category-closure-invariant-retirement\.yml|\.github/workflows/product-category-closure-write-retirement\.yml)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
      - name: Check Product formatting
        run: cargo fmt --check --manifest-path crates/rustok-product/Cargo.toml
      - name: Create bounded migration test role
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --port 5432 --username postgres --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE rustok_migration LOGIN PASSWORD 'rustok_migration' CREATEDB NOSUPERUSER NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 8"
      - name: Rehearse fresh PostgreSQL apply plus CAT-33 rollback and reapply
        env:
          RUSTOK_MIGRATION_SMOKE_DB_NAME: rustok_cat33_${{ github.run_id }}
          RUSTOK_MIGRATION_SMOKE_INCREMENTAL: "0"
          RUSTOK_MIGRATION_SMOKE_ROLLBACK_LATEST: "1"
          RUSTOK_MIGRATION_SMOKE_KEEP_DB: "0"
          RUSTOK_MIGRATION_SMOKE_REUSE_DB: "0"
        run: >-
          cargo test
          --locked
          -p rustok-migrations
          --test postgres_zero_migration_smoke
          postgres_zero_migration_smoke_applies_from_empty_database
          --
          --ignored
          --nocapture
      - name: Compile Product migrations and runtime
        run: cargo check -p rustok-product --lib
      - name: Check full PR whitespace
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --check "$base" "$head"
