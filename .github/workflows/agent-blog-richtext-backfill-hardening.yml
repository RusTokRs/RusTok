name: Agent Blog richtext backfill finalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-source:
    if: github.head_ref == 'agent/blog-richtext-offline-backfill-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blog-richtext-offline-backfill-20260730
          fetch-depth: 0
      - name: Install final source and reconcile plans
        shell: bash
        run: |
          base64 --decode scripts/agent/blog_article_richtext_backfill.rs.gz.b64 | gzip --decompress > crates/rustok-blog/src/bin/blog_article_richtext_backfill.rs
          rm scripts/agent/blog_article_richtext_backfill.rs.gz.b64
          python3 <<'PY'
          from pathlib import Path
          import json

          def ensure_replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count == 1:
                  target.write_text(text.replace(old, new, 1))
                  return
              if count == 0 and new in text:
                  return
              raise RuntimeError(f'{path}: replacement drift old={count} new={text.count(new)}')

          ensure_replace(
              'scripts/verify/verify-blog-fba.mjs',
              '''const allowedRichtextStatuses = new Set([
            'implemented_source_verified_no_compile',
            'executable_no_run',
            'contained_compatibility',
            'legacy_blocker',
          ]);''',
              '''const allowedRichtextStatuses = new Set([
            'implemented_source_verified_no_compile',
            'executable_no_run',
          ]);''',
          )

          inventory_path = Path('crates/rustok-blog/contracts/evidence/blog-richtext-cutover-inventory.json')
          inventory = json.loads(inventory_path.read_text())
          offline = next(check for check in inventory['checks'] if check['name'] == 'offline_backfill')
          for marker in [
              'LEFT JOIN blog_posts',
              'struct Cursor',
              'updated_at = $6',
              'repair the owner relation before backfill',
          ]:
              if marker not in offline['required_markers']:
                  offline['required_markers'].append(marker)
          inventory_path.write_text(json.dumps(inventory, ensure_ascii=False, indent=2) + '\n')

          evidence_path = Path('crates/rustok-blog/contracts/evidence/blog-richtext-offline-backfill.json')
          evidence = json.loads(evidence_path.read_text())
          evidence['safety']['orphan_rows_fail_closed'] = True
          evidence['safety']['stable_cursor'] = 'updated_at_id'
          evidence['safety']['optimistic_updated_at_predicate'] = True
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n')

          ensure_replace(
              'scripts/verify/verify-blog-richtext-offline-backfill.mjs',
              '''  || evidence.safety?.optimistic_updates !== true
            || evidence.safety?.checkpoint_mutation !== false) {''',
              '''  || evidence.safety?.optimistic_updates !== true
            || evidence.safety?.orphan_rows_fail_closed !== true
            || evidence.safety?.stable_cursor !== "updated_at_id"
            || evidence.safety?.optimistic_updated_at_predicate !== true
            || evidence.safety?.checkpoint_mutation !== false) {''',
          )
          ensure_replace(
              'scripts/verify/verify-blog-richtext-offline-backfill.mjs',
              '''  "async fn optimistic_update(",
            "--apply",''',
              '''  "async fn optimistic_update(",
            "LEFT JOIN blog_posts",
            "struct Cursor",
            "updated_at = $6",
            "repair the owner relation before backfill",
            "--apply",''',
          )

          ensure_replace(
              'crates/rustok-blog/docs/richtext-cutover-inventory.md',
              '''uses optimistic body/format predicates per batch and performs a final
          post-apply scan. The NDJSON report contains identifiers and outcomes, not
          content bodies.''',
              '''uses a stable `(updated_at, id)` cursor, reports orphan translations as
          invalid, applies optimistic body/format/updated-at predicates per batch, and
          performs a final post-apply scan. The NDJSON report contains identifiers and
          outcomes, not content bodies.''',
          )
          ensure_replace(
              'crates/rustok-blog/docs/implementation-plan.md',
              '''- Blog article offline backfill: `executable_no_run`; dry-run preflight,
            content-free reporting, explicit apply/Markdown acknowledgement, optimistic
            writes, and post-apply verification are implemented.''',
              '''- Blog article offline backfill: `executable_no_run`; dry-run preflight,
            content-free reporting, explicit apply/Markdown acknowledgement, orphan
            detection, stable cursoring, optimistic writes, and post-apply verification
            are implemented.''',
          )

          central = 'docs/modules/rich-text-implementation-plan.md'
          ensure_replace(
              central,
              '''This is Phase 1 foundation evidence, not the owner cutover. Blog, Forum,
          Comments, orchestration, Search/Index, and both UI hosts still have to move
          atomically before the new policy becomes the only runtime write/read path.
          The old implementation is not a target compatibility contract and must not
          receive new call sites.''',
              '''The Phase 1 foundation now backs the Blog article and Comments source
          cutovers. Forum and explicitly opted-in future fields still have to move before
          the shared policy is universal. The old implementation is not a target
          compatibility contract and must not receive new call sites.''',
          )
          ensure_replace(
              central,
              '''The first Blog article boundary slice is also implemented: the owner validates
          submitted documents with the fixed `article` profile, writes canonical root JSON
          for that path, and exposes server-derived HTML/plain text to the Next admin
          form. This is not the atomic owner cutover yet: the Leptos/storefront
          transports, storage columns, revisions, and Search/AI projections still need
          to move together.''',
              '''The Blog article source cutover is implemented: owner, GraphQL, native and
          browser transports use the fixed `article` document; storage retains canonical
          root JSON; Search, SEO, AI, and storefront reads use server projections; and the
          format selector is removed by a fail-closed irreversible migration. The
          owner-specific dry-run/apply backfill prepares retained legacy rows. Migration,
          PostgreSQL, and browser execution evidence remain maintainer-owned.''',
          )
          ensure_replace(
              central,
              '''The following inventory was verified on 2026-07-22. Items explicitly marked
          resolved record completed slices; all others are implementation gaps, not
          target behavior:''',
              '''The original inventory was verified on 2026-07-22 and reconciled through
          2026-07-30. Items explicitly marked resolved record completed slices; all
          others are implementation gaps, not target behavior:''',
          )
          ensure_replace(
              central,
              '''- resolved for the first Next article slice 2026-07-23: the Blog post form now
            sends one shared `RichTextDocument`, uses the shared framed runtime, and
            renders only server-projected HTML; the owner transport/storage cutover is
            still pending;''',
              '''- resolved for Blog article source 2026-07-30: owner and transports use one
            `RichTextDocument`, storage is canonical, Search/SEO/AI/storefront consume
            shared projections, and an owner-specific offline backfill precedes the
            fail-closed migration; runtime evidence is still pending;''',
          )
          ensure_replace(
              central,
              '''- Blog posts and Forum still expose the same source twice as a string body and
            a `content_json` value; Comments and the Blog comment consumer no longer do;''',
              '''- resolved for Blog posts and Comments: typed documents are the only write
            source; Forum still retains its legacy string/structured compatibility;''',
          )
          ensure_replace(
              central,
              '''- resolved for the Comments vertical 2026-07-23: content orchestration now
            rejects conversions with comments/replies until Forum adopts canonical
            richtext; raw Blog-post/Forum-topic conversion remains part of their pending
            owner cutovers;
          - Blog and shared-content search projectors index the serialized JSON string;
          - the existing migration binary targets obsolete shared content rows, skips
            current owner tables and existing RT envelopes, mutates checkpoints during
            dry runs, and bypasses owner events/audit/reindex paths;''',
              '''- resolved for Comments and Blog: orchestration fails closed across
            incompatible richtext profiles; Forum owner conversion remains pending;
          - resolved for Blog Search: canonical documents are parsed through the shared
            Article plain-text policy and invalid rows roll back projection writes;
          - the legacy shared-content migration binary remains obsolete and deprecated;
            Blog now has an owner-specific dry-run-first backfill with no checkpoint
            mutation, explicit apply, and fail-closed conversion policy;''',
          )
          PY
          rm .github/workflows/agent-blog-richtext-backfill-hardening.yml
          node --check scripts/verify/verify-blog-richtext-offline-backfill.mjs
          python3 -m json.tool crates/rustok-blog/contracts/evidence/blog-richtext-cutover-inventory.json >/dev/null
          python3 -m json.tool crates/rustok-blog/contracts/evidence/blog-richtext-offline-backfill.json >/dev/null
          grep -q 'LEFT JOIN blog_posts' crates/rustok-blog/src/bin/blog_article_richtext_backfill.rs
          grep -q 'struct Cursor' crates/rustok-blog/src/bin/blog_article_richtext_backfill.rs
          grep -q 'updated_at = $6' crates/rustok-blog/src/bin/blog_article_richtext_backfill.rs
          grep -q 'repair the owner relation before backfill' crates/rustok-blog/src/bin/blog_article_richtext_backfill.rs
          git diff --check
      - name: Commit final source slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(blog): finalize richtext backfill safety"
          git push origin HEAD:agent/blog-richtext-offline-backfill-20260730
