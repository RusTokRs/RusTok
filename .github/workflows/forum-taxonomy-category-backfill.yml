name: Forum Taxonomy Category Backfill Contract

on:
  pull_request:
    paths:
      - "crates/modules/rustok-forum/src/migrations/m20260823_000030_backfill_forum_categories_to_taxonomy.rs"
      - "crates/modules/rustok-forum/src/migrations/mod.rs"
      - "crates/modules/rustok-forum/src/entities/mod.rs"
      - "crates/modules/rustok-forum/src/entities/forum_category.rs"
      - "crates/modules/rustok-forum/src/entities/forum_category_translation.rs"
      - "crates/modules/rustok-forum/src/services/mod.rs"
      - "docs/migrations/backfill-contracts.json"
      - "scripts/verify/verify-forum-taxonomy-category-backfill.mjs"
      - ".github/workflows/forum-taxonomy-category-backfill.yml"
  push:
    branches:
      - main
    paths:
      - "crates/modules/rustok-forum/src/migrations/m20260823_000030_backfill_forum_categories_to_taxonomy.rs"
      - "crates/modules/rustok-forum/src/migrations/mod.rs"
      - "crates/modules/rustok-forum/src/entities/mod.rs"
      - "crates/modules/rustok-forum/src/entities/forum_category.rs"
      - "crates/modules/rustok-forum/src/entities/forum_category_translation.rs"
      - "crates/modules/rustok-forum/src/services/mod.rs"
      - "docs/migrations/backfill-contracts.json"
      - "scripts/verify/verify-forum-taxonomy-category-backfill.mjs"
      - ".github/workflows/forum-taxonomy-category-backfill.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    name: Forum Taxonomy Category backfill source contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify staged Forum Category backfill boundary
        run: node scripts/verify/verify-forum-taxonomy-category-backfill.mjs

  rust-contract:
    name: Forum Taxonomy Category backfill Rust contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check CAT-5 boundary Rust formatting only
        shell: bash
        run: |
          rustfmt +1.96.0 --edition 2024 --check \
            crates/modules/rustok-forum/src/entities/mod.rs \
            crates/modules/rustok-forum/src/entities/forum_category.rs
      - name: Compile Forum backfill and migration registry
        run: cargo check --locked -p rustok-forum --lib
