name: Page Builder Static Sanitization Registry Apply

on:
  push:
    branches:
      - agent/page-builder-static-sanitization-registry-evidence-20260813
    paths:
      - ".github/workflows/page-builder-static-sanitization-registry-apply.yml"

permissions:
  contents: write

concurrency:
  group: page-builder-static-sanitization-registry-apply
  cancel-in-progress: true

jobs:
  apply:
    name: Apply admitted static sanitization evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify pre-state and apply exact admitted node
        shell: bash
        run: |
          set -euo pipefail
          registry="crates/rustok-page-builder/contracts/page-builder-fba-registry.json"
          expected_sha="dbb731faba7656f3a0103fae35279c4f0bf8310ed81539a9e61c0b512ee557c2"
          actual_sha="$(sha256sum "$registry" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          python - <<'PY'
          from pathlib import Path
          import subprocess

          registry = Path("crates/rustok-page-builder/contracts/page-builder-fba-registry.json")
          text = registry.read_text(encoding="utf-8")
          start_marker = '    "static_sanitization_contract": {'
          end_marker = '    "static_materialization_contract": {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          segment = text[start:end]
          before = '      "executed_evidence": "pending"'
          after = '      "executed_evidence": "verified"'
          if segment.count(before) != 1 or after in segment:
              raise SystemExit("static sanitization executed_evidence pre-state is not exactly one pending node")
          registry.write_text(text[:start] + segment.replace(before, after, 1) + text[end:], encoding="utf-8")

          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "--", str(registry)], text=True
          )
          changes = [
              line for line in diff.splitlines()
              if (line.startswith("+") and not line.startswith("+++"))
              or (line.startswith("-") and not line.startswith("---"))
          ]
          expected = [
              '-      "executed_evidence": "pending"',
              '+      "executed_evidence": "verified"',
          ]
          if changes != expected:
              raise SystemExit(f"unexpected registry diff: {changes!r}")
          PY

          git diff --check
          test "$(git diff --name-only)" = "$registry"
          test "$(git diff --numstat -- "$registry")" = $'1\t1\tcrates/rustok-page-builder/contracts/page-builder-fba-registry.json'
      - name: Commit registry-only net change and remove apply workflow
        shell: bash
        run: |
          set -euo pipefail
          registry="crates/rustok-page-builder/contracts/page-builder-fba-registry.json"
          workflow=".github/workflows/page-builder-static-sanitization-registry-apply.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$registry"
          git rm -- "$workflow"
          git commit \
            -m "test(page-builder): admit static sanitization executed evidence" \
            -m "Execution run: 31678544586 @ 4afd59de877c71e1b22d155c99d1fb6c2abc9ff2" \
            -m "Admission packet: run 31687278648, artifact 9175922988, artifact digest sha256:6be87c58398851937b1306c34f4cbec0a684442e01f45e2774b2b11414d3c27a"
          git push origin HEAD:agent/page-builder-static-sanitization-registry-evidence-20260813
