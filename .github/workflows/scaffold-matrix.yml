name: Native Scaffold Matrix

on:
  pull_request:
    paths:
      - ".github/workflows/scaffold-matrix.yml"
      - "scripts/ci/verify-scaffold-matrix.sh"
      - "xtask/src/scaffold/**"
      - "Cargo.toml"
      - "modules.toml"
      - "apps/server/Cargo.toml"
      - "crates/modules/rustok-distribution/**"
      - "docs/modules/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scaffold-matrix.yml"
      - "scripts/ci/verify-scaffold-matrix.sh"
      - "xtask/src/scaffold/**"
      - "Cargo.toml"
      - "modules.toml"
      - "apps/server/Cargo.toml"
      - "crates/modules/rustok-distribution/**"
      - "docs/modules/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

jobs:
  generated-scaffold-matrix:
    name: Generate, validate and compile scaffold modes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Generate and verify all native scaffold modes
        run: bash scripts/ci/verify-scaffold-matrix.sh
