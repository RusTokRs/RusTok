name: Native Scaffold Matrix

on:
  pull_request:
    paths:
      - ".github/workflows/scaffold-matrix.yml"
      - "scripts/ci/verify-scaffold-matrix.sh"
      - "scripts/generate/generate-cli-registry.mjs"
      - "cli-registry.toml"
      - "crates/utils/rustok-cli-registry/Cargo.toml"
      - "scripts/verify/native-module-layout.mjs"
      - "scripts/verify/verify-module-source-layout.mjs"
      - "xtask/src/module_commands.rs"
      - "xtask/src/migrations.rs"
      - "xtask/src/scaffold/**"
      - "crates/libs/rustok-core/src/search_projection.rs"
      - "crates/libs/rustok-outbox-storage/**"
      - "crates/modules/rustok-cache/**"
      - "crates/modules/rustok-search/**"
      - "Cargo.toml"
      - "modules.toml"
      - "apps/server/Cargo.toml"
      - "crates/modules/rustok-distribution/**"
      - "docs/modules/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scaffold-matrix.yml"
      - "scripts/ci/verify-scaffold-matrix.sh"
      - "scripts/generate/generate-cli-registry.mjs"
      - "cli-registry.toml"
      - "crates/utils/rustok-cli-registry/Cargo.toml"
      - "scripts/verify/native-module-layout.mjs"
      - "scripts/verify/verify-module-source-layout.mjs"
      - "xtask/src/module_commands.rs"
      - "xtask/src/migrations.rs"
      - "xtask/src/scaffold/**"
      - "crates/libs/rustok-core/src/search_projection.rs"
      - "crates/libs/rustok-outbox-storage/**"
      - "crates/modules/rustok-cache/**"
      - "crates/modules/rustok-search/**"
      - "Cargo.toml"
      - "modules.toml"
      - "apps/server/Cargo.toml"
      - "crates/modules/rustok-distribution/**"
      - "docs/modules/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

jobs:
  generated-scaffold-matrix:
    name: Verify scaffold contracts and PostgreSQL publication
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RUSTOK_SCAFFOLD_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Generate and verify all native scaffold modes
        run: bash scripts/ci/verify-scaffold-matrix.sh
