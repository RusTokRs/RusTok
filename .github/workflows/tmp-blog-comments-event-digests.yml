name: Temporary Blog Comments event digests

on:
  pull_request:
    branches:
      - agent/tmp-blog-comments-digest-base-20260803

permissions:
  contents: read

jobs:
  digests:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-slim
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Generate event contract digests
        run: cargo run -p rustok-events --example event_contract_digests
