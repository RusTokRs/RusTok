name: Temporary Blog Comments event digests

on:
  push:
    branches:
      - agent/blog-comments-audit-event-contract-20260803

permissions:
  contents: read

jobs:
  digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Generate event contract digests
        run: cargo run -p rustok-events --example event_contract_digests
