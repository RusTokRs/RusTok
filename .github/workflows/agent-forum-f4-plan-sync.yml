name: Agent Forum F4 plan sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-forum-f4-plan-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-plans:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch canonical Forum plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          forum_path = Path("crates/rustok-forum/docs/implementation-plan.md")
          search_path = Path("crates/rustok-search/docs/implementation-plan.md")
          workflow_path = Path(".github/workflows/agent-forum-f4-plan-sync.yml")
          forum = forum_path.read_text()

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          forum = replace_once(
              forum,
              "FORUM-23B2F3 locks exact requested/fallback locale and adds inclusive published date-window filters before owner eligibility, visible totals, facets and pagination. Remaining kind, channel/group and attachment-presence filters, owner revision ordering/reconciliation and maintainer runtime evidence remain.",
              "FORUM-23B2F3 locks exact requested/fallback locale and adds inclusive published date-window filters before owner eligibility, visible totals, facets and pagination; FORUM-23B2F4 adds trusted current-channel-only narrowing and transactional parent-derived reply projection refresh. Remaining kind, owner-authorized arbitrary channel/group and attachment-presence filters, owner revision ordering/reconciliation and maintainer runtime evidence remain.",
              "FORUM-23 ledger",
          )

          f3_tail = """- `forum-search-locale-date-filter.json`,
  `forum-23b2f3-search-locale-date-filter.md`, and
  `verify-forum-search-locale-date-filter.mjs` lock locale, projection, range,
  ordering, compatibility and degraded-mode behavior while execution/reindex
  evidence remains pending.

### Compatibility and degraded mode
"""
          f4_section = """- `forum-search-locale-date-filter.json`,
  `forum-23b2f3-search-locale-date-filter.md`, and
  `verify-forum-search-locale-date-filter.mjs` lock locale, projection, range,
  ordering, compatibility and degraded-mode behavior while execution/reindex
  evidence remains pending.

### Delivered in `FORUM-23B2F4`

- the explicit Forum-only GraphQL owner accepts optional
  `currentChannelOnly`, while additive GraphQL/native operations select the
  exact trusted current request channel without accepting a caller-selected
  channel slug;
- an active current-channel filter requires a complete tenant-matching channel
  ID/slug pair from `RequestContext`, excludes categories and global topics, and
  preserves absent/false behavior;
- topics match exact Forum-projected `payload.channel_slugs`, while approved
  replies match parent-derived `payload.topic_channel_slugs`; missing, malformed
  or mixed-type projected arrays fail closed until reindexed;
- the stable raw 100-candidate bound remains before current-channel narrowing;
  exact locale, author, tag, solved, date and current-channel predicates
  intersect before Forum owner eligibility, visible totals, facets, offset and
  limit while preserving ranking order;
- query-rule pins remain disabled while current-channel narrowing is active;
- the public root `TopicService::update` now delegates to the existing
  transactional inline owner command, preserving omitted quote relations and
  writing one `forum_topic` reindex before commit;
- the Search inbox maps exact `forum_topic` reindex work to Full Forum scope and
  `ForumSearchProjector` rebuilds the tenant, so parent-derived reply channel
  projections refresh with a topic channel change;
- existing legacy, author-only, tag/solved and date-window GraphQL/native wire
  signatures remain unchanged; `ForumStorefrontSearchByCurrentChannel` and
  `search/forum-storefront-search-by-current-channel` are additive;
- `forum-search-current-channel-filter.json`,
  `forum-23b2f4-search-current-channel-filter.md`, and
  `verify-forum-search-current-channel-filter.mjs` lock trusted input,
  projection, ordering, refresh and compatibility behavior while execution and
  reindex evidence remain pending.

### Compatibility and degraded mode
"""
          forum = replace_once(forum, f3_tail, f4_section, "FORUM-23B2F4 section")

          forum = replace_once(
              forum,
              "`FORUM-23B2A/B2B/B2C/B2D/B2E1/B2E2/B2F1/B2F2/B2F3`. `FORUM-23B2F2` extends\nthe Forum reply projection payload with parent-topic `topic_tags`; `FORUM-23B2F3`\nextends topic and reply payloads with Forum-owned `published_at`. Legacy rows\nrequire reindex before positive tag/date matches and fail closed until repaired.",
              "`FORUM-23B2A/B2B/B2C/B2D/B2E1/B2E2/B2F1/B2F2/B2F3/B2F4`. `FORUM-23B2F2` extends\nthe Forum reply projection payload with parent-topic `topic_tags`; `FORUM-23B2F3`\nextends topic and reply payloads with Forum-owned `published_at`; `FORUM-23B2F4`\nextends approved replies with parent-topic `topic_channel_slugs` and routes public\ntopic updates through transactional `forum_topic` invalidation. Legacy rows\nrequire reindex before positive tag/date/current-channel matches and fail closed until repaired.",
              "compatibility slice list",
          )

          forum = replace_once(
              forum,
              "windows use Forum-projected timestamps and legacy topic/reply rows fail closed until\nreindexed. Existing legacy, author-only and B2F2 GraphQL/native wire signatures remain\nunchanged. Admin/global Search behavior remains unchanged.",
              "windows use Forum-projected timestamps and legacy topic/reply rows fail closed until\nreindexed. Current-channel narrowing uses only trusted request context and Forum-projected\ntopic/parent-topic channel slugs; unscoped requests and malformed legacy replies fail closed.\nTopic channel edits publish transactional reindex work that rebuilds the tenant Forum projection.\nExisting legacy, author-only, B2F2 and date-window GraphQL/native wire signatures remain\nunchanged. Admin/global Search behavior remains unchanged.",
              "compatibility current-channel paragraph",
          )

          forum = replace_once(
              forum,
              "- add kind, channel/group and attachment-presence query filters;",
              "- add kind, owner-authorized arbitrary channel/group and attachment-presence query filters;",
              "FORUM-23 remaining filters",
          )

          verifier_anchor = "node scripts/verify/verify-forum-search-locale-date-filter.mjs\ncargo check -p rustok-search --features graphql --all-targets"
          verifier_replacement = "node scripts/verify/verify-forum-search-locale-date-filter.mjs\nnode scripts/verify/verify-forum-search-current-channel-filter.mjs\nnode scripts/verify/verify-forum-projection-invalidation.mjs\ncargo check -p rustok-search --features graphql --all-targets"
          count = forum.count(verifier_anchor)
          if count != 2:
              raise SystemExit(f"verifier anchors: expected two matches, found {count}")
          forum = forum.replace(verifier_anchor, verifier_replacement)

          forum = replace_once(
              forum,
              "The `FORUM-23B2A/B2B/B2C/B2D/B2E1/B2E2/B2F1/B2F2/B2F3` source and contract records do not",
              "The `FORUM-23B2A/B2B/B2C/B2D/B2E1/B2E2/B2F1/B2F2/B2F3/B2F4` source and contract records do not",
              "FORUM-23 source record list",
          )

          forum = replace_once(
              forum,
              "filters before owner revision ordering and reconciliation; execute B2D/F1/F2/F3\n    evidence with `LINK-FORUM-03` only after ordering is stable;",
              "filters before owner revision ordering and reconciliation; execute B2D/F1/F2/F3/F4\n    evidence, including topic-channel update/reindex refresh, with `LINK-FORUM-03`\n    only after ordering is stable;",
              "recommended next FORUM-23 slice",
          )

          forum_path.write_text(forum)

          search = search_path.read_text()
          for marker in [
              "`FORUM-23B2F4` adds an additive trusted current-channel narrowing",
              "Trusted current-channel Forum filter status:",
              "verify-forum-search-current-channel-filter.mjs",
              "transactional topic-update invalidation",
          ]:
              if marker not in search:
                  raise SystemExit(f"Search plan missing F4 marker: {marker}")

          workflow_path.unlink()
          PY

      - name: Commit plan synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rustok-forum/docs/implementation-plan.md \
                  crates/rustok-search/docs/implementation-plan.md \
                  .github/workflows/agent-forum-f4-plan-sync.yml
          git diff --cached --check
          git commit -m "docs(forum): synchronize FORUM-23B2F4 plans"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
