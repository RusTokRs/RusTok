name: Locale cache hardening

on:
  push:
    branches: [main]
    paths:
      - "apps/server/src/middleware/locale.rs"
      - "apps/server/tests/locale_cache_architecture_guard.rs"
      - ".github/workflows/locale-cache-hardening.yml"
  pull_request:
    paths:
      - "apps/server/src/middleware/locale.rs"
      - "apps/server/tests/locale_cache_architecture_guard.rs"
      - ".github/workflows/locale-cache-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  locale-cache:
    name: Locale cache contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: locale-cache-hardening
      - name: Format
        run: cargo fmt --all --check
      - name: Compile server
        run: cargo check -p rustok-server --lib
      - name: Locale cache tests
        run: |
          cargo test -p rustok-server tenant_locale_cache --lib
          cargo test -p rustok-server --test locale_cache_architecture_guard
      - name: Clippy
        run: cargo clippy -p rustok-server --lib -- -D warnings
