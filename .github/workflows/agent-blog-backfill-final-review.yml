name: Agent Blog backfill final review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-final-review:
    if: github.head_ref == 'agent/blog-richtext-offline-backfill-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blog-richtext-offline-backfill-20260730
          fetch-depth: 0
      - name: Reconcile final plan wording
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement, found {count}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'docs/modules/rich-text-implementation-plan.md',
              '''The Blog article source cutover is implemented: owner, GraphQL, native and
          browser transports use the fixed `article` document; storage retains canonical
          root JSON; Search, SEO, AI, and storefront reads use server projections; and the
          format selector is removed by a fail-closed irreversible migration. The
          owner-specific dry-run/apply backfill prepares retained legacy rows. Migration,
          PostgreSQL, and browser execution evidence remain maintainer-owned.''',
              '''The Blog article source cutover is implemented: owner and GraphQL writes use
          the fixed `article` document, Next admin submits it, and native/GraphQL
          storefront reads use server projections. Storage retains canonical root JSON;
          Search, SEO, and AI use owner projections; and the format selector is removed by
          a fail-closed irreversible migration. The owner-specific dry-run/apply backfill
          prepares retained legacy rows. Migration, PostgreSQL, and browser execution
          evidence remain maintainer-owned.''',
          )

          replace_once(
              'crates/rustok-blog/docs/richtext-cutover-inventory.md',
              '''After reviewing the report and backup, rerun with `--apply`. Add
          `--allow-markdown-plain-text` only when literal-text conversion is accepted.
          The utility does not execute the schema migration or Search reindex.''',
              '''After reviewing the report and backup, rerun with `--apply`. Add
          `--allow-markdown-plain-text` only when literal-text conversion is accepted.
          Tenant-scoped runs are useful for rehearsal or incremental conversion, but a
          final unscoped dry-run is required before the global schema migration so orphan
          and cross-tenant rows cannot be missed. The utility does not execute the schema
          migration or Search reindex.''',
          )

          replace_once(
              'crates/rustok-blog/docs/implementation-plan.md',
              '''   only after accepting literal-text conversion, then rerun with `--apply`.
             Execute the irreversible migration, perform Blog Search reindex/rollback, and''',
              '''   only after accepting literal-text conversion, then rerun with `--apply`.
             Complete a final unscoped dry-run before the global migration. Execute the
             irreversible migration, perform Blog Search reindex/rollback, and''',
          )
          PY
          rm .github/workflows/agent-blog-backfill-final-review.yml
          git diff --check
      - name: Commit final review
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(blog): clarify global backfill preflight"
          git push origin HEAD:agent/blog-richtext-offline-backfill-20260730
