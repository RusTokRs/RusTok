name: Repair Index lock runtime API edges

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-index-lock-runtime-api.yml

permissions:
  contents: write

concurrency:
  group: repair-index-lock-runtime-api
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/index-lock-runtime-api-20260803'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/index-lock-runtime-api-20260803
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Add exact Index lock edges
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Cargo.lock')
          text = path.read_text()
          old = ''' "rust_decimal",
           "rustok-core",
           "rustok-events",
           "sea-orm",'''
          new = ''' "rust_decimal",
           "rustok-api",
           "rustok-core",
           "rustok-events",
           "rustok-runtime",
           "sea-orm",'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Index lock dependency block: expected one match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify exact lock-only diff
        run: |
          git diff -- Cargo.lock > /tmp/index-lock.diff
          cat /tmp/index-lock.diff
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/index-lock.diff').read_text().splitlines()
          added = [line for line in lines if line.startswith('+') and not line.startswith('+++')]
          removed = [line for line in lines if line.startswith('-') and not line.startswith('---')]
          expected = ['+ "rustok-api",', '+ "rustok-runtime",']
          if added != expected or removed:
              raise SystemExit(f'unexpected Cargo.lock diff: added={added!r}, removed={removed!r}')
          PY
          test "$(git diff --numstat -- Cargo.lock)" = $'2\t0\tCargo.lock'
          test -z "$(git status --short --untracked-files=no | grep -v '^ M Cargo.lock$')"

      - name: Verify locked workspace metadata
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Commit lock repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && { echo "expected lock repair is missing" >&2; exit 1; }
          git commit -m "fix(build): refresh Index runtime API lock edges"
          git push origin HEAD:fix/index-lock-runtime-api-20260803
