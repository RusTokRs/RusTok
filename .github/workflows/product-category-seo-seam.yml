name: Product Category SEO Seam

on:
  pull_request:
    paths:
      - "crates/rustok-product/src/migrations/m20260829_000017_add_product_category_seo_translations.rs"
      - "crates/rustok-product/src/migrations/mod.rs"
      - "crates/rustok-product/src/services/catalog_schema_service/categories.rs"
      - "crates/rustok-product/docs/category-taxonomy-binding.md"
      - "crates/rustok-product/docs/category-locale-contract.md"
      - "crates/rustok-taxonomy/docs/implementation-plan.md"
      - "scripts/verify/verify-product-category-seo-seam.mjs"
      - ".github/workflows/product-category-seo-seam.yml"
      - ".github/workflows/product-taxonomy-category-read-cutover.yml"

permissions:
  contents: read

concurrency:
  group: product-category-seo-seam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seo-seam-contract:
    name: Product Category SEO seam
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Verify Product Category SEO seam contract
        run: node scripts/verify/verify-product-category-seo-seam.mjs
      - name: Fetch exact PR base
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
      - name: Assert bounded CAT-27 file set when CAT-27 changes
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='crates/rustok-product/src/migrations/m20260829_000017_add_product_category_seo_translations.rs'
          verifier='scripts/verify/verify-product-category-seo-seam.mjs'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          if ! printf '%s\n' "$changed" | grep -Eq "^(${migration}|${verifier})$"; then
            echo "CAT-27 migration/verifier unchanged; PR-wide CAT-27 slice restriction is not applicable."
            exit 0
          fi
          allowed='^(crates/rustok-product/src/migrations/m20260829_000017_add_product_category_seo_translations\.rs|crates/rustok-product/src/migrations/mod\.rs|crates/rustok-product/src/services/catalog_schema_service/categories\.rs|crates/rustok-product/docs/category-taxonomy-binding\.md|crates/rustok-product/docs/category-locale-contract\.md|crates/rustok-taxonomy/docs/implementation-plan\.md|scripts/verify/verify-product-category-seo-seam\.mjs|\.github/workflows/product-category-seo-seam\.yml|\.github/workflows/product-taxonomy-category-read-cutover\.yml)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
      - name: Check Product formatting
        run: cargo fmt --check --manifest-path crates/rustok-product/Cargo.toml
      - name: Run Product Category SEO unit regression
        run: cargo test -p rustok-product --lib category_seo_detects -- --nocapture
      - name: Compile Product Category SEO seam
        run: cargo check -p rustok-product --lib
      - name: Check full PR whitespace
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --check "$base" "$head"
