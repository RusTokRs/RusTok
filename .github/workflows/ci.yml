name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustok_revisions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install sea-orm-cli
        run: cargo install sea-orm-cli

      - name: Run migrations
        working-directory: ./rustok-revisions
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rustok_revisions_test
        run: sea-orm-cli migrate up

      - name: Check formatting
        working-directory: ./rustok-revisions
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: ./rustok-revisions
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        working-directory: ./rustok-revisions
        run: cargo build --all-features

      - name: Run tests
        working-directory: ./rustok-revisions
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rustok_revisions_test
        run: cargo test --all-features

      - name: Run integration tests
        working-directory: ./rustok-revisions
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rustok_revisions_test
        run: cargo test --test integration_tests --all-features

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Build
        working-directory: ./rustok-revisions
        run: cargo build --all-features

      - name: Build derive crate
        working-directory: ./rustok-revisions-derive
        run: cargo build

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustok_revisions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Install sea-orm-cli
        run: cargo install sea-orm-cli

      - name: Run migrations
        working-directory: ./rustok-revisions
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rustok_revisions_test
        run: sea-orm-cli migrate up

      - name: Generate code coverage
        working-directory: ./rustok-revisions
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rustok_revisions_test
        run: cargo tarpaulin --all-features --out Xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./rustok-revisions/cobertura.xml
          fail_ci_if_error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        working-directory: ./rustok-revisions
        run: cargo audit

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        working-directory: ./rustok-revisions
        run: cargo doc --all-features --no-deps

      - name: Check documentation links
        working-directory: ./rustok-revisions
        run: cargo doc --all-features --no-deps --document-private-items

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish derive crate
        working-directory: ./rustok-revisions-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --dry-run

      - name: Publish main crate
        working-directory: ./rustok-revisions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --dry-run
