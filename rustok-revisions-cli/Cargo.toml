[package]
name = "rustok-revisions-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for managing content revisions"
license = "MIT OR Apache-2.0"

[[bin]]
name = "revctl"
path = "src/main.rs"

[dependencies]
rustok-revisions = { path = "../rustok-revisions", features = ["seaorm"] }
sea-orm = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
colored = "2.0"
tabled = "0.15"
dialoguer = "0.11"
indicatif = "0.17"
