groups:
  - name: rustok_slo_alerts
    interval: 30s
    rules:
      # High Error Rate Alert
      - alert: HighErrorRate
        expr: |
          (
            rate(rustok_http_requests_total{status=~"5.."}[5m])
            /
            rate(rustok_http_requests_total[5m])
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Slow Request Latency Alert
      - alert: SlowRequestLatency
        expr: |
          histogram_quantile(
            0.95,
            rate(rustok_http_request_duration_seconds_bucket[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "P95 latency is too high"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 500ms)"

      # Very Slow Request Latency Alert (Critical)
      - alert: VerySlowRequestLatency
        expr: |
          histogram_quantile(
            0.95,
            rate(rustok_http_request_duration_seconds_bucket[5m])
          ) > 1.0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "P95 latency is critically high"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 1s)"

  - name: rustok_eventbus_alerts
    interval: 30s
    rules:
      # High Event Queue Depth
      - alert: HighEventQueueDepth
        expr: rustok_event_bus_queue_depth > 7000
        for: 5m
        labels:
          severity: warning
          component: eventbus
        annotations:
          summary: "Event queue depth is high"
          description: "Event queue depth is {{ $value }} (threshold: 7000)"

      # Critical Event Queue Depth
      - alert: CriticalEventQueueDepth
        expr: rustok_event_bus_queue_depth > 10000
        for: 2m
        labels:
          severity: critical
          component: eventbus
        annotations:
          summary: "Event queue depth is critically high"
          description: "Event queue depth is {{ $value }} (threshold: 10000). Risk of memory exhaustion!"

      # Event Processing Errors
      - alert: HighEventProcessingErrors
        expr: rate(rustok_event_bus_errors_total[5m]) > 1
        for: 3m
        labels:
          severity: warning
          component: eventbus
        annotations:
          summary: "High event processing error rate"
          description: "Event errors: {{ $value | humanize }}/sec for {{$labels.event_type}}"

      # Event Lag Too High
      - alert: HighEventLag
        expr: |
          histogram_quantile(
            0.95,
            rate(rustok_event_bus_lag_seconds_bucket[5m])
          ) > 30
        for: 5m
        labels:
          severity: warning
          component: eventbus
        annotations:
          summary: "Event processing lag is too high"
          description: "P95 event lag is {{ $value | humanizeDuration }} (threshold: 30s)"

      # Broadcast lag means a long-lived consumer actually skipped one or more messages.
      - alert: EventConsumerSkippedMessages
        expr: increase(rustok_event_consumer_lagged_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: eventbus
        annotations:
          summary: "Event consumer skipped messages"
          description: "Consumer {{$labels.consumer}} reported broadcast lag in the last five minutes. Execute its owner-defined gap recovery before acknowledging new events."

      # Supervisors record bounded restart reasons through the shared event error metric.
      - alert: RepeatedRuntimeWorkerRestarts
        expr: increase(rustok_event_bus_errors_total{error_type=~".*restart.*"}[10m]) > 3
        for: 2m
        labels:
          severity: warning
          component: runtime
        annotations:
          summary: "Runtime worker is repeatedly restarting"
          description: "Worker {{$labels.event_type}} restarted more than three times in ten minutes. Inspect the terminal error and readiness state before increasing restart delays."

  - name: rustok_circuit_breaker_alerts
    interval: 30s
    rules:
      # Circuit Breaker Open
      - alert: CircuitBreakerOpen
        expr: rustok_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
          component: resilience
        annotations:
          summary: "Circuit breaker is open"
          description: "Circuit breaker for {{$labels.service}} is OPEN (failing fast)"

      # Circuit Breaker Half-Open (Info)
      - alert: CircuitBreakerHalfOpen
        expr: rustok_circuit_breaker_state == 2
        for: 30s
        labels:
          severity: info
          component: resilience
        annotations:
          summary: "Circuit breaker is half-open"
          description: "Circuit breaker for {{$labels.service}} is HALF-OPEN (testing recovery)"

      # High Circuit Breaker Failure Rate
      - alert: HighCircuitBreakerFailures
        expr: rustok_circuit_breaker_failures > 5
        for: 2m
        labels:
          severity: warning
          component: resilience
        annotations:
          summary: "High failure count in circuit breaker"
          description: "{{$labels.service}} has {{ $value }} failures (threshold: 5)"

  - name: rustok_cache_alerts
    interval: 30s
    rules:
      # Low Cache Hit Rate
      - alert: LowCacheHitRate
        expr: |
          (
            rate(rustok_cache_operations_total{result="hit"}[5m])
            /
            (
              rate(rustok_cache_operations_total{result="hit"}[5m])
              +
              rate(rustok_cache_operations_total{result="miss"}[5m])
            )
          ) < 0.5
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Cache hit rate is low"
          description: "Cache hit rate for {{$labels.cache}} is {{ $value | humanizePercentage }} (threshold: 50%)"

      # Very Low Cache Hit Rate
      - alert: VeryLowCacheHitRate
        expr: |
          (
            rate(rustok_cache_operations_total{result="hit"}[5m])
            /
            (
              rate(rustok_cache_operations_total{result="hit"}[5m])
              +
              rate(rustok_cache_operations_total{result="miss"}[5m])
            )
          ) < 0.2
        for: 5m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Cache hit rate is critically low"
          description: "Cache hit rate for {{$labels.cache}} is {{ $value | humanizePercentage }} (threshold: 20%)"

      # High Cache Eviction Rate
      - alert: HighCacheEvictionRate
        expr: rate(rustok_cache_evictions_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "High cache eviction rate"
          description: "Cache {{$labels.cache}} is evicting {{ $value | humanize }} entries/sec"

      # Configured Redis must remain reachable. Memory-only deployments keep this gauge at zero.
      - alert: CacheRedisDegraded
        expr: rustok_cache_redis_degraded == 1
        for: 2m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Configured cache Redis is degraded"
          description: "Redis is configured but the client is unavailable or failing connectivity checks for more than two minutes."

      # A failed durable generation bump means replicas cannot safely acknowledge a cache epoch.
      - alert: CacheGenerationBumpFailure
        expr: increase(rustok_cache_generation_bump_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Cache generation bump failed"
          description: "At least one shared cache generation bump failed in the last five minutes; inspect the owning mutation and recovery worker before retrying writes."

      # PubSub is a fast path, but repeated failures increase convergence latency and Redis load.
      - alert: CacheInvalidationPublishFailures
        expr: increase(rustok_cache_invalidation_redis_publish_failure_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Cache invalidation publication is failing"
          description: "Redis invalidation publication failed during the last five minutes. Verify durable generation reconciliation and Redis health."

      # Saturation means stale values may remain until a later refresh or hard expiry.
      - alert: CacheRefreshSaturated
        expr: increase(rustok_cache_refresh_saturated_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Cache refresh capacity is saturated"
          description: "Refresh work was rejected by the bounded coordinator during the last five minutes. Inspect in-flight refreshes and loader latency before raising limits."

      # CAS errors are transport/backend failures, not normal optimistic mismatches.
      - alert: CacheCompareAndSetFailures
        expr: increase(rustok_cache_cas_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Cache compare-and-set operations are failing"
          description: "At least one atomic cache compare-and-set operation failed in the last five minutes. Mismatches are expected; failures require backend investigation."

  - name: rustok_database_alerts
    interval: 30s
    rules:
      # Slow Database Queries
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(
            0.95,
            rate(rustok_database_query_duration_seconds_bucket[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database queries are slow"
          description: "P95 query duration is {{ $value | humanizeDuration }} (threshold: 100ms)"

      # Very Slow Database Queries
      - alert: VerySlowDatabaseQueries
        expr: |
          histogram_quantile(
            0.95,
            rate(rustok_database_query_duration_seconds_bucket[5m])
          ) > 0.5
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database queries are critically slow"
          description: "P95 query duration is {{ $value | humanizeDuration }} (threshold: 500ms)"

      # High Database Query Errors
      - alert: HighDatabaseQueryErrors
        expr: rate(rustok_database_query_errors_total[5m]) > 0.5
        for: 3m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "High database query error rate"
          description: "Database errors: {{ $value | humanize }}/sec for {{$labels.query_type}}"

      # Low Database Connection Pool
      - alert: LowDatabaseConnections
        expr: rustok_database_connections{state="idle"} < 2
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Low idle database connections"
          description: "Only {{ $value }} idle connections available"

  - name: rustok_module_alerts
    interval: 30s
    rules:
      # Module Error Rate
      - alert: ModuleErrorRate
        expr: rate(rustok_module_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "High error rate in module"
          description: "Module {{$labels.module}} has {{ $value | humanize }} errors/sec"

      # Critical Module Error Rate
      - alert: CriticalModuleErrorRate
        expr: rate(rustok_module_errors_total{severity="critical"}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "Critical errors in module"
          description: "Module {{$labels.module}} has {{ $value | humanize }} critical errors/sec"
  - name: rustok_outbox_alerts
    interval: 30s
    rules:
      # Any event landing in the DLQ needs operator attention: it exhausted
      # its retries (or was permanently undispatchable) and stays failed
      # until replayed from the admin DLQ surface.
      - alert: OutboxEventsEnteringDlq
        expr: increase(rustok_outbox_relay_dlq_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox events entered the DLQ"
          description: "{{ $value }} outbox events moved to the dead-letter queue in the last 15 minutes. Inspect and replay them from the admin DLQ surface."

      # A rising share of failed dispatches means the target transport or a
      # consumer is unhealthy long before the DLQ threshold is reached.
      - alert: OutboxRelayFailureRateHigh
        expr: |
          (
            rate(rustok_outbox_relay_failure_total[10m])
            /
            clamp_min(rate(rustok_outbox_relay_processed_total[10m]), 0.001)
          ) > 0.25
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox relay failure rate is high"
          description: "More than 25% of outbox dispatches failed over the last 10 minutes. Check the target transport and the newest last_error values."

      # Dispatch latency percentiles come from the shared dispatch
      # histogram (milliseconds) recorded per relayed event.
      - alert: OutboxDispatchLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            rate(rustok_event_dispatch_latency_ms_bucket{consumer="outbox_relay"}[5m])
          ) > 1000
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox dispatch latency is high"
          description: "P95 outbox dispatch latency is {{ $value }}ms (threshold: 1000ms). Slow dispatches risk outliving claim leases; verify publish timeouts stay below claim TTL."

      # The supervisor restarts a crashed relay loop; repeated restarts
      # mean delivery is effectively stalled.
      - alert: OutboxRelayWorkerRestarting
        expr: increase(rustok_runtime_worker_restarts_total{worker="outbox_relay"}[10m]) > 3
        for: 2m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox relay worker is repeatedly restarting"
          description: "The outbox relay worker restarted more than three times in ten minutes. Inspect the terminal error before increasing restart delays."

      # Retention failures leave delivered rows (and prunable receipts)
      # accumulating; the worker retries each interval, so a growing
      # counter means a persistent cause.
      - alert: OutboxRetentionFailing
        expr: increase(rustok_runtime_worker_failures_total{worker="outbox_retention"}[30m]) > 3
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox retention prune is failing"
          description: "The outbox retention worker failed more than three times in thirty minutes. Delivered events and terminal receipts are not being pruned."

  - name: rustok_auth_jwt_alerts
    interval: 15s
    rules:
      - alert: JwtAuthorityMetricsUnavailable
        expr: rustok_auth_jwt_collection_status == 0
        for: 1m
        labels:
          severity: warning
          component: auth
        annotations:
          summary: "JWT authority observation unavailable"

      - alert: JwtWitnessFenced
        expr: rustok_auth_jwt_witness_fenced == 1
        labels:
          severity: critical
          component: auth
        annotations:
          summary: "JWT rollback witness fault; stop writers and recover the authenticated checkpoint"

      - alert: JwtClockFault
        expr: rustok_auth_jwt_local_clock_fenced == 1 or rustok_auth_jwt_authority_clock_fenced == 1
        labels:
          severity: critical
          component: auth
        annotations:
          summary: "JWT clock fault latched; correct clocks before restart"

      - alert: JwtLocalCryptoGateClosed
        expr: rustok_auth_jwt_local_ready == 0
        for: 30s
        labels:
          severity: critical
          component: auth
        annotations:
          summary: "JWT crypto gate closed on a serving target"

      - alert: JwtGenerationLag
        expr: rustok_auth_jwt_generation_lag != 0 and rustok_auth_jwt_collection_status == 1
        for: 1m
        labels:
          severity: warning
          component: auth
        annotations:
          summary: "JWT local and durable generations differ"

      - alert: JwtCurrentMaterialRevoked
        expr: rustok_auth_jwt_current_revoked == 1
        labels:
          severity: critical
          component: auth
        annotations:
          summary: "Current JWT authority contains revoked material"

      - alert: JwtRotationWaiting
        expr: rustok_auth_jwt_pending_seconds > 60
        for: 30s
        labels:
          severity: warning
          component: auth
        annotations:
          summary: "JWT rotation remains pending on a target"
